<script id="lib">
// Qurilma kaliti: telefon ichida yaratiladi, tashqariga chiqarib bo'lmaydi (IndexedDB, non-extractable).
window.IL=(function(){
  var FN="https://yhljeyxcporqienvdjax.supabase.co/functions/v1/ilova",ALG={name:"ECDSA",namedCurve:"P-256"};
  function db(){return new Promise(function(res,rej){var r=indexedDB.open("telc_ilova",1);r.onupgradeneeded=function(){r.result.createObjectStore("k")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
  function idb(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction("k",mode),s=t.objectStore("k"),q=fn(s);t.oncomplete=function(){res(q&&q.result)};t.onerror=t.onabort=function(){rej(t.error)}})})}
  async function get(){
    try{var r=await idb("readonly",function(s){return s.get("me")});if(r&&r.rid&&r.kp)return r}catch(e){}
    try{var s=localStorage.getItem("telc_ilova");if(s){var o=JSON.parse(s);return{rid:o.rid,kp:{privateKey:await crypto.subtle.importKey("jwk",o.priv,ALG,false,["sign"])}}}}catch(e){}
    return null;
  }
  async function del(){try{await idb("readwrite",function(s){return s.delete("me")})}catch(e){}try{localStorage.removeItem("telc_ilova")}catch(e){}}
  async function post(route,body){var r=await fetch(FN+"/"+route,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});return await r.json().catch(function(){return{ok:false,err:"net"}})}
  async function create(){
    var kp=await crypto.subtle.generateKey(ALG,false,["sign","verify"]),stored=false,priv=null;
    var pub=await crypto.subtle.exportKey("jwk",kp.publicKey);
    var r=await post("req",{pub:{kty:pub.kty,crv:pub.crv,x:pub.x,y:pub.y},ua:navigator.userAgent});
    if(!r.ok)throw new Error(r.err||"req");
    try{await idb("readwrite",function(s){return s.put({rid:r.rid,kp:kp},"me")});var chk=await get();stored=!!(chk&&chk.rid===r.rid)}catch(e){}
    if(!stored){ // zaxira: IndexedDB kalitni saqlay olmasa
      kp=await crypto.subtle.generateKey(ALG,true,["sign","verify"]);pub=await crypto.subtle.exportKey("jwk",kp.publicKey);priv=await crypto.subtle.exportKey("jwk",kp.privateKey);
      r=await post("req",{pub:{kty:pub.kty,crv:pub.crv,x:pub.x,y:pub.y},ua:navigator.userAgent});if(!r.ok)throw new Error(r.err||"req");
      localStorage.setItem("telc_ilova",JSON.stringify({rid:r.rid,priv:priv}));
    }
    return{rid:r.rid,kp:kp};
  }
  function b64u(buf){var s="",b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  async function call(rec,route,extra){
    var ts=Date.now(),sig=await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},rec.kp.privateKey,new TextEncoder().encode(rec.rid+"."+ts+"."+route));
    var b={rid:rec.rid,ts:ts,sig:b64u(sig)};for(var k in (extra||{}))b[k]=extra[k];
    return post(route,b);
  }
  return{get:get,del:del,create:create,call:call};
})();
</script>
<script>
(async function(){
  const m=document.getElementById("m"),show=h=>{m.innerHTML=h};

  const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;

  // 1) Brauzerda ochilgan: avval telefon ekraniga o'rnatish kerak (kalit faqat o'rnatilgan ilova ichida yaratiladi)
  if(!standalone){
    return show(LOGO+"<b>telc B2 ilovasini o'rnating</b>"+(ios?
      `<ol><li>Bu sahifani <b>Safari</b>'da oching (Telegram ichida emas).</li><li>Pastdagi manzil qatoridagi <b>≡</b> belgisini (yoki <b>⋯</b> ni) bosing, keyin <b>«Поделиться» / «Share» / «Ulashish»</b> ni tanlang. Eski iPhone'larda pastdagi kvadrat-strelka tugmasini bosing.</li><li><b>«На экран „Домой“» / «Add to Home Screen» / «Uy ekraniga»</b> ni tanlang (ko'rinmasa, ro'yxatni pastga suring yoki <b>«Ещё» / «More»</b> ni bosing) va <b>Qo'shish</b>ni bosing.</li><li>Telefon ekranida paydo bo'lgan <b>telc B2</b> ikonkasidan oching.</li></ol>`:
      `<ol><li>Bu sahifani <b>Chrome</b>'da oching.</li><li>Yuqori o'ngdagi <b>⋮</b> menyuni bosing.</li><li><b>«Установить приложение» / «Install app» / «Добавить на главный экран»</b> ni tanlang.</li><li>Telefon ekranidagi <b>telc B2</b> ikonkasidan oching.</li></ol>`)+
      "<small>Ilova faqat ustoz tasdiqlagan telefonda ishlaydi.</small>");
  }

  let rec=null,timer=null,busy=false;
  const stop=()=>{if(timer){clearTimeout(timer);timer=null}};
  const later=ms=>{stop();timer=setTimeout(step,ms)};
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&rec&&!busy)step()});

  async function fresh(){await IL.del();rec=null;return step()}

  async function step(){
    if(busy)return;busy=true;stop();
    try{
      if(!rec)rec=await IL.get();
      if(!rec){show('<div class="sp"></div>Tayyorlanmoqda…');rec=await IL.create()}
      const r=await IL.call(rec,"status");
      if(r.err==="auth"){busy=false;return fresh()}
      if(!r.ok)throw new Error(r.err||"status");
      const st=r.status,bot=r.bot||"Timur_B2simulyatsiya_bot";
      if(st==="ok"){busy=false;return open()}
      if(st==="expired"){busy=false;return fresh()}
      if(st==="new"){
        show(LOGO+`<b>Telefoningizni ulash</b><p>Pastdagi tugmani bosing — Telegram ochiladi. U yerda <b>START</b> (Начать) ni bosing. So'rov ustozga boradi.</p>
          <a class="b" href="https://t.me/${bot}?start=app_${r.code}">📲 Telegram orqali ulash</a>
          <p><small>Tugma ishlamasa, botga shu matnni yuboring:</small></p><div class="code">/start app_${r.code}</div><small>Kod 30 daqiqa amal qiladi.</small>`);
      }else if(st==="wait"){
        show(LOGO+'<div class="sp"></div><b>Ustoz tasdiqlashini kuting</b><p>So\'rovingiz ustozga yuborildi. Tasdiqlangach ilova o\'zi ochiladi.</p><small>Savol bo\'lsa: @Timur_Rakhmonov</small>');
      }else if(st==="no"||st==="old"){
        show(LOGO+(st==="no"?"<b>❌ Ustoz bu telefonni tasdiqlamadi</b>":"<b>🚫 Bu telefon o'chirilgan</b><p>Ilova boshqa telefonga o'tkazilgan yoki ustoz bu telefonni o'chirgan.</p>")+
          '<p><small>Ustozingizga yozing: @Timur_Rakhmonov</small></p><button class="b alt" id="again">Qayta so\'rov yuborish</button>');
        document.getElementById("again").onclick=fresh;
        busy=false;return;
      }
      busy=false;later(st==="wait"?4000:5000);
    }catch(e){
      busy=false;
      show(LOGO+'⚠️ Internet aloqasini tekshiring.<button class="b" id="re">Qayta urinish</button>');
      document.getElementById("re").onclick=step;
    }
  }

  async function open(){
    show('<div class="sp"></div>Ochilmoqda…');
    let r;
    try{r=await IL.call(rec,"open")}catch(e){r={ok:false,err:"net"}}
    if(r.err==="auth")return fresh();
    if(r.err==="status")return step();
    if(r.err==="notmember")return show(LOGO+"🔒 Siz o'quvchilar guruhi a'zosi emassiz.<br><br>Ustozingizga murojaat qiling: <b>@Timur_Rakhmonov</b>");
    if(!r.ok){show(LOGO+'⚠️ Ochib bo\'lmadi. Internetni tekshiring.<button class="b" id="re">Qayta urinish</button>');document.getElementById("re").onclick=open;return}
    const X={uid:r.uid,name:(r.name||(r.un?"@"+r.un:"")).replace(/[<>&"]/g,"")};
    const lib=document.getElementById("lib").textContent;
    const inj=`<div id="__sh"></div><style>body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text}#__sh{position:fixed;inset:0;z-index:2147483646;background:#fff;display:none}@media print{body *{display:none!important}}#__lk{position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font:16px sans-serif;padding:24px}</style>
<script>${lib}<\/script>
<script>(function(){var X=${JSON.stringify(X)};window.__X=X;
 var el=document.createElement("div");el.id="__wm";
 el.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483000;pointer-events:none;background-repeat:repeat";
 function e2(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
 function mk(){var d=new Date(),p=function(n){return("0"+n).slice(-2)},t=p(d.getDate())+"."+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes());
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="300" height="190"><g transform="rotate(-28 150 95)" font-family="Arial,sans-serif" font-weight="700" fill="#1e2a44" fill-opacity=".12" text-anchor="middle"><text x="150" y="88" font-size="17">'+e2(X.name)+'</text><text x="150" y="110" font-size="13">ID '+e2(X.uid)+' · '+t+'</text></g></svg>';
  el.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")'}
 mk();setInterval(mk,30000);(document.body||document.documentElement).appendChild(el);
 ["copy","cut","contextmenu","dragstart"].forEach(function(e){document.addEventListener(e,function(x){if(!(x.target.closest&&x.target.closest("input,textarea")))x.preventDefault()},true)});
 var sh=document.getElementById("__sh"),last=Date.now(),dead=false;
 function lock(t){dead=true;document.body.innerHTML='<div id="__lk">'+t+'</div>'}
 async function ping(){if(dead)return;var now=Date.now(),sec=Math.round((now-last)/1000);last=now;
  try{var rec=await IL.get();if(!rec)return lock("🚫 Ilova qayta ulanishi kerak. Ilovani yopib qayta oching.");
   var j=await IL.call(rec,"ping",{sec:document.visibilityState==="visible"?Math.min(sec,120):0});
   if(j&&j.s==="kick")lock("🚫 Bu telefon o'chirildi.<br><br>Ilovani yopib qayta oching.");}catch(e){}}
 setInterval(function(){if(document.visibilityState==="visible")ping()},30000);
 document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"){sh&&(sh.style.display="block")}else{sh&&(sh.style.display="none");last=Date.now();ping()}});
})();<\/script>`;
    // «👥 Hozir kim shug'ullanyapti» (17.11.2026): telc/live.js
    const liveTag='<script>window.__LIVE={mode:"app"}<\/script><script src="live.js?v=1" charset="utf-8"><\/script>';
    let html=r.html;const i=html.lastIndexOf("</body>");
    html=i>=0?html.slice(0,i)+inj+liveTag+html.slice(i):html+inj+liveTag;
    // Ilova ikonkasi va sarlavhasi saqlanib qolsin
    html=html.replace(/<head>/i,'<head><link rel="manifest" href="ilova.webmanifest?v=2"><link rel="apple-touch-icon" href="ic/apple-180.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="telc B2">');
    document.open();document.write(html);document.close();
  }

  step();
})();
