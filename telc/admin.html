<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>telc B2 · Admin</title><meta name="robots" content="noindex">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7489;--ln:#e3e7f0;--ac:#3b6ef5;--ok:#1f9d55;--bad:#d64545}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--ln);padding:12px 16px;z-index:2}
h1{font-size:17px;margin:0 0 8px}.stats{display:flex;gap:8px;flex-wrap:wrap}.st{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--mu)}.st b{display:block;font-size:16px;color:var(--tx)}
.tools{display:flex;gap:8px;margin-top:10px}input,select{flex:1;padding:9px 10px;border:1px solid var(--ln);border-radius:9px;font:inherit;background:#fff;min-width:0}
main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
.u{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.u .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.u .n{font-weight:600}.u .s{font-size:12px;color:var(--mu);margin-top:3px}
.bd{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--mu);white-space:nowrap}.bd.on{background:#e3f6ea;color:var(--ok)}.bd.x{background:#fbe5e5;color:var(--bad)}.bd.a{background:#e6edff;color:var(--ac)}
.det{margin-top:10px;border-top:1px dashed var(--ln);padding-top:10px;cursor:default}
.det table{width:100%;border-collapse:collapse;font-size:12px}.det td,.det th{padding:4px 6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.btns button{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer}
.btns .r{color:var(--bad);border-color:#f0c4c4}.btns .g{color:var(--ok);border-color:#bfe3cc}
.sec{font-size:12px;color:var(--mu);margin:6px 0}.sec span{display:inline-block;background:var(--bg);border-radius:6px;padding:2px 7px;margin:2px}
h2{font-size:14px;margin:18px 0 8px;color:var(--mu)}.msg{padding:40px 16px;text-align:center;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:1px solid var(--ln);background:#fff;border-radius:9px;padding:8px;font:inherit;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wk{display:flex;align-items:center;gap:8px;margin:4px 0 12px}.wk select{flex:1}
.grid{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden;font-size:13px}.grid th,.grid td{padding:8px;border-bottom:1px solid var(--ln);text-align:left}.grid th{background:var(--bg);font-size:12px;color:var(--mu)}.grid td.n{text-align:right;white-space:nowrap}
.ok{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}.sub td{font-size:12px;color:var(--mu);background:#fafbfe}.tw{overflow-x:auto;margin-bottom:16px}
.rk{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;margin-bottom:8px}.rk .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rk .m{font-size:20px;width:34px;text-align:center;flex:none}.rk .nm{flex:1;font-weight:600}.rk .tx{font-size:13px;margin-top:6px;line-height:1.45}.rk .sc{font-size:12px;color:var(--mu);margin-top:4px}
.mv{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}.mv.up{background:#e3f6ea;color:var(--ok)}.mv.dn{background:#fbe5e5;color:var(--bad)}.mv.eq{background:var(--bg);color:var(--mu)}.mv.nw{background:#e6edff;color:var(--ac)}
.rk.g1{border-color:#f5c542;background:#fffbea}.rk.g2{border-color:#c9ced8}.rk.g3{border-color:#e0a46b}
</style></head><body>
<header><h1>📊 telc B2 — admin</h1><div class="tabs"><button id="t1" class="on">👥 Foydalanuvchilar</button><button id="t3">🏆 Kunlik reyting</button><button id="t2">📅 Haftalik</button></div><div class="stats" id="stats"></div>
<div class="tools" id="tools"><input id="q" placeholder="Ism yoki @username…"><select id="sort"><option value="last">Oxirgi kirish</option><option value="time">Ko'p vaqt</option><option value="visits">Ko'p kirish</option><option value="first">Yangi qo'shilgan</option></select></div></header>
<main id="main"><div class="msg">Yuklanmoqda…</div></main><main id="wmain" hidden></main><main id="dmain" hidden></main>
<script>
const FN="https://hveicvjjqiehjxkwqobr.supabase.co/functions/v1/tg/admin";
const W=window.Telegram&&Telegram.WebApp;try{W.ready();W.expand()}catch(e){}
const api=(op,x={})=>fetch(FN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({initData:W?W.initData:"",op,...x})}).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=s=>{s=s||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} soat ${m} daq`:m?`${m} daq`:`${s} s`};
const dt=d=>{if(!d)return"—";const x=new Date(d);return x.toLocaleString("uz-UZ",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})};
const ago=d=>{if(!d)return"hech qachon";const m=(Date.now()-new Date(d))/60000;return m<3?"hozir onlayn":m<60?Math.round(m)+" daq oldin":m<1440?Math.round(m/60)+" soat oldin":Math.round(m/1440)+" kun oldin"};
let D={users:[]},open=null;
async function load(){const r=await api("list");if(r.err){document.getElementById("main").innerHTML=`<div class="msg">${r.err==="notadmin"?"⛔ Siz admin emassiz":"⚠️ Panelni bot ichidan oching (/panel)"}</div>`;return}D=r;render()}
function render(){
  const U=D.users||[],now=Date.now();
  const on=U.filter(u=>u.last_seen&&now-new Date(u.last_seen)<180000).length,today=U.filter(u=>u.last_seen&&now-new Date(u.last_seen)<86400000).length;
  const tot=U.reduce((a,u)=>a+(u.seconds||0),0);
  document.getElementById("stats").innerHTML=`<div class="st"><b>${U.length}</b>jami</div><div class="st"><b>${on}</b>onlayn</div><div class="st"><b>${today}</b>bugun</div><div class="st"><b>${dur(tot)}</b>umumiy vaqt</div><div class="st"><b>${(D.groups||[]).length}</b>guruh</div>`;
  const q=document.getElementById("q").value.trim().toLowerCase(),so=document.getElementById("sort").value;
  let L=U.filter(u=>!q||`${u.first_name} ${u.last_name} ${u.username} ${u.id}`.toLowerCase().includes(q));
  const k={last:u=>-(new Date(u.last_seen||0)),time:u=>-(u.seconds||0),visits:u=>-(u.visits||0),first:u=>-(new Date(u.first_seen))}[so];L.sort((a,b)=>k(a)-k(b));
  let h=L.map(u=>{const nm=esc([u.first_name,u.last_name].filter(Boolean).join(" ")||u.id),onl=u.last_seen&&now-new Date(u.last_seen)<180000;
    return `<div class="u" data-id="${u.id}"><div class="t"><div><span class="n">${nm}</span> ${u.username?`<span class="s">@${esc(u.username)}</span>`:""}</div><div>${u.is_admin?'<span class="bd a">admin</span> ':""}${u.blocked?'<span class="bd x">bloklangan</span>':onl?'<span class="bd on">onlayn</span>':`<span class="bd">${ago(u.last_seen)}</span>`}</div></div>
    <div class="s">🔁 ${u.visits||0} marta · ⏱ ${dur(u.seconds)} · 📍 ${esc(u.last_section||"—")}${u.member_status&&u.member_status!=="member"&&!u.is_admin?` · <span style="color:var(--bad)">guruhda emas</span>`:""}</div>
    ${open==u.id?`<div class="det" id="det"></div>`:""}</div>`}).join("")||'<div class="msg">Hali hech kim kirmagan</div>';
  if((D.denied||[]).length)h+=`<h2>🚫 Kirolmaganlar (guruhda emas)</h2>`+D.denied.slice(0,20).map(d=>`<div class="u" style="cursor:default"><div class="t"><span>${esc(d.name)} ${d.username?"@"+esc(d.username):""}</span><span class="bd">${dt(d.at)}</span></div></div>`).join("");
  document.getElementById("main").innerHTML=h;
  if(open)detail(open);
}
async function detail(id){
  const u=D.users.find(x=>x.id==id),el=document.getElementById("det");if(!el)return;
  el.innerHTML="…";const r=await api("user",{id});const V=r.visits||[];
  const sec={};V.forEach(v=>Object.entries(v.sections||{}).forEach(([k,s])=>sec[k]=(sec[k]||0)+s));
  const top=Object.entries(sec).sort((a,b)=>b[1]-a[1]);
  el.innerHTML=`<div class="s">ID: ${u.id} · Birinchi kirish: ${dt(u.first_seen)} · Oxirgi: ${dt(u.last_seen)} · ${esc(u.last_platform||"")}</div>
  <div class="btns">${u.blocked?`<button class="g" data-a="unblock">✅ Blokdan chiqarish</button>`:`<button class="r" data-a="block">⛔ Bloklash</button>`}
  <button data-a="kick">📴 Sessiyani yopish</button>
  ${u.allowed?`<button data-a="unallow">Ruxsatni olish</button>`:`<button data-a="allow" title="Guruhda bo'lmasa ham kira oladi">➕ Guruhsiz ruxsat</button>`}
  ${u.is_admin?`<button class="r" data-a="unadmin">Adminlikdan olish</button>`:`<button data-a="admin">👑 Admin qilish</button>`}</div>
  ${top.length?`<div class="sec"><b>Bo'limlar bo'yicha vaqt:</b><br>${top.map(([k,s])=>`<span>${esc(k)} — ${dur(s)}</span>`).join("")}</div>`:""}
  <table><tr><th>Kirish</th><th>Davomiyligi</th><th>Qurilma</th></tr>${V.slice(0,40).map(v=>`<tr><td>${dt(v.started_at)}</td><td>${dur(v.seconds)}</td><td>${esc(v.platform||"")}</td></tr>`).join("")}</table>`;
  el.onclick=async e=>{e.stopPropagation();const a=e.target.dataset.a;if(!a)return;
    const m={block:["blocked",1],unblock:["blocked",0],allow:["allowed",1],unallow:["allowed",0],admin:["is_admin",1],unadmin:["is_admin",0]}[a];
    if(a==="kick")await api("kick",{id});else await api("set",{id,field:m[0],val:!!m[1]});
    try{W.HapticFeedback.notificationOccurred("success")}catch(e){}await load();};
}
document.getElementById("main").addEventListener("click",e=>{const c=e.target.closest(".u[data-id]");if(!c||e.target.closest(".det"))return;open=open==c.dataset.id?null:c.dataset.id;render()});
document.getElementById("q").oninput=render;document.getElementById("sort").onchange=render;

// ---- Haftalik hisobot ----
let WK=[],WR=[],wsel=null,wopen=null;
const pct=(o,b)=>o+b?Math.round(o*100/(o+b))+"%":"—";
const wlab=d=>{const a=new Date(d+"T00:00:00"),e=new Date(a);e.setDate(a.getDate()+6);const f=x=>x.toLocaleDateString("uz-UZ",{day:"2-digit",month:"2-digit",year:"numeric"});return f(a)+" – "+f(e)};
async function loadWeeks(){const r=await api("weeks");WK=r.weeks||[];if(!wsel)wsel=WK[0]||null;if(wsel)WR=(await api("week",{week:wsel})).rows||[];renderW()}
function renderW(){const el=document.getElementById("wmain");
 if(!WK.length){el.innerHTML=`<div class="msg">📅 Hali tayyor hisobot yo'q.<br><br>Hisobot har <b>dushanba</b> kuni soat 00:05 da o'tgan hafta (dushanba–yakshanba) bo'yicha avtomatik tuziladi.</div>`;return}
 const sect={},usr={};
 WR.forEach(r=>{const s=sect[r.sect]||(sect[r.sect]={u:new Set(),sec:0,ok:0,bad:0});s.u.add(r.user_id);s.sec+=r.seconds;s.ok+=r.ok;s.bad+=r.bad;
  const u=usr[r.user_id]||(usr[r.user_id]={name:r.name||r.username||r.user_id,un:r.username,sec:0,ok:0,bad:0,S:[]});u.sec+=r.seconds;u.ok+=r.ok;u.bad+=r.bad;u.S.push(r)});
 const SL=Object.entries(sect).sort((a,b)=>b[1].sec-a[1].sec),UL=Object.entries(usr).sort((a,b)=>b[1].sec-a[1].sec);
 const T=UL.reduce((a,[,u])=>(a.sec+=u.sec,a.ok+=u.ok,a.bad+=u.bad,a),{sec:0,ok:0,bad:0});
 el.innerHTML=`<div class="wk"><select id="wsel">${WK.map(w=>`<option value="${w}" ${w===wsel?"selected":""}>${wlab(w)}</option>`).join("")}</select></div>
 <div class="stats" style="margin-bottom:12px"><div class="st"><b>${UL.length}</b>ishlagan o'quvchi</div><div class="st"><b>${dur(T.sec)}</b>umumiy vaqt</div><div class="st"><b class="ok">${T.ok}</b>to'g'ri</div><div class="st"><b class="no">${T.bad}</b>xato</div><div class="st"><b>${pct(T.ok,T.bad)}</b>natija</div></div>
 <h2>📚 Bo'limlar (Teil) bo'yicha</h2><div class="tw"><table class="grid"><tr><th>Bo'lim</th><th>Odam</th><th>Vaqt</th><th>✓</th><th>✕</th><th>%</th></tr>
 ${SL.map(([k,s])=>`<tr><td>${esc(k)}</td><td class="n">${s.u.size}</td><td class="n">${dur(s.sec)}</td><td class="n ok">${s.ok}</td><td class="n no">${s.bad}</td><td class="n">${pct(s.ok,s.bad)}</td></tr>`).join("")}</table></div>
 <h2>👥 O'quvchilar bo'yicha</h2><div class="tw"><table class="grid"><tr><th>O'quvchi</th><th>Vaqt</th><th>✓</th><th>✕</th><th>%</th></tr>
 ${UL.map(([id,u])=>`<tr data-wu="${id}" style="cursor:pointer"><td>${wopen==id?"▾":"▸"} ${esc(u.name)}${u.un?` <span class="s">@${esc(u.un)}</span>`:""}</td><td class="n">${dur(u.sec)}</td><td class="n ok">${u.ok}</td><td class="n no">${u.bad}</td><td class="n">${pct(u.ok,u.bad)}</td></tr>`+
   (wopen==id?u.S.sort((a,b)=>b.seconds-a.seconds).map(r=>`<tr class="sub"><td>&nbsp;&nbsp;${esc(r.sect)}</td><td class="n">${dur(r.seconds)}</td><td class="n">${r.ok}</td><td class="n">${r.bad}</td><td class="n">${pct(r.ok,r.bad)}</td></tr>`).join(""):"")).join("")}</table></div>
 <div class="s" style="text-align:center">Hisobot har dushanba 00:05 da avtomatik yangilanadi.</div>`;
 document.getElementById("wsel").onchange=async e=>{wsel=e.target.value;wopen=null;WR=(await api("week",{week:wsel})).rows||[];renderW()};
 el.querySelectorAll("[data-wu]").forEach(tr=>tr.onclick=()=>{wopen=wopen==tr.dataset.wu?null:tr.dataset.wu;renderW()});
}

// ---- Kunlik reyting ----
let DD=[],dsel="live",DR=null;
const MON=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentyabr","oktyabr","noyabr","dekabr"];
const dlab=d=>{const x=new Date(d+"T00:00:00");return x.getDate()+"-"+MON[x.getMonth()]};
const dprev=d=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)};
async function loadDays(){const r=await api("days");DD=r.days||[];await loadDay()}
async function loadDay(){DR=await api("day",dsel==="live"?{live:true}:{day:dsel});renderD()}
function renderD(){const el=document.getElementById("dmain"),R=(DR&&DR.rows)||[],d=DR&&DR.day;
 const T=R.reduce((a,r)=>(a.ok+=r.ok,a.bad+=r.bad,a.sec+=r.seconds,a),{ok:0,bad:0,sec:0});
 const md=n=>n===1?"🥇":n===2?"🥈":n===3?"🥉":n+".";
 const mv=r=>r.prev_rank==null?`<span class="mv nw">🆕 yangi</span>`:r.prev_rank>r.rank?`<span class="mv up">⬆ +${r.prev_rank-r.rank}</span>`:r.prev_rank<r.rank?`<span class="mv dn">⬇ −${r.rank-r.prev_rank}</span>`:`<span class="mv eq">= o'zgarmadi</span>`;
 const mvT=r=>r.prev_rank==null?"":r.prev_rank>r.rank?` Oldingi kundan <b style="color:var(--ok)">${r.prev_rank-r.rank} pog'ona ko'tarildi</b> (${r.prev_rank}-o'rindan).`:r.prev_rank<r.rank?` Oldingi kundan <b style="color:var(--bad)">${r.rank-r.prev_rank} pog'ona tushdi</b> (${r.prev_rank}-o'rindan).`:` O'rni o'zgarmadi.`;
 el.innerHTML=`<div class="wk"><select id="dsel"><option value="live" ${dsel==="live"?"selected":""}>Bugun — davom etmoqda (21:00 da yopiladi)</option>${DD.map(x=>`<option value="${x}" ${x===dsel?"selected":""}>${dlab(x)} · ${dlab(dprev(x))} 21:00 – ${dlab(x)} 21:00</option>`).join("")}</select></div>
 <div class="stats" style="margin-bottom:12px"><div class="st"><b>${R.length}</b>ishlagan</div><div class="st"><b class="ok">${T.ok}</b>to'g'ri</div><div class="st"><b class="no">${T.bad}</b>xato</div><div class="st"><b>${pct(T.ok,T.bad)}</b>natija</div><div class="st"><b>${dur(T.sec)}</b>vaqt</div></div>
 ${R.length?R.map(r=>{const S=Object.entries(r.sects||{}).filter(([,v])=>v[0]+v[1]>0).sort((a,b)=>(b[1][0]+b[1][1])-(a[1][0]+a[1][1]));
  const nm=esc(r.name||r.username||r.user_id);
  return `<div class="rk ${r.rank<=3?"g"+r.rank:""}"><div class="t"><span class="m">${md(r.rank)}</span><span class="nm">${nm}${r.username?` <span class="s">@${esc(r.username)}</span>`:""}</span>${mv(r)}</div>
  <div class="tx"><b>${nm}</b> — ${r.rank}-o'rin. ${dsel==="live"?"Bugun":"Shu kuni"} jami <b class="ok">${r.ok} ta to'g'ri</b>, <b class="no">${r.bad} ta xato</b>${S.length?" — "+S.map(([k,v])=>`${esc(k)} (✓${v[0]} ✕${v[1]})`).join(", "):""}.${mvT(r)}</div>
  <div class="sc">⏱ ${dur(r.seconds)} · natija ${pct(r.ok,r.bad)}</div></div>`}).join(""):`<div class="msg">${dsel==="live"?"Bugun hali hech kim test ishlamadi.":"Bu kunda natija yo'q."}</div>`}
 <div class="s" style="text-align:center;margin-top:8px">Kun har kuni 21:00 da yopiladi, 21:01 dan yangi kun boshlanadi. O'rin: to'g'ri javoblar soni bo'yicha (teng bo'lsa — kam xato).</div>`;
 document.getElementById("dsel").onchange=async e=>{dsel=e.target.value;el.innerHTML='<div class="msg">Yuklanmoqda…</div>';await loadDay()};
}
function tab(n){document.getElementById("t1").classList.toggle("on",n===1);document.getElementById("t2").classList.toggle("on",n===2);document.getElementById("t3").classList.toggle("on",n===3);document.getElementById("dmain").hidden=n!==3;if(n===3){document.getElementById("dmain").innerHTML='<div class="msg">Yuklanmoqda…</div>';loadDays()}
 document.getElementById("main").hidden=n!==1;document.getElementById("tools").hidden=n!==1;document.getElementById("stats").hidden=n!==1;document.getElementById("wmain").hidden=n!==2;
 if(n===2){document.getElementById("wmain").innerHTML='<div class="msg">Yuklanmoqda…</div>';loadWeeks()}}
document.getElementById("t1").onclick=()=>tab(1);document.getElementById("t3").onclick=()=>tab(3);document.getElementById("t2").onclick=()=>tab(2);
load();setInterval(load,60000);
</script></body></html>
