 {"g": "b", "t": "Wählen mit 16", "u": "16 yoshdan saylovda qatnashish", "img": "m/waehlen16.jpg", "ot": "Wählen schon mit 16", "ou": "Saylov yoshi o'zgarmas narsa emas. Kim qachondan saylov huquqiga ega bo'lishi kerakligi haqidagi qarashlar o'zgarib turadi. So'nggi paytda yoshlar 16 yoshdan Germaniyadagi barcha saylovlarda qatnashishi kerakmi, degan savol tobora ko'p muhokama qilinmoqda. Hozirgi saylov yoshi asosan 18, garchi ba'zi federal yerlarda, masalan mahalliy saylovlarda, 16 yoshdan ovoz berish mumkin. Saylov yoshini umuman 16 ga tushirish foydasiga va zarariga qanday dalillar bor?\nAvval tushirish foydasiga dalillar: saylov yoshini tushirish davlat institutlari (barcha darajadagi hukumatlar, jumladan o'z shahri yoki yeri) yoshlar orasida ko'proq tan olinishiga olib kelishi mumkin, chunki yoshlar ularni shakllantirishda ishtirok etadi. Bundan tashqari, yoshlar siyosatga juda qiziqadi va faol. Bu faollik hozir faqat parlamentdan tashqarida namoyon bo'ladi; saylov huquqi bilan yoshlar manfaatlarini ifodalash va faol bo'lish imkoniyati ko'payardi. Yoshlar saylov huquqiga ega bo'lsa, ularning manfaatlari ko'proq hisobga olinadi. Yoshlar saylov huquqi siyosatni kelajak uchun jasoratli qarorlar qabul qilishga majbur qiladi. Bundan tashqari, siyosiy qarorlar ko'pincha qaytarib bo'lmaydigan bo'lgani uchun bugungi yoshlar katta bo'lganda ishtirok eta olmagan qarorlarning oqibatini ko'taradi. Bu demokratiyaning asosiy g'oyasiga zid: qoidalar kimga tegishli bo'lsa, o'shalar ularni belgilashda qatnasha olishi kerak.\nBoshqa tomondan, bu siyosatga qiziqadigan yoshlarning hammasiga tegishlimi — bahsli. Nihoyat, yoshlar beqaror va ekstremal qarashlarga moyil, degan dalil ham bor. Saylov yoshini tushirish o'ta chap va o'ta o'ng partiyalarni kuchaytirib, siyosiy tizimni radikallashtirishi mumkin. Xo'sh, saylov yoshi 18 da qolishi kerakmi?", "p": [["Inhalt", "Im Text geht es um die Frage, ob {Jugendliche schon mit 16 wählen} dürfen sollen.", "Matnda yoshlarga 16 yoshdan saylovda ovoz berishga ruxsat berish kerakmi, degan savol ko'riladi."], ["Vorteile", "Jugendliche können {über ihre eigene Zukunft mitentscheiden}, und Politiker {hören ihnen mehr zu}.", "Yoshlar o'z kelajagi haqida qaror qabul qilishda ishtirok eta oladi va siyosatchilar ularni ko'proq tinglaydi."], ["Nachteile", "Viele 16-Jährige {interessieren sich nicht für Politik} und können {leicht beeinflusst} werden.", "Ko'p 16 yoshlilar siyosatga qiziqmaydi va ularga osongina ta'sir qilish mumkin."], ["Erfahrung", "Ich habe {mit 18 zum ersten Mal gewählt} und wusste damals {nicht viel über die Kandidaten}. Ich habe einfach {wie meine Eltern} gewählt.", "Men 18 yoshda birinchi marta ovoz berganman va o'shanda nomzodlar haqida ko'p narsa bilmasdim. Men shunchaki ota-onam kabi ovoz berdim."], ["Meinung", "Meiner Meinung nach sollte das Wahlalter {bei 18 bleiben}, aber Schulen sollten {mehr über Politik unterrichten}. Dann können junge Leute {besser entscheiden}.", "Menimcha, saylov yoshi 18 da qolishi kerak, lekin maktablar siyosat haqida ko'proq o'qitishi kerak. Shunda yoshlar yaxshiroq qaror qabul qila oladi."]], "k": [["wählen / die Wahl", "saylamoq / saylov"], ["das Wahlalter", "saylov yoshi"], ["wahlberechtigt", "saylov huquqiga ega"], ["mitbestimmen / mitentscheiden", "qaror qabul qilishda qatnashmoq"], ["sich engagieren", "faol bo'lmoq"], ["beeinflussen", "ta'sir qilmoq"], ["die Radikalisierung", "radikallashuv"]]},
 {"g": "b", "t": "Teilzeitarbeit für Männer", "u": "Erkaklar uchun yarim stavka ish", "img": "m/teilzeit.jpg", "ot": "Teilzeitarbeit auch für Männer?", "ou": "Yarim stavkali ish erkaklarni kasal qiladi — yaqinda bir sug'urta kassasi tadqiqoti shunday xulosaga keldi: haftasiga 20 soat ishlaydiganlar to'liq stavkadagi erkaklarga qaraganda ko'proq depressiyaga tushadi va ko'proq psixotrop dori ichadi. Demak, firmalarning erkaklarni yarim stavkaga olishi aqlsizlikmi? Aslo, chunki firmalar nuqtai nazaridan erkaklarga ham yarim stavka taklif qilish foydasiga bir qator dalillar bor.\nYarim stavkada ishlaydiganlarning ko'pchiligi ishdan bo'sh vaqtida bolalariga qaraydi. Ko'p mutaxassislar fikricha, bu tajriba firmaga foyda keltiradigan maxsus qobiliyatlarda namoyon bo'ladi: tashkilotchilik, moslashuvchanlik, muammolarni tez va oson hal qilish.\nXodimlarda vazifalar uchun vaqt kamroq bo'lsa, ular undan ko'pincha samaraliroq foydalanadi: diqqat bilan ishlaydi va bo'sh turishlar kam bo'ladi. Shu bilan o'z ishidan qoniqish ortadi, bu esa ish muhitiga ijobiy ta'sir qiladi. Firma uchun ish o'rnini bo'lish ham foydali bo'lishi mumkin: ikki yoki undan ko'p xodim bir vazifa sohasini o'zaro bo'ladi. Shunda maxsus bilim bo'linadi va xodimlardan biri ketganda ham saqlanib qoladi. Ta'til yoki kasallik holatlarini yengish osonroq, chunki doim malakali xodim tayyor turadi.\nTo'g'ri, yarim stavka ijtimoiy sug'urta xarajatlarini va kadrlar bo'limidagi qo'shimcha ma'muriy ishni oshiradi. Xodimlar soni ko'paygan sari malaka oshirish xarajatlari ham ortadi.\nUmuman olganda, yarim stavka firmalar uchun bir qator afzalliklarga ega. Erkaklarning o'zi uchun ham kamroq stress va oila uchun ko'proq vaqt uzoq muddatda ijobiy ta'sir qilishi kerak. Tadqiqot rahbarlari erkaklar avvalo klassik rol tasavvurlari bilan xayrlashishni va o'zini faqat kasb orqali tasdiqlamaslikni o'rganishi kerak, degan xulosaga keladi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob {auch Männer in Teilzeit arbeiten} sollten.", "Matnda erkaklar ham yarim stavkada ishlashi kerakmi, degan savol ko'riladi."], ["Vorteile", "Männer haben {mehr Zeit für die Familie} und arbeiten oft {konzentrierter}.", "Erkaklarda oila uchun ko'proq vaqt bo'ladi va ular ko'pincha diqqat bilan ishlaydi."], ["Nachteile", "Sie {verdienen weniger Geld} und haben manchmal {weniger Karrierechancen}.", "Ular kamroq pul topadi va ba'zan martaba imkoniyati kamroq bo'ladi."], ["Erfahrung", "In Usbekistan arbeiten Männer meistens {Vollzeit}, weil sie {die Familie finanziell versorgen} müssen. Deshalb haben sie {wenig Zeit für die Kinder}.", "O'zbekistonda erkaklar asosan to'liq stavkada ishlaydi, chunki oilani moddiy ta'minlashi kerak. Shuning uchun ularning bolalarga vaqti kam."], ["Meinung", "Meiner Meinung nach sollte jeder Mann {frei wählen} können, besonders {wenn die Kinder klein} sind. Dann haben die Kinder {mehr Zeit mit dem Vater}.", "Menimcha, har bir erkak erkin tanlay olishi kerak, ayniqsa bolalar kichik bo'lganda. Shunda bolalar otasi bilan ko'proq vaqt o'tkazadi."]], "k": [["die Teilzeitarbeit / Vollzeit", "yarim stavka / to'liq stavka"], ["der Arbeitnehmer", "xodim"], ["flexibel / die Flexibilität", "moslashuvchan / moslashuvchanlik"], ["effizient", "samarali"], ["die Arbeitsplatzteilung", "ish o'rnini bo'lish"], ["das Rollenbild", "rol tasavvuri"], ["verdienen", "pul topmoq"]]},
 {"g": "b", "t": "Englisch als Firmensprache", "u": "Ingliz tili — xalqaro firma tili", "img": "m/englisch.jpg", "ot": "Englisch als weltweite Unternehmenssprache", "ou": "Xalqaro faoliyat yurituvchi firmalar uchun boshqa tilli mahalliy bozorlarda ham ingliz tili korporativ til sifatida odatiy holga aylandi. Internet bu jarayonni yanada tezlashtirdi. Afzallik va kamchiliklari haqida turlicha fikrlash mumkin. Haqiqat shuki, ingliz tili iqtisod va ilm tiliga aylandi va bu deyarli o'zgarmaydi.\nBu jarayon tanqidchilari esa til shunchaki ma'lumotdan ko'proq narsa, deydi. Ko'pincha yaxshi bilinmaydigan ingliz tilidan rangsiz va hissiyotsiz foydalanish haqiqatan ko'prik qurishga yaramaydi. Tarafdorlar esa bunga qarshi: global faoliyat yurituvchi deyarli barcha firmalar uchun, qayerda joylashganidan qat'i nazar, ingliz tili dunyoda aloqa o'rnatish va saqlash tiliga aylangan — biznes madaniyatlarini birlashtirishning ehtimol qo'pol, lekin baribir birinchi qadami. Bundan tashqari, tarjimonlar va tarjimalarga ketadigan katta mablag' tejaladi.\nFirmalar uchun iqtisodiy foydali bo'lgan narsa xodimlarda ko'pincha qo'rquv uyg'otadi. Ular qobiliyatlari cheklangandek his qiladi: ona tilida katta so'z boyligiga ega bo'lib, ishonch bilan gapira oladiganlar chet tilida bu qobiliyatni ko'pincha yo'qotadi. Raqiblar umumiy til jarayonlar, muloqot va jamoa tuzishni osonlashtirishini tan oladi. Lekin umumiy til odamlarda hamma bir-biri bilan haqiqatan samarali muloqot qilayotgandek illyuziya ham uyg'otadi. Bir xil so'zlar boshqa mahalliy sharoitda butunlay boshqa ma'no olishi mumkin, boshqacha talaffuz yoki kuchli aksent esa muloqotni osonlashtirmaydi.\nTil bilan bog'liq turli fikrlash usullari bunday firma madaniyatida umuman namoyon bo'lmasligi mumkin va tashkilot xodimlarining g'oya va qarashlari salohiyatidan cheklangan foydalanadi. Shuning uchun tillar xilma-xilligi saqlanishi va qadrlanishi kerak, umumiy tilga kelishmoqchi bo'lganda ham.", "p": [["Inhalt", "Im Text geht es darum, dass viele internationale Firmen {Englisch als gemeinsame Sprache} benutzen.", "Matnda ko'p xalqaro firmalar ingliz tilini umumiy til sifatida ishlatishi haqida gap boradi."], ["Vorteile", "Alle {verstehen sich besser}, und die Firma {spart Geld für Übersetzer}.", "Hamma bir-birini yaxshiroq tushunadi va firma tarjimonlarga ketadigan pulni tejaydi."], ["Nachteile", "Viele Mitarbeiter {sprechen nicht gut Englisch} und können sich {nicht so gut ausdrücken}.", "Ko'p xodimlar ingliz tilini yaxshi bilmaydi va fikrini unchalik yaxshi ifodalay olmaydi."], ["Erfahrung", "In der Medizin sind {fast alle Fachartikel auf Englisch}, deshalb {lese ich viel auf Englisch}. Ohne Englisch {kann man heute kaum studieren}.", "Tibbiyotda deyarli barcha ilmiy maqolalar ingliz tilida, shuning uchun men inglizcha ko'p o'qiyman. Hozir ingliz tilisiz o'qish deyarli imkonsiz.",["Ich bin Englischlehrerin, deshalb {spreche und lese ich jeden Tag Englisch}.", "Men ingliz tili o'qituvchisiman, shuning uchun har kuni inglizcha gapiraman va o'qiyman."]], ["Meinung", "Meiner Meinung nach ist Englisch {sehr wichtig}, aber man sollte auch {die Landessprache lernen}. So fühlt man sich {im neuen Land zu Hause}.", "Menimcha, ingliz tili juda muhim, lekin mamlakat tilini ham o'rganish kerak. Shunda yangi mamlakatda o'zini uydagidek his qiladi."]], "k": [["die Unternehmenssprache", "firma tili"], ["international tätig", "xalqaro faoliyat yurituvchi"], ["der Dolmetscher / die Übersetzung", "tarjimon / tarjima"], ["sich ausdrücken", "fikrini ifodalamoq"], ["der Wortschatz", "so'z boyligi"], ["die Sprachenvielfalt", "tillar xilma-xilligi"], ["der Akzent", "aksent, talaffuz"]]},
 {"g": "b", "t": "Spielen für die Karriere", "u": "Martaba uchun o'yin", "img": "m/karriere.jpg", "ot": "Spielen für die Karriere", "ou": "Yangi tashkil etilgan aviakompaniyani qabul qilgan yosh menejer uni zarardan chiqarishi kerak. U dunyoning eng muhim aeroportlari uchun parvoz litsenziyalarini olishi, qo'shimcha samolyotlar sotib olishi, malakali xodimlarni ishga olishi kerak — lekin pul kam. Yangi samolyotlarni ijaraga olsinmi yoki ishlatilganini sotib olsinmi? Arzon chipta taklif qilsinmi yoki qimmatroq reyslarga mijoz jalb qilsinmi? Bu og'ir bosqichda qaror qabul qilishda hamma narsani nazorat qilmasa, aviakompaniya bankrot bo'ladi. Noutbuk ekranida \"O'yin tugadi\" yozuvi miltillaydi, chunki bularning hammasi faqat simulyatsiya.\nLufthansa aviakompaniyasida yosh xodimlar o'quv materiallari yoki ma'ruzalar bilan qiynalish o'rniga soatlab kompyuterda o'ynaydi. \"Airline Company\" kompyuter o'yini orqali xodimlar aviakompaniyani qanday tashkil qilish va boshqarishni o'rganadi: yo'nalishlarni belgilaydi, samolyot parkini tuzadi, xodim yollaydi va o'qitadi, marketing kampaniyalarini boshlaydi — oxirida esa foyda qilishi va raqiblarni yengishi kerak.\nSamolyot va aeroportlar haqidagi barcha texnik ma'lumotlar haqiqatga mos. Ayniqsa yosh xodimlar va o'quvchilar bunday o'yin uslubidan zavqlanadi va o'yin orqali firma qanday ishlashini tez tushunadi, deydi Lufthansa ta'lim menejeri Ronald Urgast. Birgalikda o'ynash klassik malaka oshirish kurslaridan nafaqat qiziqarliroq, balki samaraliroq ham. \"Agar yoshlarga xuddi shu mazmunni taqdimotda bersak, ancha kam eslab qolishardi. O'yinda diqqat va e'tibor ancha katta\", deydi Urgast.\nBir qancha boshqa firmalar ham bir necha yildan beri mutaxassis va rahbarlarni tayyorlashda bunday kompyuter simulyatsiyalari bilan tajriba o'tkazmoqda. \"Jiddiy o'yinlar\" bilan ular avvalo yosh xodimlarni o'z firmasiga jalb qilmoqchi. Tadqiqotlar ko'rsatadiki, raqamli avlod yoshlari uchun jozibali malaka oshirish takliflari ish beruvchini tanlashda muhim mezon.\nFirmalar uchun eng katta kamchilik — xarajat: alohida tayyorlangan o'quv o'yini klassik e-learning dasturidan kamida ikki barobar qimmat. Bu ko'pchilik firmalar uchun juda qimmat.", "p": [["Inhalt", "Im Text geht es darum, dass Firmen wie Lufthansa {junge Mitarbeiter mit Computerspielen schulen}.", "Matnda Lufthansa kabi firmalar yosh xodimlarni kompyuter o'yinlari orqali o'qitishi haqida gap boradi."], ["Vorteile", "Man lernt {mit Spaß} und {behält mehr} als bei einem normalen Vortrag.", "Qiziqib o'rganasan va oddiy ma'ruzadan ko'ra ko'proq eslab qolasan."], ["Nachteile", "Solche Lernspiele sind {sehr teuer}, und {nicht jede Firma} kann sie bezahlen.", "Bunday o'quv o'yinlari juda qimmat va har bir firma ham ularni to'lay olmaydi."], ["Erfahrung", "Im Medizinstudium haben wir {an Simulatoren und Puppen} geübt, und das hat {sehr geholfen}. Danach hatten wir {weniger Angst} vor echten Patienten.", "Tibbiyot o'qishida biz simulyator va qo'g'irchoqlarda mashq qilganmiz va bu juda yordam bergan. Keyin haqiqiy bemorlardan kamroq qo'rqardik.",["Im Studium haben wir {mit Lernspielen Englisch geübt}, und das hat {sehr geholfen}.", "O'qishda biz o'quv o'yinlari bilan ingliz tilini mashq qilganmiz va bu juda yordam bergan."]], ["Meinung", "Meiner Meinung nach sind Lernspiele {eine gute Ergänzung}, aber sie können {die Praxis nicht ersetzen}. Am Ende muss man {echte Erfahrung} sammeln.", "Menimcha, o'quv o'yinlari yaxshi qo'shimcha, lekin ular amaliyotning o'rnini bosa olmaydi. Oxir-oqibat haqiqiy tajriba to'plash kerak."]], "k": [["die Simulation", "simulyatsiya"], ["die Nachwuchskraft", "yosh xodim"], ["die Weiterbildung", "malaka oshirish"], ["der Arbeitgeber", "ish beruvchi"], ["die Aufmerksamkeit", "diqqat, e'tibor"], ["pleitegehen", "bankrot bo'lmoq"], ["sich etwas merken", "eslab qolmoq"]]},
 {"g": "b", "t": "Klassenfahrten", "u": "Sinf sayohatlari", "img": "m/klassenfahrt.jpg", "ot": "Sind Klassenfahrten sinnvoll?", "ou": "Bizningcha, sinf sayohatlari muhim va yaxshi, chunki ular sinf jamoasini mustahkamlaydi. Bir-biringni yaxshiroq bilib olasan, o'qituvchilarni ham faqat darsdan emas, boshqacha taniysan. Bir-biring bilan til topishishni o'rganasan va o'zing uchun javobgar bo'lasan. 4–9-sinflar uchun mos joylar — Shimoliy dengiz, Kyoln va Berlin. 10-sinfdan yoki yuqori sinflardan Ispaniya yoki Fransiya ham mayli. Sinf sayohatlari kam pulli oilalar ham ko'tara olishi uchun juda qimmat bo'lmasligi kerak. To'lay olmasa, har bir o'quvchi qatnashishi uchun shahar yoki maktab biroz moliyaviy yordam berishi kerak. Ko'pi bilan 500 yevro va bir hafta bo'lishi kerak. Avstraliya yoki Janubiy Amerika unchalik mos emas. Sayohat o'quvchilar kun tartibiga rioya qilishi va zerikmasligi uchun oldindan yaxshi rejalashtirilishi kerak. Mos diqqatga sazovor joylar — masalan, Berlinda Brandenburg darvozasi, Reyxstag, Kyolnda sobor. O'quvchilarning istak va takliflariga ham e'tibor berish kerak. (Malte, Noa)\nSinf sayohatlarining asosiy maqsadi — sinf jamoasi va birdamlikni mustahkamlash, do'stlik orttirish (masalan, 5-sinfdagi maxsus tanishuv sayohati). Menimcha, bu yomon emas, ayniqsa sinfdoshlar bilan ko'p vaqt o'tkaziladigan shahar rallilarida. Shunda oddiy hayotda bo'lmaydigan tarzda tanishasan. Demak, menimcha, sinf sayohatlari puxta o'ylangan bo'lsa va o'quvchilarda dam olishga yetarli vaqt bo'lsa, yaxshi. (Dominik)\nBizningcha, sinf sayohatlari juda yaxshi, chunki masalan 5-sinf o'quvchilari bir-birini yaxshiroq taniydi. Bundan tashqari, ular o'quvchi va o'qituvchilarga odatda juda zavq beradi va pedagogik jihatdan qimmatli, chunki darsliklarda doim topib bo'lmaydigan narsalarni ko'rasan. Ota-onasi kam pul topadigan o'quvchilar uchun muhim shahar va manzaralarni ko'rishning juda yaxshi imkoniyati. Agar ba'zi ota-onalar uchun baribir qimmat bo'lsa, jamoa yoki shahardan yordam so'rashi mumkin. Bundan tashqari, sinf sayohatlari sinf jamoasini mustahkamlaydi va o'quvchilar o'qituvchilar bilan yaxshiroq munosabatga ega bo'ladi, shundan keyin darsda ham yaxshiroq til topishadi.", "p": [["Inhalt", "Im Text erzählen Schüler, warum {Klassenfahrten wichtig} sind und {wie sie organisiert} sein sollten.", "Matnda o'quvchilar sinf sayohatlari nima uchun muhimligi va qanday tashkil qilinishi kerakligini aytib beradi."], ["Vorteile", "Die Schüler {lernen sich besser kennen} und sehen {neue Städte und Sehenswürdigkeiten}.", "O'quvchilar bir-birini yaxshiroq taniydi va yangi shahar va diqqatga sazovor joylarni ko'radi."], ["Nachteile", "Für manche Familien sind Klassenfahrten {zu teuer}, und {nicht alle Kinder} können mitfahren.", "Ba'zi oilalar uchun sinf sayohatlari juda qimmat va hamma bolalar ham bora olmaydi."], ["Erfahrung", "In meiner Schulzeit sind wir {nach Samarkand gefahren}, und das war {ein tolles Erlebnis}. Wir haben {die Geschichte unseres Landes} besser kennengelernt.", "Maktab davrimda biz Samarqandga borganmiz va bu ajoyib taassurot bo'lgan. Mamlakatimiz tarixini yaxshiroq bilib oldik."], ["Meinung", "Meiner Meinung nach sind Klassenfahrten {sinnvoll}, aber die Schule sollte {armen Familien helfen}. So können {alle Schüler} mitfahren.", "Menimcha, sinf sayohatlari foydali, lekin maktab kam ta'minlangan oilalarga yordam berishi kerak. Shunda barcha o'quvchilar safarga bora oladi."]], "k": [["die Klassenfahrt", "sinf sayohati"], ["die Klassengemeinschaft", "sinf jamoasi"], ["der Zusammenhalt", "birdamlik"], ["die Sehenswürdigkeit", "diqqatga sazovor joy"], ["sich leisten können", "(pulga) qurbi yetmoq"], ["pädagogisch wertvoll", "pedagogik jihatdan qimmatli"], ["Verantwortung übernehmen", "mas'uliyat olmoq"]]},
 {"g": "b", "t": "Haushaltsgeräte", "u": "Maishiy texnika uy ishini yengillashtiradi", "img": "m/haushalt.jpg", "ot": "Haushaltsgeräte erleichtern die Hausarbeit", "ou": "Elektr oshxona jihozlari haqiqiy ko'p qirrali usta! Ular aralashtiradi, xamir qoradi va ko'pirtiradi, isitadi, qaynatadi va qovuradi. Puxta o'ylangan maishiy texnika yordamida bajarib bo'lmaydigan oshxona ishi deyarli yo'q. Ular tufayli hatto mutlaq yangi boshlovchilar ham juda tez mohir oshpazga aylanadi va tajribali oshpazlardan kam vaqt sarflaydi. Aynan ko'p kuch va vaqtni tejagani uchun elektr oshxona jihozlari Rojdestvoga mashhur sovg'a.\nKofe kapsulali mashinalar — tugma bosish bilan mukammal doza va eng yaxshi sifat. Eng mashhur maishiy texnikalardan biri — zamonaviy kofe va espresso mashinalari. Ikkalasi ham ko'p ishlatiladi: ertalab uyg'onish uchun ham, tushdan keyin pishiriq va tort bilan ham. Qora issiq ichimlik nemislarning eng sevimlisi. Klassik filtrli kofe mashinalaridan tashqari, ayniqsa juda qulay kapsulali mashinalar talabchan kofe ishqibozlariga yoqadi. Bu tushunarli: ulardan foydalanish oson va tez. Bundan tashqari, yolg'iz yashaydiganlarni xursand qilib, endi ko'p miqdorda pishirish shart emas: doza ancha oson va texnika bir-ikki katta yoki kichik piyolani o'zi kuzatmasdan to'ldiradi.\nVaqt va pulni tejaydi: bitta mashinada ko'p funksiya. Amaliy oshxona kombaynlari va kuchli blenderlar ham juda talabgir. Bitta jihoz ko'p boshqalarning o'rnini bosadi: zamonaviy kombaynlar xamir qorishi yoki qaymoqni sachratmasdan ko'pirtirishi mumkin, ularda sabzavot to'g'ragich va go'sht qiymalagich bor. Ular elektr tejaydi va ko'pchilik o'ylagandan ancha arzon. Xavfsizlik doim birinchi o'rinda: kabel saqlash joyi, himoya qopqog'i va avtomatik o'chirish mexanizmi bor.\nStatsionar blender — eng mashhur maishiy texnikalardan biri. Kuchli blenderlar ko'p oshxona kombaynlarining qismi bo'lsa ham, ko'pchilik mijozlar ularni alohida sotib olishni afzal ko'radi.", "p": [["Inhalt", "Im Text geht es darum, dass {moderne Küchengeräte} die {Hausarbeit leichter und schneller} machen.", "Matnda zamonaviy oshxona jihozlari uy ishini osonroq va tezroq qilishi haqida gap boradi."], ["Vorteile", "Man {spart viel Zeit und Kraft}, und auch Anfänger {können gut kochen}.", "Ko'p vaqt va kuch tejaladi va yangi boshlovchilar ham yaxshi ovqat pishira oladi."], ["Nachteile", "Viele Geräte sind {teuer}, {brauchen Strom} und stehen oft {nur ungenutzt in der Küche}.", "Ko'p jihozlar qimmat, elektr sarflaydi va ko'pincha oshxonada ishlatilmay turadi."], ["Erfahrung", "Bei uns zu Hause hilft {eine Waschmaschine und ein Multikocher} meiner Frau sehr. So hat sie {mehr Zeit für die Kinder}.", "Bizning uyda kir yuvish mashinasi va multivarka ayolimga juda yordam beradi. Shunday qilib uning bolalarga ko'proq vaqti qoladi."], ["Meinung", "Meiner Meinung nach sollte man {nur Geräte kaufen}, die man {wirklich jeden Tag braucht}. Sonst {gibt man zu viel Geld aus}.", "Menimcha, faqat haqiqatan har kuni kerak bo'ladigan jihozlarni sotib olish kerak. Aks holda ortiqcha pul sarflanadi."]], "k": [["das Haushaltsgerät", "maishiy texnika"], ["die Hausarbeit", "uy ishi"], ["erleichtern", "yengillashtirmoq"], ["die Küchenmaschine / der Mixer", "oshxona kombayni / blender"], ["Zeit und Kraft sparen", "vaqt va kuch tejamoq"], ["der Strom / stromsparend", "elektr / elektr tejaydigan"], ["praktisch", "amaliy, qulay"]]},
 {"g": "b", "t": "Elektronischer Ausweis", "u": "Elektron pasport bilan xarid", "img": "m/eperso.jpg", "ot": "Einkaufen mit dem elektronischen Personalausweis", "ou": "Xavfsiz pul o'tkazish, pensiya hisobiga tez nazar tashlash yoki onlayn do'konda yoshni oson tekshirish — bularning hammasi va yana ko'p narsani elektron shaxsiy guvohnoma (E-Perso) imkon berishi kerak. Chunki o'quvchi qurilma va \"AusweisApp\" kompyuter dasturi bilan E-Perso egalari internetda shaxsini tasdiqlay oladi. Lekin yangi imkoniyatlardan deyarli hech kim foydalanmaydi. Ko'p fuqarolar ma'lumotlari uchun qo'rqadi va guvohnomani ishlatish o'rniga noqulay usulda xarid qilishni afzal ko'radi. Ehtimol muvaffaqiyatsizlik sababi yangi funksiyalar tufayli E-Perso qimmatlashganidir: buyurtma qilgan kishi taxminan 30 yevro to'laydi. Onlayn funksiyalardan foydalanish uchun guvohnoma berilganda \"raqamli identifikatsiya\" yoqilishi kerak. Foydalanuvchi o'quvchi qurilma ham sotib olishi kerak. Bundan tashqari, E-Perso bilan xizmat ko'rsatadigan firmalar soni kam: xarajat ko'pchilik provayderlar uchun juda yuqori, mijoz shaxsini tasdiqlashning boshqa usullari ham bor.\nShunga qaramay, mutaxassislar E-Persoga ishonadi: kelajakda ko'proq qo'llanishlar bo'ladi. Tegishli federal vazirlik matbuot kotibi Filipp Shpaushus ham shunday fikrda: \"Fuqarolar funksiyani qancha ko'p yoqib qo'ysa, iqtisod va boshqaruvning jozibali takliflarga sarflagan mablag'i shuncha tez o'zini oqlaydi.\"\n2020-yilgacha har bir nemis E-Perso olishi kerak. Hozir faqat 13,5 millionga yaqin yangi guvohnoma muomalada, ulardan faqat 3,8 millionga yaqinida raqamli identifikatsiya yoqilgan, ya'ni faqat shu odamlar guvohnomani masalan internetda tasdiqlash uchun ishlatmoqchi. Demak, barcha fuqarolar undan foydalanishiga hali ancha vaqt bor. Yoki E-Perso yana bekor qilinadimi?", "p": [["Inhalt", "Im Text geht es um den {elektronischen Personalausweis}, mit dem man sich {im Internet ausweisen} kann.", "Matnda internetda shaxsni tasdiqlash mumkin bo'lgan elektron shaxsiy guvohnoma haqida gap boradi."], ["Vorteile", "Man kann {online sicher einkaufen}, {Geld überweisen} und {Behördengänge sparen}.", "Onlayn xavfsiz xarid qilish, pul o'tkazish va idoralarga borishni tejash mumkin."], ["Nachteile", "Viele Menschen haben {Angst um ihre Daten}, und man braucht {ein extra Lesegerät}.", "Ko'p odamlar ma'lumotlari uchun qo'rqadi va qo'shimcha o'quvchi qurilma kerak."], ["Erfahrung", "In Usbekistan benutze ich {meine ID-Karte und my.gov.uz}, um {Dokumente online zu bekommen}. Ich muss {nicht mehr lange warten}.", "O'zbekistonda hujjatlarni onlayn olish uchun ID-kartam va my.gov.uz dan foydalanaman. Endi uzoq kutishim shart emas."], ["Meinung", "Meiner Meinung nach ist der E-Ausweis {praktisch}, aber der Staat muss {die Daten gut schützen}. Sonst können {Hacker die Daten stehlen}.", "Menimcha, elektron guvohnoma qulay, lekin davlat ma'lumotlarni yaxshi himoya qilishi kerak. Aks holda xakerlar ma'lumotlarni o'g'irlashi mumkin."]], "k": [["der Personalausweis", "shaxsiy guvohnoma"], ["sich ausweisen / identifizieren", "shaxsni tasdiqlamoq"], ["überweisen", "pul o'tkazmoq"], ["die Daten / der Datenschutz", "ma'lumotlar / ma'lumotlar himoyasi"], ["das Lesegerät", "o'quvchi qurilma"], ["der Behördengang", "idoraga borish"], ["aktivieren", "yoqmoq, faollashtirmoq"]]},
 {"g": "b", "t": "Wo einkaufen?", "u": "Qayerdan xarid qilish kerak", "img": "m/einkaufen.jpg", "ot": "Wo sollen wir einkaufen?", "ou": "Yana (8 yosh) Frankfurtda yashashni yaxshi ko'radi. U ayniqsa akasi va ota-onasi bilan o'tkazadigan oilaviy kunlarni intiqlik bilan kutadi. Shunda ular Frankfurt markaziga borib, shaharning eng mashhur savdo ko'chasi Zeil'da vitrinalarni tomosha qilib sayr qilishadi. \"Zeil'da bo'lganimizda doim muzqaymoq yeymiz. Bu yerda mashina yurmagani uchun harakatga e'tibor berishim shart emas. Bu menga juda yoqadi\", deydi Yana.\nZeil — piyodalar zonasi. Germaniyada piyodalar zonalari 1950-yillar boshidan bor. Undan oldin turli joylarda, masalan AQShda yoki Argentina poytaxti Buenos-Ayresda mashinasiz zonalar tashkil qilingan. Mashinasiz shahar markazi g'oyasi dastlab ko'pincha savdogarlarning qarshiligiga uchragan: ular ko'p mijozni yo'qotishdan qo'rqqan.\nO'shanda natijasi noma'lum tajriba sifatida boshlangan narsa bugun Germaniyada zamonaviy shaharsozlikning muhim elementi. Piyodalar zonalari ko'plab restoran, ko'cha kafelari va univermaglarga ega mashinasiz vohalarga aylangan. Ular hayot sifati va ekologik ongli yashash ramzi.\nXarid paytida baribir mashinasidan voz kechmoqchi bo'lmagan odam savdo markazida kerakli hamma narsani topadi. Bu \"iste'mol saroylari\" egalari charchagan mijozlarga avvalo bitta narsani va'da qiladi: qulay xarid. Bir tom ostida ko'plab do'konlar, xizmat ko'rsatish va ovqatlanish joylari bor. Savdo markazlari ko'pincha avtomagistrallar yaqinida quriladi. Mijozlar qulay yetib borish va keng avtoturargohni qadrlaydi.\n\"Biz bu jarayonni xavotir bilan kuzatmoqdamiz\", deydi frankfurtlik shaharsoz Valter Nimeyer (47). \"Ko'p mijozlar savdo markazlarida xarid qilsa, shahar markazidagi do'konlar yopilishi kerak. Ish o'rinlari yo'qoladi va markazlar huvillab qoladi. Shahar markazlari an'anaviy uchrashuv, dam olish va sifatli xarid joyi sifatida saqlanishi kerak.\"\nPiyodalar zonalari asosan Yevropada tarqalgan: Germaniyada bugun ko'plab katta, o'rta va kichik shaharlarda piyodalar zonalari bor, AQShda esa ozgina qolgan.", "p": [["Inhalt", "Im Text geht es um die Frage, ob man {in der Fußgängerzone in der Stadt} oder {im Einkaufszentrum} einkaufen sollte.", "Matnda shahardagi piyodalar zonasidan xarid qilish kerakmi yoki savdo markazidan, degan savol ko'riladi."], ["Vorteile", "Im Einkaufszentrum findet man {alles unter einem Dach} und es gibt {viele Parkplätze}.", "Savdo markazida hamma narsa bir tom ostida va avtoturargoh ko'p."], ["Nachteile", "Dann müssen {kleine Geschäfte in der Stadt schließen}, und die Innenstadt wird {leer}.", "Shunda shahardagi kichik do'konlar yopiladi va shahar markazi huvillab qoladi."], ["Erfahrung", "In Taschkent gehe ich gern {auf den Basar}, weil das Obst dort {frisch und billig} ist. Außerdem kann man dort {den Preis verhandeln}.", "Toshkentda bozorga borishni yaxshi ko'raman, chunki u yerda mevalar yangi va arzon. Bundan tashqari, u yerda narxni savdolashish mumkin."], ["Meinung", "Meiner Meinung nach sollte man {kleine Läden und Märkte unterstützen}, damit die Stadt {lebendig bleibt}. Online-Shopping ist bequem, aber {nicht immer besser}.", "Menimcha, shahar jonli qolishi uchun kichik do'kon va bozorlarni qo'llab-quvvatlash kerak. Onlayn xarid qulay, lekin har doim ham yaxshiroq emas."]], "k": [["die Fußgängerzone", "piyodalar zonasi"], ["das Einkaufszentrum", "savdo markazi"], ["die Innenstadt", "shahar markazi"], ["der Händler / das Geschäft", "savdogar / do'kon"], ["der Parkplatz", "avtoturargoh"], ["veröden", "huvillab qolmoq"], ["die Lebensqualität", "hayot sifati"]]},
 {"g": "b", "t": "Grundeinkommen", "u": "Hammaga bir xil pul (shartsiz asosiy daromad)", "img": "m/grundeinkommen.jpg", "ot": "Gleiches Geld für alle", "ou": "G'oya shunday: davlat barcha fuqarolarga — go'dakdan qariyagacha — umrbod yashash uchun yetarli oylik daromad kafolatlaydi.\nAsosiy daromad shartsiz, ya'ni byurokratik ovoragarchiliksiz to'lanadi. Yosh yoki qari, ishlaydigan yoki ishsiz, uylangan yoki yolg'iz — hamma uni oladi.\nAsosiy daromad soliqqa tortilmaydi. Boshqa barcha daromadlardan soliq to'lanadi.\nAsosiy pensiya, ijtimoiy yordam, ishsizlik nafaqasi, uy-joy va bolalar nafaqasi kabi hozirgi ko'plab ijtimoiy to'lovlar o'rniga faqat asosiy daromad bo'lishi kerak.\nAsosiy daromadga qarshi tez-tez aytiladigan e'tiroz — uni hamma, jumladan puli yetarli bo'lganlar ham oladi. Birinchi qarashda yaxshi topadiganlar va boylar davlat yordamini olishi haqiqatan adolatsiz ko'rinadi. Lekin bu dalilni osongina rad etish mumkin: boylar ham asosiy daromad oladi, lekin uni soliqlari orqali moliyalashtiradi ham.\nAsosiy daromadning ma'nosi to'lov miqdoriga bog'liq. Yuqori daromad yuqori soliq stavkalarini, past daromad past stavkalarni talab qiladi. Lekin yuqori daromad va yuqori soliqlar ishlash istagini kamaytiradi, past daromad va past soliqlar esa uni kuchaytiradi. Shuning uchun miqdorni yaxshilab o'ylash kerak.\nAlbatta, shartsiz asosiy daromad haqiqatni jannatga aylantirmaydi. Bu tizimni ham aldaydigan, suiiste'mol qiladigan va o'z foydasiga ishlatadigan odamlar bo'laveradi. Lekin gap bunda emas. Gap yangi ijtimoiy siyosat izlashda.", "p": [["Inhalt", "Im Text geht es um die Idee, dass {jeder Bürger jeden Monat Geld vom Staat} bekommt, {ohne Bedingungen}.", "Matnda har bir fuqaro har oy davlatdan shartsiz pul olishi g'oyasi haqida gap boradi."], ["Vorteile", "Niemand muss {in Armut leben}, und es gibt {weniger Bürokratie}.", "Hech kim qashshoqlikda yashamaydi va byurokratiya kamroq bo'ladi."], ["Nachteile", "Manche Menschen {wollen dann vielleicht nicht mehr arbeiten}, und die {Steuern werden höher}.", "Ba'zi odamlar shunda ishlashni xohlamay qolishi mumkin va soliqlar oshadi."], ["Erfahrung", "In Usbekistan gibt es so etwas nicht, viele Menschen {arbeiten deshalb im Ausland}, um {Geld zu verdienen}. Sie sehen ihre Familie oft {nur einmal im Jahr}.", "O'zbekistonda bunday narsa yo'q, shuning uchun ko'p odamlar pul topish uchun chet elda ishlaydi. Ular oilasini ko'pincha yilda bir marta ko'radi."], ["Meinung", "Meiner Meinung nach ist die Idee interessant, aber {zu teuer} — besser sind {Hilfen für Menschen, die wirklich arm sind}. Und die Menschen sollten {weiter arbeiten wollen}.", "Menimcha, g'oya qiziq, lekin juda qimmat — haqiqatan kambag'al odamlarga yordam yaxshiroq. Va odamlar ishlashni davom ettirishni xohlashi kerak."]], "k": [["das Grundeinkommen", "asosiy daromad"], ["bedingungslos", "shartsiz"], ["die Sozialleistung", "ijtimoiy to'lov, nafaqa"], ["die Steuer / steuerfrei", "soliq / soliqsiz"], ["der Anreiz", "rag'bat, undov"], ["die Armut", "qashshoqlik"], ["missbrauchen", "suiiste'mol qilmoq"]]},
 {"g": "b", "t": "Ganztagsschule", "u": "Kun bo'yi maktab", "img": "m/ganztag.jpg", "ot": "Ganztagsschule – Pro und Contra", "ou": "To'g'ri maktabni topish bolalar va ota-onalar uchun tobora katta muammo. Maktab avvalo federal yerlar ishi, shuning uchun yerdan yerga farq qiladi va doim tegishli yer hukumatiga bog'liq. Boshlang'ich maktabdan keyingi maktab turlari va nomlari ham mamlakat bo'ylab juda xilma-xil: Hauptschule, Realschule, Gesamtschule, Gymnasium va boshqalar.\nBoshqa tomondan, butun mamlakat bo'ylab umumiy tendensiya bor — boshlang'ich sinf va 5–10-sinf o'quvchilari uchun kun bo'yi maktablar ko'paymoqda. 2002-yilda o'quvchilarning taxminan 10 foizi kun bo'yi maktabga borgan bo'lsa, 2014-yilda deyarli 36 foiz, 2016-yilda esa 42,5 foiz bo'ldi. 2019-yilgi so'rovga ko'ra, 78 foiz kun bo'yi maktablar tizimini kengaytirish tarafdori.\nKun bo'yi maktab nimani anglatadi? Prinsipial jihatdan u har qanday maktab turida bo'lishi mumkin. Lekin yagona \"kun bo'yi maktab\" yo'q. 2003-yilgi Ta'lim vazirlari konferensiyasi ta'rifiga ko'ra, ertalabki darslardan tashqari haftada kamida uch kun kuniga kamida yetti soatlik dastur taklif qiladigan maktablar kun bo'yi maktab hisoblanadi. Ya'ni \"kun bo'yi maktab\" deb yozilgan maktab har kuni kun bo'yi qarov bermasligi mumkin. Har bir yer o'z siyosatini yuritgani uchun dars shakllari, qarov tizimi va ota-onalar xarajatlarida muhim farqlar bor. Faqat bitta narsa bir xil: hech kim kun bo'yi maktabga borish huquqiga ega emas.\nYagona tizim yo'qligining turli sabablari bor, lekin asosida xarajat, imkoniyatlar tengligi va bolalar ta'limi uchun ota-ona yoki davlat qanchalik mas'ul ekanligi masalasi turadi.\nKun bo'yi maktab o'quvchilari yarim kunlik maktabdagilarga qaraganda yaxshiroq yoki yomonroq natija ko'rsatadimi, degan muhim savolga hali javob yo'q — maktablar orasidagi farqlar taqqoslash uchun juda katta. Shuning uchun kun bo'yi maktabni tanlash avvalo o'quvchi va ota-onasining shaxsiy qarashi, istagi va ehtiyojlariga bog'liq.", "p": [["Inhalt", "Im Text geht es um {Ganztagsschulen}, in denen Kinder {bis zum Nachmittag} in der Schule bleiben.", "Matnda bolalar tushdan keyingacha maktabda qoladigan kun bo'yi maktablar haqida gap boradi."], ["Vorteile", "Eltern können {beide arbeiten}, und Kinder bekommen {Hilfe bei den Hausaufgaben} und {ein warmes Mittagessen}.", "Ota-onaning ikkalasi ham ishlay oladi, bolalar esa uy vazifasiga yordam va issiq tushlik oladi."], ["Nachteile", "Die Kinder haben {weniger Freizeit} und {weniger Zeit mit der Familie}.", "Bolalarda bo'sh vaqt va oila bilan o'tkazadigan vaqt kamroq bo'ladi."], ["Erfahrung", "In Usbekistan haben wir {zwei Schichten}, und ich hatte {nur vormittags Unterricht}. Am Nachmittag habe ich {meine Hausaufgaben gemacht} und {draußen gespielt}.", "O'zbekistonda maktablar ikki smenada ishlaydi va menda faqat ertalab dars bo'lardi. Tushdan keyin uy vazifamni bajarib, tashqarida o'ynardim."], ["Meinung", "Meiner Meinung nach ist eine Ganztagsschule gut, wenn sie {freiwillig} ist und {Sport und Kunst} anbietet. So haben {berufstätige Eltern} mehr Zeit.", "Menimcha, kun bo'yi maktab ixtiyoriy bo'lsa va sport va san'at taklif qilsa, yaxshi. Shunda ishlaydigan ota-onalarning vaqti ko'proq bo'ladi."]], "k": [["die Ganztagsschule / Halbtagsschule", "kun bo'yi maktab / yarim kunlik maktab"], ["die Betreuung", "qarov"], ["das Mittagessen", "tushlik"], ["die Freizeit", "bo'sh vaqt"], ["berufstätig", "ishlaydigan"], ["der Ausbau", "kengaytirish"], ["freiwillig", "ixtiyoriy"]]},
 {"g": "b", "t": "Tierversuche", "u": "Hayvonlar ustida tajriba", "img": "m/tierversuche.jpg", "ot": "Tierversuche: Pro und Contra", "ou": "Tarafdor dalillar.\nOdamlar hayotini saqlaydi: zamonaviy tibbiyotning ko'p yutuqlari hayvonlar ustidagi tajribalarga, ayniqsa fundamental tadqiqotlarga asoslangan. Sil, qandli diabet va ko'p saraton kasalliklari faqat hayvon tajribalari yordamida o'rganilishi mumkin edi.\nMuqobillar cheklangan: dori yoki kimyoviy moddalarni faqat probirkadagi alohida hujayralarda sinab bo'lmaydi. Tirik organizmga qanday ta'sir qilishini o'rganish kerak. Kompyuter simulyatsiyalari ham cheklangan: virtual uy sichqonini faqat organizmdagi barcha mexanizmlarni bilsangiz dasturlash mumkin.\nHayvon tajribalari qat'iy tartibga solingan, ruxsat talab qiladi va faqat odam uchun katta foyda bo'lsagina o'tkaziladi.\nQarshi dalillar.\nTajriba hayvonlarining azobi: nima o'rganilishiga qarab hayvonlarga katta og'riq va azob berilishi mumkin. Bundan tashqari, tajriba tugagach hayvonlar odatda o'ldiriladi. Ko'pchilik hayvonlarni inson farovonligi uchun azoblashni axloqan to'g'ri emas deb hisoblaydi.\nFundamental tadqiqotlar: ko'p tajribalar fundamental tadqiqotlarda o'tkaziladi. Aniq maqsadsiz bunday \"tavakkaliga\" tajribalarni ba'zilar hayvonlar azobi evaziga oqlab bo'lmaydi, deb hisoblaydi.\nOdamga ko'chirish: kalamush va sichqonlar odamga o'xshasa ham, ko'p natijalarni odamga ko'chirib bo'lmaydi. Unda hayvon tajribalari ma'nosiz.\nMuqobillar mavjud: tadqiqotlar shu darajaga yetdiki, sun'iy organlar o'stirish mumkin — tajribalar shular bilan cheklanishi kerak. Kompyuter simulyatsiyalari ham muqobil.", "p": [["Inhalt", "Im Text geht es um die {Argumente für und gegen Tierversuche} in der Medizin.", "Matnda tibbiyotda hayvonlar ustidagi tajribalar foydasiga va qarshi dalillar haqida gap boradi."], ["Vorteile", "Durch Tierversuche wurden {viele Medikamente entwickelt}, zum Beispiel {gegen Diabetes}.", "Hayvon tajribalari orqali ko'p dorilar yaratilgan, masalan, function exPick(sec){

  const avg=n?Math.round(H.reduce((a,h)=>a+pct(h),0)/n):0, best=n?Math.max(...H.map(pct)):0, last=n?pct(H[n-1]):0;

(function(){

    if(window.innerWidth<761) return;
    e.preventDefault();

  },{passive:false});
  let d=null;
  pg.addEventListener("mousedown",e=>{ if(e.button!==0) return; d={x:e.clientX,y:e.clientY,l:pg.scrollLeft,t:pg.scrollTop,m:false}; pg.classList.add("drag"); e.preventDefault(); });
  window.addEventListener("mousemove",e=>{ if(!d) return; const dx=e.clientX-d.x, dy=e.clientY-d.y; if(Math.abs(dx)+Math.abs(dy)>3) d.m=true; pg.scrollLeft=d.l-dx; pg.scrollTop=d.t-dy; });
  window.addEventListener("mouseup",()=>{ if(d){ pg.classList.remove("drag"); d=null; } });
  pg.addEventListener("click",e=>{ if(window.innerWidth>=761) e.preventDefault(); },true);
})();
