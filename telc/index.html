 {"t": "Jugendliche ausgehen", "u": "Yoshlar kechqurun qachongacha yurishi mumkin", "img": "m/ausgehen.jpg", "ot": "Wie lange dürfen Jugendliche abends ausgehen?", "ou": "Ko'p ota-onalar voyaga yetmagan farzandlaridan ko'pi bilan soat 22:00 da uyda bo'lishni talab qiladi. Qarorini asoslash uchun ular yoshlarni himoya qilish qonuniga tayanadi. Ko'plab ommaviy tadbirlarda 16 yoshgacha bo'lganlar uchun haqiqatan 22:00 chegarasi amal qiladi. Lekin qonun faqat yoshlarning ma'lum joylarda bo'lishini tartibga soladi. Farzandni qachongacha tashqariga qo'yishni asosan ota-ona hal qiladi.\nYoshlar aynan shu dalil bilan ota-onasidan 23:00 yoki 24:00 gacha ruxsat so'raydi. Lekin ota-onalarning farzandini erta uyda ko'rishni istashiga asosiy sabab nazorat majburiyatini buzish va qonun bilan muammoga tushish qo'rquvi emas. Ular avvalo farzandini yomon ta'sirlardan va yoshlar hali to'g'ri baholay olmaydigan xavflardan himoya qilmoqchi.\nBoshqa tomondan, ota-onalar farzandining o'zi uchun mas'uliyat olish qobiliyatini ham tobora rivojlantirishi kerak. Bu faqat o'zaro ishonch asosida bo'lishi mumkin. Ota-ona farzandini uzoqroq qo'yishi uchun unga ishona olishi kerak: kim bilan va qayerdaligini bilishi, kelishilgan vaqtga rioya qilishiga amin bo'lishi kerak. Mustaqillik va himoya o'rtasida muvozanat topish uchun oldindan ishonch bildirish zarur.", "p": [["Inhalt", "Im Text geht es um die Frage, {bis wann Jugendliche abends draußen bleiben} dürfen.", "Matnda yoshlar kechqurun qachongacha tashqarida qolishi mumkinligi haqidagi savol ko'riladi."], ["Vorteile", "Wenn Jugendliche später nach Hause kommen dürfen, lernen sie {Verantwortung} und {Selbstständigkeit}.", "Yoshlarga kechroq kelishga ruxsat berilsa, ular mas'uliyat va mustaqillikni o'rganadi."], ["Nachteile", "Spät abends gibt es {mehr Gefahren}, zum Beispiel {Alkohol oder schlechte Freunde}.", "Kech kechqurun xavf ko'proq bo'ladi, masalan, alkogol yoki yomon do'stlar."], ["Erfahrung", "Als ich 16 war, musste ich {um 21 Uhr zu Hause sein}, weil meine Eltern {sich Sorgen gemacht} haben. Heute verstehe ich meine Eltern {besser}.", "16 yoshligimda soat 21 da uyda bo'lishim kerak edi, chunki ota-onam xavotir olardi. Hozir ota-onamni yaxshiroq tushunaman."], ["Meinung", "Meiner Meinung nach brauchen Eltern und Kinder {Vertrauen} und {feste Regeln}. Die Kinder sollten immer sagen, {wo und mit wem} sie sind.", "Menimcha, ota-ona va farzandlarga ishonch va aniq qoidalar kerak. Bolalar doim qayerda va kim bilan ekanini aytishi kerak."]], "k": [["ausgehen", "tashqariga chiqmoq, yurmoq"], ["das Jugendschutzgesetz", "yoshlarni himoya qilish qonuni"], ["die Aufsichtspflicht", "nazorat majburiyati"], ["Verantwortung übernehmen", "mas'uliyat olmoq"], ["das Vertrauen", "ishonch"], ["sich Sorgen machen", "xavotir olmoq"], ["sich an Zeiten halten", "vaqtga rioya qilmoq"]]},
 {"t": "Darf man behalten?", "u": "Topgan narsani olib qolish mumkinmi", "img": "m/behalten.jpg", "ot": "Darf man behalten, was man findet?", "ou": "Ko'chada pul yoki hamyon topsa, nima qilish kerak? Agar juda qimmatbaho narsa, masalan, taqinchoq yoki yutuqli lotereya chiptasi topilsa-chi?\nBa'zilar topilmani topilmalar byurosiga topshirmoqchi bo'lsa, boshqalar \"Topgan oladi, yo'qotgan yig'laydi\" degan bolalar qo'shig'ini eslaydi. Bu jozibali eshitiladi, lekin to'g'ri emas.\nYaqinda bir nemis juftligi topilgan 30 000 lik lotereya chiptasini naqdlashtirib, pulning yarmini sarflagani uchun qamoq jazosiga hukm qilindi. Ular chiptani aslida sotib olgan ayolga qolgan 15 000 ni qaytarishga majbur qilindi.\nDunyoning ko'p mamlakatlarida topgan odam qonunga ko'ra egasini topish uchun barcha oqilona choralarni ko'rishi shart. Ko'plab mamlakatlarda topuvchiga mukofot — ko'pincha buyum qiymatining bir foizi beriladi.\nAlbatta, 1 yevrolik tangani olib qolish mumkin. Huquqiy jihatdan aniqroq aytganda: topuvchi egasini topishga harakat qilsa-yu, egasi aniqlanmasa, buyumni olib qolishi mumkin. Narsani yo'qotganlar esa eng kuchli huquqqa ega. Lekin hayotda qanday bo'ladi?", "p": [["Inhalt", "Im Text geht es um die Frage, was man tun soll, wenn man {Geld oder eine Geldbörse findet}.", "Matnda pul yoki hamyon topsang nima qilish kerakligi haqidagi savol ko'riladi."], ["Vorteile", "Wer die Sache {zum Fundbüro bringt}, {hilft dem Besitzer} und bekommt oft {eine Belohnung}.", "Buyumni topilmalar byurosiga topshirgan odam egasiga yordam beradi va ko'pincha mukofot oladi."], ["Nachteile", "Wer etwas Wertvolles behält, kann {große Probleme mit der Polizei} bekommen.", "Qimmatbaho narsani olib qolgan odam politsiya bilan katta muammoga duch kelishi mumkin."], ["Erfahrung", "Ich habe einmal {ein Handy im Taxi gefunden} und es {dem Besitzer zurückgegeben}. Der Besitzer war {sehr glücklich} und hat mir {gedankt}.", "Bir marta taksida telefon topib, uni egasiga qaytarganman. Egasi juda xursand bo'lib, menga rahmat aytdi."], ["Meinung", "Meiner Meinung nach sollte man {alles Wertvolle zurückgeben}, nur {kleines Geld} darf man behalten. Man sollte immer denken: {Was wäre, wenn ich es verloren hätte?}", "Menimcha, har qanday qimmatbaho narsani qaytarish kerak, faqat mayda pulni olib qolish mumkin. Doim o'ylash kerak: agar men yo'qotganimda nima bo'lardi?"]], "k": [["finden / die Fundsache", "topmoq / topilma"], ["behalten", "olib qolmoq"], ["das Fundbüro", "topilmalar byurosi"], ["der Besitzer / Eigentümer", "egasi"], ["die Belohnung", "mukofot"], ["zurückgeben", "qaytarib bermoq"], ["die Haftstrafe", "qamoq jazosi"]]},
 {"t": "Tiere als Geschenk", "u": "Hayvon — sovg'a sifatida", "img": "m/tiere.jpg", "ot": "Tiere – eine gute Geschenkidee?", "ou": "Keksa qarindoshlarga biroz ko'proq hamroh va harakat kerak bo'lishi mumkin. Yoki bolalar nihoyat it yoki mushuk olishni xohlaydi. Ayniqsa Rojdestvo yoki katta oilaviy bayramda hayvon sovg'a qilish fikri qanchalik tabiiy!\nArcha tagidagi bolalarning ko'zlarini yoki bayramdagi boshqa tabrik qiluvchilarning munosabatini tasavvur qiling — sovg'angiz shubhasiz eng o'ziga xos bo'lardi!\nIt yoki mushukni sovg'a qilish foydasiga shuni aytish mumkin: siz ko'p yillik hamroh sovg'a qilib, katta quvonch keltirasiz.\nLekin aynan shu yerda bunday sovg'aning salbiy tomoni ham bor. Sovg'a oluvchi bundan ortiq hech narsani istamasligiga ishonch hosil qilsangiz ham, noaniqliklar qoladi: u haqiqatan shu hayvonni tanlaganmi? Hayvon va odam til topisha olmasa-chi? Uning hayvon uchun yetarli joyi va vaqti bormi? Bir necha hafta, oy yoki yildan keyin ham hayvondan xursand bo'ladimi?\nHayvonga uy berish — uzoq muddatli va mas'uliyatli vazifa. Bu qaror uzoq va jiddiy o'ylashni talab qiladi, birdaniga qabul qilinmasligi kerak.\nYengiltaklik, Rojdestvo oldidan achinib sotib olish yoki bolaning hayvon do'st istagi sabab bo'lishi mumkin. Lekin unutmang: hayvonlar tirik mavjudot, Rojdestvodan keyin almashtirib bo'ladigan sviter kabi tovar emas. Ayniqsa bolalar ko'pincha bir paytlar orzu qilgan to'rt oyoqli do'stiga tezda qiziqishni yo'qotadi.\nBoshqa tomondan, hayvonning bolalar uchun tarbiyaviy ahamiyati bor: ular mas'uliyatni o'rganadi. Keksa odamlarga esa har kuni sayrga olib chiqish kerak bo'lgan it bilan bir parcha sog'lik sovg'a qilish mumkin.\nXo'sh, nima tavsiya qilish mumkin?", "p": [["Inhalt", "Im Text geht es um die Frage, ob {ein Tier ein gutes Geschenk} ist, zum Beispiel {zu Weihnachten}.", "Matnda hayvon yaxshi sovg'a bo'ladimi, masalan, Rojdestvoda, degan savol ko'riladi."], ["Vorteile", "Kinder lernen mit einem Tier {Verantwortung}, und ältere Menschen {bewegen sich mehr}.", "Bolalar hayvon bilan mas'uliyatni o'rganadi, keksalar esa ko'proq harakat qiladi."], ["Nachteile", "Viele Kinder {verlieren schnell das Interesse}, und dann {kümmert sich niemand} um das Tier.", "Ko'p bolalar tezda qiziqishni yo'qotadi va keyin hayvonga hech kim qaramaydi."], ["Erfahrung", "Bei uns auf dem Land hatte jede Familie {Tiere}, und ich musste als Kind {die Hühner füttern}. So habe ich gelernt, {Verantwortung} zu übernehmen.", "Bizda qishloqda har bir oilada hayvon bo'lardi, bolaligimda tovuqlarga don berishim kerak edi. Shunday qilib mas'uliyatni o'z zimmamga olishni o'rgandim."], ["Meinung", "Meiner Meinung nach sollte man ein Tier nur schenken, wenn man {vorher mit der Familie gesprochen} hat. Ein Tier ist {kein Spielzeug}, sondern {ein Lebewesen}.", "Menimcha, hayvonni faqat oldin oila bilan gaplashib olgandan keyin sovg'a qilish kerak. Hayvon o'yinchoq emas, balki tirik jon."]], "k": [["verschenken / das Geschenk", "sovg'a qilmoq / sovg'a"], ["das Haustier", "uy hayvoni"], ["sich kümmern um", "g'amxo'rlik qilmoq"], ["die Verantwortung", "mas'uliyat"], ["das Lebewesen", "tirik mavjudot"], ["das Interesse verlieren", "qiziqishni yo'qotmoq"], ["spontan / langfristig", "birdaniga / uzoq muddatli"]]},
 {"t": "Schulen für Hochbegabte", "u": "Iqtidorli bolalar uchun maxsus maktablar", "img": "m/hochbegabt.jpg", "ot": "Spezielle Schulen für hochbegabte Schüler: Separation oder Integration?", "ou": "Ular vunderkind va dahiylar sifatida tanilgan, lekin iqtidorli bolalar o'z salohiyatini faqat shunday deb tan olinib, mos ravishda qo'llab-quvvatlansa ro'yobga chiqara oladi. Lekin noyob iqtidorni qanday to'g'ri rivojlantirish kerak? Pedagoglar va ta'lim siyosatchilari yillardan beri bu haqda bahslashmoqda.\nIqtidorli sportchilar faqat maxsus markazlarda qobiliyatini maqsadli rivojlantirsa olimpiya chempioni bo'lishi shubhasiz.\nMusiqachi, sportchi yoki raqqoslar uchun to'g'ri bo'lgan narsa intellektual iqtidorlilar uchun har doim ham qabul qilinmaydi. Darslar yuqori darajada o'tishi va kichik guruhlarda ko'plab qo'shimcha mashg'ulotlar bo'lishi kerak, chunki iqtidorli o'quvchilar ham har xil. Buni maxsus maktablar bera oladi.\nBoshqa tomondan, noyob iqtidorli o'quvchilar ajratib qo'yilmasligi kerak. Iqtidor va shaxsiyatning har tomonlama rivojlanishi uchun iqtidorli va oddiy o'quvchilardan tashkil topgan sinflar kerak. Aks holda faqat bilish sohasida bir tomonlama rivojlanish bo'ladi.\nXo'sh, iqtidor aslida nima? Iqtidor — avvalo yutuqqa erishish qobiliyati (salohiyati). Bu yuqori natijaning o'zi emas. Noyob iqtidor haqiqatan noyob natijaga olib kelishi uchun bolaning aqlidan tashqari ijodkorlik, motivatsiya, ijtimoiy ko'nikma, ma'lum shaxsiy xususiyatlar va eng muhimi bolani tan oladigan va qo'llab-quvvatlaydigan mehribon, rag'batlantiruvchi muhit kerak.", "p": [["Inhalt", "Im Text geht es um die Frage, ob {hochbegabte Kinder} in {spezielle Schulen} oder in {normale Klassen} gehen sollen.", "Matnda iqtidorli bolalar maxsus maktabga borishi kerakmi yoki oddiy sinflargami, degan savol ko'riladi."], ["Vorteile", "In speziellen Schulen lernen sie {auf hohem Niveau} und {langweilen sich nicht}.", "Maxsus maktablarda ular yuqori darajada o'qiydi va zerikmaydi."], ["Nachteile", "Sie haben dort {wenig Kontakt zu normalen Kindern} und lernen {weniger soziale Fähigkeiten}.", "U yerda ularning oddiy bolalar bilan aloqasi kam bo'ladi va ijtimoiy ko'nikmalarni kamroq o'rganadi."], ["Erfahrung", "In Usbekistan gibt es {Präsidentenschulen} für sehr gute Schüler, und viele Eltern {wollen ihre Kinder dorthin schicken}. Aber nicht alle Kinder {schaffen die Prüfung}.", "O'zbekistonda juda yaxshi o'quvchilar uchun Prezident maktablari bor va ko'p ota-onalar farzandini u yerga yubormoqchi. Lekin hamma bolalar ham imtihondan o'ta olmaydi."], ["Meinung", "Meiner Meinung nach sollten hochbegabte Kinder {in normalen Klassen} bleiben, aber {zusätzliche Kurse} bekommen. So können sie {Freunde finden} und {ihr Talent fördern}.", "Menimcha, iqtidorli bolalar oddiy sinflarda qolishi, lekin qo'shimcha kurslar olishi kerak. Shunda ular do'st ham topadi, iste'dodini ham rivojlantiradi."]], "k": [["hochbegabt / die Hochbegabung", "iqtidorli / iqtidor"], ["fördern / die Förderung", "qo'llab-quvvatlamoq / rivojlantirish"], ["das Niveau", "daraja"], ["ausgrenzen", "ajratib qo'ymoq, chetlatmoq"], ["die soziale Kompetenz", "ijtimoiy ko'nikma"], ["das Potenzial entfalten", "salohiyatni ro'yobga chiqarmoq"], ["das Wunderkind", "vunderkind"]]},
 {"t": "Hausaufgaben", "u": "Uy vazifalari", "img": "m/hausaufgaben.jpg", "ot": "Hausaufgaben – unnötig oder unvermeidlich?", "ou": "Hamma ularni biladi, ko'pchilik ulardan qochadi, ba'zilar esa dahshat bilan eslaydi: gap uy vazifalari haqida. O'quvchilarning avlodlari bo'sh vaqtida bu yoqimsiz majburiyatni bajarishga o'rgangan.\nLekin bugun zamonaviy usullar va yangi pedagogik yondashuvlar bilan o'qitilayotganda uy vazifalari hali ham zamonaviymi, degan savol tobora ko'p tug'iladi. Raqiblarning ham, tarafdorlarning ham yaxshi dalillari bor.\nNafaqat ko'p o'quvchilar, balki ba'zi ota-onalar va pedagoglar ham uy vazifalarini bekor qilish kerak, deb hisoblaydi. Kun bo'yi dars, sport va musiqa to'garaklari, test va bitiruv imtihonlariga tayyorgarlik tufayli ko'p o'quvchilar kechqurun butunlay charchab stol oldida o'tiradi va o'rganish samarasi deyarli yo'qoladi.\nRaqiblar bu sohada imkoniyatlar tengligi kamligini ham aytadi. Ba'zi o'quvchilarga ota-onasi yordam beradi, boshqalar yolg'iz qoladi va ko'proq qiynaladi. Bu ularning motivatsiyasini pasaytiradi, o'qish natijalarini yomonlashtiradi va yaxshi hamda yomon o'quvchilar orasidagi farqni oshiradi.\nTarafdorlar yangi materialni o'rganishda takrorlash isbotlangan samarali usul ekanini, shuning uchun uyda ma'lum darajada diqqat bilan, xalaqitsiz o'qish zarurligini ta'kidlaydi. Uyda darsda o'rganilganni yangi bog'liqliklarga qo'yib, yaxshilab o'ylab chiqish imkoni bor: o'qituvchi tushuntirgan narsani o'quvchi o'zi yana ishlab chiqsa, u haqiqatan o'zlashtiriladi.\nUy vazifalari maktabdan keyingi haqiqiy hayotga tayyorlashi shubhasiz. Yoshligidan o'zini tutish va muammolarni mustaqil hal qilish qobiliyati shakllanadi. Axir kattalar hayotida ham sevimli mashg'ulotga o'tishdan oldin bajarilishi kerak bo'lgan ko'p yoqimsiz va qiyin vazifalar bor.", "p": [["Inhalt", "Im Text geht es um die Frage, ob {Hausaufgaben heute noch sinnvoll} sind.", "Matnda uy vazifalari bugun ham foydalimi, degan savol ko'riladi."], ["Vorteile", "Durch Hausaufgaben {wiederholen Schüler den Stoff} und lernen {selbstständig zu arbeiten}.", "Uy vazifalari orqali o'quvchilar materialni takrorlaydi va mustaqil ishlashni o'rganadi."], ["Nachteile", "Nach einem langen Schultag sind viele Kinder {sehr müde}, und nicht alle {bekommen Hilfe von den Eltern}.", "Uzoq maktab kunidan keyin ko'p bolalar juda charchagan bo'ladi va hammaga ham ota-onasi yordam bermaydi."], ["Erfahrung", "In meiner Schulzeit hatten wir {jeden Tag viele Hausaufgaben}, und ich habe oft {bis spät abends} gesessen. Deshalb hatte ich {wenig Zeit für Sport und Freunde}.", "Maktab davrimda har kuni ko'p uy vazifasi bo'lardi va men ko'pincha kech kechgacha o'tirardim. Shuning uchun sport va do'stlarga kam vaqtim qolardi."], ["Meinung", "Meiner Meinung nach sind Hausaufgaben wichtig, aber es sollten {nicht zu viele} sein. Kinder brauchen auch {Freizeit} und {Ruhe}.", "Menimcha, uy vazifalari muhim, lekin ular juda ko'p bo'lmasligi kerak. Bolalarga bo'sh vaqt va dam olish ham kerak."]], "k": [["die Hausaufgabe", "uy vazifasi"], ["abschaffen", "bekor qilmoq"], ["die Chancengleichheit", "imkoniyatlar tengligi"], ["der Lernstoff", "o'quv materiali"], ["selbstständig", "mustaqil"], ["die Selbstdisziplin", "o'zini tutish, intizom"], ["die Motivation sinkt", "motivatsiya pasayadi"]]},
 {"t": "Stadt oder Land", "u": "Shahar kvartirasi yoki tabiat qo'ynidagi uy", "img": "m/stadtland.jpg", "ot": "Stadtwohnung oder Haus im Grünen", "ou": "Yosh yolg'izlar yoki farzandsiz juftliklar ko'pincha shahar kvartirasini tanlaydi. Shaharda ular ish va ta'lim, madaniyat va ko'ngilochar joylarni, ideal holda eshik oldida topadi.\nLekin ko'p shaharliklarda farzand istagi paydo bo'lishi bilan tabiat qo'ynidagi uyga intilish ham tug'iladi. Yam-yashil o'tloqlar orasidagi o'z uyida yashash orzu qilingan idilliyadek tuyuladi. Bolalar avtomobil gazlarisiz, shovqinsiz va shoshqaloqliksiz erkin o'sishi kerak. Bu tasavvur haqiqatga mosmi?\nMutaxassislar ko'pchilikning, ko'pincha aholi punktlaridan tashqarida o'z uyi bo'lish istagi ko'p tanqid qilinadigan \"tarqoq qurilish\"ga yordam berishidan ogohlantiradi. Keng turar joy hududlari landshaftga kirib boradi. Aholi punktlari ichida bo'sh yerlar bo'lsa ham, ko'pincha tabiiy yerlar qurilish yeriga aylantiriladi. Qishloqda yashash istagi shu bilan tabiat va madaniy landshaftlarga xavf soladi.\nBunday hududlarga kamdan-kam jamoat transporti qatnaydi va oilalar ish va maktabga borishi uchun ko'pincha ikkinchi mashina kerak bo'ladi. Natijada transport va atrof-muhitga yuk ko'payadi. Bolalar ham do'stlariga, futbol maydoniga yoki musiqa maktabiga borish uchun ko'pincha ota-onasi va uning mashinasiga bog'liq bo'ladi — erkin o'sish o'rniga.\nAlbatta, odamlarning shahar kvartirasining torligidan qochib, ayniqsa yozda bog'dan zavqlanishni istashi tushunarli. Uy, bundan tashqari, ichini o'z xohishiga ko'ra jihozlash uchun ko'proq imkon beradi. Shaharda esa o'z tasavvuriga ko'ra rejalashtirish imkoni kam bo'ladi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob man {lieber in der Stadt} oder {in einem Haus auf dem Land} wohnen sollte.", "Matnda shaharda yashash yaxshimi yoki qishloqdagi uydami, degan savol ko'riladi."], ["Vorteile", "Auf dem Land haben Kinder {mehr Platz und frische Luft}, und es ist {ruhiger}.", "Qishloqda bolalarga ko'proq joy va toza havo bor, u yer tinchroq."], ["Nachteile", "Man braucht dort oft {ein Auto}, weil es {wenig Busse und Bahnen} gibt.", "U yerda ko'pincha mashina kerak, chunki avtobus va poyezdlar kam."], ["Erfahrung", "Ich komme aus {einer kleinen Stadt}, aber jetzt wohne ich {in Taschkent}, weil ich dort studiere. In Taschkent gibt es {mehr Möglichkeiten}, aber auch {mehr Verkehr}.", "Men kichik shahardanman, lekin hozir Toshkentda yashayman, chunki u yerda o'qiyman. Toshkentda imkoniyatlar ko'proq, lekin transport tirbandligi ham ko'proq."], ["Meinung", "Meiner Meinung nach ist {für Familien mit Kindern} ein Haus am Stadtrand {die beste Lösung}. Dort gibt es {Ruhe und Natur}, aber die Stadt ist {nicht weit}.", "Menimcha, bolali oilalar uchun shahar chetidagi uy eng yaxshi yechim. U yerda tinchlik va tabiat bor, shahar ham uzoq emas."]], "k": [["die Stadtwohnung", "shahar kvartirasi"], ["im Grünen", "tabiat qo'ynida"], ["der Lärm / die Abgase", "shovqin / chiqindi gazlar"], ["öffentliche Verkehrsmittel", "jamoat transporti"], ["auf jemanden angewiesen sein", "kimgadir bog'liq bo'lmoq"], ["die Umweltbelastung", "atrof-muhitga yuk"], ["der Stadtrand", "shahar chekkasi"]]},
 {"t": "Doping", "u": "Professional sport va doping", "img": "m/doping.jpg", "ot": "Leistungssport und Doping", "ou": "Professional sportda doping odatiy amaliyot ekani va doping nazorati unchalik samarali emasligini yaqinda \"Tur de Frans\"dagi bir qator g'alabalarning keyinchalik bekor qilinishi haqidagi salbiy xabarlar yana isbotladi.\nDoping vositalariga ruxsat berishni talab qiluvchi ovozlar ham bor: ularning fikricha, shunda nihoyat ikkiyuzlamachilikka chek qo'yiladi. Axir ish qobiliyatini oshiruvchi vositalar jamiyatning boshqa sohalarida ham ishlatiladi: odamlar kofe, sigaret yoki kokain kabi stimulyatorlarga murojaat qiladi; o'quvchilarda psixofarmakologik dorilar iste'moli so'nggi o'n yilda yuz barobar oshgan. Butun jamiyat doping qilsa, nega sportda taqiqlanishi kerak?\nRuxsat berish raqiblari esa sport ish qobiliyatini oshiruvchi moddalarga qarshi kurashda o'rnak bo'lishi kerak, deydi. Ularning fikricha, giyohvand moddalar zararli va sport bilan mos kelmaydi. Bundan tashqari, doping adolatsiz, chunki imkoniyatlar tengligi qolmaydi.\nAksincha, deydi tarafdorlar: ayrim sportchilar doim nazoratni chetlab o'tish yo'lini topadi va bu tengsizlikni kuchaytiradi. Nazorat suiiste'molni to'xtata olmaydi, faqat nazoratsiz iste'molni oshiradi. To'g'ri, nazorat ostidagi iste'molda sog'liq xavfi chegaralangan. Bundan tashqari, kimyoviy modda ichish har bir sportchining shaxsiy ishi.\nDopingsiz sport tarafdorlari ham hozirgi nazoratni chetlab o'tish osonligini biladi. Shuning uchun tekshiruvlar samaraliroq bo'lishi kerak. Nazorat ostida ham nojo'ya ta'sirlar juda xavfli.\nAgar professional sportda dopingga ruxsat berilsa, havaskor sportchilar ham ko'proq doping qiladi. Dopingning keng tarqalishi oqibatlarini oldindan aytib bo'lmaydi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob man {Doping im Profisport erlauben} oder {streng verbieten} sollte.", "Matnda professional sportda dopingga ruxsat berish kerakmi yoki qat'iy taqiqlashmi, degan savol ko'riladi."], ["Vorteile", "Manche sagen, mit einer Erlaubnis gäbe es {keine Lügen mehr}, weil {sowieso viele dopen}.", "Ba'zilar ruxsat berilsa yolg'on qolmaydi, chunki baribir ko'pchilik doping qiladi, deydi."], ["Nachteile", "Doping ist {sehr gefährlich für die Gesundheit} und {unfair gegenüber ehrlichen Sportlern}.", "Doping sog'liq uchun juda xavfli va halol sportchilarga nisbatan adolatsiz."], ["Erfahrung", "Als Arzt weiß ich, dass Dopingmittel {Herz und Leber} stark {schädigen} können. Manche Sportler {werden später schwer krank}.", "Shifokor sifatida doping vositalari yurak va jigarga qattiq zarar yetkazishini bilaman. Ba'zi sportchilar keyinchalik og'ir kasal bo'lib qoladi.",["Ich habe gelesen, dass Dopingmittel {Herz und Leber} stark {schädigen} können.", "Doping vositalari yurak va jigarga qattiq zarar yetkazishi mumkinligini o'qiganman."]], ["Meinung", "Meiner Meinung nach muss Doping {verboten bleiben} und die {Kontrollen müssen besser} werden. Nur so ist der Sport {fair}.", "Menimcha, doping taqiqlangan bo'lib qolishi va nazorat kuchaytirilishi kerak. Faqat shunda sport adolatli bo'ladi."]], "k": [["der Leistungssport", "professional sport"], ["das Dopingmittel", "doping vositasi"], ["die Dopingkontrolle", "doping nazorati"], ["die Leistung steigern", "natijani oshirmoq"], ["unfair / die Chancengleichheit", "adolatsiz / imkoniyatlar tengligi"], ["die Nebenwirkung", "nojo'ya ta'sir"], ["das Vorbild", "o'rnak"]]},
 {"t": "Fernsehen bildet", "u": "Televizor bilim beradi", "img": "m/fernsehen.jpg", "ot": "Fernsehen bildet", "ou": "Televizor ta'limga hech narsa qo'shmaydi, aksincha tomoshabinlarni ahmoq qiladi, degan fikr keng tarqalgan. Ko'rsatuvlarning katta qismiga qarasangiz, bu fikr tasdiqlanganga o'xshaydi: ular turli shakldagi ko'ngilochar dasturlar. Badiiy filmlar, seriallar, tok-shoular va tobora mashhur bo'layotgan realiti-shoular bilimni oshiradi, deb hech kim jiddiy aytmaydi.\nAxborot va bilim ko'rsatuvlarida esa vaziyat boshqacha — ular haqiqatan ta'lim berishi mumkin. Yena universitetidan prof. Rurmanning so'zlariga ko'ra, ayniqsa televizion ilmiy jurnalistika so'nggi yillarda xilma-xil bo'ldi: mazmunan xizmatga yo'naltirilgan va qiziqarliroq bo'ldi. Bundan tashqari, keng tushuntirilgan ko'proq va yaxshiroq tasvirlar bor — bu tomoshabin uchun yutuq, chunki tasvir va filmlar o'qilgan yoki eshitilgan matndan ancha ta'sirli.\nTelevizordan foyda olish uchun dasturni to'g'ri tanlash va yaxshi o'zini tutish kerak. Axir sog'lom ovqatlanish haqidagi reportaj o'rniga qiziqarli film ko'rish jozibali emasmi?\nShuning uchun bolalar uchun televizorning foydasi kam, ayniqsa nazoratsiz ko'rsalar. Bolalar uchun yaxshi tayyorlangan, ibratli va qiziqarli bilim ko'rsatuvlari bor, buni ko'p ota-ona va o'qituvchilar biladi. Lekin so'rovga ko'ra, so'ralganlarning atigi 8 foizi ota-onasi maslahati bilan va 5 foizi o'qituvchi tavsiyasi bilan shunday ko'rsatuvlarni ko'radi.\nAgar bu ko'rsatuvlar ko'rilsa, ular maktab bilimiga qo'shimcha bo'lishi va ilmdan qo'rquvni yo'qotishi mumkin — chunki bilim bolalarga, masalan, viktorina savollari orqali eng tez yetkaziladi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob man {durch Fernsehen etwas lernen} kann.", "Matnda televizor orqali biror narsa o'rganish mumkinmi, degan savol ko'riladi."], ["Vorteile", "Gute {Dokumentationen und Wissenssendungen} erklären Themen {mit Bildern sehr verständlich}.", "Yaxshi hujjatli filmlar va bilim ko'rsatuvlari mavzularni tasvirlar bilan juda tushunarli tushuntiradi."], ["Nachteile", "Die meisten Sendungen sind aber {nur Unterhaltung}, und Kinder sehen oft {ohne Kontrolle} fern.", "Lekin ko'pchilik ko'rsatuvlar faqat ko'ngilochar va bolalar ko'pincha nazoratsiz televizor ko'radi."], ["Erfahrung", "Ich habe als Kind {viele Tierfilme} gesehen und dabei {viel über die Natur} gelernt. Heute sehe ich mit meinen Kindern {Dokumentarfilme}.", "Bolaligimda ko'p hayvonlar haqidagi filmlarni ko'rganman va tabiat haqida ko'p narsa o'rganganman. Hozir bolalarim bilan hujjatli filmlar ko'raman."], ["Meinung", "Meiner Meinung nach kann Fernsehen bilden, wenn man {die richtigen Sendungen auswählt}. Die Eltern sollten {zusammen mit den Kindern} fernsehen.", "Menimcha, to'g'ri ko'rsatuvlarni tanlasa, televizor bilim berishi mumkin. Ota-onalar bolalari bilan birga televizor ko'rishi kerak."]], "k": [["bilden / die Bildung", "bilim bermoq / ta'lim"], ["die Sendung", "ko'rsatuv"], ["die Unterhaltung", "ko'ngilochar"], ["die Dokumentation", "hujjatli film"], ["der Zuschauer", "tomoshabin"], ["unbeaufsichtigt", "nazoratsiz"], ["auswählen", "tanlamoq"]]},
 {"t": "Sparkonto für Kinder", "u": "Bolalar uchun jamg'arma hisobi", "img": "m/sparkonto.jpg", "ot": "Sparkonto für Kinder", "ou": "Ilgari pul cho'chqa-tangadonga solinardi va yilda bir marta jamg'arma daftarchasiga o'tkazilardi. Yoki har oylik to'lovli bank jamg'arma rejasi bo'lardi. Farzand, nevara yoki cho'qintirgan bola uchun pul yig'moqchi bo'lsangiz, hozir ikkalasi ham foyda bermaydi.\n\"Finanztest\" jurnali so'nggi sonida 150 ga yaqin bankning bolalar uchun omonatlarini tekshirdi. Natija: ozmi-ko'pmi qoniqarli foyda topish oson emas, lekin mumkin.\nMutaxassislar bir necha toifani ajratadi.\nKichik pul sovg'alari uchun jamg'arma yoki joriy hisoblar: ko'p banklar voyaga yetmaganlar uchun maxsus hisoblar taklif qiladi, ularning foizi odatdagidan yuqori, lekin odatda maksimal summa cheklangan. Masalan, ba'zi banklar 2500 yevrogacha summaga yiliga 2 foiz beradi.\nKattaroq sovg'alar uchun bir martalik omonat: katta summalarda \"Finanztest\" muddatli omonatni tavsiya qiladi. Bu yerda ham voyaga yetmaganlar uchun maxsus takliflar bor: masalan, 5000 yevrodan boshlab 10 yilga qo'yilsa, yiliga 1,85 foiz.\nHar oylik to'lov uchun ETF jamg'arma rejalari: tavakkaldan qo'rqmagan kishi ETF rejasi bilan ancha ko'p foyda olishi mumkin. \"Finanztest\" farzandiga kichik boylik yig'moqchi bo'lganlarga buni tavsiya qiladi. Ko'pincha oyiga 25 yevro kifoya, pul ma'lum aksiya indeksini takrorlaydigan indeks fondlariga (ETF) tushadi. Mutaxassislar xavfni yaxshiroq taqsimlaydigan MSCI World kabi keng indekslarni tavsiya qiladi.", "p": [["Inhalt", "Im Text geht es darum, wie man {Geld für Kinder sparen} kann, zum Beispiel {auf einem Sparkonto} oder mit {ETF}.", "Matnda bolalar uchun qanday pul yig'ish mumkinligi, masalan, jamg'arma hisobida yoki ETF orqali, haqida gap boradi."], ["Vorteile", "Wenn man {früh anfängt}, hat das Kind später {Geld für Studium oder Wohnung}.", "Erta boshlasang, keyin bolada o'qish yoki uy uchun pul bo'ladi."], ["Nachteile", "Die {Zinsen sind oft niedrig}, und {Aktien haben ein Risiko}.", "Foizlar ko'pincha past, aksiyalar esa xavfli."], ["Erfahrung", "In Usbekistan sparen viele Eltern für ihre Kinder {nicht auf der Bank}, sondern {kaufen Gold oder ein Grundstück}. Meine Eltern haben {für mich ein Grundstück gekauft}.", "O'zbekistonda ko'p ota-onalar farzandlari uchun bankda emas, balki oltin yoki yer sotib olib pul yig'adi. Ota-onam men uchun yer uchastkasi sotib olishgan."], ["Meinung", "Meiner Meinung nach sollten Eltern {jeden Monat einen kleinen Betrag} sparen und den Kindern {den Umgang mit Geld} beibringen. So lernen sie {früh zu sparen}.", "Menimcha, ota-onalar har oy kichik summa yig'ishi va bolalarga pul bilan muomala qilishni o'rgatishi kerak. Shunda ular yoshligidan tejashni o'rganadi."]], "k": [["sparen / das Sparkonto", "pul yig'moq / jamg'arma hisobi"], ["die Zinsen", "foizlar"], ["die Rendite", "daromad, foyda"], ["das Risiko", "xavf, tavakkal"], ["die Aktie", "aksiya"], ["der Betrag", "summa"], ["der Umgang mit Geld", "pul bilan muomala"]]},
 {"t": "Haustausch", "u": "Uy almashish", "img": "m/haustausch.jpg", "ot": "Haustausch", "ou": "Arzon ta'til joyida bufet ham, hovuz ham yo'qligi kamchilik bo'lishi shart emas. Oilaviy dam olish uchun katta afzallik — boshqa mehmonxona mehmonlari yoki lager tashrifchilariga e'tibor berishingiz shart emas.\nBundan tashqari, dam olish joyini o'zingiz u yerda yashayotgandek o'rganishingiz mumkin. Bu ayniqsa ikkala almashuvchi bir-biridan uzoqda, ideal holda turli mamlakatlarda yashasa qiziqarli.\nShunday qilib kundalik hayotni ortda qoldirib, boshqa madaniyatdagi hayot bilan tanishishingiz mumkin. Juda kam xarajatdan tashqari, uy almashishning jozibasi yangi narsaga qadam qo'yish sarguzashtida.\nUy almashish sharti: ishonch.\nBa'zilar uchun afzallik bo'lgan narsa boshqalar uchun jiddiy kamchilik: nimaga qadam qo'yayotganingizni aniq bilmaganingiz uchun omadingiz kelmasligi ham mumkin.\nJihozlar yoqmagani yoki gigiyena me'yorlari boshqacha bo'lgani uchun hafsalangiz pir bo'lmasligi uchun almashuvchidan manzil emas, rasm ham so'rang. Yaxshisi uzoq telefonda gaplashib, begona uydagi dam olish uchun aniq qoidalar belgilang.\nHuquqiy kamchiliklar jiddiy.\nUy almashish trendining eng katta kamchiligi — huquqiy tuzoqlar: tomonlar o'rtasida shartnoma tuzilmagani uchun javobgarlik masalasi noaniq qoladi. Ochiq aytganda: biror narsa buzilsa yoki yo'qolsa, zararni o'zingiz ko'tarishingiz mumkin.\nFaqat vositachi bo'lgan veb-portalni javobgarlikka tortib bo'lmaydi. Kelishuv e-pochta orqali anonim bo'lgani uchun oldini olish imkoni ham deyarli yo'q. Portallar bu muammo ustida ishlamoqchi. Ungacha yomon kutilmagan hodisalarning oldini olishning yagona yo'li — ishonch va odamni taniy bilish.", "p": [["Inhalt", "Im Text geht es um {Haustausch}: Zwei Familien {tauschen im Urlaub ihre Häuser}.", "Matnda uy almashish haqida gap boradi: ikki oila ta'tilda uylarini almashadi."], ["Vorteile", "Der Urlaub ist {sehr billig}, und man lernt {das echte Leben in einem anderen Land} kennen.", "Ta'til juda arzon bo'ladi va boshqa mamlakatdagi haqiqiy hayot bilan tanishasan."], ["Nachteile", "Wenn {etwas kaputtgeht}, ist oft {nicht klar, wer bezahlt}.", "Agar biror narsa buzilsa, kim to'lashi ko'pincha noaniq."], ["Erfahrung", "In Usbekistan ist Haustausch {nicht bekannt}, wir {übernachten im Urlaub meistens bei Verwandten}. Das ist {billig} und wir {sehen die Familie}.", "O'zbekistonda uy almashish ma'lum emas, biz ta'tilda odatda qarindoshlarnikida tunaymiz. Bu arzon va oilani ko'rib turamiz."], ["Meinung", "Meiner Meinung nach ist Haustausch eine gute Idee, aber man sollte {vorher klare Regeln} vereinbaren. Zum Beispiel, wer {die Blumen gießt} und wer {putzt}.", "Menimcha, uy almashish yaxshi g'oya, lekin oldindan aniq qoidalar kelishib olish kerak. Masalan, kim gullarga suv quyadi, kim tozalaydi."]], "k": [["der Haustausch / tauschen", "uy almashish / almashmoq"], ["der Tauschpartner", "almashuvchi sherik"], ["das Vertrauen", "ishonch"], ["die Kosten", "xarajat"], ["kaputtgehen", "buzilmoq"], ["die Haftung", "javobgarlik"], ["Regeln festlegen", "qoidalar belgilamoq"]]},
 {"g": "b", "t": "Solarium", "u": "Qishda solyariy", "img": "m/solarium.jpg", "ot": "Solarium im Winter – gut für die Gesundheit?", "ou": "Odamlarga farovonlik uchun quyosh nuri kerak. Qishda quyosh qisqa vaqt chiqsa, bu ko'pincha kayfiyatga ta'sir qiladi. Shimoliy Yevropada qishda tobora ko'proq odamlar depressiya va loqaydlikka moyil bo'lishi bejiz emas. Quyosh nuri nafaqat farovonlik, balki D vitamini ishlab chiqarilishi uchun ham muhim.\nDemak, solyariyning faqat afzalliklari bormi? Yo'q, deb ogohlantiradi masalan shifokorlar: \"haqiqiy\" quyoshdagidek ehtiyot bo'lish kerak. Tabiiy quyosh kabi solyariy nuri ham teri hujayralariga zarar yetkazishi va teri saratoniga sabab bo'lishi mumkin. Sog'liqni saqlash tashkilotlari va sug'urta kassalari ham kosmetik maqsadda solyariyga borishdan ogohlantiradi.\nBundan tashqari, ba'zi apparatlar xavfli, chunki zararli nurlar ulushi juda yuqori. Nur yuki past apparatni tanlang — shunda qishda birdaniga qovurilgan tovuqqa o'xshab qolishdan qo'rqmaysiz.\nAyniqsa bolalar va o'smirlar terisi nozikligi sababli xavf ostida va umuman solyariyga bormasligi kerak. Juda oq yoki sezgir terili odamlar ham sun'iy nurga tushmasligi kerak.\nShu sabablarga ko'ra ko'p nemislar qishda solyariyga boradi. Lekin ko'pchilik tashrifchilar undan Ispaniyada dam olgandan keyingidek doim chiroyli qoramtir bo'lish uchun foydalanadi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob ein {Solarium im Winter gesund} ist.", "Matnda qishda solyariy sog'liq uchun foydalimi, degan savol ko'riladi."], ["Vorteile", "Das Licht kann {gegen schlechte Laune} helfen und den Körper {Vitamin D} bilden lassen.", "Nur yomon kayfiyatga qarshi yordam berishi va organizmda D vitamini hosil bo'lishiga imkon berishi mumkin."], ["Nachteile", "Zu viel künstliches Licht {schädigt die Haut} und kann sogar {Hautkrebs} verursachen.", "Ortiqcha sun'iy nur teriga zarar yetkazadi va hatto teri saratoniga sabab bo'lishi mumkin."], ["Erfahrung", "Als Arzt rate ich meinen Patienten, im Winter lieber {Vitamin D zu nehmen} und {spazieren zu gehen}. Das ist {gesünder} und {kostet nichts}.", "Shifokor sifatida bemorlarimga qishda yaxshisi D vitamini ichish va sayr qilishni maslahat beraman. Bu sog'liq uchun foydaliroq va hech narsa turmaydi.",["Im Winter nehme ich lieber {Vitamin D} und {gehe viel spazieren}.", "Qishda yaxshisi D vitamini ichaman va ko'p sayr qilaman."]], ["Meinung", "Meiner Meinung nach ist das Solarium {nicht nötig}, besonders {für Kinder und Jugendliche}. Die Sonne im Sommer {reicht völlig}.", "Menimcha, solyariy kerak emas, ayniqsa bolalar va o'smirlar uchun. Yozdagi quyosh mutlaqo yetarli."]], "k": [["das Solarium / Sonnenstudio", "solyariy"], ["das Wohlbefinden", "farovonlik, o'zini yaxshi his qilish"], ["die Haut schädigen", "teriga zarar yetkazmoq"], ["der Hautkrebs", "teri saratoni"], ["die Strahlen", "nurlar"], ["empfindlich", "sezgir, nozik"], ["braun werden", "qoramtir bo'lmoq (oftobda)"]]},
 {"g": "b", "t": "Elektroautos", "u": "Elektromobillar", "img": "m/eauto.jpg", "ot": "Elektroautos – Verkehrsmittel der näheren Zukunft?", "ou": "Kelgusi yillarda Germaniya yo'llarida elektromobillar tobora ko'payadi. Ularning afzallik va kamchiliklari qanday?\nAfzalligi — foydalanish xarajati past: taxminan 1,50 yevroga 100 kilometrgacha yurish mumkin. Avtomobil solig'i va sug'urtasi kabi boshqa xarajatlar ham ancha kam. Ya'ni elektromobil sotib olsangiz, tejaysiz.\nYana bir afzallik — ekologiklik, chunki mashina zararli gaz chiqarmaydi. Shovqin ham kamayadi, chunki elektromobillar deyarli ovoz chiqarmaydi. Lekin transport mutaxassislari bunda kamchilik ham ko'radi: biz yo'lda tovushga qarab mo'ljal olishga o'rganganmiz, shuning uchun eshitilmay qolgan elektromobillar bilan baxtsiz hodisalar ko'payishi mumkin.\nYana bir kamchilik — akkumulyatorning qisqa xizmat muddati: hozircha o'rtacha 3–5 yil, keyin almashtirish kerak. To'liq quvvatlash odatda 8–10 soat oladi. Yarim soatda akkumulyatorning 80 foizini quvvatlaydigan tez quvvatlash ham bor, lekin Germaniyada quvvatlash stansiyalari hozircha kam.\nElektromobilda yurish arzon bo'lsa-da, uni sotib olish dastlab juda qimmat: kichik mashinalarga ham 23 000 yevro atrofida, to'rt o'rindiqli mashinaga esa 40 000 yevrodan ham ko'p to'lanadi. Ko'p muhokama qilinadigan masofa kamchiligi ham jiddiy: modelga qarab bir quvvatlashda 80 dan 300 kilometrgacha. Shuning uchun elektromobil hozir asosan uydan taxminan 80 kilometr radiusda yuradiganlarga tavsiya etiladi.", "p": [["Inhalt", "Im Text geht es um die {Vor- und Nachteile von Elektroautos}.", "Matnda elektromobillarning afzallik va kamchiliklari haqida gap boradi."], ["Vorteile", "Elektroautos sind {umweltfreundlich}, {leise} und {billig im Verbrauch}.", "Elektromobillar ekologik, shovqinsiz va yurishga arzon."], ["Nachteile", "Sie sind {teuer beim Kauf}, und es gibt {zu wenige Ladestationen}.", "Ularni sotib olish qimmat va quvvatlash stansiyalari juda kam."], ["Erfahrung", "In Taschkent sieht man {immer mehr Elektroautos aus China}, weil {Benzin teurer} wird. Sie sind {leise} und {verbrauchen kein Benzin}.", "Toshkentda Xitoyning elektromobillari tobora ko'payib bormoqda, chunki benzin qimmatlashmoqda. Ular shovqinsiz va benzin sarflamaydi."], ["Meinung", "Meiner Meinung nach sind Elektroautos {die Zukunft}, aber der Staat muss {mehr Ladestationen bauen}. Dann kaufen {mehr Menschen} Elektroautos.", "Menimcha, elektromobillar kelajak, lekin davlat ko'proq quvvatlash stansiyalari qurishi kerak. Shunda ko'proq odam elektromobil sotib oladi."]], "k": [["das Elektroauto", "elektromobil"], ["umweltfreundlich", "ekologik"], ["die Abgase", "chiqindi gazlar"], ["der Akku / aufladen", "akkumulyator / quvvatlamoq"], ["die Ladestation", "quvvatlash stansiyasi"], ["die Reichweite", "yurish masofasi"], ["die Anschaffung", "sotib olish"]]},
 {"g": "b", "t": "Schulqualität", "u": "Maktab sifatini o'lchash mumkinmi", "img": "m/schulqual.jpg", "ot": "Ist Schulqualität messbar?", "ou": "PISA, VERA yoki yerlararo taqqoslash — maktab sifatini tekshirish nemis ta'lim tizimida mustahkam o'rin olgan. Ular nemis maktablarining zaif va kuchli tomonlarini ko'rsatishi kerak. Lekin nima o'lchanadi va bu ma'lumotlar qanchalik foydali? Maktab sifatini umuman qanday o'lchash mumkin?\nGermaniyada maktab natijalarini o'lchash bumi boshlandi. Ayniqsa 4- va 9-sinflarda o'tkaziladigan yerlararo taqqoslashlar o'quvchilarning nemis tili, matematika, birinchi chet tili (asosan ingliz) va uchta tabiiy fan (biologiya, kimyo, fizika) bo'yicha natijalarini aniqlaydi. Bu testlar 16 federal yerning umumta'lim tizimi qanchalik samarali ekanini ko'rsatishi kerak. Asos — ta'lim vazirlarining umumiy ta'lim standartlari. Ular shunday yozilganki, ulardan bevosita test talablari chiqariladi. Shu ma'noda maktab sifatini o'lchash mumkinligi aniq.\nLekin raqiblar faqat o'quv maqsadlariga erishish o'lchanishi mumkinligini aytadi. Gap maktabning pedagogik sifati haqida ketganda, o'lchash tezda chegarasiga yetadi. Bundan tashqari, o'lchash hatto maktab sifatiga zarar yetkazadi: hamma faqat bir nechta fandagi maqsadlarga e'tibor beradi, bilim qanday yetkazilishi yoki zaif o'quvchilar kerakli yordamni olishiga emas. O'quvchilar maktabda o'zini yaxshi his qiladimi va yana nimalarni — jamiyatdagi faollik, bag'rikenglik, jamoada ishlash va hokazo — o'rganishi ham o'lchanmaydi.\nShunday qilib, yaxshi maktab nima, degan savolgina emas, balki natijalarni o'lchash o'quvchilarga foydadan ko'ra ko'proq zarar keltirmaydimi, degan savol ham tug'iladi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob man {die Qualität einer Schule mit Tests} messen kann.", "Matnda maktab sifatini testlar bilan o'lchash mumkinmi, degan savol ko'riladi."], ["Vorteile", "Tests zeigen {die Stärken und Schwächen} der Schulen, und man kann sie {vergleichen}.", "Testlar maktablarning kuchli va zaif tomonlarini ko'rsatadi va ularni taqqoslash mumkin."], ["Nachteile", "Tests messen {nur Noten}, aber nicht, ob die Schüler {sich wohlfühlen} oder {im Team arbeiten} können.", "Testlar faqat baholarni o'lchaydi, lekin o'quvchilar o'zini yaxshi his qiladimi yoki jamoada ishlay oladimi — buni emas."], ["Erfahrung", "In meiner Schulzeit haben die Lehrer {nur für die Prüfungen} unterrichtet, und {kreative Fächer} waren nicht wichtig. Deshalb habe ich {nicht gelernt, selbst zu denken}.", "Maktab davrimda o'qituvchilar faqat imtihonlar uchun dars berardi, ijodiy fanlar muhim emas edi. Shuning uchun o'zim mustaqil fikrlashni o'rganmadim."], ["Meinung", "Meiner Meinung nach sind Tests nützlich, aber man sollte auch {die Meinung der Schüler und Eltern} fragen. Sie wissen am besten, {was gut und was schlecht} ist.", "Menimcha, testlar foydali, lekin o'quvchilar va ota-onalarning fikrini ham so'rash kerak. Nima yaxshi, nima yomonligini ular yaxshiroq biladi."]], "k": [["die Schulqualität", "maktab sifati"], ["messen / messbar", "o'lchamoq / o'lchanadigan"], ["die Leistung", "natija, o'zlashtirish"], ["vergleichen", "taqqoslamoq"], ["das Lernziel", "o'quv maqsadi"], ["sich wohlfühlen", "o'zini yaxshi his qilmoq"], ["die Teamfähigkeit", "jamoada ishlash qobiliyati"]]},
 {"g": "b", "t": "Trinkgeld", "u": "Choychaqa berish", "img": "m/trinkgeld.jpg", "ot": "Trinkgeld geben", "ou": "Ular chamadonlarimizni ko'taradi, eshikni ochib turadi, aytilgan manzilga olib boradi yoki dasturxonda xizmat qiladi: mehmonxona va restoranlarda, sartaroshda yoki taksida xodimlarga choychaqa berish odat. Nega aslida? Baribir pul to'lanadigan xizmat uchun nega yana qo'shimcha mukofot berish kerak?\nOdatda hisobga qo'shimcha yoki kichik xizmat uchun beriladigan bu kichik summa xushmuomala yoki malakali xizmatga minnatdorchilik hisoblanadi. Ba'zilar choychaqani alohida munosabatga undov yoki hatto, ayniqsa oldindan berilsa, bir xil pora deb biladi. Choychaqa beradigan joyda biz shaxs sifatida markazda bo'lamiz: bizga shaxsan murojaat qilinadi, xizmat qilinadi, olib boriladi, chiroyli qilinadi. Bu xizmatlar kichik hashamat va biz unga kichik minnatdorchilik ishorasi bilan rahmat aytamiz. Kim choychaqa olishini tushunish ba'zan qiyin: ofitsiantga beriladi, samolyotdagi styuardessaga yo'q. Ilgari konduktorga choychaqa berish odat bo'lgan, bugun buni hech kim tushunmaydi.\nHaqiqat shuki, ba'zi kasblarda choychaqa ish haqining doimiy qismi hisoblanadi va shuning uchun asosiy maosh past belgilanadi. Bu yerda xodimlar mijozlarning saxiyligiga bog'liq.\nBiroq kam choychaqadan darhol saxiylik yo'q, degan xulosa chiqarmaslik kerak: o'zi kam pulga ega odam katta summa bera olmaydi. Choychaqa baribir o'z-o'zidan kutilmasligi kerak. Yomon yoki qo'pol xizmat ko'rgan odam choychaqa bermaslik orqali buni bildirishga haqli.\nChoychaqa miqdori haqida ko'pincha noaniqlik bor, ayniqsa odatlar mamlakatdan mamlakatga farq qiladi. Choychaqa odat bo'lmagan mamlakatlar ham bor. Shuning uchun safardan oldin mahalliy odatlar bilan tanishib olish yaxshi.", "p": [["Inhalt", "Im Text geht es um die Frage, {warum und wem} man {Trinkgeld} gibt.", "Matnda nega va kimga choychaqa berilishi haqidagi savol ko'riladi."], ["Vorteile", "Trinkgeld ist ein {Dankeschön für guten Service} und hilft Menschen mit {niedrigem Lohn}.", "Choychaqa yaxshi xizmat uchun minnatdorchilik va kam maosh oladigan odamlarga yordam beradi."], ["Nachteile", "Oft weiß man nicht, {wie viel man geben soll}, und in jedem Land ist es {anders}.", "Ko'pincha qancha berish kerakligini bilmaysan va har bir mamlakatda bu har xil."], ["Erfahrung", "In Usbekistan gibt man im Restaurant meistens {kein extra Trinkgeld}, weil {die Bedienung schon auf der Rechnung} steht. Aber in Taxis {runden viele den Preis auf}.", "O'zbekistonda restoranda odatda qo'shimcha choychaqa berilmaydi, chunki xizmat haqi hisobda bor. Lekin taksida ko'pchilik narxni yaxlitlab beradi."], ["Meinung", "Meiner Meinung nach sollte man Trinkgeld geben, wenn {der Service wirklich gut} war. Das ist {ein schönes Dankeschön} für die Arbeit.", "Menimcha, xizmat haqiqatan yaxshi bo'lsa, choychaqa berish kerak. Bu mehnat uchun chiroyli minnatdorchilik."]], "k": [["das Trinkgeld", "choychaqa"], ["die Bedienung / der Service", "xizmat"], ["die Anerkennung", "minnatdorchilik, e'tirof"], ["großzügig", "saxiy"], ["der Lohn", "ish haqi"], ["die Bestechung", "pora"], ["üblich sein", "odat bo'lmoq"]]},
 {"g": "b", "t": "Frauenquote", "u": "Erkak va ayollar uchun teng imkoniyat", "img": "m/frauenquote.jpg", "ot": "Gleiche Chancen für Männer und Frauen – per Gesetz geregelt", "ou": "Ayollar va erkaklar kasbda va jamiyatda teng imkoniyatga ega bo'lishi kerak. 1970-yillarda ayollar harakati kurashib erishgan bu maqsad XX asrning 80–90-yillarida bosqichma-bosqich amalga oshirildi. Jinslar tengligiga erishish uchun Germaniya va boshqa ko'p Yevropa mamlakatlarida qonuniy tartib joriy qilindi: ayollar kvotasi.\nAyollar kvotasi shuni anglatadi: agar bir ish o'rniga bir xil malakali bir necha nomzod bo'lsa va xodimlarning 50 foizdan kami ayol bo'lsa, erkak o'rniga ayol nomzod ishga olinishi kerak. Bu firmalardagi rahbarlik lavozimlari va siyosatga ham tegishli.\nKvota joriy qilinishiga sabab — ayollar jamiyatda qaror qabul qilishda, masalan firmalarga ishga olishda yoki lavozimda ko'tarilishda ayol bo'lgani uchun kamsitiladi. Ayollar erkaklarga qaraganda ko'pincha kamroq maoshli kasblarda ishlashi, parlament va rahbarlik lavozimlarida esa ancha kam uchrashi haqiqat.\nBu esa ayollar va erkaklar teng nisbatda attestat olishi, universitetlarda ularning ulushi deyarli teng ekani, ayollar o'qishni erkaklardan tezroq tugatishiga aniq zid.\nXo'sh, nega ayollar malakali va yaxshi maoshli ish izlaganda ko'pincha erkaklardan yomonroq holatda? Haqiqatan erkaklar ayollar bilan birga ishlash mumkin emas deb o'ylab, erkaklarni afzal ko'radimi? Yoki kadrlar bo'limi rahbarlari xodima homiladorlik va ota-onalik ta'tiliga chiqsa firma ko'p pul yo'qotadi, deb qo'rqadimi? Qizig'i: erkak ota-onalik ta'tilini olishi ehtimoli ularni bezovta qilmaydiganga o'xshaydi.\nAyollar kvotasi shu yerda ayollarga teng imkoniyat huquqini olishga yordam berishi kerak. Albatta, qonunning tanqidchilari ham bor: ular kvota kasbiy malaka hisobiga bo'lishidan qo'rqadi. Lekin tenglik qonuni bilan ham maqsadlarga erishishgacha hali uzoq yo'l bor: chunki o'zgarish ongda, ayniqsa erkaklar ongida ham bo'lishi kerak.", "p": [["Inhalt", "Im Text geht es um die {Frauenquote}, die {Frauen im Beruf gleiche Chancen} geben soll.", "Matnda ayollarga kasbda teng imkoniyat berishi kerak bo'lgan ayollar kvotasi haqida gap boradi."], ["Vorteile", "Durch die Quote kommen {mehr Frauen in Führungspositionen} und in die {Politik}.", "Kvota orqali rahbarlik lavozimlari va siyosatga ko'proq ayollar keladi."], ["Nachteile", "Manche meinen, dann bekommt eine Frau die Stelle, {nur weil sie eine Frau ist}, nicht wegen ihrer {Qualifikation}.", "Ba'zilar shunda ayol ish o'rnini malakasi uchun emas, faqat ayol bo'lgani uchun oladi, deb hisoblaydi."], ["Erfahrung", "In der Medizin gibt es bei uns {sehr viele Ärztinnen}, aber {die Chefärzte sind meistens Männer}. Viele Frauen {arbeiten weniger}, weil sie {kleine Kinder} haben.", "Bizda tibbiyotda shifokor ayollar juda ko'p, lekin bosh shifokorlar asosan erkaklar. Ko'p ayollar kichik bolalari borligi uchun kamroq ishlaydi.",["In der Schule gibt es bei uns {sehr viele Lehrerinnen}, aber {die Direktoren sind meistens Männer}.", "Bizda maktabda o'qituvchi ayollar juda ko'p, lekin direktorlar asosan erkaklar."]], ["Meinung", "Meiner Meinung nach sollte {die Qualifikation entscheiden}, aber Frauen brauchen {mehr Unterstützung}, zum Beispiel {Kitas}. Dann können sie {Beruf und Familie} verbinden.", "Menimcha, malaka hal qilishi kerak, lekin ayollarga ko'proq yordam kerak, masalan, bog'chalar. Shunda ular ish va oilani birga olib bora oladi."]], "k": [["die Gleichberechtigung", "teng huquqlilik"], ["die Frauenquote", "ayollar kvotasi"], ["die Führungsposition", "rahbarlik lavozimi"], ["benachteiligt werden", "kamsitilmoq"], ["die Qualifikation", "malaka"], ["die Elternzeit / der Elternurlaub", "ota-onalik ta'tili"], ["einstellen", "ishga olmoq"]]},
 {"g": "b", "t": "Tattoo", "u": "Tatuirovka — abadiy bezak", "img": "m/tattoo.jpg", "ot": "Tattoo – Schmuck für die Ewigkeit", "ou": "Bu juda oson sodir bo'ladi: ko'z ochib-yumguncha sevimli zanjir yoki chiroyli soat yo'qoladi. Sevimli taqinchoq tezda yo'qoladi, odam asabiylashib, qayerga ketdi ekan, deb o'ylaydi.\nYechimi? Hech tatuirovka haqida o'ylab ko'rganmisiz? Tatuirovka bezagingizni hech qachon yo'qotmaslik yoki o'g'irlatmaslik imkonini beradi.\nYozda bu hammaga ko'rinadi: futbolchilar, musiqachilar va hatto sobiq federal prezident Kristian Vulffning rafiqasi ko'rsatgan namunaga ko'pchilik ergashmoqda. Tatuirovkalar jamiyatda qabul qilinadigan bo'ldi.\nSo'nggi yillarda tobora ko'proq odamlar tatuirovka istagini amalga oshirmoqda. Ko'p nemislar tatuirovkani yaxshi ko'radi, buni raqamlar ham tasdiqlaydi: Germaniya tatuirovkachilari uyushmasida 5000 ga yaqin studiya ro'yxatdan o'tgan, soni o'sib bormoqda. Har holda tatuirovka qarori shoshilib qabul qilinmasligi kerak. Tananing qaysi qismini bezash — muhim qaror. Kiyim bilan yopib bo'lmaydigan ko'rinadigan joylarni, ayniqsa kasbi tufayli jamoatchilik oldida bo'ladigan odamlar tanlamagani ma'qul.\nNafaqat joy, balki rasm tanlovi ham muhim. Kim bilagiga sherigining ismini yozdirsa, munosabat tugaganda yana bir muammoga ega bo'ladi: singan yurakka tatuirovkani qanday olib tashlash degan savol qo'shiladi.\nEng keng tarqalgan usul — lazer bilan olib tashlash. Lekin bu sohadagi katta yutuqlarga qaramay, aniq aytish kerakki, tatuirovka hamon abadiy va keyinchalik olib tashlash uzoq, qimmat va og'riqli bo'lishi mumkin.\nVa yana savol qoladi: tatuirovka umuman chiroylimi?", "p": [["Inhalt", "Im Text geht es darum, dass {Tattoos immer beliebter} werden, aber {für immer} bleiben.", "Matnda tatuirovkalar tobora mashhur bo'layotgani, lekin abadiy qolishi haqida gap boradi."], ["Vorteile", "Ein Tattoo ist {ein persönlicher Schmuck}, den man {nie verlieren} kann.", "Tatuirovka hech qachon yo'qotib bo'lmaydigan shaxsiy bezak."], ["Nachteile", "Später kann man es {bereuen}, und die {Entfernung mit Laser} ist {teuer und schmerzhaft}.", "Keyin pushaymon bo'lish mumkin, lazer bilan olib tashlash esa qimmat va og'riqli."], ["Erfahrung", "In Usbekistan sind Tattoos {nicht so üblich}, viele ältere Menschen finden sie {nicht schön}. Aber bei jungen Leuten sind sie {immer beliebter}.", "O'zbekistonda tatuirovka unchalik odat emas, ko'p keksalar uni chiroyli deb hisoblamaydi. Lekin yoshlar orasida tobora ommalashmoqda."], ["Meinung", "Meiner Meinung nach sollte man {gut nachdenken} und kein Tattoo an {einer sichtbaren Stelle} machen. Später {gefällt es einem vielleicht nicht mehr}.", "Menimcha, yaxshilab o'ylab ko'rish va ko'rinadigan joyga tatuirovka qilmaslik kerak. Keyinchalik u yoqmay qolishi mumkin."]], "k": [["die Tätowierung / das Tattoo", "tatuirovka"], ["der Schmuck", "bezak, taqinchoq"], ["für die Ewigkeit", "abadiy"], ["bereuen", "pushaymon bo'lmoq"], ["entfernen / die Entfernung", "olib tashlamoq / olib tashlash"], ["sichtbar", "ko'rinadigan"], ["übereilt", "shoshilinch"]]},
 {"g": "b", "t": "Handy und Internet", "u": "Bolalar telefon va internet xavfini kam baholaydi", "img": "m/handy.jpg", "ot": "Kinder unterschätzen Gefahren von Handy und Internet", "ou": "Yevropa Komissiyasi bolalar va o'smirlar o'rtasida telefon va internetdan foydalanish bo'yicha so'rov o'tkazdi. Natija: yosh foydalanuvchilar yangi media bilan ishonch bilan ishlaydi, lekin xavf-xatarlarni kam baholaydi.\nHolbuki yangi texnologiyalar ko'pincha xavfsiz emas: qurilmalar orqali zo'ravonlik o'yinlari va pornografik kontentga kirish mumkin. Bolalarga qarshi tahdid, tovlamachilik yoki haqorat ko'rinishidagi telefon terrori ham tobora ko'paymoqda. Telefonlardagi kamera ham suiiste'molga yo'l ochadi: sezdirmay olingan rasm orqali odam birdan o'zini internetda ko'rishi mumkin.\nYevropadagi bolalar va o'smirlar uchun internet va telefon odatiy holga aylangan va umuman ular virtual dunyodagi xavflarni biladi. Lekin muammo bo'lsa, kattalardan faqat oxirgi chora sifatida yordam so'raydi. Bu Yevropa Ittifoqi topshirig'i bilan barcha a'zo davlatlar, Norvegiya va Islandiyadagi 9–10 va 12–14 yoshli bolalar o'rtasidagi so'rov natijasi.\nAyniqsa mobil telefondan foydalanishni bolalar xavfsiz deb biladi. 9–10 yoshlilarning qariyb 75 foizi va 12–14 yoshlilarning hatto 90 foizida telefon bor.\nKo'p yosh foydalanuvchilar xavflardan xabardor bo'lsa ham, ko'pchiligi muammoni o'zi yoki do'stlari yordamida hal qilishga urinadi va ota-onasiga faqat jiddiy holatlarda aytadi. \"Ota-onamdan boshqa hammaga aytgan bo'lardim\", deydi so'ralgan 9–10 yoshli nemis qiz.", "p": [["Inhalt", "Im Text geht es darum, dass {Kinder die Gefahren von Handy und Internet unterschätzen}.", "Matnda bolalar telefon va internet xavfini kam baholashi haqida gap boradi."], ["Vorteile", "Kinder können im Internet {schnell Informationen finden} und {mit Freunden in Kontakt bleiben}.", "Bolalar internetda tez ma'lumot topishi va do'stlari bilan aloqada bo'lishi mumkin."], ["Nachteile", "Sie können {gefährliche Inhalte sehen} oder {online gemobbt} werden.", "Ular xavfli kontentni ko'rishi yoki internetda tazyiqqa uchrashi mumkin."], ["Erfahrung", "Heute haben in Usbekistan schon {Grundschulkinder ein Smartphone} und spielen {stundenlang}. Deshalb {bewegen sie sich wenig} und {schlafen schlecht}.", "Bugun O'zbekistonda boshlang'ich sinf bolalarida ham smartfon bor va ular soatlab o'ynaydi. Shuning uchun ular kam harakat qiladi va yomon uxlaydi."], ["Meinung", "Meiner Meinung nach sollten Eltern {mit ihren Kindern offen sprechen} und {die Handyzeit begrenzen}. Zum Beispiel {kein Handy beim Essen} und {nicht im Bett}.", "Menimcha, ota-onalar farzandlari bilan ochiq gaplashishi va telefon vaqtini cheklashi kerak. Masalan, ovqatlanayotganda va to'shakda telefon yo'q."]], "k": [["unterschätzen", "kam baholamoq"], ["die Gefahr / das Risiko", "xavf"], ["der Inhalt", "kontent, mazmun"], ["die Erpressung / Drohung", "tovlamachilik / tahdid"], ["der Missbrauch", "suiiste'mol"], ["um Hilfe bitten", "yordam so'ramoq"], ["begrenzen", "cheklamoq"]]},
 {"g": "b", "t": "Fernsehen macht dumm", "u": "Televizor bolalarni ahmoq qiladi", "img": "m/fernsehdumm.jpg", "ot": "Fernsehen macht Kinder dumm", "ou": "Bolaligida ko'p televizor ko'rgan odam yoshlikda kam ko'rganlarga qaraganda yomonroq ma'lumot oladi. Yangi tadqiqotlar buni tasdiqlaydi.\nBolalar televizor oldiga qancha erta o'tirsa, keyingi o'qish natijalari shuncha zaif bo'ladi. Xonasida televizori bor bolalar o'rtacha o'z televizori yo'q tengdoshlariga qaraganda yomonroq baho oladi.\nMutaxassislar bir fikrda: juda erta va juda ko'p televizor ko'rish bolalar sog'lig'iga salbiy ta'sir qiladi, chunki passiv ko'rish jismoniy harakatsizlikka olib keladi. Bundan tashqari, televizor ko'radigan bolalar alkogol, tamaki va boshqa giyohvand moddalar bilan ertaroq tanishadi.\nYangi tadqiqotlar ko'p aytilgan, lekin isbotlanmagan taxminni tasdiqladi: televizor bolalar ta'limiga zarar yetkazadi. Bolaligida eng ko'p (kuniga 3 soatdan ortiq) televizor ko'rganlar ko'pincha maktabni tugatmagan, eng kam ko'rganlar esa keyinchalik eng ko'p oliy ma'lumot olgan — IQ va ijtimoiy-iqtisodiy sharoitdan qat'i nazar.\nShuning uchun mutaxassislar film va kompyuter o'yinlarini me'yorida ko'rishni maslahat beradi: kuniga bir soatgacha mayli. Uy vazifasini hech qachon televizor oldida qilmaslik kerak — tasvir va tovush juda chalg'itadi, miya materialni uzoq eslab qololmaydi va yodlash behuda ketadi. Uxlashdan bir soat oldin televizor va kompyuter ham taqiqlangan.", "p": [["Inhalt", "Im Text geht es darum, dass {zu viel Fernsehen} den Kindern {in der Schule schadet}.", "Matnda juda ko'p televizor ko'rish bolalarga maktabda zarar qilishi haqida gap boradi."], ["Vorteile", "Manche Sendungen sind {lehrreich}, und Kinder können sich {nach der Schule entspannen}.", "Ba'zi ko'rsatuvlar ibratli va bolalar maktabdan keyin dam olishi mumkin."], ["Nachteile", "Kinder {bewegen sich zu wenig} und bekommen oft {schlechtere Noten}.", "Bolalar juda kam harakat qiladi va ko'pincha yomonroq baho oladi."], ["Erfahrung", "Ich sehe oft, dass kleine Kinder {beim Essen Zeichentrickfilme schauen}, damit sie {ruhig sind}. Ich finde, das ist {keine gute Gewohnheit}.", "Kichik bolalar tinch o'tirishi uchun ovqat paytida multfilm ko'rishini tez-tez ko'raman. Menimcha, bu yaxshi odat emas."], ["Meinung", "Meiner Meinung nach sollten Kinder {höchstens eine Stunde am Tag} fernsehen und {keinen Fernseher im Zimmer} haben. Sie sollten lieber {draußen spielen} und {Bücher lesen}.", "Menimcha, bolalar kuniga ko'pi bilan bir soat televizor ko'rishi va xonasida televizor bo'lmasligi kerak. Ular yaxshisi tashqarida o'ynashi va kitob o'qishi kerak."]], "k": [["fernsehen / der Fernsehkonsum", "televizor ko'rmoq / televizor ko'rish"], ["der Schulabschluss", "maktabni tugatish"], ["die Note", "baho"], ["die Inaktivität", "harakatsizlik"], ["ablenken", "chalg'itmoq"], ["gemäßigt", "me'yorida"], ["schaden", "zarar qilmoq"]]},
 {"g": "b", "t": "Woche ohne Internet", "u": "Internetsiz bir hafta", "img": "m/ohneinternet.jpg", "ot": "Eine Woche ohne Internet", "ou": "Dengiz otlari baliqmi yoki sutemizuvchimi?\nBolam mening noaniq gaplarimdan tezda zerikib: \"Kompyuterdan qarab qo'y-chi\", deydi. Lekin men qarolmayman, chunki tajriba shunday nomlanadi: internetsiz bir hafta.\nEndi yangi maktab sumkasi yoki keyingi yozgi moda kabi orzu qilingan narsalarga ham yo'l yo'q — ular ham kompyuterda paydo bo'lib, bir necha kundan keyin yetkazib berilardi. Shuning uchun bola nazarida kompyuter zamonaviy Qorbobo.\nHafta oxirida belim og'rib qoldi, chunki onlayn yetkazib berish tufayli ichimlik yashiklarini to'g'ri ko'tarishni unutgan ekanman. Vokzalda ikkita chipta sotib olishga urinib, yoqimsiz vaqt o'tkazdim: internetda bu 3 daqiqa, kassada esa bir necha barobar ko'p vaqt oldi. Temir yo'l xodimi ham shunga o'xshash narsa bildirdi.\nShanba kuni do'stlarimiz bayramiga taklif qilindik. Eski shahar xaritasi bilan manzilni topdik, lekin bar qorong'i edi, bitta deraza taxta bilan mixlangan. Telefoniga qo'ng'iroq qildik — hech kim olmadi, ehtimol musiqa tufayli eshitishmagandir. Ertasi kuni ertalab e-pochtada o'qidim: \"Pudel'da yong'in chiqdi, shuning uchun ... da nishonlaymiz.\"\nHafta oxirida yozib qo'ydim: internet hamma odamlarga xayrixoh va ularni bir-biriga yaqinlashtiradigan, hamma narsani biladigan Qorboboga o'xshaydi. U dengiz otlari baliq ekanini ham bilgan bo'lardi.", "p": [["Inhalt", "Im Text beschreibt ein Autor, wie schwer {eine Woche ohne Internet} für ihn war.", "Matnda muallif internetsiz bir hafta unga qanchalik qiyin bo'lganini tasvirlaydi."], ["Vorteile", "Ohne Internet hat man {mehr Zeit für die Familie} und {spricht mehr mit Menschen}.", "Internetsiz oila uchun ko'proq vaqt bo'ladi va odamlar bilan ko'proq gaplashasan."], ["Nachteile", "Viele Dinge dauern {viel länger}, zum Beispiel {Tickets kaufen} oder {Informationen suchen}.", "Ko'p ishlar ancha uzoq davom etadi, masalan, chipta sotib olish yoki ma'lumot qidirish."], ["Erfahrung", "Für mein Studium und mein Deutschlernen brauche ich {das Internet jeden Tag}. Aber am Abend {lese ich lieber ein Buch} ohne Handy.", "O'qishim va nemis tilini o'rganishim uchun menga har kuni internet kerak. Lekin kechqurun telefonsiz kitob o'qishni afzal ko'raman."], ["Meinung", "Meiner Meinung nach kann man heute nicht ohne Internet leben, aber {ein Tag pro Woche ohne Handy} ist gesund. Dann hat man {mehr Zeit für die Familie}.", "Menimcha, bugun internetsiz yashab bo'lmaydi, lekin haftada bir kun telefonsiz o'tkazish sog'liq uchun foydali. Shunda oilaga ko'proq vaqt qoladi."]], "k": [["das Experiment", "tajriba"], ["online bestellen / der Lieferservice", "onlayn buyurtma / yetkazib berish xizmati"], ["der Fahrschein", "chipta"], ["der Schalter", "kassa"], ["verlernen", "unutib qo'ymoq (ko'nikmani)"], ["Bescheid geben", "xabar bermoq"], ["allwissend", "hamma narsani biladigan"]]},
 {"g": "b", "t": "Musik beim Zahnarzt", "u": "Tish shifokorida burg'u o'rniga musiqa", "img": "m/zahnarzt.jpg", "ot": "Musik statt Bohrgeräusche beim Zahnarzt", "ou": "Kelajakda tish shifokoriga borish yoqimliroq bo'lishi mumkin. Britaniyalik olimlar burg'uning o'tkir ovozini o'chiradigan quloqchin yaratdi. Bu yangilik bemorlarga tish shifokoriga qo'rqmasdan borishga yordam berishi kerak. Bu tamoyil \"antishovqin\" deb ataladi. G'oya yangi emas: nemis Paul Lueg tovushni antitovush bilan kamaytirish g'oyasini 1933-yildayoq patentlagan. Lekin bir necha yil oldingacha buni amalga oshirishga texnik imkoniyat yo'q edi.\nTamoyil oddiy: mikrofon tashqi tovushlarni yozadi, elektronika esa iloji boricha aniq qarama-qarshi tovush to'lqinini hosil qiladi. Interferensiya degan fizik tamoyilga ko'ra ikki to'lqin bir-birini so'ndiradi va hech narsa eshitilmaydi. Antishovqin ishlashini samolyotlar va shovqinli joylarda qo'llanishi ko'rsatadi — u yerda tijoriy mahsulotlar allaqachon bor.\nBu ko'pchilik uchun keyingi tish shifokori tashrifida orzu bo'lardi: burg'uning g'ichirlashi umuman eshitilmaydi. Ko'p bemorlar aynan tovushdan qo'rqadi va burg'u ovozini eshitishi bilan terga botadi. Yana bir imkoniyat: bemorlar davolanish paytida o'z musiqasini tinglashi mumkin. Shunda shifokor bilan muloqot qiyinlashishidan qo'rqish mumkin: shifokor muhim ko'rsatma bersa-yu, eshitmasam-chi? Ishlab chiquvchilar esa bemorlar quloqchin taqib ham shifokor aytganini eshitaverishini aytadi.\nEndi faqat ishlab chiqish va sotish uchun iqtisodiy hamkor kerak, chunki quloqchinlar hali sotuvda yo'q. Bu yerda yana bir muammo bo'lishi mumkin: ehtimol bemorlar yangi texnologiyadan har tashrifda qo'shimcha pul to'lab foydalanadi. Bu choraga pul to'lagan bo'larmidingiz?", "p": [["Inhalt", "Im Text geht es um {einen neuen Kopfhörer}, der beim Zahnarzt {das Geräusch des Bohrers ausblendet}.", "Matnda tish shifokorida burg'u ovozini o'chiradigan yangi quloqchin haqida gap boradi."], ["Vorteile", "Patienten haben {weniger Angst} und können {ihre eigene Musik hören}.", "Bemorlar kamroq qo'rqadi va o'z musiqasini tinglay oladi."], ["Nachteile", "Die Patienten müssen vielleicht {extra dafür bezahlen}, und sie {hören den Arzt schlechter}.", "Bemorlar buning uchun qo'shimcha to'lashi kerak bo'lishi mumkin va shifokorni yomonroq eshitadi."], ["Erfahrung", "Als Kind hatte ich {große Angst vor dem Zahnarzt}, besonders {vor dem Bohrer}. Mit Musik {hätte ich weniger Angst} gehabt.", "Bolaligimda tish shifokoridan, ayniqsa burg'udan juda qo'rqardim. Musiqa bo'lganda kamroq qo'rqqan bo'lardim."], ["Meinung", "Meiner Meinung nach ist das eine gute Idee, {besonders für Kinder}, aber es sollte {nicht zu teuer} sein. So gehen Kinder {ohne Angst} zum Zahnarzt.", "Menimcha, bu yaxshi g'oya, ayniqsa bolalar uchun, lekin juda qimmat bo'lmasligi kerak. Shunda bolalar tish shifokoriga qo'rqmay boradi."]], "k": [["der Zahnarzt", "tish shifokori"], ["der Bohrer / das Bohrgeräusch", "burg'u / burg'u ovozi"], ["der Kopfhörer", "quloqchin"], ["ausblenden", "o'chirmoq, eshittirmaslik"], ["die Angst", "qo'rquv"], ["die Behandlung", "davolash"], ["entwickeln", "ishlab chiqmoq"]]},
 {"g": "b", "t": "Alkoholmissbrauch", "u": "Alkogoldan suiiste'mol", "img": "m/alkohol.jpg", "ot": "Alkoholmissbrauch", "ou": "Belgilangan narxga xohlagancha alkogol ichish — Ittifoq ichki ishlar vazirlariga ko'ra, bunday takliflar endi bo'lmasligi kerak. Ular butun mamlakat bo'ylab taqiq tarafdori. Lekin bitta kichik federal yer tezroq harakat qilmoqda.\nIttifoq ichki ishlar vazirlari belgilangan narxga cheksiz alkogolli ichimlik beriladigan \"flatrate-partiyalar\"ni taqiqlamoqchi. \"Biz buni butun mamlakatda to'xtatish kerakligiga qo'shilamiz\", dedi Bremen ichki ishlar senatori Tomas Röwekamp hamkasblari bilan konferensiyadan keyin. Bremenda taqiq bo'yicha kelishuvga allaqachon erishilgan, bu kichik yer uni restoranlar to'g'risidagi qonun orqali amalga oshiradi.\nMart oxirida Berlinda 16 yoshli o'quvchining o'limi alkogol taqiqlari haqidagi bahsni butun mamlakatda qayta qo'zg'atdi. Bir qancha siyosatchilarning fikricha, yoshlarni himoya qilish va restoranlar to'g'risidagi mavjud qonunlar avvalgidan qattiqroq qo'llanishi kerak.\nQonunga ko'ra Germaniyada pivo, vino va shampan 16 yoshgacha bo'lganlarga, aroq turidagi ichimliklar esa 18 yoshgacha bo'lganlarga sotilmasligi kerak. Bundan tashqari, restoran egalariga mast odamlarga yana alkogol quyish taqiqlangan.\nSog'liq bo'yicha tushuntirish federal markaziga ko'ra, 12–17 yoshlilarning uchdan biridan ko'prog'i mast bo'lgan. Poytaxtda bolalar o'rtasida alkogoldan suiiste'mol keskin oshmoqda: 2000–2005-yillarda alkogoldan zaharlanib kasalxonada davolangan 15–19 yoshlilar soni ikki barobar oshgan. Kichiklar ham istisno emas: faqat 2005-yilda 74 nafar 10–14 yoshli bola alkogoldan zaharlanib statsionar davolangan, 2004-yilda bu 48 nafar edi.", "p": [["Inhalt", "Im Text geht es darum, dass {immer mehr Jugendliche zu viel Alkohol trinken} und Politiker {Flatrate-Partys verbieten} wollen.", "Matnda tobora ko'proq yoshlar ortiqcha alkogol ichishi va siyosatchilar flatrate-partiyalarni taqiqlamoqchi ekani haqida gap boradi."], ["Vorteile", "Ein Verbot kann {Jugendliche schützen} und {Alkoholvergiftungen verhindern}.", "Taqiq yoshlarni himoya qilishi va alkogoldan zaharlanishning oldini olishi mumkin."], ["Nachteile", "Jugendliche finden oft {andere Wege}, Alkohol zu bekommen, zum Beispiel {über ältere Freunde}.", "Yoshlar ko'pincha alkogol olishning boshqa yo'lini topadi, masalan, katta do'stlari orqali."], ["Erfahrung", "In Usbekistan trinken {viele junge Leute keinen Alkohol}, weil es {in unserer Kultur nicht gern gesehen} wird. Aber in Großstädten trinken {immer mehr junge Leute}.", "O'zbekistonda ko'p yoshlar alkogol ichmaydi, chunki bizning madaniyatimizda bu yoqtirilmaydi. Lekin katta shaharlarda tobora ko'proq yoshlar ichmoqda."], ["Meinung", "Meiner Meinung nach brauchen wir {strengere Kontrollen} und {mehr Aufklärung in Schulen}. Die Eltern sollten auch {ein gutes Vorbild} sein.", "Menimcha, bizga qattiqroq nazorat va maktablarda ko'proq tushuntirish ishlari kerak. Ota-onalar ham yaxshi o'rnak bo'lishi kerak."]], "k": [["der Alkoholmissbrauch", "alkogoldan suiiste'mol"], ["die Alkoholvergiftung", "alkogoldan zaharlanish"], ["betrunken", "mast"], ["das Jugendschutzgesetz", "yoshlarni himoya qilish qonuni"], ["verbieten / das Verbot", "taqiqlamoq / taqiq"], ["ausschenken", "(ichimlik) quymoq, sotmoq"], ["die Suchtprävention", "qaramlikning oldini olish"]]},
 {"g": "b", "t": "Digitales Unterrichtsmaterial", "u": "Maktabda raqamli o'quv materiallari", "img": "m/digital.jpg", "ot": "Soll digitales Unterrichtsmaterial in den Schulen eingesetzt werden?", "ou": "Amerikada qisman allaqachon haqiqat, Germaniyada ba'zi maktablarda sinovda: elektron o'quv materiallaridan foydalanish tez orada hamma joyda haqiqatga aylanadimi? Kitob ko'rgazmalari tobora raqamlashtirish belgisi ostida o'tsa-da, bu hali uzoq kelajakdagidek.\nTarafdorlar an'anaviy darsliklar hozirning o'zida internetdagi qo'shimcha materiallarga havola qilishini aytadi. Demak, o'quv mazmunini elektron kitoblar orqali yetkazish mantiqiy. Maktab hozirgi rivojlanishdan ortda qolmasligi uchun bu albatta zarur.\nBosma darsliklar himoyachilari esa maktab yangi texnologiyalar uchun tajriba maydoni bo'lmasligi kerak, deydi. Elektron kitoblarni keng qo'llash usullari va ta'siri yetarlicha o'rganilmagan. Bundan tashqari, bunday loyihani moliyalashtirish juda noaniq.\nElektron kitoblarni darsga joriy qilish uchun katta mablag' kerakligini tarafdorlar ham tan oladi. Lekin ularning fikricha, ko'p afzalliklar tufayli bu mablag' oqlanadi. Elektron kitoblar tez va oson yangilanadi, darsliklar esa tez eskiradi. Ko'p funksiyalar o'quvchilarga yordam beradi: havolalar qo'shimcha ma'lumot beradi, ovoz chiqarib o'qish funksiyasi tinglab tushunishni o'rgatadi, qaydlar funksiyasi o'rganilganni to'ldiradi va mustahkamlaydi.\nBugun o'quvchilar mobil qurilmalardan bemalol foydalanadi va darsda raqamli mediadan foydalanish o'quvchilarning media savodxonligi, tanqidiy fikrlashi va o'zini tashkil qilishini rivojlantiradi — tarafdorlarning xulosasi shunday.", "p": [["Inhalt", "Im Text geht es um die Frage, ob Schulen {E-Books und Tablets statt gedruckter Schulbücher} benutzen sollen.", "Matnda maktablar bosma darsliklar o'rniga elektron kitob va planshetlardan foydalanishi kerakmi, degan savol ko'riladi."], ["Vorteile", "Digitale Bücher sind {immer aktuell} und haben {nützliche Funktionen}, zum Beispiel {Links und Audio}.", "Raqamli kitoblar doim dolzarb va foydali funksiyalarga ega, masalan, havolalar va audio."], ["Nachteile", "Die Technik ist {sehr teuer}, und Kinder {schauen noch mehr auf Bildschirme}.", "Texnika juda qimmat va bolalar ekranga yanada ko'proq qaraydi."], ["Erfahrung", "Ich lerne Deutsch {fast nur mit Apps und Webseiten}, und das {hilft mir sehr}. So kann ich {überall und jederzeit} lernen.", "Men nemis tilini deyarli faqat ilovalar va saytlar orqali o'rganaman va bu menga juda yordam beradi. Shunday qilib har yerda va istalgan vaqtda o'qiy olaman."], ["Meinung", "Meiner Meinung nach ist {eine Mischung aus Büchern und digitalen Medien} am besten. Bücher sind gut zum {Lesen}, Apps zum {Üben}.", "Menimcha, kitoblar va raqamli media aralashmasi eng yaxshisi. Kitoblar o'qish uchun, ilovalar mashq qilish uchun yaxshi."]], "k": [["das Unterrichtsmaterial", "o'quv materiali"], ["das Schulbuch", "darslik"], ["das E-Book", "elektron kitob"], ["aktualisieren", "yangilamoq"], ["veraltet", "eskirgan"], ["die Investition", "mablag' sarflash, investitsiya"], ["die Medienkompetenz", "media savodxonligi"]]},
 {"g": "b", "t": "Direkte Demokratie", "u": "To'g'ridan-to'g'ri demokratiya", "img": "m/demokratie.jpg", "ot": "Der Ruf nach mehr direkter Demokratie", "ou": "Berlin aeroporti kabi shov-shuvli yirik loyihalar munosabati bilan yaqinda xalq vakillarining qarorlari baland ovozda shubha ostiga olindi va fuqarolarning bevosita ishtiroki ko'payishi talab qilindi. Fuqarolar siyosiy qaror qabul qilishga haqiqatan ko'proq jalb qilinishi kerakmi? Savol o'rinli, chunki to'g'ridan-to'g'ri demokratiyaning xavflari ham bor.\nXalqning bevosita ovoz berishi siyosiy qarorlarni shubhasiz qonuniylashtiradi. Fuqarolar o'zi qaror qilsa, oqibatlarini ham ko'tarishga ko'proq tayyor bo'ladi. Lekin buning uchun keng ishtirok va saylovchilarning qiziqishi kerak — bu har bir masalada bo'lavermaydi. Bundan tashqari, xalq ovoz beradigan masalalar ko'pincha juda murakkab va fuqarolardan har doim kerakli bilimni talab qilib bo'larmikan.\nBunga qarshi to'g'ri aytish mumkinki, shunda siyosatchilar puxta tushuntirishga majbur bo'ladi va jamoatchilik bahsi jonlanadi. Lekin jamoatchilik muhokamasi xolislik va uzoqni ko'ra bilish bilan emas, kayfiyat uyg'otish uchun suiiste'mol qilinishidan qo'rqish mumkin. OAVda yetarli o'rni bor manfaatdor guruhlar jamoatchilik fikriga o'z foydasiga ta'sir qilishi mumkin. Boshqa tomondan, xalq qarorlari partiya manfaatlariga ancha kam bog'liq bo'ladi.\nBa'zan juda nopopulyar siyosiy qarorlar qabul qilish kerak. Zarur o'zgarishlar aholidan bevosita so'rash orqali to'xtatilishi va siyosatda turg'unlik keltirib chiqarishi mumkin. Bundan tashqari, to'g'ridan-to'g'ri demokratiya vositalari uzoq davom etadi va siyosatning tez harakat qilish qobiliyatini cheklaydi.\nMahalliy darajada, ya'ni faqat yashash joyi va uning atrofiga tegishli qarorlarda fuqarolar ishtiroki samaraliroq va osonroq ko'rinadi. Bu yerda fuqarolarga qarorlar bevosita ta'sir qiladi va ishtirokga qiziqishi kattaroq. Federal yoki mahalliy darajada bo'lsin — ko'proq to'g'ridan-to'g'ri demokratiya talabi ko'proq siyosiy ta'lim talabi bilan birga bo'lishi kerak.", "p": [["Inhalt", "Im Text geht es um die Frage, ob {die Bürger öfter selbst über politische Themen abstimmen} sollen.", "Matnda fuqarolar siyosiy masalalarda tez-tez o'zi ovoz berishi kerakmi, degan savol ko'riladi."], ["Vorteile", "Die Menschen fühlen sich {ernst genommen} und {akzeptieren die Entscheidungen} besser.", "Odamlar o'zini jiddiy qabul qilingandek his qiladi va qarorlarni yaxshiroq qabul qiladi."], ["Nachteile", "Viele Themen sind {zu kompliziert}, und Abstimmungen {dauern lange und kosten Geld}.", "Ko'p masalalar juda murakkab, ovoz berish esa uzoq davom etadi va pul talab qiladi."], ["Erfahrung", "In Usbekistan gab es {ein Referendum über die Verfassung}, und {viele Menschen haben mitgemacht}. Ich finde es gut, wenn {die Bürger mitentscheiden}.", "O'zbekistonda Konstitutsiya bo'yicha referendum bo'lgan va ko'p odamlar qatnashgan. Fuqarolar qaror qabul qilishda ishtirok etsa, yaxshi deb o'ylayman."], ["Meinung", "Meiner Meinung nach ist direkte Demokratie {in der eigenen Stadt} sinnvoll, zum Beispiel {bei Parks oder Straßen}. Da kennen sich {die Bürger am besten} aus.", "Menimcha, to'g'ridan-to'g'ri demokratiya o'z shahrida mantiqli, masalan, bog'lar yoki ko'chalar masalasida. Bu masalalarni fuqarolarning o'zi yaxshi biladi."]], "k": [["die direkte Demokratie", "to'g'ridan-to'g'ri demokratiya"], ["abstimmen / die Abstimmung", "ovoz bermoq / ovoz berish"], ["der Bürger / die Bürgerbeteiligung", "fuqaro / fuqarolar ishtiroki"], ["die Entscheidung", "qaror"], ["komplex / kompliziert", "murakkab"], ["die Wahlbeteiligung", "saylovda ishtirok"], ["die politische Bildung", "siyosiy ta'lim"]]},
 {"g": "b", "t": "Orthographie und Handschrift", "u": "Bugungi imlo va qo'lyozma", "img": "m/handschrift.jpg", "ot": "Orthographie und Handschrift heute", "ou": "Bugun bolalar yozishni shunday o'rganadi: eshitganidek yozishi kerak. Nemis tili o'qituvchisi Kristian Uling-Noymanning aytishicha, mashq bilan eshitish yaxshilangani sari yozilgan narsa ham to'g'riroq bo'ladi. Demak, bugun bolalar yozishni avvalgidan boshqacha o'rganadi, lekin yozuv ham bugun boshqacha ishlatiladi va ehtimol bir necha o'n yil avvalgidan boshqacha qadrlanadi. Bu o'zgarish yaxshimi yoki yomonmi — fikrlar turlicha.\nBirlar madaniy ko'nikmaning tanazzulini ko'rsa, boshqalar bugungi turmush tarziga zarur moslashuvni ko'radi. Kompyuter dasturlari deyarli har bir imlo xatosini tuzatadi, imlo islohoti tufayli to'g'ri va noto'g'ri orasidagi chegara xiralashgan. Bunday dunyoda xatosiz yozishdan ko'ra matndan zavq olish muhimroq emasmi?\nO'zgarish ayniqsa qo'lyozmaga ta'sir qiladi. Kattalar va ko'p bolalar ham ruchka bilan tobora kam, klaviaturada tobora ko'p yozadi. Biznesda bosma xatlar va elektron pochta qo'lda yozilgan xatlarning o'rnini egalladi. Yo'lda qayd yozadigan odam uni telefoniga kiritadi. Oshxonada o'tirgan hamkasbiga qo'ng'iroqni qabul qilgan xodima \"Xotiningiz qo'ng'iroq qildi\" degan gapni qog'ozga yozgandan ko'ra e-mail yuboradi. Shaxsiy hayotda ham elektronika ruchkani siqib chiqarmoqda: yigirma va yetmish yosh oralig'idagi odam ba'zan yangi tanishlarining qo'lyozmasini umuman bilmaydi. Tug'ilgan kunga internetdan elektron otkritka yuboriladi.\n\"Bu tanazzul\", deydi ta'lim falsafasi va tarixi bo'yicha sobiq professor Gyunter Böme. Uning aytishicha, bugun odamlar shaxs bo'lishni istamaydi. Shaxsiyat talab qilinmaydigan zamonda terilgan yozuv tufayli o'ziga xos hamma narsa, jumladan qo'lyozma ham yo'qolishi tabiiy.", "p": [["Inhalt", "Im Text geht es darum, dass Menschen heute {immer weniger mit der Hand} schreiben und {Rechtschreibung weniger wichtig} wird.", "Matnda odamlar bugun qo'lda tobora kam yozishi va imlo kamroq muhim bo'lib qolayotgani haqida gap boradi."], ["Vorteile", "Am Computer schreibt man {schneller}, und das Programm {korrigiert die Fehler}.", "Kompyuterda tezroq yozasan va dastur xatolarni tuzatadi."], ["Nachteile", "Viele Menschen können {nicht mehr richtig schreiben} und haben {keine schöne Handschrift}.", "Ko'p odamlar endi to'g'ri yoza olmaydi va chiroyli qo'lyozmasi yo'q."], ["Erfahrung", "Als Arzt muss ich manchmal {Rezepte mit der Hand} schreiben, aber {meistens} arbeite ich {am Computer}. Meine Handschrift ist {leider nicht schön}.", "Shifokor sifatida ba'zan retseptlarni qo'lda yozaman, lekin asosan kompyuterda ishlayman. Afsuski, mening qo'lyozmam chiroyli emas.",["Als Lehrerin schreibe ich {an der Tafel mit der Hand}, aber {zu Hause} arbeite ich {am Computer}.", "O'qituvchi sifatida doskada qo'lda yozaman, lekin uyda kompyuterda ishlayman."]], ["Meinung", "Meiner Meinung nach sollten Kinder in der Schule {trotzdem mit der Hand schreiben lernen}. Das ist {gut für das Gehirn} und das Gedächtnis.", "Menimcha, bolalar maktabda baribir qo'lda yozishni o'rganishi kerak. Bu miya va xotira uchun foydali."]], "k": [["die Rechtschreibung / Orthographie", "imlo"], ["die Handschrift", "qo'lyozma"], ["die Tastatur", "klaviatura"], ["der Stift / Kugelschreiber", "ruchka"], ["korrigieren", "tuzatmoq"], ["der Niedergang", "tanazzul"], ["ersetzen / verdrängen", "o'rnini egallamoq / siqib chiqarmoq"]]},
 {"g": "b", "t": "Europäische Union", "u": "Yevropa Ittifoqi — tarafdor va qarshi", "img": "m/eu.jpg", "ot": "Die Europäische Union – Pro und Contra", "ou": "Yevropa Ittifoqi 28 a'zo davlatdan iborat. 2004-yilgi katta sharqiy kengayishdan keyin 2007-yil yanvarda Ruminiya va Bolgariya qo'shildi. Xorvatiya 2013-yil 1-iyulda 28-a'zo bo'ldi. Yana boshqa mamlakatlar ham tez orada qabul qilinishi mumkin: Albaniya va Bosniya-Gersegovina nomzodlar ro'yxatida.\nDastlab gap davlatlar uchun faqat iqtisodiy foyda haqida edi. Birinchi a'zolar iqtisodi o'sdi va shuning uchun tobora ko'proq davlatlar hamjamiyatga qo'shilmoqchi bo'ldi. Bugun YeI vazifalariga tashqi va ijtimoiy siyosat, madaniyat, ekologiya va ta'lim siyosatida hamkorlik hamda umumiy valyuta siyosati ham kiradi.\nLekin barcha mamlakatlar uchun yagona qonun chiqarish va uni amalga oshirish oson emas, chunki manfaatlar juda farq qiladi. Masalan, umumiy valyuta yevroni joriy qilish muammo, chunki Buyuk Britaniya va Shvetsiya yevrodan voz kechadi.\nDavlat YeIga kirsa, ko'p afzallik oladi: siyosiy jihatdan yaqinroq hamkorlik qilish mumkin, kambag'alroq mamlakatlar moliyaviy qo'llab-quvvatlanadi. Mamlakatlar tovarlarini boshqa davlatlarga bojsiz olib borib sotishi mumkin, bu foyda keltiradi. Kambag'alroq davlatlarning ko'p fuqarolari YeIga kirish mamlakatiga ko'proq farovonlik va yaxshiroq sharoit olib keladi, deb umid qiladi. Eng muhimi, alohida YeI mamlakatlari dunyodagi mavqeini mustahkamlaydi.\nLekin YeI a'zolari uchun kamchiliklar va Yevropa Ittifoqining salbiy tomonlari ham bor. Ko'p dehqonlar, chakana savdogarlar va kichik firmalar kuchaygan raqobat tufayli mavjudligidan xavotirda. YeI davlatlari va kambag'al mamlakatlar orasidagi farq kuchayadi, qochqinlar \"boy Yevropa\"dan tobora ko'proq to'sib qo'yiladi.", "p": [["Inhalt", "Im Text geht es um die {Vor- und Nachteile der Europäischen Union} für ihre Mitgliedsländer.", "Matnda Yevropa Ittifoqining a'zo mamlakatlar uchun afzallik va kamchiliklari haqida gap boradi."], ["Vorteile", "Die Länder können {ohne Zoll handeln}, und {ärmere Länder bekommen finanzielle Hilfe}.", "Mamlakatlar bojsiz savdo qila oladi va kambag'alroq mamlakatlar moliyaviy yordam oladi."], ["Nachteile", "Kleine Firmen und Bauern haben {mehr Konkurrenz}, und {gemeinsame Gesetze sind schwierig}.", "Kichik firmalar va dehqonlarga raqobat kuchayadi, umumiy qonunlar esa qiyin."], ["Erfahrung", "Ich möchte in Deutschland als Arzt arbeiten, und dort {arbeiten viele Ärzte aus anderen EU-Ländern}. Das zeigt, wie {offen} die EU ist.", "Men Germaniyada shifokor bo'lib ishlamoqchiman va u yerda boshqa YeI mamlakatlaridan ko'p shifokorlar ishlaydi. Bu YeI qanchalik ochiq ekanini ko'rsatadi.",["Ich möchte in Deutschland als Englischlehrerin arbeiten, und dort {arbeiten viele Menschen aus anderen EU-Ländern}.", "Men Germaniyada ingliz tili o'qituvchisi bo'lib ishlamoqchiman va u yerda boshqa YeI mamlakatlaridan ko'p odamlar ishlaydi."]], ["Meinung", "Meiner Meinung nach hat die EU {mehr Vorteile als Nachteile}, weil die Länder {zusammen stärker} sind. Außerdem kann man {ohne Visum reisen und arbeiten}.", "Menimcha, YeIning afzalliklari kamchiliklaridan ko'p, chunki mamlakatlar birgalikda kuchliroq. Bundan tashqari, vizasiz sayohat qilish va ishlash mumkin."]], "k": [["der Mitgliedstaat", "a'zo davlat"], ["beitreten / der Beitritt", "qo'shilmoq / a'zolik"], ["die Währung", "valyuta"], ["zollfrei", "bojsiz"], ["der Wohlstand", "farovonlik"], ["die Konkurrenz", "raqobat"], ["die Zusammenarbeit", "hamkorlik"]]},
