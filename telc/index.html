const SETS = { "1":{title:"Hören Teil 1",data:T1,lists:["1","2","3"],flip:false},
               "2":{title:"Hören Teil 2",data:T2,lists:["1","2","3"],flip:true},

const AUTO_MS=1100; let _an=null;
const autoNext=(guard,fn)=>{ clearTimeout(_an); _an=setTimeout(()=>{ if(guard()) fn(); },AUTO_MS); };
const okMsg=`<p class="msg ok">To'g'ri! ✓ <span style="font-weight:500;color:var(--muted)">keyingisiga o'tilmoqda…</span></p>`;
const shuf = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toW = d => { const r=[], seen=new Set(); d.forEach(([n,ws])=>ws.forEach(x=>{ const w=x.replace(/^!/,""); if(seen.has(w+"|"+n)) return; seen.add(w+"|"+n); r.push({w,red:x[0]==="!",n}); })); return r; };
const store = (k,v) => { try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null} };

let teil="1", SET, ALL_W, ALL_NUMS, list="1", DATA, W, NUMS;
function setTeil(t){
  teil=t; SET=SETS[t]; store("ht",t);
  ALL_W=toW(SET.data); ALL_NUMS=SET.data.map(d=>d[0]);
  document.getElementById("h").textContent=SET.title;
  document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  const L=document.getElementById("lists");
  L.innerHTML=SET.lists.map(l=>`<button data-l="${l}">${l}-list</button>`).join("")+`<button data-l="0">Hammasi</button>`;
  L.querySelectorAll("button").forEach(b=>b.onclick=()=>{setList(b.dataset.l);start(mode)});
  let l=store("hl"+t)||"1"; if(l!=="0"&&!SET.lists.includes(l)) l="1";
  setList(l);
}
function setList(l){
  list=l; store("hl"+teil,l);
  DATA = l==="0" ? SET.data : SET.data.filter(d=>String(d[2])===l);
  W=toW(DATA); NUMS=DATA.map(d=>d[0]);
  document.querySelectorAll("#lists button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
}
// chalg'ituvchilar: avval shu listdan, yetmasa boshqa listlardan
const pool = (own, all, n) => { const o=shuf(own); return o.length>=n ? o.slice(0,n) : [...o, ...shuf(all.filter(x=>!own.includes(x)))].slice(0,n); };
// o'xshash raqamlar: umumiy boshlanish, umumiy raqamlar, uzunlik yaqinligi
function sim(a,b){ let p=0; while(p<a.length&&p<b.length&&a[p]===b[p]) p++;
  let c=0; const bb=[...b]; [...a].forEach(d=>{const i=bb.indexOf(d); if(i>=0){c++;bb.splice(i,1)}});
  return p*2+c-Math.abs(a.length-b.length)*1.5; }
function similarNums(ans,n){
  let cand=NUMS.filter(x=>x!==ans); if(cand.length<6) cand=ALL_NUMS.filter(x=>x!==ans);
  const top=cand.sort((x,y)=>sim(ans,y)-sim(ans,x)).slice(0,6);
  return shuf(top).slice(0,n);
}
const wordsOf = n => W.filter(x=>x.n===n);
const P = document.getElementById("panel");
let mode="a", queue=[], total=0, right=0, firstTry=0, cur=null, done=false, picked=new Set(), opts=[], lastOk=false;
const wrong = new Set();

function start(m){
  mode=m; wrong.clear(); store("hm",m);
  document.getElementById("lists").hidden=false;
  document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  if(m==="l") return renderList();
  if(m==="h") return renderStories();
  document.getElementById("lists").hidden = (m==="w");
  if(m==="w") return startWrite();
  queue = m==="a" ? shuf(NUMS) : shuf(W.map((_,i)=>i));
  total=queue.length; right=0; firstTry=0; next();
}
function next(){
  done=false; picked=new Set();
  if(!queue.length) return finish();
  cur=queue[0];
  if(mode==="a"){
    const correct=wordsOf(cur);
    const k=Math.max(5,correct.length+3);
    const own=W.filter(x=>x.n!==cur), rest=ALL_W.filter(x=>x.n!==cur);
    opts=shuf([...correct,...pool(own,rest,k)]);
  }else{
    const ans=W[cur].n;
    opts=shuf([ans,...similarNums(ans,3)]);
  }
  render();
}
function render(msg="",cls=""){
  const meta=`<div class="meta"><span>Qoldi: ${queue.length}</span><span>To'g'ri: ${right}/${total}</span></div>`;
  let q,o;
  if(mode==="a"){
    const correct=new Set(wordsOf(cur).map(x=>x.w));
    q=`<div class="q"><small>Shu raqamga tegishli hamma so'zlarni belgilang (${correct.size} ta)</small><div class="num">${cur}</div></div>`;
    o=opts.map((x,i)=>{
      let c="opt";
      if(done){ if(correct.has(x.w)) c+= picked.has(i)?" good":" miss"; else if(picked.has(i)) c+=" bad"; }
      else if(picked.has(i)) c+=" sel";
      return `<button class="${c}" data-i="${i}">${esc(x.w)}</button>`}).join("");
  }else{
    const it=W[cur];
    q=`<div class="q"><small>Bu so'z qaysi raqamga tegishli?</small><div class="qword${it.red?" r":""}">${esc(it.w)}</div></div>`;
    o=opts.map((n,i)=>{
      let c="opt n";
      if(done){ if(n===it.n) c+=" good"; else if(picked.has(i)) c+=" bad"; }
      return `<button class="${c}" data-i="${i}">${n}</button>`}).join("");
  }
  const nextB = lastOk?"":`<div class="btns"><button class="go alt" id="retry">Qayta ishlash</button><button class="go" id="go">Keyingi</button></div>`;
  const btn = done ? nextB : (mode==="a" ? `<button class="go" id="go" ${picked.size?"":"disabled"}>Tekshirish</button>` : "");
  P.innerHTML=meta+q+`<div class="opts">${o}</div><p class="msg ${cls}">${msg}</p>`+btn;
  P.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const g=document.getElementById("go"); if(g) g.onclick=()=>done?advance():check();
  const r=document.getElementById("retry"); if(r) r.onclick=()=>{wrong.add(cur);done=false;picked=new Set();opts=shuf(opts);render();};
}
function pick(i){
  if(done) return;
  if(mode==="a"){ picked.has(i)?picked.delete(i):picked.add(i); render(); }
  else{ picked.add(i); check(); }
}
function check(){
  done=true; let ok;
  if(mode==="a"){
    const correct=new Set(wordsOf(cur).map(x=>x.w));
    const sel=[...picked].map(i=>opts[i].w);
    ok = sel.length===correct.size && sel.every(w=>correct.has(w));
  } else ok = opts[[...picked][0]]===W[cur].n;
  lastOk=ok;
  const ans = mode==="a" ? "" : ` — javob: ${W[cur].n}`;
  render(ok?"To'g'ri! ✓":"Xato"+ans, ok?"ok":"no");
  if(!ok&&mode!=="a"){ try{ const it=W[cur], st=findStory(it), box=document.createElement("div"); box.className="wstory";
    box.innerHTML=`<h3>Kalit so'z${st?" · "+esc(st[1]):""}</h3><p><b class="r">${esc(it.w)}</b> → <b>${esc(it.n)}</b></p>${st?`<p>${storyHtml(st[2])}</p>`:""}`;
    const m=P.querySelector(".msg"); if(m) m.after(box); }catch(e){} }
  if(!ok&&mode==="a"){ try{ const box=document.createElement("div"); box.className="wstory"; const st=findStory({n:cur,w:""});
    box.innerHTML=`<h3>Kalit so'zlar · ${esc(cur)}</h3><p>${wordsOf(cur).map(x=>`<b class="${x.red?"r":""}">${esc(x.w)}</b>`).join(", ")}</p>${st?`<p>${storyHtml(st[2])}</p>`:""}`;
    const m=P.querySelector(".msg"); if(m) m.after(box); }catch(e){} }
  if(ok){ const c=cur, q=queue; autoNext(()=>done&&lastOk&&cur===c&&queue===q&&!document.getElementById("panel").hidden,advance); }
}
function advance(){
  const item=queue.shift();
  if(lastOk){ right++; if(!wrong.has(item)) firstTry++; }
  else { wrong.add(item); queue.push(item); }
  next();
}
function finish(){
  P.innerHTML=`<div class="q"><small>Raund tugadi</small><div class="num">${firstTry}/${total}</div><small>birinchi urinishda to'g'ri</small></div><button class="go" id="go">Qaytadan</button>`;
  wrong.clear();
  document.getElementById("go").onclick=()=>start(mode);
}
const fmt = x => x[0]==="!"?`<span class="r">${esc(x.slice(1))}</span>`:esc(x);

let WS=null;
function findStory(item){
  const S=STORIES[teil]||{};
  for(const l of Object.keys(S)){ for(const it of S[l].items){
    if(SET.flip ? it[0].split(" — ")[0]===item.w && it[0].endsWith(item.n) : it[0]===item.n) return it;
  } }
  return null;
}
function startWrite(only){
  const all=only||toW(SET.data);
  WS={items:all,queue:shuf(all.map((_,i)=>i)),total:all.length,right:0,first:0,missed:new Set(),errs:[],done:false,ok:false,val:""};
  nextWrite();
}
function nextWrite(){
  WS.done=false; WS.val="";
  if(!WS.queue.length){
    const byWord=new Map();
    WS.errs.forEach(e=>{ const k=WS.items[e.i]; if(!byWord.has(k)) byWord.set(k,[]); byWord.get(k).push(e.v); });
    const list=[...byWord.entries()];
    const errHtml = list.length
      ? `<div class="errs"><h3>Xatolar (${list.length} ta so'z)</h3>${list.map(([it,vs])=>`<div class="erow"><span class="ew${it.red?" r":""}">${esc(it.w)}</span><span class="en">${esc(it.n)}</span><span class="ev">siz: ${vs.map(esc).join(", ")}</span></div>`).join("")}</div>`
      : `<p class="msg ok">Bitta ham xato yo'q! 🎉</p>`;
    P.innerHTML=`<div class="q"><small>Raund tugadi</small><div class="num">${WS.first}/${WS.total}</div><small>birinchi urinishda to'g'ri</small></div>${errHtml}
      <div class="btns">${list.length?`<button class="go alt" id="goerr">Xatolarni qayta ishlash</button>`:""}<button class="go" id="go">Qaytadan</button></div>`;
    document.getElementById("go").onclick=()=>startWrite();
    const ge=document.getElementById("goerr"); if(ge) ge.onclick=()=>startWrite(list.map(([it])=>it));
    return;
  }
  renderWrite();
}
function renderWrite(){
  const it=WS.items[WS.queue[0]];
  let after="";
  if(WS.done){
    if(WS.ok) after=okMsg;
    else{
      const st=findStory(it);
      after=`<p class="msg no">Xato</p><div class="wans">To'g'ri javob:<b>${esc(it.n)}</b></div>${kvTag(SET.flip?it.w:it.n)}`+
        (st?`<div class="wstory"><h3>Hikoya · ${esc(st[1])}</h3><p>${storyHtml(st[2])}</p></div>`:"")+
        `<div class="btns"><button class="go alt" id="wretry">Qayta yozish</button><button class="go" id="wnext">Keyingi</button></div>`;
    }
  }
  P.innerHTML=`<div class="meta"><span>Qoldi: ${WS.queue.length}</span><span>To'g'ri: ${WS.right}/${WS.total}</span></div>
    <div class="q"><small>Bu so'zning raqamini yozing</small><div class="qword${it.red?" r":""}">${esc(it.w)}</div>${SET.flip?kvTag(it.w):""}</div>
    <input id="win" class="winput${WS.done?(WS.ok?" ok":" no"):""}" inputmode="numeric" autocomplete="off" placeholder="raqam" value="${esc(WS.val)}" ${WS.done?"readonly":""}>
    ${WS.done?"":`<button class="go" id="wcheck">Tekshirish</button>`}${after}`;
  const inp=document.getElementById("win");
  if(!WS.done){ inp.focus(); inp.oninput=()=>{WS.val=inp.value}; inp.onkeydown=e=>{if(e.key==="Enter")checkWrite()}; document.getElementById("wcheck").onclick=checkWrite; }
  const n=document.getElementById("wnext"); if(n){ n.onclick=advWrite; n.focus(); }
  const r=document.getElementById("wretry"); if(r) r.onclick=()=>{WS.done=false;WS.val="";renderWrite()};
}
function checkWrite(){ const _w=WS;
  const it=WS.items[WS.queue[0]];
  const v=(WS.val||"").replace(/\D/g,"");
  if(!v) return;
  WS.done=true; WS.ok = v===it.n;
  if(!WS.ok){ WS.missed.add(WS.queue[0]); WS.errs.push({i:WS.queue[0],v}); }
  renderWrite();
  if(WS.ok){ const id=WS.queue[0]; autoNext(()=>WS===_w&&WS.done&&WS.ok&&WS.queue[0]===id&&!document.getElementById("panel").hidden,advWrite); }
}
function advWrite(){
  const id=WS.queue.shift();
  if(WS.ok){ WS.right++; if(!WS.missed.has(id)) WS.first++; }
  else WS.queue.push(id);
  nextWrite();
}

const KV_NORM=s=>String(s).replace(/^!/,"").split(" — ")[0].toLowerCase().replace(/[^a-zäöüß]/g,"").replace("interwiew","interview");
function kvList(key){
  const sec="H"+teil, B=BOOK[sec]; if(!B) return [];
  if(teil==="2"){ const k=KV_NORM(key); return B.filter(x=>{const w=KV_NORM(x.w); return w===k || (k.length>4 && (w.startsWith(k)||k.startsWith(w)) && Math.abs(w.length-k.length)<3);}).map(x=>x.v); }
  const n=String(key).split(" — ")[0]; return B.filter(x=>x.n===n).map(x=>x.v);
}
function kvTag(key){ const v=kvList(key); return v.length?`<div class="kv">Kitob: ${v.join(", ")}-variant</div>`:""; }

const BKSEC=[["L1","Lesen 1"],["L2","Lesen 2"],["L3","Lesen 3"],["H1","Hören 1"],["H2","Hören 2"],["H3","Hören 3"]];
let bsec=store("bks")||"L1", bcur=0, bsel=[], bdone=false, bval="";
if(!BOOK[bsec]) bsec="L1";
const bDone=sec=>new Set((store("bkd_"+sec)||"").split(",").filter(Boolean));
function bMark(sec,v){ const d=bDone(sec); d.add(v); store("bkd_"+sec,[...d].join(",")); }
function showBook(on){
  const bk=document.getElementById("bk"); bk.hidden=!on;
  document.getElementById("panel").hidden=on;
  const w=document.querySelector(".wrap"); w.classList.toggle("book",on);
  document.querySelector(".hint").hidden=on;
  {const tb=document.getElementById("tb"); if(tb) tb.classList.toggle("tbk",on);} if(on) document.getElementById("h").textContent="Kitob"; document.querySelector(".sub").hidden=on;
  if(on){ ["modes","lists","lmodes","llists"].forEach(id=>{const e=document.getElementById(id); if(e) e.hidden=true}); fitBook(); }
}
function fitBook(){
  const bk=document.getElementById("bk"); if(bk.hidden) return;
  const top=bk.getBoundingClientRect().top+window.scrollY;
  bk.style.height=Math.max(420,window.innerHeight-top-8)+"px";
}
window.addEventListener("resize",fitBook);
function renderBkSec(){
  document.getElementById("bksec").innerHTML=BKSEC.map(([k,t])=>`<button data-bs="${k}" class="${k===bsec?"on":""}">${t}</button>`).join("");
  document.querySelectorAll("[data-bs]").forEach(b=>b.onclick=()=>{ bsec=b.dataset.bs; store("bks",bsec); openBkVar(+(store("bkv_"+bsec)||0)); renderBkSec(); });
}
function renderBkVars(){
  const d=bDone(bsec), pre=bsec==="L1"?"1.":"";
  const el=document.getElementById("bkvars");
  el.innerHTML=BOOK[bsec].map((x,i)=>`<button data-bv="${i}" class="${bcur===i?"on":""} ${d.has(x.v)?"done":""}">${pre}${esc(x.v)}</button>`).join("");
  el.querySelectorAll("[data-bv]").forEach(b=>b.onclick=()=>openBkVar(+b.dataset.bv));
  const on=el.querySelector(".on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
}
function openBkVar(i){
  const list=BOOK[bsec]; bcur=Math.min(Math.max(0,i),list.length-1); store("bkv_"+bsec,String(bcur));
  bsel=Array((list[bcur].a||"").length||5).fill(null); bdone=false; bval="";
  const x=list[bcur];
  const pg=document.getElementById("bkpages"); pg.classList.toggle("fit",bsec==="L2"||bsec==="L3");
  pg.innerHTML=x.p.map(p=>`<a class="${x.p.length===1?"solo":""}" href="${p}" target="_blank" rel="noopener"><img loading="lazy" decoding="async" src="${p}" alt="Variant ${esc(x.v)}"></a>`).join("");
  pg.scrollTo(0,0);
  renderBkVars(); renderBkAns();
}
function storyFor(sec,x){
  const T=sec[1], S=STORIES[T]||{};
  for(const l of Object.keys(S)) for(const it of S[l].items){
    if(T==="2" ? it[0].split(" — ")[1]===x.n && it[0].split(" — ")[0].toLowerCase().startsWith(x.w.toLowerCase().slice(0,5)) : it[0]===x.n) return it;
  }
  return null;
}
function renderBkAns(){
  const x=BOOK[bsec][bcur], A=document.getElementById("bkans");
  const head=`<div class="meta"><span>${bsec==="L1"?"Teil 1."+esc(x.v):bsec==="L2"?"Teil 2 · "+esc(x.v):BKSEC.find(s=>s[0]===bsec)[1]+" · "+esc(x.v)}</span><span>${bcur+1}/${BOOK[bsec].length}</span></div>`;
  const nextB=`<button class="go" id="bknext">Keyingi variant</button>`;
  if(bsec==="L1"||bsec==="L2"||bsec==="L3"){
    const two=bsec==="L2", three=bsec==="L3", LET=two?"abc":three?"abcdefghijklx":"abcdefghij";
    const rows=[...x.a].map((_,r)=>{
      const ans=x.a[r];
      const btns=LET.split("").map(L=>{let c=""; if(bdone){ if(L===ans) c=bsel[r]===L?"good":"miss"; else if(bsel[r]===L) c="bad"; } else if(bsel[r]===L) c="sel"; return `<button class="${c}" data-r="${r}" data-k="${L}">${L}</button>`}).join("");
      const key=bdone&&bsel[r]!==ans?(three?`<div class="l1key">To'g'ri: <b>${ans.toUpperCase()}</b></div>`:two?`<div class="l1key">To'g'ri: <b>${ans.toUpperCase()}</b>${x.k[r]?" — kalit: <b>"+esc(x.k[r])+"</b>":""}</div>`:`<div class="l1key">${esc(x.k[r][0])} → <b>${ans.toUpperCase()}) ${esc(x.k[r][1])}</b></div>`):"";
      return `<div class="l1row"><span class="l1n">${two?r+6:three?r+11:r+1}</span><div class="l1letters${two?" abc":three?" l13":""}">${btns}</div>${key}</div>`}).join("");
    let foot;
    if(!bdone) foot=`<button class="go" id="bkcheck" ${bsel.some(v=>!v)?"disabled":""}>Tekshirish</button>`;
    else { const right=x.a.split("").filter((L,r)=>bsel[r]===L).length;
      const N=x.a.length; foot=`<p class="msg ${right===N?"ok":"no"}">${right}/${N} to'g'ri</p>${three&&x.w?`<div class="kv">${esc(x.w)}</div>`:""}<div class="btns">${right<N?`<button class="go alt" id="bkretry">Qayta</button>`:""}${nextB}</div>`; }
    A.innerHTML=head+(x.note?`<div class="bknote">${esc(x.note)}</div>`:"")+rows+foot;
    A.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ if(bdone) return; bsel[+b.dataset.r]=b.dataset.k; renderBkAns(); });
    const c=document.getElementById("bkcheck"); if(c) c.onclick=()=>{ bdone=true; if(x.a.split("").every((L,r)=>bsel[r]===L)){ bMark(bsec,x.v); renderBkVars(); } renderBkAns(); };
  } else {
    let after="";
    if(bdone){
      const ok=bval===x.n;
      if(ok) after=`<p class="msg ok">To'g'ri! (${esc(x.w)})</p>${nextB}`;
      else { const st=storyFor(bsec,x);
        after=`<p class="msg no">Xato</p><div class="wans">To'g'ri javob:<b>${esc(x.n)}</b></div><div class="l1key">Kalit so'z: <b>${esc(x.w)}</b></div>`+
        (st?`<div class="wstory"><h3>Hikoya · ${esc(st[1])}</h3><p>${storyHtml(st[2])}</p></div>`:"")+
        `<div class="btns"><button class="go alt" id="bkretry">Qayta</button>${nextB}</div>`; }
    }
    A.innerHTML=head+`<div class="q"><small>Kalit so'zni toping va raqamini yozing</small></div>
      <input id="bkin" class="winput${bdone?(bval===x.n?" ok":" no"):""}" inputmode="numeric" autocomplete="off" placeholder="raqam" value="${esc(bval)}" ${bdone?"readonly":""}>
      ${bdone?"":`<button class="go" id="bkcheck">Tekshirish</button>`}${after}`;
    const inp=document.getElementById("bkin");
    const chk=()=>{ const v=(inp.value||"").replace(/\D/g,""); if(!v) return; bval=v; bdone=true; if(v===x.n){ bMark(bsec,x.v); renderBkVars(); } renderBkAns(); };
    if(!bdone){ inp.oninput=()=>{bval=inp.value}; inp.onkeydown=e=>{if(e.key==="Enter")chk()}; document.getElementById("bkcheck").onclick=chk; }
  }
  const rt=document.getElementById("bkretry"); if(rt) rt.onclick=()=>{ bdone=false; bsel=Array((BOOK[bsec][bcur].a||"").length||5).fill(null); bval=""; renderBkAns(); };
  const nx=document.getElementById("bknext"); if(nx) nx.onclick=()=>openBkVar((bcur+1)%BOOK[bsec].length);
}
function openL1(){
  store("ht","K"); showBook(true);
  document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==="K"));
  renderBkSec(); openBkVar(+(store("bkv_"+bsec)||0)); fitBook();
}

const MUND=[
 {t:"Rauchen",u:"Chekish",img:"m/rauchen.jpg",ot:"Wie entwickelt sich das Rauchen in Deutschland?",od:"Rauchen ist etwas, was Erwachsene und Filmstars tun – und Kinder nicht dürfen. Kein Wunder, dass das Rauchen eine geradezu magische Anziehung auf Jugendliche ausübt! Nach dem Motto: Seht her, jetzt bin ich auch erwachsen und kann tun und lassen, was ich will. Raucher in der Werbung wirken schick, cool und lässig, Raucher in der Wirklichkeit eher schwach, nervös und kränklich. Der ganze Zauber entpuppt sich als Illusion. Reingefallen? Du auch?\nWie entwickelt sich das Rauchen in Deutschland? Es gibt insgesamt zwar immer weniger Raucher (ca. 21 Millionen), aber die Zahl der gerauchten Zigaretten nimmt weiterhin zu! Jugendliche fangen immer früher mit dem Rauchen an. Die Zahl der rauchenden Mädchen und Frauen ist gestiegen.\nWas ist schuld am Ausprobieren der ersten Zigarette? Die rauchenden Freunde üben Druck aus (Mutprobe). Man versucht, durch das Rauchen das geringe Ansehen innerhalb einer Gruppe auszugleichen oder anzuheben. Rauchen Eltern und Geschwister seit Langem, hält man es für selbstverständlich und macht es nach. Man will rauchenden Prominenten aus den Medien nacheifern, da sie einem als Vorbild dienen. Man lässt sich durch die geschickte Werbung verführen. Gerade in Filmen kommen die rauchenden Hauptfiguren cool rüber, und man will es ihnen nachtun. Man will zeigen, dass man erwachsen ist und tun und lassen kann, was man will. Wenn die Eltern es verbieten, raucht man aus Trotz und Protest erst recht. Man möchte durch das Rauchen persönliche Unsicherheit überspielen. Man ist einfach neugierig, wie es schmeckt.",ou:"Chekish — kattalar va kino yulduzlari qiladigan, bolalarga esa mumkin bo'lmagan narsa. Shuning uchun chekish yoshlarni deyarli sehrli tarzda o'ziga tortishi ajablanarli emas! Go'yo: \"Qaranglar, men ham endi kattaman va xohlaganimni qila olaman.\" Reklamadagi chekuvchilar zamonaviy, \"cool\" va bemalol ko'rinadi, hayotda esa chekuvchilar ko'proq zaif, asabiy va kasalmand bo'ladi. Butun \"sehr\" aldov bo'lib chiqadi. Aldandingmi? Sen ham-mi?\nGermaniyada chekish qanday rivojlanmoqda? Umuman olganda chekuvchilar soni kamayib bormoqda (taxminan 21 million), lekin chekilayotgan sigaretalar soni hamon oshmoqda! Yoshlar chekishni tobora erta boshlamoqda. Chekuvchi qizlar va ayollar soni ko'paygan.\nBirinchi sigaretani tatib ko'rishga nima sabab bo'ladi? Chekadigan do'stlar bosim o'tkazadi (jasorat sinovi). Chekish orqali guruhdagi past obro'sini tenglashtirishga yoki ko'tarishga harakat qilinadi. Ota-ona va aka-uka/opa-singillar uzoq vaqtdan beri cheksa, buni odatiy hol deb bilib, ularga taqlid qilinadi. OAVdagi chekadigan mashhurlarga o'xshashni xohlashadi, chunki ular o'rnak bo'ladi. Mohirona reklamaga aldanib qolinadi. Ayniqsa filmlarda chekadigan bosh qahramonlar \"cool\" ko'rinadi va ularga taqlid qilishni istashadi. Katta bo'lib qolganini va xohlaganini qila olishini ko'rsatmoqchi bo'lishadi. Ota-ona taqiqlasa, o'jarlik va norozilik tufayli battar chekishadi. Chekish orqali shaxsiy ishonchsizlikni yashirmoqchi bo'lishadi. Shunchaki ta'mi qandayligiga qiziqishadi.",p:[
  ["Inhalt","Der Text untersucht, warum Jugendliche mit dem Rauchen beginnen. Oft spielen {Gruppenzwang} oder {Idole aus den Medien} eine Rolle. Dabei werden die {gesundheitlichen Risiken} und die {Suchtgefahr} völlig {unterschätzt}.","Matnda yoshlar nima uchun chekishni boshlashi o'rganiladi. Ko'pincha guruh bosimi yoki ommaviy axborot vositalaridagi butlar sabab bo'ladi. Bunda sog'liqqa xavf va qaramlik xavfi mutlaqo yetarlicha baholanmaydi."],
  ["Erfahrung","In meinem Freundeskreis raucht {zum Glück niemand}. Wir {treiben lieber Sport}, weil wir gesund bleiben wollen. Ich finde es schade, wenn junge Leute ihr Geld {für Zigaretten ausgeben}, anstatt es {für Reisen zu sparen}. Deshalb fühlen wir uns {fit} und haben {mehr Geld für Hobbys}.","Baxtimizga, do'stlarim orasida hech kim chekmaydi. Biz sog'lom bo'lishni xohlaganimiz uchun sport bilan shug'ullanishni afzal ko'ramiz. Yoshlar pulini sayohat uchun yig'ish o'rniga sigaretaga sarflashi menga achinarli tuyuladi. Shuning uchun o'zimizni baquvvat his qilamiz va sevimli mashg'ulotlarga ko'proq pulimiz qoladi."],
  ["Meinung","Meiner Meinung nach sollte der Staat {Zigaretten teurer machen} und mehr {Aufklärung in Schulen} anbieten. So können junge Leute {gar nicht erst anfangen}.","Menimcha, davlat sigaretalarni qimmatlashtirishi va maktablarda ko'proq tushuntirish ishlarini olib borishi kerak. Shunda yoshlar umuman boshlamaydi."]],

 {"t": "Gewaltspiele", "u": "Zo'ravonlik o'yinlari", "img": "m/gewalt.jpg", "ot": "Verbot von Gewaltspielen – Pro und Kontra", "od": "Nachdem sich in Deutschland mehrere Male Amokläufe ereigneten, bei denen die Täter Jugendliche waren, die teilweise noch zur Schule gingen, wurde von Lehrern und Politikern das Verbot gewaltverherrlichender Computerspiele gefordert. Doch abgesehen davon, dass ein solches Verbot kaum umsetzbar ist, ist unklar, ob es überhaupt Sinn ergibt und Gewalttaten verringern oder gar vermeiden würde.\nEinige Politiker meinen, dass man die globale und höchst problematische Diskussion um Gewaltausbrüche bei der jungen Generation nicht auf das bloße Verbot von Computerspielen verengen sollte. Vielmehr sollte das Gewaltphänomen breiter analysiert werden. Denn es sind komplexe Prozesse, die schließlich zu einem schrecklichen Ereignis führen können und nicht allein auf das Spielen solcher Killerspiele zurückzuführen sind. Vielmehr spielt da das Umfeld des Kindes eine entscheidende Rolle, vor allem seine Eltern und Lehrer. Sie sollen für den Heranwachsenden richtige Vorbilder sein. Wenn sich das Kind einsam fühlt und zu den fraglichen Computerspielen greift, wäre es verfehlt, lediglich die Spiele für den möglichen Gewaltausbruch verantwortlich zu machen. Folglich würde ein Verbot am eigentlichen Ziel vorbeilaufen.\nAuf der anderen Seite bekommen Kinder in solchen Spielen virtuelle Vorbilder zu sehen. Brutale Computerspiele und Videofilme gaukeln Jugendlichen den schnellen Sieg des Stärkeren vor, und Auswege für den Verlierer bieten sie nicht. Wer andere Menschen mordet, der ist stark und wird als Gewinner geehrt. Diese logischen Denkweisen werden vom heranwachsenden Gehirn aufgenommen und fälschlicherweise, wenn auch unter Einfluss anderer Faktoren, in die Wirklichkeit projiziert. Genau deshalb soll das Verbot ausgesprochen werden, und zwar sowohl ein Herstellungs- als auch ein Verbreitungsverbot. Das sei nach Meinung der Verbotsbefürworter notwendig, damit Jugendliche nicht zum Töten anderer Menschen motiviert werden, egal ob real oder virtuell.\nWürden sie im Falle einer Vernachlässigung durch Familie oder Freunde zu Freizeitaktivitäten greifen, die keine Gewalt beinhalten, so würden sie auch keine gewaltbereiten, pseudo-starken Figuren vor Augen haben und viel weniger Lust verspüren, denen irgendwann ähnlich zu sein.", "ou": "Germaniyada bir necha marta ommaviy otishmalar sodir bo'lib, ularni qilganlar yoshlar — ba'zilari hali maktabda o'qiydiganlar bo'lganidan keyin, o'qituvchilar va siyosatchilar zo'ravonlikni ulug'laydigan kompyuter o'yinlarini taqiqlashni talab qilishdi. Biroq bunday taqiqni amalga oshirish deyarli mumkin emasligidan tashqari, uning umuman ma'nosi bormi, zo'ravonlikni kamaytiradimi yoki oldini oladimi — bu noaniq.\nBa'zi siyosatchilarning fikricha, yosh avloddagi zo'ravonlik haqidagi keng va o'ta murakkab muhokamani faqat kompyuter o'yinlarini taqiqlash bilan cheklab qo'ymaslik kerak. Aksincha, zo'ravonlik hodisasini kengroq tahlil qilish lozim. Chunki oxir-oqibat dahshatli voqeaga olib keladigan jarayonlar murakkab bo'lib, ularni faqat bunday \"qotil o'yinlar\" o'ynash bilan izohlab bo'lmaydi. Bunda bolaning atrofidagi muhit, avvalo ota-onasi va o'qituvchilari hal qiluvchi rol o'ynaydi. Ular o'smir uchun to'g'ri o'rnak bo'lishi kerak. Agar bola o'zini yolg'iz his qilib, shunday o'yinlarga berilsa, ehtimoliy zo'ravonlik uchun faqat o'yinlarni aybdor qilish xato bo'lardi. Demak, taqiq asl maqsadga erishmaydi.\nBoshqa tomondan, bolalar bunday o'yinlarda virtual \"o'rnak\"larni ko'radi. Shafqatsiz kompyuter o'yinlari va videofilmlar yoshlarga kuchlining tez g'alabasini ko'rsatadi, mag'lub bo'lgan uchun esa chiqish yo'li bermaydi. Boshqalarni o'ldirgan kuchli hisoblanadi va g'olib sifatida ulug'lanadi. Bu fikrlash tarzi o'sib kelayotgan miya tomonidan qabul qilinadi va — boshqa omillar ta'sirida bo'lsa ham — noto'g'ri ravishda haqiqiy hayotga ko'chiriladi. Aynan shuning uchun taqiq e'lon qilinishi kerak: ham ishlab chiqarishni, ham tarqatishni taqiqlash. Taqiq tarafdorlari fikricha, bu yoshlarni boshqa odamlarni o'ldirishga — real yoki virtual bo'lishidan qat'i nazar — undamaslik uchun zarur.\nAgar ular oila yoki do'stlari tomonidan e'tiborsiz qolganda zo'ravonliksiz bo'sh vaqt mashg'ulotlariga yuzlansa, ko'z oldilarida zo'ravonlikka moyil, soxta kuchli qahramonlar bo'lmasdi va ularga o'xshashni ancha kam xohlashardi.", "p": [["Inhalt", "Es geht um {Computerspiele mit Gewalt}. Manche sagen, diese Spiele {machen Kinder aggressiv}. Andere meinen, dass {die Erziehung der Eltern} wichtiger ist als die Spiele.", "Gap zo'ravonlikka asoslangan kompyuter o'yinlari haqida. Ba'zilar bu o'yinlar bolalarni tajovuzkor qiladi, deydi. Boshqalar esa ota-onaning tarbiyasi o'yinlardan muhimroq, deb hisoblaydi."], ["Vorteile", "Ein Verbot könnte {aggressive Taten verhindern} und Kinder {vor negativem Einfluss schützen}.", "Taqiq tajovuzkor xatti-harakatlarning oldini olishi va bolalarni salbiy ta'sirdan himoya qilishi mumkin."], ["Nachteile", "Spiele sind oft {nur ein Hobby}. {Das soziale Umfeld} und {die Familie} sind viel wichtigere Gründe für Gewalt.", "O'yinlar ko'pincha shunchaki sevimli mashg'ulot. Ijtimoiy muhit va oila zo'ravonlikning ancha muhimroq sabablari."], ["Erfahrung", "In meiner Jugend {habe ich solche Spiele gespielt}, aber ich bin {nicht aggressiv geworden}. Ich denke, die Eltern müssen {kontrollieren, wie lange} die Kinder spielen. Heute spiele ich {nur noch selten}, weil ich {keine Zeit} habe.", "Yoshligimda men ham shunday o'yinlarni o'ynaganman, lekin tajovuzkor bo'lib qolmadim. Menimcha, ota-onalar bolalar qancha vaqt o'ynashini nazorat qilishi kerak. Hozir kamdan-kam o'ynayman, chunki vaqtim yo'q."], ["Meinung", "Meiner Meinung nach ist {ein komplettes Verbot nicht sinnvoll}. Besser ist {eine gute Kontrolle durch die Eltern}. Die Eltern sollten auch {zusammen mit den Kindern spielen}.", "Menimcha, to'liq taqiq mantiqsiz. Ota-onalarning yaxshi nazorati yaxshiroq. Ota-onalar bolalari bilan birga o'ynashi ham kerak."]], "k": [["durch etwas motiviert werden", "nimadandir turtki olmoq"], ["unter Kontrolle bleiben", "nazorat ostida qolmoq"], ["der Mordfall (Mordfälle)", "qotillik hodisasi"], ["die Gewalt", "zo'ravonlik"], ["die Vernachlässigung", "e'tiborsizlik, qarovsiz qoldirish"], ["gewaltig", "juda katta, kuchli"], ["zu etwas führen", "nimagadir olib kelmoq"]]},
 {"t": "Schuluniform", "u": "Maktab formasi", "img": "m/uniform.jpg", "ot": "Die Schuluniform – Pro und Kontra", "od": "Der Gruppenzwang unter den Jugendlichen ist ein Problem, das man mit allen möglichen Mitteln zu bekämpfen versucht. Wer die falschen Klamotten trägt, kann schnell zum Außenseiter werden. Ist die Schuluniform vielleicht eine Hilfe?\nSeit Jahren klagt man über die zunehmende Markenorientierung von Schülern und die damit verbundene soziale Ausgrenzung. Der dadurch entstehende soziale Druck, teure und angesagte Marken zu tragen, ist für Schülerinnen und Schüler extrem hoch und trägt nicht selten zum angespannten Arbeitsklima und zur abgeschwächten Konzentration im Unterricht bei. Wer nicht mitmachen möchte oder nicht mithalten kann, wird leicht ausgegrenzt und im negativen Licht betrachtet.\nEine einheitliche Schulkleidung würde das Zusammengehörigkeitsgefühl der Schülerinnen und Schüler untereinander stärken. Mehrere erfolgreiche Modellversuche belegen, dass – wenn Äußerlichkeiten keine so große Rolle spielen – auch die Integration von Kindern unterschiedlicher sozialer und ökonomischer Herkunft, Nationalität und Religion verbessert werden kann. Außerdem sollen die Jugendlichen lernen, sich mehr über ihre Persönlichkeit und soziale Kompetenz zu identifizieren und weniger über ihre Kleidung.\nAuf der anderen Seite sind Schuluniformen kein Allheilmittel. Sie werden vorgeschlagen oder sogar eingesetzt, um viele Probleme im jugendlichen Dasein zu entschärfen. Dabei wird jedoch gerne übersehen, dass dieser Konflikt nicht so einfach zu lösen ist. Denn Aggressionen lassen sich durch Uniformen nicht verhindern, ganz im Gegenteil: Die sollten offen besprochen und gemeinsam gelöst werden. Die Vermittlung von grundlegenden Werten wie gegenseitigem Respekt oder der Akzeptanz unterschiedlicher Geschmäcker und Ansichten kann nur im Dialog mit allen Beteiligten erfolgen. Darum halten es viele für ein völlig falsches Vorgehen, den Schulen Uniformen zu verordnen.", "ou": "Yoshlar orasidagi guruh bosimi — har qanday yo'l bilan kurashishga urinilayotgan muammo. \"Noto'g'ri\" kiyim kiygan kishi tezda chetga surilgan bo'lib qolishi mumkin. Balki maktab formasi yordam berar?\nYillar davomida o'quvchilarning brendlarga tobora ko'proq e'tibor berishi va u bilan bog'liq ijtimoiy chetlashtirishdan shikoyat qilinadi. Shu tufayli yuzaga keladigan qimmat va mashhur brendlarni kiyish bo'yicha ijtimoiy bosim o'quvchilar uchun juda kuchli va ko'pincha darsdagi tarang muhit hamda diqqatning susayishiga sabab bo'ladi. Bunga qo'shilishni istamagan yoki ulgura olmagan kishi osongina chetlashtiriladi va salbiy nazar bilan qaraladi.\nYagona maktab kiyimi o'quvchilar o'rtasidagi birdamlik tuyg'usini mustahkamlagan bo'lardi. Bir qancha muvaffaqiyatli tajribalar shuni ko'rsatadiki, tashqi ko'rinish unchalik katta rol o'ynamasa, turli ijtimoiy va iqtisodiy kelib chiqishga, millat va dinga ega bolalarning integratsiyasi ham yaxshilanishi mumkin. Bundan tashqari, yoshlar o'zlarini kiyimi orqali emas, ko'proq shaxsiyati va ijtimoiy qobiliyati orqali anglashni o'rganishlari kerak.\nBoshqa tomondan, maktab formasi har dardga davo emas. U yoshlar hayotidagi ko'p muammolarni yumshatish uchun taklif qilinadi yoki hatto joriy etiladi. Biroq bu ziddiyatni hal qilish unchalik oson emasligi ko'pincha e'tibordan chetda qoladi. Chunki formalar tajovuzning oldini ololmaydi, aksincha: uni ochiq muhokama qilib, birgalikda hal qilish kerak. O'zaro hurmat yoki turli did va qarashlarni qabul qilish kabi asosiy qadriyatlarni faqat barcha ishtirokchilar bilan muloqot orqali singdirish mumkin. Shuning uchun ko'pchilik maktablarga formani majburlashni butunlay noto'g'ri yondashuv deb hisoblaydi.", "p": [["Inhalt", "Der Text behandelt {Pro und Kontra von Schuluniformen}. Sie sollen {soziale Unterschiede verstecken}, schränken aber {die Freiheit} ein.", "Matnda maktab formasining afzallik va kamchiliklari ko'rib chiqiladi. Forma ijtimoiy farqlarni yashirishi kerak, lekin erkinlikni cheklaydi."], ["Erfahrung", "In meiner Schulzeit {gab es keine Uniformen}. {Reiche Schüler trugen teure Marken}, und das {erzeugte Neid}. Ich habe mich deshalb {oft unwohl gefühlt}.", "Mening maktab davrimda forma yo'q edi. Boy o'quvchilar qimmat brendlarni kiyardi va bu hasad uyg'otardi. Shuning uchun ko'pincha o'zimni noqulay his qilardim."], ["Vorteile", "Schüler können sich {besser auf den Unterricht konzentrieren}. Außerdem wird die {Integration} von Kindern aus verschiedenen Familien verbessert.", "O'quvchilar darsga yaxshiroq diqqat qaratishi mumkin. Bundan tashqari, turli oilalardan kelgan bolalarning integratsiyasi yaxshilanadi."], ["Nachteile", "Uniformen können {Aggressionen nicht verhindern}. Probleme sollte man lieber {im Dialog lösen}.", "Forma tajovuzning oldini ololmaydi. Muammolarni yaxshisi muloqot orqali hal qilish kerak."], ["Meinung", "Meiner Meinung nach sollte es eine {einheitliche Schuluniform} geben, weil sie {Zeit und Geld spart}. Außerdem ist die Schule für das Lernen und {nicht für eine Modenschau}. So sind {alle Schüler gleich}.", "Menimcha, yagona maktab formasi bo'lishi kerak, chunki u vaqt va pulni tejaydi. Bundan tashqari, maktab o'qish uchun, moda ko'rgazmasi uchun emas. Shunda barcha o'quvchilar teng bo'ladi."]], "k": [["einheitlich", "yagona, bir xil"], ["die Modenschau", "moda ko'rgazmasi"], ["das Zusammengehörigkeitsgefühl", "birdamlik tuyg'usi"], ["der Charakter", "xarakter, fe'l-atvor"], ["die Diskriminierung", "kamsitish"], ["verringern", "kamaytirmoq"], ["soziale Ungleichheiten", "ijtimoiy tengsizlik"]]},
 {"t": "Hochzeit", "u": "Faqat ikkovlon to'y", "img": "m/hochzeit.jpg", "ot": "Hochzeit nur zu zweit", "od": "Für Christiane und Olaf Witte ist der Traum vom glücklichsten Tag im Leben endlich Wirklichkeit geworden. Vor drei Tagen haben sich die 29-jährige Bankkauffrau und der 30-jährige Berufsschullehrer aus dem hessischen Marburg das Ja-Wort gegeben. „Verheiratet zu sein ist ein unbeschreiblich schönes Gefühl. Wir sind sehr glücklich“, erzählt Christiane Witte. Auch Olaf Witte schwelgt in Erinnerungen: „Die Hochzeitszeremonie war phantastisch. Es war genauso, wie wir uns das vorgestellt und gewünscht haben.“ Es ist eine Hochzeit ohne Gäste. Nur ein Standesbeamter und ein Fotograf begleiteten das Brautpaar an diesem besonderen Tag. Geheiratet wurde weit weg von zu Hause, im 400 Kilometer entfernten Sankt Peter-Ording an der Nordseeküste. Familie und Freunde waren nicht eingeladen. „Unsere Eltern denken, wir würden in Norddeutschland Urlaub machen. Wir hoffen, dass sie nicht allzu sehr enttäuscht sind und unsere Entscheidung akzeptieren“, gesteht Olaf Witte. Was die Hochzeitsfeierlichkeiten (und die Flitterwochen) gekostet haben? Etwa 1.800 Euro haben die beiden für alles eingeplant. Mit ihrem Wunsch, bescheiden zu heiraten, sind Christiane und Olaf Witte nicht allein.\nWährend für die Deutschen in vielen Bereichen das Beste gerade gut genug ist, zeigen sie sich beim Thema Hochzeit von ihrer sparsamen Seite. Viele Paare wünschen sich statt Feierlichkeiten im großen Stil eine Eheschließung im kleinen Kreis ohne großen finanziellen Aufwand. 38 Prozent würden höchstens 5.000 Euro für den schönsten Tag ihres Lebens ausgeben. Neun Prozent der Deutschen ist die eigene Hochzeit sogar nur bis zu 1.000 Euro wert. Das sind Ergebnisse einer aktuellen Umfrage der CreditPlus Bank AG.\nIndessen genießt Familie Witte vor Ort ihre Hochzeitsreise. Geplant sind Tagesausflüge in die nähere Umgebung, romantische Spaziergänge am Strand und Wattwanderungen. Zwei Wochen pures Glück und Entspannung – aber ob sich Familie und Freunde wirklich mit den beiden freuen können, wenn sie von ihrer Hochzeitsreise zurückkommen?", "ou": "Kristiane va Olaf Vitte uchun hayotdagi eng baxtli kun orzusi nihoyat ro'yobga chiqdi. Uch kun oldin Gessen yeridagi Marburg shahridan bo'lgan 29 yoshli bank xodimasi va 30 yoshli kasb-hunar maktabi o'qituvchisi bir-biriga \"ha\" deyishdi. \"Turmush qurgan bo'lish — ta'riflab bo'lmas darajada go'zal tuyg'u. Biz juda baxtlimiz\", deydi Kristiane Vitte. Olaf Vitte ham xotiralarga berilib: \"Nikoh marosimi ajoyib bo'ldi. Hammasi biz tasavvur qilgan va xohlagandek bo'ldi\", deydi. Bu mehmonlarsiz to'y edi. Bu alohida kunda kelin-kuyovni faqat FHDYo xodimi va fotograf kuzatib bordi. Nikoh uydan uzoqda — 400 kilometr naridagi Shimoliy dengiz sohilidagi Sankt Peter-Ordingda o'tkazildi. Oila va do'stlar taklif qilinmadi. \"Ota-onamiz biz Shimoliy Germaniyada dam olyapmiz, deb o'ylashadi. Ular unchalik xafa bo'lmaydi va qarorimizni qabul qiladi, deb umid qilamiz\", deb tan oladi Olaf Vitte. To'y tantanalari (va asal oyi) qancha turdi? Ikkalasi hammasiga taxminan 1800 yevro rejalashtirgan. Kamtarona turmush qurish istagida Kristiane va Olaf Vitte yolg'iz emas.\nNemislar ko'p sohalarda eng yaxshisini tanlasa ham, to'y masalasida tejamkorlik ko'rsatadi. Ko'plab juftliklar katta tantanalar o'rniga katta xarajatsiz, tor doirada nikohdan o'tishni xohlaydi. 38 foizi hayotining eng go'zal kuni uchun ko'pi bilan 5000 yevro sarflagan bo'lardi. Nemislarning 9 foizi uchun o'z to'yi hatto atigi 1000 yevrogacha arziydi. Bu CreditPlus Bank AG ning so'nggi so'rovnomasi natijalari.\nBu orada Vitte oilasi u yerda asal oyini maroqlab o'tkazmoqda. Yaqin atrofga bir kunlik sayohatlar, sohilda romantik sayrlar va dengiz tubida piyoda yurishlar rejalashtirilgan. Ikki hafta sof baxt va dam olish — lekin ular asal oyidan qaytganda oila va do'stlari ular bilan birga chin dildan quvona olarmikan?", "p": [["Inhalt", "Im Text geht es um ein Paar, das {ohne Gäste geheiratet} hat, weil es {Geld sparen} wollte.", "Matnda pulni tejash uchun mehmonlarsiz turmush qurgan juftlik haqida gap boradi."], ["Vorteile", "Eine kleine Hochzeit ist {billig} und man hat {weniger Stress}.", "Kichik to'y arzon va stress kamroq bo'ladi."], ["Nachteile", "Die Familie kann {enttäuscht sein}, weil sie {nicht dabei war}.", "Oila xafa bo'lishi mumkin, chunki ular to'yda qatnashmagan."], ["Erfahrung", "In Usbekistan feiern wir Hochzeiten mit {sehr vielen Gästen}, oft mit {mehr als 300 Personen}. Deshalb {leihen sich viele Familien Geld}, und das ist {ein großes Problem}.", "O'zbekistonda biz to'ylarni juda ko'p mehmon bilan, ko'pincha 300 kishidan ortiq qilib nishonlaymiz. Shuning uchun ko'p oilalar qarz oladi va bu katta muammo."], ["Meinung", "Meiner Meinung nach sollte man das Geld lieber {für die gemeinsame Zukunft} ausgeben. Zum Beispiel kann ein junges Paar damit {eine Wohnung kaufen}.", "Menimcha, pulni yaxshisi birgalikdagi kelajak uchun sarflash kerak. Masalan, yosh juftlik shu pulga uy sotib olishi mumkin."]], "k": [["das Ja-Wort geben", "\"ha\" demoq (nikohdan o'tmoq)"], ["der Standesbeamte", "FHDYo xodimi"], ["enttäuscht sein", "xafa (hafsalasi pir) bo'lmoq"], ["bescheiden", "kamtarona"], ["sparsam", "tejamkor"], ["die Flitterwochen / die Hochzeitsreise", "asal oyi"], ["im kleinen Kreis", "tor doirada"]]},
 {"t": "Nahrungsergänzungsmittel", "u": "Biologik faol qo'shimchalar", "img": "m/nem.jpg", "ot": "Wie sinnvoll sind Nahrungsergänzungsmittel?", "od": "Das Angebot an Nahrungsergänzungsmitteln in Form von Pulver, Kapseln, Tabletten oder Tropfen nimmt ständig zu. Nahrungsergänzungsmittel enthalten hoch dosierte Nährstoffe wie Mineralstoffe, Vitamine oder Spurenelemente und sollen die Gesundheit in besonderem Maße fördern. Nahrungsergänzungen sind keine Arzneimittel und haben daher auch keine heilende Wirkung, aber sie sollen die Leistungsfähigkeit steigern und unsere Abwehrkräfte stärken. Angesichts des steigenden Angebots stellt sich die Frage: Brauchen wir Nahrungsergänzungsmittel?\nViele Experten weisen darauf hin, dass eine frische, ausgewogene Ernährung vollkommen ausreicht, um den Körper mit den nötigen Nährstoffen zu versorgen. Dagegen könnte man einwenden, dass in den Industrieländern zwar das richtige Angebot an Nahrungsmitteln vorhanden ist, viele Menschen sich aber nicht die Zeit nehmen, um gut durchdachte Mahlzeiten zusammenzustellen. Der Zeitmangel hindert sie nicht nur daran, Nahrungsmittel mit Bedacht auszuwählen, sondern Stress verstärkt noch einmal den Bedarf an Nährstoffen. Zusätzlich wird argumentiert, dass unsere Lebensmittel aufgrund der industriellen Herstellung viel weniger Nährstoffe enthalten als früher und wir daher trotz eines reichen Angebotes an Nahrungsmitteln nur unzureichend mit lebenswichtigen Wirkstoffen versorgt werden.\nHier sollen nun Nahrungsergänzungsmittel eine einfache Möglichkeit darstellen, um Krankheiten vorzubeugen. Auch bei besonderen Ernährungsgewohnheiten wie dem Veganismus, das heißt dem Verzicht auf jede Art von tierischen Produkten, wird oft die Einnahme solcher Mittel empfohlen, um Mangelerscheinungen zu vermeiden.\nFür viele sind Nahrungsergänzungsmittel allerdings nichts weiter als eine Möglichkeit, mit der Gutgläubigkeit von Menschen, die sich um ihre Gesundheit sorgen, viel Geld zu machen. Es sei falsch vorzugeben, dass man mit Hilfe von Pillen ungesunde Ernährungs- und Lebensgewohnheiten ausgleichen könne.", "ou": "Kukun, kapsula, tabletka yoki tomchi ko'rinishidagi biologik faol qo'shimchalar taklifi doimiy ravishda ortib bormoqda. Qo'shimchalar tarkibida minerallar, vitaminlar yoki mikroelementlar kabi yuqori dozali ozuqa moddalari bo'lib, ular sog'liqni alohida darajada mustahkamlashi kerak. Qo'shimchalar dori emas, shuning uchun davolovchi ta'sirga ega emas, lekin ular ish qobiliyatini oshirishi va himoya kuchlarimizni mustahkamlashi kerak. Taklif ortib borayotgani sababli savol tug'iladi: bizga qo'shimchalar kerakmi?\nKo'plab mutaxassislar yangi, muvozanatli ovqatlanish organizmni zarur ozuqa moddalari bilan ta'minlash uchun mutlaqo yetarli ekanini ta'kidlaydi. Bunga qarshi shuni aytish mumkin: rivojlangan mamlakatlarda oziq-ovqat taklifi to'g'ri bo'lsa-da, ko'p odamlar yaxshi o'ylangan taomlar tayyorlashga vaqt ajratmaydi. Vaqt yetishmasligi ularga oziq-ovqatni o'ylab tanlashga xalaqit berishidan tashqari, stress ozuqa moddalariga bo'lgan ehtiyojni yana oshiradi. Bundan tashqari, sanoat ishlab chiqarishi tufayli oziq-ovqatlarimizda avvalgidan ancha kam ozuqa moddalari borligi va shuning uchun boy taklifga qaramay hayotiy muhim moddalar bilan yetarlicha ta'minlanmasligimiz ta'kidlanadi.\nMana shu yerda qo'shimchalar kasalliklarning oldini olishning oson yo'li bo'lishi kerak. Veganlik, ya'ni hayvon mahsulotlarining har qanday turidan voz kechish kabi alohida ovqatlanish odatlarida ham yetishmovchilik belgilarining oldini olish uchun bunday vositalarni qabul qilish ko'pincha tavsiya etiladi.\nBiroq ko'pchilik uchun qo'shimchalar sog'lig'ini o'ylaydigan odamlarning soddaligidan foydalanib katta pul ishlash usulidan boshqa narsa emas. Tabletkalar yordamida nosog'lom ovqatlanish va turmush tarzi odatlarini qoplash mumkin, deb ko'rsatish noto'g'ri, deyishadi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob wir {Vitamine und Mineralstoffe in Tabletten} wirklich brauchen.", "Matnda bizga tabletkadagi vitamin va minerallar haqiqatan kerakmi, degan savol ko'riladi."], ["Vorteile", "Sie können helfen, wenn man {wenig Zeit hat} oder {vegan lebt}.", "Ular vaqti kam yoki vegan bo'lgan odamlarga yordam berishi mumkin."], ["Nachteile", "Sie sind oft {teuer} und können eine {gesunde Ernährung nicht ersetzen}.", "Ular ko'pincha qimmat va sog'lom ovqatlanishning o'rnini bosa olmaydi."], ["Erfahrung", "Als Arzt sehe ich oft Patienten, die {viele Tabletten kaufen}, aber {schlecht essen}. Viele denken, Tabletten sind {gesünder als Obst und Gemüse}.", "Shifokor sifatida ko'p tabletka sotib oladigan, lekin yomon ovqatlanadigan bemorlarni tez-tez ko'raman. Ko'pchilik tabletkalarni meva va sabzavotdan foydaliroq deb o'ylaydi.",["Viele Bekannte von mir {kaufen viele Tabletten}, aber sie {essen schlecht}.", "Ko'p tanishlarim ko'p tabletka sotib oladi, lekin yomon ovqatlanadi."]], ["Meinung", "Meiner Meinung nach sollte man zuerst {gesund essen} und Tabletten nur {nach Rücksprache mit dem Arzt} nehmen. Obst und Gemüse sind {billiger und besser}.", "Menimcha, avvalo sog'lom ovqatlanish kerak, tabletkalarni esa faqat shifokor bilan maslahatlashib ichish kerak. Meva va sabzavot arzonroq va foydaliroq."]], "k": [["das Nahrungsergänzungsmittel", "biologik faol qo'shimcha"], ["ausgewogene Ernährung", "muvozanatli ovqatlanish"], ["die Abwehrkräfte stärken", "immunitetni mustahkamlamoq"], ["Krankheiten vorbeugen", "kasalliklarning oldini olmoq"], ["der Mangel / Mangelerscheinungen", "yetishmovchilik / yetishmovchilik belgilari"], ["ersetzen", "o'rnini bosmoq"], ["die Rücksprache", "maslahatlashuv"]]},
 {"t": "Antibiotika", "u": "Antibiotiklar", "img": "m/antibiotika.jpg", "ot": "Antibiotika – gibt es Alternativen?", "ou": "Antibiotiklar — kasallik qo'zg'atuvchi bakteriyalarga qarshi ishlatiladigan dorilar. Ilgari Germaniyada ham odamlar tomoq yoki o'pka yallig'lanishidan o'lgan. Bugun antibiotiklar tufayli bu deyarli uchramaydi. Lekin so'nggi yillarda shifokor va bemorlar dori endi ta'sir qilmayotganini tobora ko'p sezmoqda.\nBa'zi bakteriyalarni antibiotik bilan yengib bo'lmay qoldi. Ular antibiotiklarga chidamli bo'lib, avvalgidek xavfli bo'lib qoldi. Buning sabablaridan biri — antibiotiklar kerak bo'lmaganda ham, masalan, odatda bakteriya sabab bo'lmaydigan oddiy shamollashda yozib berilgan. Chorvachilikda antibiotik ishlatilishi ham oziq-ovqat orqali chidamlilikni kuchaytiradi.\nBoshqa tomondan, bemorning dorini noto'g'ri qabul qilishi ham sabab. Ayniqsa shikoyatlar kamayganda davolanishni erta to'xtatish ba'zi bakteriyalarning tirik qolishiga, yana ko'payishiga va dori-ga chidamlilik hosil qilishiga olib keladi.\nNima qilish kerak? Ko'plab bakterial shikoyatlarda avval dorivor o'simliklarni qo'llash mumkin: shalfey og'iz va tomoqdagi yallig'lanishga, tog'rayhon yo'talga, choy daraxti moyi teri infeksiyalariga yordam beradi. Tabletkani samaraliroq deb biladigan bemorlar hali ham bor — shifokorlar ularga yaxshiroq tushuntirishi kerak.\nBoshqa tarafda, ko'p bemorlar yomon tajriba tufayli umuman antibiotik ichishni istamaydi. Bu ham xavfli: hayot uchun xavfli bakteriyalar hali ham bor va ularga ko'pincha faqat antibiotik yordam beradi. Antibiotik bilan davolash zarur bo'lsa, bemorga noto'g'ri qabul qilishning oqibatlari tushuntirilishi kerak.", "p": [["Inhalt", "Im Text geht es darum, dass {viele Bakterien gegen Antibiotika resistent} geworden sind.", "Matnda ko'p bakteriyalar antibiotiklarga chidamli bo'lib qolgani haqida gap boradi."], ["Vorteile", "Antibiotika {retten Leben}, wenn eine {schwere bakterielle Infektion} vorliegt.", "Og'ir bakterial infeksiya bo'lsa, antibiotiklar hayotni saqlab qoladi."], ["Nachteile", "Wenn man sie {zu oft} oder {falsch nimmt}, wirken sie später nicht mehr.", "Ularni juda ko'p yoki noto'g'ri ichsa, keyinchalik ta'sir qilmay qo'yadi."], ["Erfahrung", "Als Arzt sehe ich oft Patienten, die Antibiotika {ohne Rezept in der Apotheke kaufen}. Oft nehmen sie die Tabletten {nur zwei oder drei Tage}.", "Shifokor sifatida antibiotiklarni dorixonadan retseptsiz sotib oladigan bemorlarni tez-tez ko'raman. Ko'pincha tabletkalarni faqat ikki-uch kun ichishadi.",["In meiner Familie haben wir früher Antibiotika {ohne Rezept in der Apotheke gekauft}.", "Oilamizda ilgari antibiotiklarni dorixonadan retseptsiz sotib olardik."]], ["Meinung", "Meiner Meinung nach sollte man Antibiotika {nur nach Rücksprache mit dem Arzt} nehmen und die {Therapie nicht zu früh abbrechen}. Sonst {wirken sie später nicht mehr}.", "Menimcha, antibiotiklarni faqat shifokor bilan maslahatlashib ichish va davolanishni erta to'xtatmaslik kerak. Aks holda keyinchalik ta'sir qilmay qo'yadi."]], "k": [["resistent sein / die Resistenz", "chidamli bo'lmoq / chidamlilik"], ["verschreiben", "(dori) yozib bermoq"], ["die Erkältung", "shamollash"], ["die Therapie abbrechen", "davolanishni to'xtatmoq"], ["die Heilpflanze", "dorivor o'simlik"], ["die Nebenwirkung", "nojo'ya ta'sir"], ["unvermeidlich / unumgänglich", "muqarrar, zarur"]]},
 {"t": "Selbst gekocht", "u": "O'zi pishirgan taom", "img": "m/selbstgekocht.jpg", "ot": "Selbst gekocht schmeckt es am besten", "ou": "O'z oshxonangda ovqat pishirish urfda: \"O'zim pishirgan ovqat mazaliroq va ichida nima borligini bilaman.\" GfK so'roviga ko'ra, nemislarning 84 foizi shunday fikrda. Bu o'zi pishirishning kelajagi borligiga yaxshi sabablardan faqat biri.\nTayyor taomlar, fast food va tashqarida ovqatlanish kundalik ovqat masalasini oson hal qilsa, nega o'zing pishirasan? Chunki shoshilinch ovqat ko'pincha ta'm va sifatni yo'qotadi. O'zi pishirishning afzalliklari esa ochiq-oydin.\nOvqatda nima borligini bilasan. Meva, sabzavot va kartoshkani supermarket, bozor yoki ishlab chiqaruvchidan olsang, konservantlar va qo'shimchalar deyarli bo'lmaydi. O'zi pishirilgan taom — keraksiz begona moddalari minimal bo'lgan tabiiy ovqat. Sog'lik va mazani o'zing pishirganda birlashtirish eng oson. Shunday qilib, \"ovqatlanish taqdiring\" butunlay o'z qo'lingda. Oziq-ovqat allergiyasi yoki boshqa ko'tara olmaslik bilan kurashayotganlar xavfli mahsulot va moddalardan o'z oshxonasida eng oson saqlana oladi. O'zi pishirish dasturxonga sifat va yangilik olib keladi. Muntazam ovqat pishiradigan odam tezda yangi va sifatli mahsulotni ajrata oladigan bo'ladi.", "p": [["Inhalt", "Im Text geht es darum, dass {selbst gekochtes Essen} oft {gesünder und leckerer} ist als Fertiggerichte.", "Matnda o'zi pishirgan ovqat ko'pincha tayyor taomlardan sog'lomroq va mazaliroq ekani haqida gap boradi."], ["Vorteile", "Man weiß genau, {was im Essen drin ist}, und man kann {Geld sparen}.", "Ovqatda nima borligini aniq bilasan va pulni tejash mumkin."], ["Nachteile", "Kochen {kostet viel Zeit}, und viele Menschen sind nach der Arbeit {zu müde}.", "Ovqat pishirish ko'p vaqt oladi va ko'p odam ishdan keyin juda charchagan bo'ladi."], ["Erfahrung", "In Usbekistan {kocht man fast jeden Tag zu Hause}, zum Beispiel {Plov} für die ganze Familie. Meine Mutter {kocht jeden Abend}, und alle {essen zusammen}.", "O'zbekistonda deyarli har kuni uyda ovqat pishiriladi, masalan, butun oila uchun palov. Onam har kechqurun ovqat pishiradi va hamma birga ovqatlanadi."], ["Meinung", "Meiner Meinung nach sollte man {möglichst oft selbst kochen}, weil es {gesund und günstig} ist. Außerdem {bringt das die Familie zusammen}.", "Menimcha, iloji boricha tez-tez o'zing pishirish kerak, chunki bu sog'lom va arzon. Bundan tashqari, bu oilani birlashtiradi."]], "k": [["das Fertiggericht", "tayyor taom"], ["die Zutat", "masalliq"], ["der Zusatzstoff / Konservierungsstoff", "qo'shimcha / konservant modda"], ["frisch", "yangi, toza"], ["die Lebensmittelallergie", "oziq-ovqat allergiyasi"], ["auf der Hand liegen", "ochiq-oydin bo'lmoq"], ["im Trend liegen", "urfda bo'lmoq"]]},
 {"t": "Arbeiten bis 75", "u": "75 yoshgacha ishlash", "img": "m/arbeit75.jpg", "ot": "Arbeiten bis 75 – eine utopische Vorstellung?", "ou": "Hozirgi pensiya tizimini uzoq muddat moliyalashtirib bo'lmaydi. Lekin \"75 yoshgacha ishlash\" yechimmi?\nPensiya yoshi haqidagi bahslarda doim aytiladiki, Germaniyada ham, Yevropada ham pensiyaga o'rtacha qonuniy yoshdan ancha oldin chiqiladi. Pensiya yoshini oshirish shart emas, unga haqiqatan rioya qilish kifoya.\nBunga qarshi aytish mumkinki, pensiya tizimi 100 yil oldin joriy qilingan va zudlik bilan moslashtirilishi kerak. O'rtacha umr ko'rish 1970-yillardan beri 70 dan 81 yoshga oshdi, pensiyada o'tadigan vaqt esa 7 yildan 23 yilga uzaydi. Bu o'zgargan sharoitni hisobga olish kerak.\nBiroq hozirning o'zida keksa xodimlarga ish topish qiyin. Ko'pi bilan 50 yoshdan ishsizlarni ishga joylash deyarli imkonsiz hisoblanadi. Bundan tashqari, hamma ham qarilikkacha ishlay olmaydi. Odamlar bugun uzoqroq sog'lom yashasa ham, 65 yoshdan keyin kasallikka moyillik keskin oshadi.\nShuning uchun ko'p mutaxassislar pensiya yoshini moslashuvchan qilishni tavsiya qiladi: odamlar qachon pensiyaga chiqishni o'zi hal qilsin, tegishli qo'shimcha yoki chegirmalar bilan. Bu odamlarni uzoqroq ishlashga ko'proq undaydi.\nSkeptiklar moslashuvchanlik yechim bo'lishiga shubha qiladi. Pensiya yoshi umr davomiyligiga moslashtirilmasa, davlat milliardlab kam daromad oladi. Ayollarning pensiya yoshi ham erkaklarnikiga tenglashtirilishi kerak — uzoqroq ishlash ayollarga martaba qilish va baribir oila qurish imkonini beradi.\nKeyinroq pensiyaga chiqish \"pensiya shoki\"ni ham kamaytirishi mumkin. Jismonan va aqlan faol odamlar bilimini yoshlarga o'tkazib, o'zini hali kerakli his qilishi mumkin.", "p": [["Inhalt", "Im Text geht es um die Frage, ob man {bis 75 arbeiten} sollte, weil das {Rentensystem zu teuer} ist.", "Matnda pensiya tizimi juda qimmat bo'lgani uchun 75 yoshgacha ishlash kerakmi, degan savol ko'riladi."], ["Vorteile", "Ältere Menschen können {ihr Wissen an junge Kollegen weitergeben} und fühlen sich {noch gebraucht}.", "Keksa odamlar bilimini yosh hamkasblarga o'tkazishi mumkin va o'zini hali kerakli his qiladi."], ["Nachteile", "Nicht jeder ist mit 70 noch {gesund genug}, besonders bei {schwerer körperlicher Arbeit}.", "Hamma ham 70 yoshda yetarlicha sog'lom emas, ayniqsa og'ir jismoniy ishda."], ["Erfahrung", "Mein Großvater ist mit 60 in Rente gegangen und {hilft jetzt bei den Enkeln}. Er sagt, er ist {glücklich und gesund}.", "Bobom 60 yoshda pensiyaga chiqqan va hozir nevaralariga qarashadi. U o'zini baxtli va sog'lom his qilishini aytadi."], ["Meinung", "Meiner Meinung nach sollte das Rentenalter {flexibel} sein, sodass jeder {selbst entscheiden} kann. Wer gesund ist und gern arbeitet, {kann länger arbeiten}.", "Menimcha, pensiya yoshi moslashuvchan bo'lishi kerak, shunda har kim o'zi hal qila oladi. Kim sog'lom va ishlashni yaxshi ko'rsa, uzoqroq ishlashi mumkin."]], "k": [["die Rente / in Rente gehen", "pensiya / pensiyaga chiqmoq"], ["das Rentenalter", "pensiya yoshi"], ["die Lebenserwartung", "o'rtacha umr ko'rish"], ["der Arbeitnehmer", "ishchi, xodim"], ["flexibel gestalten", "moslashuvchan qilmoq"], ["Wissen weitergeben", "bilim o'tkazmoq"], ["sich gebraucht fühlen", "o'zini kerakli his qilmoq"]]},
 {"t": "Praktische Lerntipps", "u": "Amaliy o'qish maslahatlari", "img": "m/lerntipps.jpg", "ot": "Praktische Lerntipps", "ou": "Tadqiqotlar shuni ko'rsatdiki, bir necha kanal orqali — o'qish va ko'rish, eshitish, gapirish, yozish (bajarish) orqali o'rganilganda natija yuqoriroq bo'ladi.\nDemak, o'rganishda sezgi a'zolari birga ishlashi kerak. Jadvalda har bir faoliyatda qancha eslab qolinishi o'rtacha ko'rsatilgan: eshitish 20%, ko'rish 30%, eshitish + ko'rish 50%, eshitish + ko'rish + gapirish 70%, eshitish + ko'rish + gapirish + bajarish 90%.\nO'quv materialini bir necha so'zga jamlashga harakat qiling. Bog'liqliklarni rasm bilan, masalan diagramma orqali ko'rsating. Ma'ruza paytida yozib boring — so'zma-so'z emas, mazmunan. \"Ortiqcha o'rganish\" — material o'zlashtirilgan bo'lsa ham, yana vaqt ajratib takrorlash degani.\nBu usul bilan eslab qolish qobiliyatini, ayniqsa uzoq muddatda, sezilarli oshirish mumkin. Lekin bu cheksiz ishlamaydi: ma'lum nuqtadan keyin ko'p vaqt sarflansa ham natija deyarli yaxshilanmaydi, ya'ni haddan oshirmang.\nTakrorlang, takrorlang, takrorlang! O'rganilganni uzoq saqlashning to'g'ri usuli — takrorlash: avval qisqa oraliqlarda, keyin tobora uzoqroq. Takrorlash mashqlari uchun aniq kunlar belgilangan takrorlash kalendari foydali.\nBundan tashqari vaqtni boshqarish, o'qish paytida to'liq sokinlik, bioritm, o'z vaqtida tanaffus kabi ko'p jihatlar bor. Asosiysi — materialni eslab qolish va kerak bo'lganda qayta tiklay olish.", "p": [["Inhalt", "Im Text geht es darum, dass man {besser lernt}, wenn man {hören, sehen, sprechen und schreiben} kombiniert.", "Matnda eshitish, ko'rish, gapirish va yozishni birlashtirsang, yaxshiroq o'rganishing haqida gap boradi."], ["Vorteile", "Wenn man {regelmäßig wiederholt}, kann man den Stoff {lange behalten}.", "Muntazam takrorlasang, materialni uzoq eslab qolasan."], ["Nachteile", "Zu viel lernen {ohne Pausen} bringt nichts, weil das Gehirn {müde wird}.", "Tanaffussiz juda ko'p o'qish foyda bermaydi, chunki miya charchaydi."], ["Erfahrung", "Ich lerne deutsche Wörter am besten {mit kleinen Geschichten} und {Karteikarten}. So {vergesse ich die Wörter nicht} so schnell.", "Men nemischa so'zlarni eng yaxshi kichik hikoyalar va kartochkalar bilan yodlayman. Shunda so'zlarni tez unutmayman."], ["Meinung", "Meiner Meinung nach sollte jeder {seine eigene Lernmethode finden} und {jeden Tag ein bisschen} lernen. {Zehn Minuten pro Tag} sind besser als {drei Stunden am Sonntag}.", "Menimcha, har kim o'z o'qish usulini topishi va har kuni ozgina o'qishi kerak. Kuniga o'n daqiqa yakshanba kuni uch soatdan yaxshiroq."]], "k": [["der Lernstoff", "o'quv materiali"], ["wiederholen", "takrorlamoq"], ["behalten", "eslab qolmoq"], ["die Sinne", "sezgi a'zolari"], ["die Pause", "tanaffus"], ["das Zeitmanagement", "vaqtni boshqarish"], ["die Lernmethode", "o'qish usuli"]]},
 {"t": "Bequemes Essen", "u": "Qulay (tayyor) ovqat", "img": "m/bequem.jpg", "ot": "Ist „bequemes Essen“ gut für uns?", "ou": "Hayotimiz, jumladan ovqatlanish ham tobora tezroq va osonroq bo'lishi kerak. Ovqat mazali, xilma-xil va oson tayyorlanadigan bo'lsin. Convenience food, ya'ni tayyor yoki yarim tayyor oziq-ovqatlar shu talablarga javob beradiganga o'xshaydi. Lekin bu ovqat biz uchun foydalimi?\nHa, deydi ko'pchilik. Bu amaliy mahsulotlar kundalik hayotda ko'p vaqtni tejaydi, sifati doim bir xil va mavsumga bog'liq emas.\nRaqiblar aynan shu vaqt tejashda jiddiy kamchilik ko'radi: ovqat tobora shoshilib va yo'l-yo'lakay yeyiladi. Tez ovqat jismoniy farovonlikka zarar yetkazadi va kundalik shoshqaloqlikda ongli dam olish imkonini ham olib qo'yadi.\nRaqiblar bir xil sifat va mavsumga bog'liq emaslik dalillarini ham qabul qilmaydi. Konservalash jarayonida ko'p qimmatli ozuqa moddalari yo'qoladi va ularni sun'iy qo'shishga to'g'ri keladi. Mavsumda mavjud narsani yeyish esa resurslarga ongli munosabatga mos. Bundan tashqari, tayyor mahsulotlar chiqindilar ko'payishiga katta hissa qo'shadi.\nTanqidchilar tayyor mahsulotlarda ko'pincha tuz, shakar va yog' ko'p bo'lib, ortiqcha vazn va qandli diabet, yurak-qon tomir kasalliklari kabi \"sivilizatsiya kasalliklari\"ga sabab bo'lishini ham aytadi.\nTarafdorlar esa sifat va qulaylik bir-biriga zid emas, deydi: tayyor mahsulotlar har xil sifatda bor — mahalliy organik mahsulotlardan tortib yuqori darajadagi restoranlar uchun mahsulotlargacha.\nRaqiblar uchun esa convenience food har holda madaniy va ijtimoiy yo'qotishdir: ongli ovqatlanish va pazandalik bilimlari yo'qoladi. Eng muhimi — birgalikda ovqat tayyorlash va yeyish oilaviy hayotda bebaho.", "p": [["Inhalt", "Im Text geht es um {Fertiggerichte}, die {schnell und bequem} sind, aber nicht immer gesund.", "Matnda tez va qulay, lekin har doim ham sog'lom bo'lmagan tayyor taomlar haqida gap boradi."], ["Vorteile", "Fertiggerichte {sparen viel Zeit} und sind {das ganze Jahr verfügbar}.", "Tayyor taomlar ko'p vaqtni tejaydi va yil bo'yi mavjud."], ["Nachteile", "Sie enthalten oft {viel Salz, Zucker und Fett} und können {dick machen}.", "Ularda ko'pincha tuz, shakar va yog' ko'p bo'ladi va semirtirishi mumkin."], ["Erfahrung", "Als Student habe ich oft {Fertignudeln} gegessen, weil ich {keine Zeit zum Kochen} hatte. Danach hatte ich oft {Bauchschmerzen}.", "Talabalik paytimda ovqat pishirishga vaqtim bo'lmagani uchun tez-tez tayyor makaron yeganman. Keyin ko'pincha qornim og'rirdi."], ["Meinung", "Meiner Meinung nach sind Fertiggerichte {nur ab und zu in Ordnung}, aber nicht {jeden Tag}. Am besten kocht man {am Wochenende für mehrere Tage}.", "Menimcha, tayyor taomlar faqat ba'zan bo'lsa mayli, lekin har kuni emas. Eng yaxshisi dam olish kunlari bir necha kunga ovqat pishirib qo'yish."]], "k": [["das Fertiggericht / Convenience Food", "tayyor taom"], ["bequem", "qulay"], ["der Nährstoff", "ozuqa moddasi"], ["das Übergewicht", "ortiqcha vazn"], ["die Zivilisationskrankheit", "sivilizatsiya kasalligi"], ["der Müll", "chiqindi"], ["nebenbei essen", "yo'l-yo'lakay yemoq"]]},
 {"t": "Glücklich ohne Geld", "u": "Pulsiz va martabasiz baxtli", "img": "m/gluecklich.jpg", "ot": "Glücklich ohne Geld und Karriere", "ou": "Pul kam yoki umuman yo'q, martaba imkoniyati deyarli yo'q, lekin mamnun: Germaniyadagi amaliyotchilar o'rtasida o'tkazilgan so'rov shunday natija berdi. Amaliyot kasbiy ta'lim doirasida kelajakdagi kasb bo'yicha amaliy tajriba berishi kerak.\nBarcha amaliyotchilarning deyarli uchdan ikki qismi juda kam yoki umuman haq olmasa ham, kasb dunyosi bilan tanishganidan mamnun.\nAyniqsa iste'mol tovarlari sanoati, sug'urta, telekommunikatsiya va internet/multimedia sohalaridagi amaliyotchilar mamnun (84 foiz). Restoran biznesi va metallga ishlov berishda esa so'ralganlarning 50 foizdan ortig'i baxtsiz.\nBundan tashqari, oliy ma'lumotli amaliyotchilar bilan boshqa ta'lim yo'nalishidagilar o'rtasida aniq farq bor: qatnashchi qanchalik malakali bo'lsa, shunchalik mamnun. Ehtimol, buning sababi oliy ta'lim bitiruvchilari ko'p nazariya o'rgangan, lekin oliygohda kasbiy amaliyotni ko'rmaganidir.\nBa'zi mutaxassislar \"Amaliyot avlodi\"ni asosan OAV o'ylab topgan narsa deb hisoblaydi. Amaliyotchi bir korxonadan boshqasiga o'tib yurishi va hech qachon doimiy ishga ega bo'lmasligi faqat bir nechta sohalarda uchraydi.\nO'tmishda siyosatchilar amaliyotchilarning mehnat shartnomalari va ish haqi to'g'risida qonun joriy qilishga bir necha bor urinishgan, lekin hozircha muvaffaqiyatsiz.", "p": [["Inhalt", "Im Text geht es um {Praktikanten}, die {wenig oder kein Geld} bekommen, aber trotzdem {zufrieden} sind.", "Matnda kam yoki umuman pul olmaydigan, lekin baribir mamnun bo'lgan amaliyotchilar haqida gap boradi."], ["Vorteile", "Ein Praktikum gibt {praktische Erfahrung} und hilft, {den richtigen Beruf zu finden}.", "Amaliyot amaliy tajriba beradi va to'g'ri kasbni topishga yordam beradi."], ["Nachteile", "Viele Praktikanten {arbeiten viel}, aber {bekommen keine feste Stelle}.", "Ko'p amaliyotchilar ko'p ishlaydi, lekin doimiy ish o'rni olmaydi."], ["Erfahrung", "Als Medizinstudent habe ich {im Krankenhaus ohne Lohn gearbeitet}, aber ich habe dort {sehr viel gelernt}. Diese Erfahrung {hilft mir heute} bei meiner Arbeit.", "Tibbiyot talabasi sifatida kasalxonada maoshsiz ishlaganman, lekin u yerda juda ko'p narsa o'rgandim. Bu tajriba hozir ishimda menga yordam beradi.",["Als Studentin habe ich {Kinder ohne Lohn unterrichtet}, aber ich habe dabei {sehr viel gelernt}.", "Talabaligimda bolalarga maoshsiz dars berganman, lekin bunda juda ko'p narsa o'rgandim."]], ["Meinung", "Meiner Meinung nach sollten Praktikanten {wenigstens ein kleines Gehalt} bekommen. So {fühlen sie sich respektiert}.", "Menimcha, amaliyotchilar hech bo'lmaganda kichik maosh olishi kerak. Shunda ular o'zlarini hurmat qilingan his qiladi."]], "k": [["der Praktikant / das Praktikum", "amaliyotchi / amaliyot"], ["zufrieden sein", "mamnun bo'lmoq"], ["die Festanstellung / feste Stelle", "doimiy ish o'rni"], ["der Lohn / das Gehalt", "ish haqi, maosh"], ["die Berufswelt", "kasb dunyosi"], ["der Hochschulabsolvent", "oliygoh bitiruvchisi"], ["Erfahrung sammeln", "tajriba to'plamoq"]]},
 {"t": "Schönheitsoperationen", "u": "Voyaga yetmaganlarga plastik jarrohlik", "img": "m/schoenheit.jpg", "ot": "Sollen Schönheitsoperationen bei Minderjährigen verboten werden?", "ou": "Siyosatchilar voyaga yetmaganlarda keraksiz operatsiyalarni taqiqlashni talab qilmoqda. Ular talabini bir qator dalillarga asoslaydi. Ular uchun voyaga yetmaganlarga plastik operatsiya — tan jarohati, shuning uchun taqiqlanishi kerak. Ularning fikricha, xavf kattalarnikidan ham kattaroq.\nBiroq ular yoshlarda ham operatsiya zarur bo'lgan istisnolar borligini ko'radi. Masalan, bola baxtsiz hodisadan keyin yuzida og'ir kuyish olgan bo'lsa, uni albatta operatsiya qilish kerak, aks holda ruhiy yuk chidab bo'lmas bo'lardi.\nTaqiq raqiblari esa ruhiy azob bilan go'zallik ideallari orasida aniq chegara qo'yish qiyinligini aytadi. Buni amalda qo'llab bo'lmaydi, shuning uchun qonuniy taqiq ma'nosiz. Aniq nima jazolanadi? Bolaning chiqib turgan quloqlarini tuzatishmi? Burundagi xolni olib tashlashmi? Ko'krakni kichraytirishmi? Bundan tashqari, taqiq ota-onalar huquqini cheklaydi.\nLekin nima muhimroq — ota-ona huquqimi yoki bolani himoya qilishmi? Ba'zi ota-onalar bolasiga chegara qo'yishga juda zaif.\nBunga qarshi aytiladiki, davlat nazorati noto'g'ri go'zallik ideallarini tuzata olmaydi. Bu yerda tushuntirish kerak: o'qituvchilar sinf bilan bunday go'zallik tasavvurlari qanchalik o'zboshimcha ekanini muhokama qilishi mumkin. Mas'uliyatli shifokor ota-onani bolasiga plastik operatsiya emas, balki o'ziga ishonchini oshirishga yordam beradigan odam kerakligiga ishontiradi. Plastik operatsiya haqidagi qarorni sud qabul qila olmaydi — u ota-ona va shifokorlarda qolishi kerak.", "p": [["Inhalt", "Im Text geht es um die Frage, ob {Schönheitsoperationen bei Jugendlichen unter 18} verboten werden sollen.", "Matnda 18 yoshgacha bo'lgan yoshlarga plastik operatsiyani taqiqlash kerakmi, degan savol ko'riladi."], ["Vorteile", "Ein Verbot {schützt Kinder} vor {unnötigen Risiken} und falschen Schönheitsidealen.", "Taqiq bolalarni keraksiz xavflardan va noto'g'ri go'zallik ideallaridan himoya qiladi."], ["Nachteile", "Manchmal ist eine Operation {wirklich notwendig}, zum Beispiel nach einem {Unfall}.", "Ba'zan operatsiya haqiqatan zarur bo'ladi, masalan, baxtsiz hodisadan keyin."], ["Erfahrung", "In Usbekistan {machen immer mehr junge Mädchen eine Nasen-OP}, weil sie {wie Stars aussehen} wollen. Später {bereuen es viele}.", "O'zbekistonda tobora ko'proq yosh qizlar yulduzlarga o'xshashni istab, burun operatsiyasini qildirmoqda. Keyinchalik ko'pchilik afsuslanadi."], ["Meinung", "Meiner Meinung nach sollte nur ein {Arzt zusammen mit den Eltern} entscheiden, und zwar nur {aus medizinischen Gründen}. Junge Menschen sollten {sich selbst akzeptieren}.", "Menimcha, faqat shifokor ota-ona bilan birga qaror qilishi kerak, faqat tibbiy sabablarga ko'ra. Yoshlar o'zlarini qanday bo'lsa, shunday qabul qilishi kerak."]], "k": [["die Schönheitsoperation", "plastik (go'zallik) operatsiyasi"], ["minderjährig", "voyaga yetmagan"], ["der Eingriff", "jarrohlik aralashuvi"], ["das Schönheitsideal", "go'zallik ideali"], ["die seelische Belastung", "ruhiy yuk"], ["selbstbewusst", "o'ziga ishongan"], ["Grenzen setzen", "chegara qo'ymoq"]]},
 {"t": "Kinderuni", "u": "Bolalar universiteti", "img": "m/kinderuni.jpg", "ot": "Die Kleinen wollen's wissen", "ou": "Ta'tilda o'qishmi? Tyubingen universitetining katta auditoriyasiga yig'ilgan 500 dan ortiq bola uchun qiziqarli davr boshlanadi.\n2002-yildan beri Tyubingen universiteti Germaniyada birinchi bo'lib bolalar uchun darslar tashkil qiladi. Bu yerda yozgi ta'tilda maktab stressi va baholarsiz o'qishadi: tinglashadi, so'rashadi va hayratlanishadi. Darslarga qatnashish ixtiyoriy. Taklif 8–12 yoshli, ayniqsa qiziquvchan bolalarga mo'ljallangan. Odatiy mavzular: Nega o'yin muhim? Nega o'lishimiz kerak? Nega biz robotlardan aqlliroqmiz?\nNemis tilli hududdagi birinchi bolalar universiteti 2001-yilda Avstriyadagi Insbruk \"Yosh universitet\"i bo'lgan. Bunga sabab: o'n yil oldin sayyohlar Ötztalda 5000 yildan ortiq yoshli odam mumiyosini topishgan va shu topilmaning 10 yilligiga bolalar uchun darslar boshlangan.\nBugun bolalar universitetlarisiz oliygoh hayotini tasavvur qilib bo'lmaydi — Germaniyada ulardan 50 dan ortiq. Lekin bu g'oyaning hamma tarafdori emas. Ayniqsa shifokor va ota-onalar tanqid qiladi. Pediatr Dr. Kleinschmidtning aytishicha, bunday tadbirlar umuman yaxshi, lekin ota-onalar sport mashg'ulotlari ham yetarli bo'lishiga e'tibor berishi kerak: ko'p bolalar kam harakat qiladi va bu sog'lig'iga zarar.\nIkki farzandli ota Mixael König ham tanqid qiladi: darslarga asosan yaxshi o'quvchilar qatnashadi, Germaniyaga esa o'qishda qiynaladigan o'quvchilarni ham qo'llab-quvvatlaydigan yangi ta'lim usullari kerak.\nTyubingenlik bola-talabalar bir fikrda: ilm qiziqarli. Ro'yxatdan o'tishlar har yili ko'paymoqda, demak, bolalar universitetlari kelajakda ham saqlanib qoladi.", "p": [["Inhalt", "Im Text geht es um {Kinderuniversitäten}, wo Kinder {in den Ferien ohne Noten} lernen.", "Matnda bolalar ta'tilda baholarsiz o'qiydigan bolalar universitetlari haqida gap boradi."], ["Vorteile", "Kinder lernen {mit Spaß} und werden {neugierig auf die Wissenschaft}.", "Bolalar qiziqib o'qiydi va ilmga qiziqishi ortadi."], ["Nachteile", "Oft kommen nur {gute Schüler}, und die Kinder {bewegen sich zu wenig}.", "Ko'pincha faqat yaxshi o'quvchilar keladi va bolalar juda kam harakat qiladi."], ["Erfahrung", "In meiner Kindheit gab es so etwas nicht, aber ich bin {in den Ferien oft in die Bibliothek} gegangen. Dort habe ich {sehr viel gelesen} und {viel gelernt}.", "Bolaligimda bunday narsa yo'q edi, lekin ta'tilda tez-tez kutubxonaga borardim. U yerda juda ko'p kitob o'qib, ko'p narsa o'rgandim."], ["Meinung", "Meiner Meinung nach ist eine Kinderuni eine gute Idee, wenn die Kinder {auch genug Sport machen}. Kinder brauchen {Zeit zum Spielen}.", "Menimcha, bolalar yetarlicha sport bilan ham shug'ullansa, bolalar universiteti yaxshi g'oya. Bolalarga o'ynash uchun vaqt kerak."]], "k": [["die Kinderuniversität", "bolalar universiteti"], ["die Ferien", "ta'til"], ["freiwillig", "ixtiyoriy"], ["neugierig", "qiziquvchan"], ["die Note", "baho"], ["lernschwach", "o'qishda qiynaladigan"], ["sich bewegen", "harakat qilmoq"]]},
 {"t": "Mehrsprachigkeit", "u": "Bolalarda ikki/ko'p tillilik", "img": "m/mehrsprachig.jpg", "ot": "Zweisprachigkeit bei Kindern", "ou": "Ikki yoki ko'p tilda tarbiyalash sabablari juda xilma-xil. Aslida odamlarning ko'pchiligi ikki tilli. Ko'pchilik ko'p tilli mamlakatlarda yashaydi, boshqalar davlat tilidan tashqari ota-onasi yoki bobosining tilini ham o'rganadi. Agar ota-ona chet tilini yaxshi bilsa va unda bajonidil gaplashsa, shu tilda tarbiyalash ham mumkin. Ko'p tilli tarbiyaning afzalliklari ko'pincha ochiq-oydin. Ota-ona bola bilan ona tilida gaplashib, unga o'z madaniyati bilan bog'lanishga va madaniy o'zligini shakllantirishga yordam beradi. Bolasini bir necha tilda tarbiyalagan kishi unga maktab, kasb va sayohat uchun ustunlik bermoqchi bo'ladi. \"Ko'p tillilik bolalarga dunyoni butunlay boshqacha ko'rish imkonini beradi\", deydi Stefani Mid. Ular boshqa madaniyatlarga ochiqroq va bag'rikengroq bo'ladi.\nBolalarni ko'p tilli tarbiyalash mantiqlimi?\nBir necha o'n yil oldin ikki tilli tarbiya bolaga og'irlik qiladi, rivojlanishini sekinlashtiradi yoki ikkala tilni ham chala o'rgatadi, deb hisoblanardi. Bugun esa ko'p tilli tarbiyaning kognitiv afzalliklari tan olingan. Olimlar ko'p tilli bolalar tillarni osongina farqlashi va har birida alohida malaka rivojlantira olishiga qo'shiladi. \"Kritik davr gipotezasi\"ga ko'ra, bolalar nafaqat bir necha tilni muammosiz o'rganadi, balki buni kattalardan ham yaxshiroq qiladi. Lekin bu fikr bahsli: tilshunos Fransua Grojanning fikricha, har qanday yoshda ko'p tilli bo'lish mumkin, ko'pincha faqat talaffuzda aksent qoladi.", "p": [["Inhalt", "Im Text geht es um die Frage, ob man Kinder {mit zwei oder mehr Sprachen erziehen} sollte.", "Matnda bolalarni ikki yoki undan ko'p tilda tarbiyalash kerakmi, degan savol ko'riladi."], ["Vorteile", "Mehrsprachige Kinder sind {offener für andere Kulturen} und haben später {bessere Chancen im Beruf}.", "Ko'p tilli bolalar boshqa madaniyatlarga ochiqroq bo'ladi va keyin kasbda imkoniyati ko'proq bo'ladi."], ["Nachteile", "Manchmal {mischen Kinder die Sprachen} oder sprechen {keine Sprache richtig gut}.", "Ba'zan bolalar tillarni aralashtiradi yoki birorta tilda ham yaxshi gapirmaydi."], ["Erfahrung", "In Usbekistan {wachsen viele Kinder mit Usbekisch und Russisch} auf, und viele {lernen zusätzlich Englisch}. Ich selbst spreche {Usbekisch, Russisch, Englisch} und jetzt auch {Deutsch}.", "O'zbekistonda ko'p bolalar o'zbek va rus tilida ulg'ayadi, ko'plari qo'shimcha ingliz tilini o'rganadi. Men o'zim o'zbek, rus, ingliz va endi nemis tilida ham gapiraman."], ["Meinung", "Meiner Meinung nach sollten Kinder {so früh wie möglich} mehrere Sprachen lernen, weil es {für sie leichter} ist. Später haben sie {bessere Chancen im Beruf}.", "Menimcha, bolalar iloji boricha erta bir necha til o'rganishi kerak, chunki ularga bu osonroq. Keyinchalik ularning kasbda imkoniyatlari ko'proq bo'ladi."]], "k": [["zweisprachig / mehrsprachig", "ikki tilli / ko'p tilli"], ["die Muttersprache", "ona tili"], ["die Erziehung", "tarbiya"], ["die Identität", "o'zlik"], ["tolerant / offen", "bag'rikeng / ochiq"], ["der Vorsprung", "ustunlik"], ["überfordern", "haddan tashqari yuklamoq"]]},
 {"t": "Blutspende", "u": "Qon topshirish", "img": "m/blutspende.jpg", "ot": "Rette Leben mit einer Blutspende", "ou": "Bugun kim ertangi kunni o'ylaydi? Baxtsiz hodisalar har kuni sodir bo'ladi va hech kim kasallikdan sug'urtalanmagan. Har kim kutilmaganda begona qonga muhtoj bo'lishi mumkin va og'ir paytda yetarli qon zaxirasi bilan ta'minlansa xursand bo'ladi. Germaniyada har kuni 15 000 qon topshirish kerak.\nQon zaxirasi yetishmasligi xavfi bor. Hannover tibbiyot oliygohining qon xizmati rahbari Dr. Hans Gert Hoyftning aytishicha, aholining atigi 3–5 foizi qon topshiradi. O'rta muddatda esa ko'proq qon kerak bo'ladi.\nQon topshirishga qanday tayyorlanish kerak? Oldin ovqatlanish va ko'p suyuqlik ichish muhim. Qon olishdan oldin topshirishga yaroqlilikni aniqlash uchun kichik tibbiy tekshiruv o'tkaziladi. Kasallik aniqlanmasa, qon olishga o'tiladi. Kichik sanchiq — va 20–30 daqiqada hammasi tugaydi. Qon topshirib hayot saqlaganingizdan yaxshi tuyg'u qoladi.\nKim qon topshira oladi? Qon topshirish katta ish emas, uzoq davom etmaydi, og'riqsiz va 18–68 yoshdagi, kamida 50 kilogramm keladigan deyarli har bir sog'lom odam topshira oladi. Organizm tiklanishi uchun ayollar yiliga ko'pi bilan 4 marta, erkaklar 6 marta topshirishi mumkin.", "p": [["Inhalt", "Im Text geht es darum, dass {zu wenige Menschen Blut spenden}, obwohl {jeden Tag viel Blut} gebraucht wird.", "Matnda har kuni ko'p qon kerak bo'lsa ham, juda kam odam qon topshirishi haqida gap boradi."], ["Vorteile", "Mit einer Blutspende kann man {anderen Menschen das Leben retten}.", "Qon topshirib boshqa odamlarning hayotini saqlab qolish mumkin."], ["Nachteile", "Viele Menschen {haben Angst vor Nadeln} oder fühlen sich danach {schwach}.", "Ko'p odamlar ignadan qo'rqadi yoki keyin o'zini holsiz his qiladi."], ["Erfahrung", "Als Arzt habe ich gesehen, wie wichtig Blut {nach einem Unfall oder bei einer Operation} ist. Manchmal gibt es {nicht genug Blut} im Krankenhaus.", "Shifokor sifatida baxtsiz hodisadan keyin yoki operatsiyada qon qanchalik muhimligini ko'rganman. Ba'zan kasalxonada qon yetmaydi.",["Meine Freundin brauchte {nach einer Operation} Blut, deshalb weiß ich, wie wichtig Blutspenden sind.", "Dugonamga operatsiyadan keyin qon kerak bo'lgan, shuning uchun qon topshirish qanchalik muhimligini bilaman."]], ["Meinung", "Meiner Meinung nach sollte {jeder gesunde Mensch} {ein- oder zweimal im Jahr} Blut spenden. Man kann damit {ein Leben retten}.", "Menimcha, har bir sog'lom odam yiliga bir-ikki marta qon topshirishi kerak. Shu bilan bir insonning hayotini saqlab qolish mumkin."]], "k": [["Blut spenden / die Blutspende", "qon topshirmoq / qon topshirish"], ["Leben retten", "hayot saqlab qolmoq"], ["die Blutkonserve", "qon zaxirasi"], ["der Mangel", "yetishmovchilik"], ["der Gesundheitscheck", "tibbiy tekshiruv"], ["geeignet sein", "yaroqli bo'lmoq"], ["die Erholungszeit", "tiklanish vaqti"]]},
 {"t": "Gesund durch Lachen", "u": "Kulgi orqali sog'lik", "img": "m/lachen.jpg", "ot": "Gesund durch Lachen", "ou": "Ikki qo'shni ayol gaplashmoqda. Biri: \"Tun bo'yi tish og'rig'idan uxlay olmadim.\" Ikkinchisi: \"Menda bunday bo'lmaydi. Men va tishlarim alohida uxlaymiz.\"\nRostini ayting: oxirgi marta qachon kulgansiz? O'n daqiqa oldinmi? Bugun hali kulmadingizmi? Kecha kechqurun bolangizni yotqizayotganda? Bolalar kattalardan ko'ra ko'proq — kuniga 400 martagacha kuladi. Kattalar esa kuniga atigi 15 marta jilmayadi. Buni kulgi tadqiqotchilari aniqlagan. Bolalar kasalxonalari hatto kulgini davolashda qo'llaydi: og'riqli muolajalarda ba'zan masxarabozlar bo'ladi. Kulgan odam kamroq qo'rqadi, kamroq qisiladi va shuning uchun og'riq ham kamroq bo'ladi.\nBir daqiqa kulgi 45 daqiqalik bo'shashish mashqidek tetiklashtirar ekan. Chin dildan kulgan odam 80 tagacha mushakni harakatga keltiradi. Shu qisqa vaqtda organizm ijobiy stress holatiga tushadi, bu hayotimizni yangilaydi va immunitetni mustahkamlaydi.\nLekin nega umr davomida eng muhim kulgi mushagi zaiflashadi? Biz juda jiddiymizmi yoki hayotmi?\n\"Hazilni bir chetga qo'yaylik\" nemislarning eng sevimli iboralaridan biri ekan. Kulgida madaniyatlararo tushunmovchiliklar muqarrar: hamma madaniyatda odamlar bir xil miqdorda va bir xil sabablarga kulmaydi.\nKulgi har doim ham hamma uchun kulgili emas. O'z guruhi ichida u birdamlik tuyg'usini kuchaytiradi. Lekin guruhga kirmaganlarga teskari ta'sir qiladi: ular osongina ustidan kulinadigan odamga aylanishi mumkin. Masxara qilingan odam uchun kulgi kamsituvchi, sha'nga tegadigan qurolga aylanadi va umuman quvnoq bo'lmaydi.", "p": [["Inhalt", "Im Text geht es darum, dass {Lachen gesund ist}, weil es {Stress abbaut} und das {Immunsystem stärkt}.", "Matnda kulgi sog'liq uchun foydali ekani, chunki u stressni kamaytirishi va immunitetni kuchaytirishi haqida gap boradi."], ["Vorteile", "Wer lacht, hat {weniger Angst} und {weniger Schmerzen}.", "Kulgan odam kamroq qo'rqadi va og'riqni kamroq sezadi."], ["Nachteile", "Lachen kann {verletzen}, wenn man {über andere Menschen lacht}.", "Boshqalar ustidan kulinsa, kulgi ozor berishi mumkin."], ["Erfahrung", "Wenn ich {mit meinen Kindern spiele und lache}, vergesse ich {den Stress von der Arbeit}. Danach {fühle ich mich viel besser}.", "Farzandlarim bilan o'ynab kulganimda ishdagi stressni unutaman. Keyin o'zimni ancha yaxshi his qilaman."], ["Meinung", "Meiner Meinung nach sollten Erwachsene {öfter lachen}, weil es {nichts kostet} und gesund ist. Zum Beispiel kann man {lustige Filme mit der Familie} schauen.", "Menimcha, kattalar tez-tez kulishi kerak, chunki bu tekin va sog'lom. Masalan, oila bilan kulgili filmlar ko'rish mumkin."]], "k": [["lachen / auslachen", "kulmoq / ustidan kulmoq"], ["Stress abbauen", "stressni kamaytirmoq"], ["das Immunsystem stärken", "immunitetni mustahkamlamoq"], ["die Therapie", "davolash"], ["ernst", "jiddiy"], ["verletzen / demütigen", "ozor bermoq / kamsitmoq"], ["das Missverständnis", "tushunmovchilik"]]},
