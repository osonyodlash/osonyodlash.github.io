const L1NEW={"39": ["Wussten Sie, dass der längste dokumentierte Winterschlaf einer Fledermausart in Nordamerika beeindruckende 344 Tage dauerte? Forscher der University of Colorado haben herausgefunden, dass diese Tiere in extrem kalten Regionen fast ein ganzes Jahr ohne Nahrung überleben können – ein faszinierender Beweis für die Anpassungsfähigkeit der Natur.\nIn der kalten Jahreszeit ziehen sich viele Tiere zurück und verfallen in den Winterschlaf. Dabei sinkt der Energieverbrauch drastisch: Herzschlag und Atmung verlangsamen sich erheblich, und die Körpertemperatur fällt spürbar. So können die Tiere monatelang ohne Nahrung auskommen. Besonders verbreitet ist dieses Verhalten bei Kleinsäugern wie Igeln, Fledermäusen oder Murmeltieren, die den Winter in geschützten Verstecken wie Höhlen, Erdlöchern oder Dachböden verbringen.\nDiese Strategie schützt nicht nur vor eisigen Temperaturen und knappen Futterquellen, sondern zeigt auch, wie genial die Natur Lösungen für extreme Bedingungen entwickelt hat. Manche Tiere wie das Eichhörnchen halten keinen echten Winterschlaf, sondern eine Winterruhe, bei der sie regelmäßig aufwachen, um Vorräte zu fressen.", "In Dänemark wurde vor einigen Jahren ein umfangreiches Schulprojekt durchgeführt, das die Auswirkungen von Tageslicht auf Kinder untersuchte. Dabei zeigte sich, dass Schülerinnen und Schüler in Räumen mit großen Fenstern und viel natürlichem Licht im Durchschnitt bessere Testergebnisse erzielten als Gleichaltrige in schlecht beleuchteten Klassenzimmern.\nAuch eine aktuelle Studie der Universität Lichtenberg bestätigt diesen Zusammenhang: Natürliches Licht wirkt sich positiv auf die Konzentrationsfähigkeit von Kindern aus. Helle, lichtdurchflutete Klassenräume sorgen dafür, dass Lernende länger aufmerksam bleiben und Informationen besser verarbeiten können. Die Wissenschaftler betonen zudem, dass ausreichend Sonnenlicht nicht nur die Leistungsfähigkeit steigert, sondern auch das allgemeine Wohlbefinden verbessert. In gut beleuchteten Räumen sind die Schülerinnen und Schüler ausgeglichener, weniger müde und insgesamt motivierter.", "Schon die alten Römer wussten, dass ausreichend Schlaf entscheidend für die Leistungsfähigkeit ist. In historischen Schriften findet man Hinweise darauf, dass Soldaten vor wichtigen Schlachten besonders viel Ruhezeit bekamen, um konzentrierter und belastbarer zu sein. Auch moderne Studien, etwa an der Universität von Kopenhagen, zeigen: Menschen, die regelmäßig zur gleichen Zeit ins Bett gehen, haben ein geringeres Risiko für Herz-Kreislauf-Erkrankungen.\nEin geregelter Schlafrhythmus ist von zentraler Bedeutung für unsere Gesundheit. Während wir schlafen, bildet unser Körper das Hormon Melatonin, das für die Steuerung des Schlaf-Wach-Rhythmus zuständig ist. Dieses Hormon sorgt dafür, dass wir entspannen können und unterstützt eine tiefe, erholsame Nachtruhe. Gerät der Schlafrhythmus jedoch aus dem Gleichgewicht – etwa durch Schichtarbeit, zu spätes Zubettgehen oder häufige Nutzung elektronischer Geräte am Abend –, kann das zu Problemen führen. Wissenschaftler weisen darauf hin, dass Schlafstörungen nicht nur Müdigkeit am Tag verursachen, sondern langfristig auch das Immunsystem schwächen und das Risiko für Krankheiten erhöhen können.", "Schon im Mittelalter unternahmen Menschen nächtliche Pilgerwege zu Klöstern oder Wallfahrtsorten, um Ruhe und Einkehr zu finden. In Japan gibt es bis heute die Tradition der „Yoru-no-sanpo“ – abendlicher Spaziergänge, die nicht nur spirituelle Bedeutung haben, sondern auch der Gesundheit dienen. Neuere Untersuchungen der Universität von Bergen zeigen zudem, dass schon 20 Minuten Bewegung im Dunkeln den Stresshormonspiegel im Körper deutlich senken können.\nIn den letzten Jahren hat sich das nächtliche Wandern zu einem regelrechten Trend entwickelt. Immer mehr Naturfreunde machen sich nach Sonnenuntergang auf den Weg, um Wälder, Felder und Berge auf eine besondere Weise zu erleben. Gesundheitsexperten raten davon ab, diese Form der Freizeitgestaltung zu verbieten, da sie zahlreiche Vorteile für Körper und Geist bietet. Wer nachts wandert, baut Stress ab, trainiert Konzentration und Sinne und erlebt die Natur intensiver als am Tag. Zudem wird nachweislich die Ausschüttung von Melatonin gefördert – jenem Hormon, das unseren Schlaf-Wach-Rhythmus steuert und Schlafproblemen vorbeugen kann. Fachleute betonen jedoch, dass diese Form der Bewegung vor allem dann förderlich ist, wenn sie unter sicheren Bedingungen erfolgt, etwa auf gut markierten Wegen oder in geführten Gruppen.", "Schon die Weltgesundheitsorganisation (WHO) weist seit Jahren darauf hin, wie stark Tageslicht unsere innere Uhr beeinflusst. Studien zeigen, dass Beschäftigte, die in lichtdurchfluteten Büros arbeiten oder während der Mittagspause einen Spaziergang im Freien machen, produktiver sind und seltener krank werden. Besonders in skandinavischen Ländern, wo die Wintertage extrem kurz sind, werden deshalb Lichttherapien eingesetzt, um Müdigkeit, Konzentrationsprobleme und sogar depressive Verstimmungen zu lindern.\nProfessor Dr. Markus Heller von der Universität Breisgau untersucht den Zusammenhang zwischen Arbeitszeiten, Sonnenlicht und der allgemeinen Gesundheit von Berufstätigen. Seine Ergebnisse belegen, dass Arbeitnehmer, die ihre Arbeitszeiten stärker am natürlichen Tagesrhythmus orientieren, deutlich weniger unter Schlafproblemen und chronischer Erschöpfung leiden. Auch ein täglicher Fuß- oder Radweg zur Arbeit – besonders, wenn er im Hellen stattfindet – wirkt sich positiv auf Körper und Psyche aus. Natürliches Licht reguliert den Hormonhaushalt, indem es die Ausschüttung von Melatonin und Serotonin beeinflusst, zwei Hormone, die maßgeblich für unser Wohlbefinden verantwortlich sind."]};

agen.", "Oxirida savollarga javob beramiz.", "prog"]]], [9, "Exkursion ins Museum", "Muzeyga ekskursiya", "Sie wollen mit Ihrem Sprachkurs eine Exkursion zu einem Museum im deutschsprachigen Raum unternehmen. Einigen Sie sich schnell auf ein Ziel, z. B. die Pinakothek der Moderne in München. Bereiten Sie dann die Exkursion vor. Denken Sie auch an eine Führung und daran, was Sie sonst am Zielort unternehmen können.", "Til kursi bilan nemis tilli hududdagi muzeyga ekskursiya qilmoqchisiz. Tezda bir joyga kelishing, masalan Myunxendagi Pinakothek der Moderne. Keyin safarni tayyorlang: gid bilan ekskursiya va u yerda yana nima qilish mumkinligini ham o'ylang.", [["Lass uns nach München in die Pinakothek fahren.", "Keling, Myunxendagi Pinakothekka boraylik.", "wo"], ["Wir buchen eine Führung auf Deutsch.", "Nemis tilida gid bilan ekskursiya buyurtma qilamiz.", "prog"], ["Am Nachmittag könnten wir die Altstadt besichtigen.", "Tushdan keyin eski shaharni ko'rsak bo'ladi.", "prog"], ["Vielleicht fahren wir lieber mit dem Bayern-Ticket.", "Balki Bavariya chiptasi bilan borganimiz yaxshiroq.", "geg"], ["Ich kümmere mich um die Tickets, du um die Führung.", "Chiptalar mendan, gid sendan.", "auf"]]], [10, "Interview mit einem Sänger", "Qo'shiqchi bilan intervyu", "Sie haben als Journalisten einer großen Zeitung die Chance, einen sehr bekannten Sänger zu interviewen. Einigen Sie sich zuerst auf eine Person und bereiten Sie dann gemeinsam einen Fragenkatalog vor: Was wollen Sie beruflich und privat von dieser Person wissen?", "Katta gazeta jurnalistlari sifatida mashhur qo'shiqchidan intervyu olish imkoniyati bor. Avval bir shaxsga kelishing, so'ng birga savollar ro'yxatini tayyorlang: uning ishi va shaxsiy hayoti haqida nimani bilmoqchisiz?", [["Wie wäre es mit einem bekannten deutschen Sänger?", "Mashhur nemis qo'shiqchisi qalay?", "wer"], ["Zuerst fragen wir nach seiner Kindheit.", "Avval bolaligi haqida so'raymiz.", "prog"], ["Dann fragen wir, wie er Sänger geworden ist.", "Keyin qanday qilib qo'shiqchi bo'lganini so'raymiz.", "prog"], ["Vielleicht fragen wir nicht zu viel Privates.", "Balki shaxsiy narsalarni ko'p so'ramaymiz.", "geg"], ["Am Ende fragen wir nach seinen Plänen.", "Oxirida rejalari haqida so'raymiz.", "prog"]]], [11, "Kursraum freundlicher machen", "Kurs xonasini chiroyli qilish", "Ihre Kursleiterin will den Kursraum freundlicher machen und bittet Sie um Hilfe. Welche Vorschläge können Sie ihr machen? Überlegen Sie gemeinsam, was zu tun ist, und denken Sie dabei auch an die Kosten und daran, wer helfen könnte.", "O'qituvchingiz kurs xonasini chiroyliroq qilmoqchi va sizdan yordam so'radi. Qanday takliflar berasiz? Nima qilish kerakligini, xarajatlarni va kim yordam berishi mumkinligini birga o'ylang.", [["Wir könnten ein paar Pflanzen kaufen.", "Bir nechta gul sotib olsak bo'ladi.", "was"], ["Die Wände sollten wir hell streichen.", "Devorlarni ochiq rangga bo'yashimiz kerak.", "was"], ["Vielleicht hängen wir Bilder aus unseren Ländern auf.", "Balki o'z davlatlarimiz rasmlarini osarmiz.", "geg"], ["Jeder Teilnehmer zahlt fünf Euro.", "Har bir ishtirokchi besh yevro to'laydi.", "kost"], ["Am Samstag machen wir das alle zusammen.", "Shanba kuni hammamiz birga qilamiz.", "wann"]]], [12, "Multikulturelles Fest der Sprachschule", "Til maktabining ko'p madaniyatli bayrami", "Ihre Sprachschule veranstaltet einmal pro Jahr ein großes Fest, das den ganzen Tag dauert. Dieses Jahr soll es ein multikulturelles Fest sein. Planen Sie zu zweit: Was für ein Programm können Sie anbieten, wer übernimmt welche Aufgaben und was müssen Sie besorgen und organisieren?", "Til maktabingiz yiliga bir marta kun bo'yi davom etadigan katta bayram o'tkazadi. Bu yil u ko'p madaniyatli bo'lishi kerak. Ikkovingiz rejalashtiring: qanday dastur, kim qaysi vazifani oladi va nimalarni tayyorlash kerak?", [["Jedes Land könnte einen eigenen Stand haben.", "Har bir davlatning o'z rastasi bo'lishi mumkin.", "was"], ["Wir kochen typische Gerichte aus unseren Ländern.", "O'z davlatlarimizning milliy taomlarini pishiramiz.", "was"], ["Am Abend gibt es Musik und Tanz.", "Kechqurun musiqa va raqs bo'ladi.", "prog"], ["Vielleicht machen wir auch ein Quiz über die Länder.", "Balki davlatlar haqida viktorina ham qilarmiz.", "geg"], ["Ich organisiere die Musik, du machst die Plakate.", "Musiqa mendan, plakatlar sendan.", "auf"]]], [13, "Fahrradreise (3 Tage)", "3 kunlik velosiped safari", "Sie möchten mit einigen Teilnehmern aus Ihrem Sprachkurs eine 3-tägige Reise mit dem Fahrrad durch eine schöne Landschaft in Deutschland oder in Ihrem Heimatland machen. Planen Sie gemeinsam den Aufenthalt der Gruppe.", "Kursdoshlaringiz bilan Germaniya yoki o'z vataningizdagi go'zal joylar bo'ylab 3 kunlik velosiped safariga chiqmoqchisiz. Guruh safarini birga rejalashtiring.", [["Wir könnten am Bodensee fahren.", "Bodensee bo'ylab yursak bo'ladi.", "wo"], ["Pro Tag fahren wir etwa 40 Kilometer.", "Kuniga taxminan 40 km yuramiz.", "prog"], ["Wir übernachten auf einem Campingplatz.", "Kemping joyida tunaymiz.", "wo"], ["Vielleicht leihen wir die Fahrräder vor Ort.", "Balki velosipedlarni joyida ijaraga olarmiz.", "geg"], ["Du planst die Route, ich buche die Übernachtung.", "Yo'nalish sendan, tunash joyini men band qilaman.", "auf"]]], [15, "Geburtstag eines Kursteilnehmers", "Kursdoshning tug'ilgan kuni", "Ein Teilnehmer aus Ihrem Sprachkurs hat am Wochenende Geburtstag. Überlegen Sie, was der Kurs ihm schenken und wie die Feier ablaufen könnte. Entwickeln Sie gemeinsam Vorschläge für das Geschenk und das Programm der Feier.", "Kursdoshingizning dam olish kunlari tug'ilgan kuni. Kurs unga nima sovg'a qilishi va bayram qanday o'tishini o'ylang. Sovg'a va bayram dasturi uchun birga takliflar tuzing.", [["Wir könnten ihm ein Buch schenken.", "Unga kitob sovg'a qilsak bo'ladi.", "was"], ["Jeder gibt fünf Euro für das Geschenk.", "Sovg'a uchun har kim besh yevrodan beradi.", "kost"], ["Die Feier machen wir im Kursraum.", "Bayramni kurs xonasida qilamiz.", "wo"], ["Vielleicht backen wir lieber selbst einen Kuchen.", "Balki pirogni o'zimiz pishirganimiz yaxshiroq.", "geg"], ["Ich kaufe das Geschenk, du lädst alle ein.", "Sovg'ani men olaman, hammani sen taklif qilasan.", "auf"]]], [16, "Geld für Straßenkinder sammeln", "Ko'cha bolalari uchun pul yig'ish", "Sie wollen gemeinsam Geld für Straßenkinder sammeln. Eine Hilfsorganisation führt in den nächsten drei Monaten ein spezielles Programm für diese Kinder durch. Besprechen Sie, welche Ideen Sie haben, und einigen Sie sich über die Einzelheiten: wer macht was, wann usw.", "Birga ko'cha bolalari uchun pul yig'moqchisiz. Bir xayriya tashkiloti keyingi uch oyda ular uchun maxsus dastur o'tkazadi. G'oyalaringizni muhokama qiling va tafsilotlarga kelishing: kim, nima, qachon qiladi.", [["Wir könnten einen Kuchenverkauf machen.", "Pirog sotish tadbirini qilsak bo'ladi.", "was"], ["Ein Flohmarkt bringt auch viel Geld.", "Barahol ham ko'p pul olib keladi.", "was"], ["Vielleicht organisieren wir lieber ein Konzert.", "Balki konsert uyushtirganimiz yaxshiroq.", "geg"], ["Wir fangen nächsten Samstag an.", "Kelasi shanbadan boshlaymiz.", "wann"], ["Ich mache die Plakate, du sprichst mit der Organisation.", "Plakatlar mendan, tashkilot bilan sen gaplashasan.", "auf"]]], [17, "Präsentation: Warum Fremdsprachen lernen?", "Taqdimot: nega chet tili o'rganish kerak?", "Sie wurden von einer Schule eingeladen, um über die Notwendigkeit des Fremdsprachenlernens aus Ihrer Sicht und Erfahrung zu berichten. Sammeln Sie Argumente und erstellen Sie zusammen eine Liste mit Stichpunkten für eine 15-minütige Präsentation vor den Schülern.", "Maktab sizni chet tili o'rganish zarurligi haqida o'z tajribangizdan gapirib berishga taklif qildi. Dalillar to'plang va o'quvchilar oldida 15 daqiqalik taqdimot uchun birga reja tuzing.", [["Zuerst erzählen wir von unseren Erfahrungen.", "Avval o'z tajribamizni aytib beramiz.", "prog"], ["Mit Fremdsprachen findet man leichter Arbeit.", "Chet tili bilan ish topish osonroq.", "was"], ["Man kann im Ausland studieren und reisen.", "Chet elda o'qish va sayohat qilish mumkin.", "was"], ["Vielleicht zeigen wir auch ein kurzes Video.", "Balki qisqa video ham ko'rsatarmiz.", "geg"], ["Du sprichst über Beruf, ich über Reisen.", "Sen kasb haqida, men sayohat haqida gapiraman.", "auf"]]], [18, "Infotag zum Arbeitsalltag", "Ish kuni haqida axborot kuni", "An einer Schule in Ihrer Stadt soll ein Infotag zum Arbeitsalltag in verschiedenen Berufen stattfinden. Sie möchten sich daran beteiligen. Überlegen Sie, welche Berufe Sie vorstellen, wie Sie den Arbeitsalltag präsentieren (Vortrag, Videos, Beispiele) und welches Material Sie brauchen.", "Shahringizdagi maktabda turli kasblardagi ish kuni haqida axborot kuni bo'ladi. Siz ham qatnashmoqchisiz. Qaysi kasblarni tanishtirishni, ish kunini qanday ko'rsatishni (ma'ruza, video, misollar) va qanday material kerakligini o'ylang.", [["Ich stelle den Beruf Arzt vor.", "Men shifokor kasbini tanishtiraman.", "was"], ["Wir könnten ein kurzes Video zeigen.", "Qisqa video ko'rsatsak bo'ladi.", "prog"], ["Die Schüler dürfen danach Fragen stellen.", "O'quvchilar keyin savol bera oladi.", "prog"], ["Vielleicht bringen wir auch Arbeitskleidung mit.", "Balki ish kiyimini ham olib borarmiz.", "geg"], ["Du brauchst einen Beamer, ich bringe Flyer.", "Senga proyektor kerak, men buklet olib kelaman.", "auf"]]], [19, "Hochzeitsüberraschung", "To'y uchun syurpriz", "Ihr gemeinsamer Freund will heiraten. Organisieren Sie eine Hochzeitsüberraschung für ihn. Überlegen Sie, was für Überraschungsideen Sie anbieten können, und machen Sie Ihrem Partner / Ihrer Partnerin Vorschläge.", "Umumiy do'stingiz uylanmoqchi. Unga to'y syurprizi tayyorlang. Qanday g'oyalar borligini o'ylang va sherigingizga taklif qiling.", [["Wir könnten ein Video mit Fotos machen.", "Rasmlardan video qilsak bo'ladi.", "was"], ["Alle Freunde singen zusammen ein Lied.", "Hamma do'stlar birga qo'shiq aytadi.", "prog"], ["Vielleicht schenken wir eine Reise.", "Balki sayohat sovg'a qilarmiz.", "geg"], ["Das Geld sammeln wir von allen Freunden.", "Pulni hamma do'stlardan yig'amiz.", "kost"], ["Ich mache das Video, du organisierst das Lied.", "Video mendan, qo'shiq sendan.", "auf"]]], [21, "Infotag Gesundheit", "Salomatlik axborot kuni", "In einem Gesundheitszentrum in Ihrer Stadt soll ein Infotag zum Thema „Gesundheit“ stattfinden. Sie sollen bei der Planung helfen. Denken Sie z. B. an Aufklärungskampagnen, Vorträge, Ernährungspläne. Planen Sie gemeinsam, was Sie organisieren können.", "Shahringizdagi salomatlik markazida „Salomatlik“ mavzusida axborot kuni bo'ladi. Rejalashtirishga yordam berishingiz kerak. Masalan: tushuntirish kampaniyasi, ma'ruzalar, ovqatlanish rejasi. Nimalarni tashkil qilishni birga rejalashtiring.", [["Ein Arzt könnte einen Vortrag halten.", "Shifokor ma'ruza qilishi mumkin.", "wer"], ["Wir bieten kostenlose Blutdruckmessungen an.", "Bepul qon bosimi o'lchashni taklif qilamiz.", "was"], ["Ein Ernährungsberater erklärt gesunde Ernährung.", "Dietolog sog'lom ovqatlanishni tushuntiradi.", "wer"], ["Vielleicht machen wir auch einen Sportkurs.", "Balki sport mashg'uloti ham qilarmiz.", "geg"], ["Ich mache die Flyer, du lädst die Experten ein.", "Bukletlar mendan, mutaxassislarni sen taklif qilasan.", "auf"]]], [22, "Flohmarkt im Stadtviertel", "Mahallada barahol", "Zum Frühlingsbeginn möchten Sie in Ihrem Stadtviertel einen Flohmarkt organisieren. Sie wollen Ihre Nachbarn einladen und den Ablauf gemeinsam festlegen. Überlegen Sie, wie Sie möglichst viele Leute erreichen, und machen Sie Vorschläge. Legen Sie gemeinsam ein passendes Datum fest.", "Bahor boshida mahallangizda barahol (eski buyumlar bozori) tashkil qilmoqchisiz. Qo'shnilarni taklif qilib, tartibini birga belgilamoqchisiz. Ko'proq odamga qanday yetkazishni o'ylang va taklif qiling. Mos sanani birga tanlang.", [["Der Flohmarkt könnte am ersten Samstag im April sein.", "Barahol aprelning birinchi shanbasida bo'lishi mumkin.", "wann"], ["Wir hängen Plakate im ganzen Viertel auf.", "Butun mahallaga plakat osamiz.", "werb"], ["Vielleicht schreiben wir auch in den Nachbarschafts-Chat.", "Balki mahalla chatiga ham yozarmiz.", "geg"], ["Jeder Nachbar bringt einen Tisch mit.", "Har bir qo'shni o'z stolini olib keladi.", "mat"], ["Ich frage die Stadt, ob wir die Straße nutzen dürfen.", "Ko'chadan foydalanish mumkinmi, shahardan men so'rayman.", "auf"]]], [23, "Kurstreffen nach einem Jahr", "Bir yildan keyin kursdoshlar uchrashuvi", "Ein Jahr nach Ende des Sprachkurses wollen Sie ein Kurstreffen für ein Wochenende organisieren, und zwar in der Stadt, in der der Kurs stattgefunden hat. Erstellen Sie ein Programm (Vormittag, Nachmittag, Abend). Denken Sie auch an Übernachtungsmöglichkeiten und daran, wie Sie alle Teilnehmer erreichen.", "Til kursi tugaganiga bir yil bo'lganda, kurs o'tgan shaharda dam olish kunlari uchrashuv tashkil qilmoqchisiz. Dastur tuzing (ertalab, tushdan keyin, kechqurun). Tunash joyi va hammaga qanday xabar berishni ham o'ylang.", [["Wir schreiben allen in der WhatsApp-Gruppe.", "Hammaga WhatsApp guruhida yozamiz.", "werb"], ["Am Vormittag besuchen wir unsere alte Sprachschule.", "Ertalab eski til maktabimizga boramiz.", "prog"], ["Am Abend essen wir zusammen im Restaurant.", "Kechqurun birga restoranda ovqatlanamiz.", "prog"], ["Vielleicht übernachten wir in einer Jugendherberge.", "Balki yoshlar mehmonxonasida tunarmiz.", "geg"], ["Du reservierst das Restaurant, ich die Zimmer.", "Restoranni sen, xonalarni men band qilaman.", "auf"]]], [24, "Schreibwettbewerb", "Yozish tanlovi", "Ihre Sprachschule möchte einen Schreibwettbewerb für alle Kursteilnehmer organisieren. Sie sollen bei der Planung helfen. Denken Sie z. B. an verschiedene Textsorten (Aufsatz, Brief usw.), mögliche Preise, Themen und einen Zeitplan. Planen Sie gemeinsam, was zu tun ist.", "Til maktabingiz barcha o'quvchilar uchun yozish tanlovi o'tkazmoqchi. Rejalashtirishga yordam bering. Masalan: matn turlari (insho, xat), sovrinlar, mavzular va vaqt jadvali. Nima qilish kerakligini birga rejalashtiring.", [["Das Thema könnte „Meine Heimat“ sein.", "Mavzu „Mening vatanim“ bo'lishi mumkin.", "was"], ["Die Teilnehmer schreiben einen Brief oder einen Aufsatz.", "Ishtirokchilar xat yoki insho yozadi.", "was"], ["Die Texte sollten höchstens eine Seite lang sein.", "Matnlar ko'pi bilan bir sahifa bo'lishi kerak.", "was"], ["Vielleicht ist der erste Preis ein Wörterbuch.", "Balki birinchi sovrin lug'at bo'lar.", "geg"], ["Die Lehrer lesen die Texte und wählen die besten.", "O'qituvchilar matnlarni o'qib, eng yaxshisini tanlaydi.", "wer"]]], [25, "Kochnachmittag im Deutschkurs", "Nemis tili kursida oshpazlik kuni", "Sie organisieren einen Kochnachmittag in Ihrem Deutschkurs. Planen Sie mit Ihrem Partner / Ihrer Partnerin ein Programm dafür. Überlegen Sie, was für ein Programm Sie anbieten können, und machen Sie gemeinsam Vorschläge.", "Nemis tili kursida tushdan keyin oshpazlik bayrami tashkil qilyapsiz. Sherigingiz bilan dastur tuzing. Qanday dastur taklif qilishni o'ylang va birga takliflar bering.", [["Jeder kocht ein Gericht aus seinem Land.", "Har kim o'z davlati taomini pishiradi.", "was"], ["Ich würde Plov kochen.", "Men palov pishirgan bo'lardim.", "was"], ["Wir brauchen die Schulküche.", "Bizga maktab oshxonasi kerak.", "mat"], ["Vielleicht schreiben wir die Rezepte auf Deutsch auf.", "Balki retseptlarni nemischa yozib qo'yarmiz.", "geg"], ["Du kaufst die Getränke, ich bringe Teller mit.", "Ichimliklarni sen olasan, likopchalarni men olib kelaman.", "auf"]]], [26, "Nachbarin im Krankenhaus", "Qo'shni ayol kasalxonada", "Ihre alleinerziehende Nachbarin wurde unerwartet ins Krankenhaus eingeliefert. Sie wollen in der ersten Zeit bei der Betreuung ihrer Kinder helfen. Überlegen Sie, was zu organisieren ist (Schule, Kochen, Einkaufen, Übernachten …).", "Bolalarini yolg'iz tarbiyalayotgan qo'shningiz kutilmaganda kasalxonaga tushib qoldi. Dastlabki paytda bolalariga qarashda yordam bermoqchisiz. Nimalarni tashkil qilish kerakligini o'ylang (maktab, ovqat, xarid, tunash...).", [["Morgens bringe ich die Kinder zur Schule.", "Ertalab bolalarni men maktabga olib boraman.", "auf"], ["Du könntest am Nachmittag für sie kochen.", "Sen tushdan keyin ularga ovqat pishirsang bo'ladi.", "auf"], ["Am Wochenende können die Kinder bei mir schlafen.", "Dam olish kunlari bolalar menikida yotishi mumkin.", "wo"], ["Vielleicht fragen wir auch die anderen Nachbarn.", "Balki boshqa qo'shnilardan ham so'rarmiz.", "geg"], ["Wir besuchen sie zusammen mit den Kindern im Krankenhaus.", "Bolalar bilan birga uni kasalxonada ko'rgani boramiz.", "prog"]]], [27, "Straßenfest", "Ko'cha bayrami", "In vielen deutschen Städten gibt es im Sommer Straßenfeste, die von allen Nachbarn einer Straße organisiert werden. Bänke und Tische werden aufgestellt und alle feiern mit selbst gemachtem Essen, Musik und Spielen für die Kinder. Sie möchten auch in Ihrer Straße ein Fest organisieren. Sammeln Sie Ideen und teilen Sie die Aufgaben unter sich auf.", "Ko'p nemis shaharlarida yozda ko'cha bayramlari bo'ladi, ularni bir ko'chadagi qo'shnilar birga tashkil qiladi. Stol-o'rindiqlar qo'yiladi, hamma uyda pishirilgan ovqat, musiqa va bolalar o'yinlari bilan bayram qiladi. Siz ham ko'changizda bayram qilmoqchisiz. G'oyalar to'plang va vazifalarni bo'lib oling.", [["Das Fest könnte im Juli am Samstag sein.", "Bayram iyul oyida shanba kuni bo'lishi mumkin.", "wann"], ["Jede Familie bringt ein Gericht mit.", "Har bir oila bitta taom olib keladi.", "mat"], ["Für die Kinder machen wir Spiele und Malen.", "Bolalar uchun o'yinlar va rasm chizish qilamiz.", "prog"], ["Vielleicht spielt ein Nachbar Gitarre.", "Balki qo'shnilardan biri gitara chalar.", "geg"], ["Ich frage nach Tischen, du verteilst die Einladungen.", "Stollarni men so'rayman, taklifnomalarni sen tarqatasan.", "auf"]]], [28, "Infotag „Neue Medien“", "„Yangi media“ axborot kuni", "An einem Bildungsinstitut in Ihrer Stadt soll ein Infotag zum Thema „Neue Medien: Internet, Handys/Smartphones und mehr“ stattfinden. Sie sollen bei der Planung helfen. Denken Sie z. B. an Informationsmaterial oder Poster, Vorträge/Präsentationen, aber auch an Werbung für den Infotag.", "Shahringizdagi ta'lim muassasasida „Yangi media: internet, smartfonlar va boshqalar“ mavzusida axborot kuni bo'ladi. Rejalashtirishga yordam bering. Masalan: axborot materiallari, plakatlar, ma'ruzalar va tadbir reklamasi.", [["Ein Experte spricht über Sicherheit im Internet.", "Mutaxassis internet xavfsizligi haqida gapiradi.", "wer"], ["Wir machen Poster über Handysucht.", "Telefonga qaramlik haqida plakat qilamiz.", "werb"], ["Für ältere Leute bieten wir einen Smartphone-Kurs an.", "Keksalar uchun smartfon kursi taklif qilamiz.", "was"], ["Vielleicht machen wir Werbung im Radio.", "Balki radioda reklama qilarmiz.", "geg"], ["Ich mache die Präsentation, du druckst die Flyer.", "Taqdimot mendan, bukletlarni sen chop etasan.", "auf"]]], [29, "Theaterstück für Wohltätigkeit", "Xayriya uchun spektakl", "Sie organisieren ein Theaterstück und spenden das Geld für einen wohltätigen Zweck. Sie sollen bei der Planung helfen. Überlegen Sie, was Sie tun können, und planen Sie gemeinsam, was Sie organisieren können.", "Spektakl tashkil qilib, tushgan pulni xayriyaga bermoqchisiz. Rejalashtirishga yordam bering. Nima qilish mumkinligini o'ylang va birga rejalashtiring.", [["Wir könnten ein kurzes Märchen spielen.", "Qisqa ertak sahnalashtirsak bo'ladi.", "was"], ["Die Schauspieler sind Schüler aus unserem Kurs.", "Aktyorlar kursimizdagi o'quvchilar.", "wer"], ["Eine Karte kostet fünf Euro.", "Bitta chipta besh yevro turadi.", "kost"], ["Vielleicht verkaufen wir in der Pause Getränke.", "Balki tanaffusda ichimlik sotarmiz.", "geg"], ["Das ganze Geld geht an ein Kinderheim.", "Hamma pul bolalar uyiga beriladi.", "kost"]]], [30, "Blutspende-Aktion", "Qon topshirish aksiyasi", "In einem Gesundheitszentrum in Ihrer Stadt organisieren Sie eine Bl ahriga qisqa safar", "Sie sollen für Ihre Klasse einen Kurztrip übers Wochenende in eine europäische Stadt organisieren. Die Interessen sind verschieden: Einige möchten Kultur und Geschichte, andere wandern und Natur, andere einen entspannten Tag am Strand oder Bummeln. In welche Stadt könnte die Reise gehen? Wie planen Sie sie, damit möglichst alle zufrieden sind?", "Sinfingiz uchun dam olish kunlari Yevropa shahriga qisqa safar tashkil qilishingiz kerak. Qiziqishlar har xil: ba'zilar madaniyat va tarixni, ba'zilar tabiat va piyoda sayrni, boshqalar plyaj yoki do'konlarni xohlaydi. Qaysi shahar mos? Hamma rozi bo'lishi uchun qanday rejalashtirasiz?", [["Ich schlage Barcelona vor, da gibt es alles.", "Barselonani taklif qilaman, u yerda hammasi bor.", "wo"], ["Am Samstagvormittag besichtigen wir die Altstadt.", "Shanba ertalab eski shaharni ko'ramiz.", "prog"], ["Am Nachmittag kann jeder wählen: Strand oder Wandern.", "Tushdan keyin har kim tanlaydi: plyaj yoki sayr.", "prog"], ["Vielleicht ist Wien besser, weil es näher ist.", "Balki Vena yaxshiroqdir, chunki yaqinroq.", "geg"], ["Am Sonntag gehen alle zusammen bummeln.", "Yakshanba kuni hamma birga do'konlarni aylanadi.", "prog"]]], [34, "Software-Seminar", "Dasturiy ta'minot seminari", "Sie organisieren ein Software-Seminar. Überlegen Sie gemeinsam, was Sie tun können. Entwickeln Sie dann gemeinsam Ihre Vorschläge für das Seminar.", "Dasturiy ta'minot bo'yicha seminar tashkil qilyapsiz. Nima qilish mumkinligini birga o'ylang va seminar uchun takliflar tuzing.", [["Das Thema könnte „Excel für Anfänger“ sein.", "Mavzu „Boshlovchilar uchun Excel“ bo'lishi mumkin.", "was"], ["Wir brauchen einen Raum mit Computern.", "Bizga kompyuterli xona kerak.", "mat"], ["Ein Experte aus einer IT-Firma leitet das Seminar.", "Seminarni IT firmadan mutaxassis olib boradi.", "wer"], ["Vielleicht machen wir es lieber online.", "Balki onlayn qilganimiz yaxshiroq.", "geg"], ["Ich kümmere mich um die Anmeldung, du um die Technik.", "Ro'y const erNorm=s=>String(s||"").toUpperCase().replace(/[^0-9A-ZÄÖÜẞ]/g,"");
function erKind(e,k){
  const a=String(e.a||"");
  if(/^\d+$/.test(a.trim())) return "num";
  if(/^[ABC·]+$/.test(a.replace(/\s/g,""))) return "abc";
  if(/^[A-Z]{2,13}$/.test(a.trim())) return "let";
  return (Array.isArray(e.o)&&e.o.length>1)||erOptsPool(e,k).length?"mc":"rev";
}
function erOptsPool(e,k){ const same=Object.entries(XS).filter(([kk,x])=>kk!==k&&x.a!==e.a&&x.s===e.s).map(([,x])=>x.a); const other=Object.entries(XS).filter(([kk,x])=>kk!==k&&x.a!==e.a&&x.s!==e.s&&erKind2(x)===erKind2(e)).map(([,x])=>x.a); return [...new Set([...shuf(same),...shuf(other)])]; }
const erKind2=x=>/,/.test(x.a)?"list":String(x.a).length>25?"long":"short";
function erOpts(e,k){ if(Array.isArray(e.o)&&e.o.includes(e.a)) return shuf(e.o.slice()); return shuf([e.a,...erOptsPool(e,k).slice(0,3)]); }
function erResult(ok){ const k=ERQ.q[ERQ.i], e=XS[k]; if(ok){ e.ok++; if(e.ok>=3) e.m=true; } else { e.ok=0; e.n++; } e.t=Date.now(); saveXS(); xBump(); }
function erCheck(v){
  const k=ERQ.q[ERQ.i], e=XS[k], kind=erKind(e,k);
  if(kind!=="mc"){ if(!erNorm(v)) return; ERQ.val=v; }
  ERQ.done=true; ERQ.ok = kind==="mc" ? v===e.a : erNorm(v)===erNorm(e.a);
  if(!ERQ.retry) erResult(ERQ.ok);
  if(!ERQ.ok) ERQ.miss.add(k);
  renderER();
  if(ERQ.ok){ const st=ERQ, ii=ERQ.i; autoNext(()=>ERQ===st&&ERQ.i===ii&&ERQ.done&&!document.getElementById("xv").hidden,()=>erAdv()); }
}
function erAdv(rev){
  const k=ERQ.q[ERQ.i], e=XS[k], ok=rev===undefined?ERQ.ok:rev;
  if(ok){ ERQ.right++; if(!ERQ.miss.has(k)) ERQ.first++; } else { ERQ.miss.add(k); if(!e.m) ERQ.q.push(k); }
  ERQ.i++; ERQ.val=""; ERQ.done=false; ERQ.ok=false; ERQ.pick=null; ERQ.opts=null; ERQ.show=false; ERQ.retry=false; renderER();
}

const XSYNC={msg:"Sinxronlash: tekshirilmoqda…", ref:null, last:""};
function xSnap(){ const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&!k.startsWith("xsync_")) o[k]=localStorage.getItem(k); } }catch(e){} return JSON.stringify(o,Object.keys(o).sort()); }
function xSyncMsg(m){ XSYNC.msg=m; const el=document.getElementById("xsyncst"); if(el) el.textContent=m; }
async function xPush(){ if(!XSYNC.ref) return; const s=xSnap(); if(s===XSYNC.last) return;
  if(s.length>900000){ xSyncMsg("Sinxronlash: ma'lumot juda katta, faqat shu qurilmada saqlanmoqda"); return; }
  const ts=Date.now(); try{ await XSYNC.ref.set({ts,kv:s}); XSYNC.last=s; store("xsync_ts",String(ts)); const d=new Date(ts); xSyncMsg("☁ Telefon va kompyuter sinxron · "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")); }catch(e){ xSyncMsg("Sinxronlash vaqtincha ishlamayapti, natijalar shu qurilmada saqlanmoqda"); } }
(async function xSync(){
  try{
    const db=await claude.use("db"), user=await claude.use("user"); if(!db||!user){ xSyncMsg("Natijalar shu qurilmada saqlanmoqda."); return; }
    const id=await user.id(); if(!id){ xSyncMsg("Sinxronlash mavjud emas, natijalar shu qurilmada."); return; }
    XSYNC.ref=db.collection("data/users/"+id).doc("progress");
    const snap=await XSYNC.ref.get(), r=snap.exists?snap.data():null, lts=+(store("xsync_ts")||0);
    if(r&&r.ts>lts&&typeof r.kv==="string"){
      const o=JSON.parse(r.kv), cur=xSnap();
      if(r.kv!==cur){ Object.entries(o).forEach(([k,v])=>store(k,v)); store("xsync_ts",String(r.ts)); XSYNC.last=r.kv;
        let once=null; try{ once=sessionStorage.getItem("xsync_rl"); }catch(e){}
        if(once!==String(r.ts)){ try{ sessionStorage.setItem("xsync_rl",String(r.ts)); }catch(e){} location.reload(); return; } }
      else { store("xsync_ts",String(r.ts)); XSYNC.last=cur; }
      xSyncMsg("☁ Boshqa qurilmadagi natijalar yuklandi");
    } else await xPush();
    setInterval(xPush,15000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") xPush(); });
  }catch(e){ xSyncMsg("Sinxronlash vaqtincha ishlamayapti, natijalar shu qurilmada saqlanmoqda"); }
})();

  if(done){ const nx=document.getElementById("khxnx"); nx.onclick=next; nx.focus({preventScroll:true}); if(ok) _ktx=setTimeout(()=>{ if(!document.getElementById("khw").hidden&&khMode===m&&KSX[m]===S&&S.q[S.i]===n&&S.v!==null) next(); },1600); }
  else { const I=document.getElementById("khxin"); I.focus({preventScroll:true});
    document.getElementById("khxf").onsubmit=e=>{ e.preventDefault(); const x=C.norm(I.value); if(!x) return; S.v=x; S.a[n]=x; saveKSX(m);
      try{ xBump(); if(x!==k[2]) xLog(`${C.key}|${n}`,C.sec,`${C.title} · ${k[1]}-variant (rasm ${n})`,k[2],(()=>{ const K=khxKey(C,k[1]); return K&&K.w?("Kalit so'z: {"+K.w+"}"+(K.st?" — "+K.st[2]:"")):""; })()); }catch(_){}
      renderKHX(); }; }
}

// ===== Guruhlangan tablar → chap menyu (drawer)
const GINFO={D:["🏠","Bosh sahifa"],ER:["🔁","Xatolarim"],H:["🎧","Hören"],LG:["📖","Lesen"],S:["🧩","Sprachbausteine"],C:["🔄","O'zgargan"],K:["📚","Kitob"],X:["📝","Imtihon"],M:["🗣️","Mündlich"],KH:["🎯","Kahoot"]};
(function buildDrawer(){
  const nav=document.createElement("nav"); nav.id="drw";
  nav.innerHTML=`<div class="dhead"><b>telc B2</b><button id="dcls" aria-label="Yopish">✕</button></div><div class="dlist"></div>`;
  const L=nav.querySelector(".dlist");
  document.querySelectorAll("#grp [data-g]").forEach(b=>{ const g=b.dataset.g, [ic,nm]=GINFO[g]||["•",b.textContent];
    b.innerHTML=`<i>${ic}</i><span>${nm}</span>`; b.className="dg"; b.style.setProperty("--c",`var(--c-${g})`); L.appendChild(b);
    const subs=[...document.querySelectorAll(`#teil [data-gp="${g}"]`)];
    if(g==="H"||g==="LG"||g==="S"||g==="M"){ const d=document.createElement("div"); d.className="dsub"; subs.forEach(x=>{ x.hidden=false; x.className="ds"; d.appendChild(x); }); L.appendChild(d); }
  });
  const bg=document.createElement("div"); bg.id="drwbg";
  document.body.append(bg,nav);
  const tb=document.createElement("div"); tb.id="tb"; tb.innerHTML=`<button id="mnu" aria-label="Menyu">☰</button>`;
  const h=document.getElementById("h"); h.parentNode.insertBefore(tb,h); tb.appendChild(h);
  document.getElementById("grp").hidden=true; document.getElementById("teil").hidden=true;
  const open=v=>document.body.classList.toggle("dopen",v);
  document.getElementById("mnu").onclick=()=>open(true);
  bg.onclick=()=>open(false); document.getElementById("dcls").onclick=()=>open(false);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") open(false); });
  nav.addEventListener("click",e=>{ if(e.target.closest(".ds,.dg")) open(false); });
})();
function syncG(){
  const on=document.querySelector("[data-gp][data-t].on"), ht=store("ht")||"1";
  const g=on?on.dataset.gp:({"1":"H","2":"H","3":"H",E:"LG",Q:"LG",L:"LG"}[ht]||ht);
  if(!on){ const b=document.querySelector(`[data-gp][data-t="${ht}"]`); if(b) b.classList.add("on"); }
  document.querySelectorAll("#drw [data-g]").forEach(b=>b.classList.toggle("on",b.dataset.g===g));
  document.querySelectorAll("#drw .dsub").forEach(d=>d.classList.toggle("open",!!d.previousElementSibling&&d.previousElementSibling.dataset.g===g));
  document.body.dataset.grp=g||"H";
}
document.querySelectorAll("#drw [data-g]").forEach(b=>b.onclick=()=>{
  const g=b.dataset.g, last=store("lastsub_"+g);
  const tgt=document.querySelector(`[data-t="${last||""}"][data-gp="${g}"]`)||document.querySelector(`[data-gp="${g}"]`);
  tgt.click();
});
document.querySelectorAll("[data-gp][data-t]").forEach(b=>b.addEventListener("click",()=>{ store("lastsub_"+b.dataset.gp,b.dataset.t); setTimeout(syncG,0); }));
syncG();

// ===== Chap menyu: ichki bo'limli guruhlarni bosganda faqat ochib-yopish
(function(){
  const nav=document.getElementById("drw"); if(!nav) return;
  nav.querySelectorAll(".dg").forEach(b=>{ const d=b.nextElementSibling; if(d&&d.classList.contains("dsub")&&!b.querySelector(".dcar")) b.insertAdjacentHTML("beforeend",'<i class="dcar" style="background:none;width:auto;height:auto">›</i>'); });
  const setExp=()=>nav.querySelectorAll(".dg").forEach(b=>{ const d=b.nextElementSibling; b.classList.toggle("exp",!!(d&&d.classList.contains("dsub")&&d.classList.contains("open"))); });
  nav.addEventListener("click",e=>{ const b=e.target.closest(".dg"); if(!b) return; const d=b.nextElementSibling;
    if(d&&d.classList.contains("dsub")){ e.stopPropagation(); e.preventDefault(); const was=d.classList.contains("open");
      nav.querySelectorAll(".dsub").forEach(x=>x.classList.remove("open")); if(!was) d.classList.add("open"); setExp(); } },true);
  const collapse=()=>{ nav.querySelectorAll(".dsub").forEach(x=>x.classList.remove("open")); setExp(); };
  document.getElementById("mnu").addEventListener("click",()=>setTimeout(collapse,0));
  collapse();
})();
</script>

<script>
// ===== Rasm lupasi: bosing → to'liq ekran; g'ildirak = kattalashtirish, sudrash = surish, Esc = yopish
(function(){
  const Z=document.createElement("div"); Z.id="zbox";
  Z.innerHTML='<div id="zbar"><button data-z="-" title="Kichraytirish">−</button><button data-z="+" title="Kattalashtirish">+</button><button data-z="0" title="Ekranga sig\'dirish">⤢</button><button data-z="x" title="Yopish">✕</button></div><img alt=""><div id="zhint">G\'ildirak — kattalashtirish · sudrang — surish · Esc — yopish</div>';
  document.body.appendChild(Z);
  const I=Z.querySelector("img"); let s=1,x=0,y=0,fit=1;
  const ap=()=>{ I.style.transform=`translate(${x}px,${y}px) scale(${s})`; };
  const fitIt=()=>{ const W=innerWidth,H=innerHeight,w=I.naturalWidth||800,h=I.naturalHeight||600; fit=Math.min((W-40)/w,(H-90)/h,3); s=fit; x=(W-w*s)/2; y=(H-h*s)/2+10; ap(); };
  const zoomAt=(f,cx,cy)=>{ const ns=Math.min(Math.max(s*f,fit*0.5),12); x=cx-(cx-x)*ns/s; y=cy-(cy-y)*ns/s; s=ns; ap(); };
  const open=src=>{ I.onload=fitIt; I.src=src; Z.classList.add("on"); document.documentElement.style.overflow="hidden"; if(I.complete) fitIt(); };
  const close=()=>{ Z.classList.remove("on"); document.documentElement.style.overflow=""; I.removeAttribute("src"); };
  document.addEventListener("click",e=>{ const t=e.target; if(t.tagName!=="IMG"||Z.contains(t)||!t.src||!t.closest(".wrap,#xv")) return; if(t.closest("button,a")) return; e.preventDefault(); e.stopPropagation(); open(t.currentSrc||t.src); },true);
  Z.addEventListener("wheel",e=>{ e.preventDefault(); zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY); },{passive:false});
  let d=null; const pts=new Map(); let pd=0;
  Z.addEventListener("pointerdown",e=>{ if(e.target.closest("#zbar")) return; Z.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); d={x:e.clientX,y:e.clientY,ox:x,oy:y,moved:false,onImg:e.target===I}; if(pts.size===2){ const [a,b]=[...pts.values()]; pd=Math.hypot(a[0]-b[0],a[1]-b[1]); } Z.classList.add("drag"); });
  Z.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){ const [a,b]=[...pts.values()], nd=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pd) zoomAt(nd/pd,(a[0]+b[0])/2,(a[1]+b[1])/2); pd=nd; if(d) d.moved=true; return; }
    if(!d) return; const dx=e.clientX-d.x, dy=e.clientY-d.y; if(Math.abs(dx)+Math.abs(dy)>4) d.moved=true; x=d.ox+dx; y=d.oy+dy; ap(); });
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) pd=0; if(pts.size===0){ Z.classList.remove("drag"); if(d&&!d.moved&&!d.onImg&&e.type==="pointerup") close(); d=null; } else { const [p]=[...pts.values()]; d={x:p[0],y:p[1],ox:x,oy:y,moved:true}; } };
  Z.addEventListener("pointerup",up); Z.addEventListener("pointercancel",up);
  Z.addEventListener("dblclick",e=>{ if(e.target.closest("#zbar")) return; if(s>fit*1.05) fitIt(); else zoomAt(2.5,e.clientX,e.clientY); });
  Z.querySelector("#zbar").addEventListener("click",e=>{ const b=e.target.closest("[data-z]"); if(!b) return; e.stopPropagation(); const k=b.dataset.z, cx=innerWidth/2, cy=innerHeight/2;
    if(k==="+") zoomAt(1.3,cx,cy); else if(k==="-") zoomAt(1/1.3,cx,cy); else if(k==="0") fitIt(); else close(); });
  document.addEventListener("keydown",e=>{ if(!Z.classList.contains("on")) return; if(e.key==="Escape"){ e.stopPropagation(); close(); } else if(e.key==="+"||e.key==="="){ zoomAt(1.3,innerWidth/2,innerHeight/2); } else if(e.key==="-"){ zoomAt(1/1.3,innerWidth/2,innerHeight/2); } },true);
  addEventListener("resize",()=>{ if(Z.classList.contains("on")) fitIt(); });
})();
</script>
