Schwimmwesten und das Paddel zum Steuern und Manövrieren verstauen und ab geht's.","Von 9 bis 15 Uhr arbeitet Sebastian Keller (18) in einem Altenwohnheim in Hamburg-Altona: Er kümmert sich um die Essensausgabe, putzt die Küche und dann ist noch Zeit, um den Senioren vorzulesen oder mit ihnen Karten zu spielen. Zur selben Zeit putzen Rebecca (12) und Christiane (13) den Eingang des \"Hamburger Michels\", der wohl bekanntesten Kirche der Stadt, und Friderike (17) füttert schon frühmorgens Kühe, Schweine und Hühner auf einem Bio-Bauernhof bei Wedel. \"Endlich mal ein sinnvoller Job\", sagen die fünf übereinstimmend. Sie stehen stellvertretend für etwa 100.000 Jugendliche, die beim \"Sozialen Tag\" mitgemacht haben. Hut ab! Und was mindestens ebenso beeindruckend ist: Der Verein \"Hamburgs Schüler helfen\" (HSH) wurde von Jugendlichen im Jahr 2004 gegründet und seitdem findet jedes Jahr im August der \"Soziale Tag\" statt. Mit Behörden und Firmen haben Schüler aus Hamburg Verträge für einen Tag abgeschlossen. Die Schülerinnen und Schüler verdienen dann am \"Sozialen Tag\" zwischen 6 und 8 Euro pro Stunde – aber nicht für sich selbst, sondern für andere. Denn der Verdienst wird gespendet. Die Jugendlichen wählen selbst ein Projekt aus, an das sie die Gelder spenden wollen. Einzige Bedingung: Es muss ein Projekt sein, von dem Jugendliche profitieren. Im letzten Jahr zum Beispiel wurde die Gesamtsumme von 1,2 Millionen Euro an das Projekt \"Frieden für alle\" gespendet. Dessen Ziel ist es, Jugendliche in Kriegs- und Krisenregionen zu unterstützen, den Dialog unter Jugendlichen aus verschiedenen Ländern zu fördern und auch das Kennenlernen anderer Kulturen zu ermöglichen. Für Ralf Waldner (20) vom HSH steht fest: \"Wir können und werden anderen auch in Zukunft helfen, das Engagement der Schülerinnen und Schüler in Hamburg ist in den letzten Jahren schließlich immer weiter gestiegen.\"","Die Windjacken waren schon eingepackt, die Koffer geschlossen. Thomas Meurer (64) und Wiebke Fuchs (62) aus Hannover freuten sich auf ihre Flusskreuzfahrt mit der \"MS Eurostar\" von Potsdam nach Prag. Stattliche 2500 Euro kostete die Reise pro Person, und beide hatten lange gespart, um sich das leisten zu können. Doch aus der Kreuzfahrt wurde eine Bustour. Meurer berichtet, was er erlebt hat: \"Wir waren am Abend auf das Schiff gegangen und hatten unsere Kabinen bezogen. Am nächsten Morgen ging es los. Aber schon bald machte das Schiff wieder fest und alle Gäste mussten von Bord.\" Wiebke Fuchs ergänzt: \"Der Fluss hatte einfach zu wenig Wasser, da konnten wir mit dem großen Kreuzfahrtschiff nicht weiterfahren!\" Per Bus ging es nach Prag. Beide wollen nun einen Teil des Reisepreises zurück, aber der Veranstalter Hapag-Lloyd wehrt ab: \"Das war höhere Gewalt, da kann man nichts machen.\""],"32a":["Entdecken Sie interessante Städte und Regionen. Im Herzen Deutschlands liegen wunderbare Landschaften, mit einem für deutsche Verhältnisse sehr milden Klima - und keine typischen Touristenziele. Von der Stadt Gießen ausgehend kann man in den hessischen Kreisen Bergstraße und Waldeck-Frankenberg viele Orte entde-cken, die noch ein Geheimtipp sind. Vor allem gilt dies für den Kreis Waldeck-Frankenberg. Wer nicht gerade in Hessen wohnt, wird kaum wissen, wo diese Region eigentlich liegt. Es ist ein herrliches Stück Deutschland ohne besonders große Städte, eine Gegend, die Natur pur bietet. Daher wundert es nicht, dass man hier einige Kurorte findet wie Bad Arolsen oder Bad Wildungen oder den Luftkurort Edertal-Klei-nern. Apropos Edertal: Der zwölf Quadratkilometer große Edersee gehört zu den vier \"schönen blauen Augen\" des Kreises. Der Landkreis Waldeck-Frankenberg ist Hessens attraktivstes Umland. In der Region der Berge und Seen spürt man auch heute noch einen Hauch von Fürstlichkeit: Majestätisch erhebt sich über dem Edersee das Schloss Waldeck. Auch in Bad Arolsen, einer ehemali-gen Residenzstadt, ist vieles noch vom früheren Adel geprägt. Unbedingt besuchen sollte man darüber hinaus das über 1000 Jahre alte Korbach wie auch die Fach-werkstadt Frankenberg.","Pferde waren schon immer Melanie Schilles Leidenschaft. \"Und jetzt kann ich Hobby und Beruf miteinander verbinden\", freut sich die Beamtin aus Hannover. In diesem Jahr verstärkt sie die Strandwache an der Nordseeküste. Ihr Arbeitsplatz ist der Strand: Mit \"Magnus\", einem 11-jährigen Pferd, patrouilliert sie dort, wo die Kleinen Sandburgen bauen, Urlauber bei einem Buch entspannen oder sich in die kühlen Fluten stürzen. Melanie Schille und ihr Hannoveraner sind eine Attraktion in dem Ferienort. Immer wieder wollen Gäste das Tier streicheln, von der Polizistin wissen, was sie hier macht. \"Wir sorgen für mehr Sicherheit am Strand\", erklären Melanie Schille und Rüdiger Teichmann (42). Sie suchen im Watt nach Vermissten, klären über Gefahren auf, verhindern Diebstähle und Sachbeschädigungen. Nach-weislich gingen die Delikte zurück, seit es die Streife hoch zu Ross gibt. Die Polizisten: \"Wir sind in dem unwegsamen Gelände oft schneller am Einsatzort als die Kollegen per Fahrrad oder mit dem Auto. Außerdem schonen wir die Natur.\" Für sich persönlich sieht Melanie Schille noch einen großen Vorteil: \"Es ist schön, mal keine Demonstration sichern zu müssen, stattdessen genieße ich die frische Luft mit fröhlichen Urlaubern.\" Nur eins vermisst die 22-Jährige, die mit Polizeipferd \"Magnus\" auf einem Bauernhof Quartier bezogen hat, während ihres sechswöchigen Einsatzes: Freund Robert (23). Er fährt als Polizist in Hannover Streife und wartet auf sie.","Ein neuer Urlaubstrend setzt sich durch: Statt faul am Strand zu liegen, wird man aktiv. Ein besonders beliebtes Ziel ist Schweden: So kann man am Ufer des Flusses Klarälven in der Provinz Värmland selbst ein Floß bauen. Das dauert drei bis sechs Stunden, anschließend macht man darauf Urlaub. \"Das ist Abenteuerurlaub pur\", schwärmt Johan Bengtson, der mit seiner Frau und den drei Kindern zum zweiten Mal Floßferie rufsein- und -aufstieg. Das ist aber nur bedingt richtig, denn sonst hätten die Frauen auf dem Arbeitsmarkt längst die Nase vorn. Mehr als die Hälfte aller Absolventen an höheren Schulen ist weiblich. Trotz besserer Qualifikation haben Frauen aber das Nachsehen. Zu diesem Schluss kommt eine Untersuchung des städtischen Frauenreferates zur Ausbildungssituation von Frauen und Mädchen in Frankfurt. Eine Erklärung für die schlechte Lage von weiblichen Arbeitskräften ist aber auch die Tatsache, dass Frauen nach wie vor für Familie und Kindererziehung auf Karriere verzichten.","Übergewicht könnte erheblich durch Krankheiten, aber auch durch falsche Essgewohnheiten bedingt sein. Psychiater der Universität Florida haben jetzt das schnelle Essen als mögliche Ursache für Fettleibigkeit entdeckt. Die Wissenschaftler untersuchten, was genau im Hirn bei der Nahrungsaufnahme passiert. Zu diesem Zweck bekamen Testpersonen nach einer zwölfstündigen Fastenzeit eine Zuckerlösung zu trinken. Zuerst zeigte sich verstärkte Gehirntätigkeit, ausgelöst durch Schlucken, Geruch und Geschmack. Dann, zehn Minuten später, signalisierte das Gehirn, dass der Körper genug habe. Bei Menschen, die zu schnell essen, ist dieses Signal stark verzögert. Daher dürfte das Sprichwort \"Iss langsam, Kind!\" tatsächlich eine Weisheit sein.","Wenn Sie mehr über richtige Ernährung und das ideale Gewicht wissen wollen, informieren Sie der \"Fonds Gesundes Österreich\" und der Verein für Konsumenteninformation. Unter 0 810 810 27 werden gratis firmenunabhängige, wissenschaftlich fundierte Informationen über ausgewogene und gesunde Ernährung angeboten. Die Verantwortlichen reagieren damit auf den erschreckenden Trend, dass die Zahl der dicken Menschen, darunter vor allem Kinder, immer mehr zunimmt. In den vergangenen 15 Jahren habe sich die Zahl übergewichtiger Kinder und Jugendlicher mehr als verdoppelt. Bewegungsmangel und fettes Essen seien die Hauptgründe dafür.","Das Arbeitsamt Berlin hat seine beiden Informationshefte \"Alternative zum Studium\" neu aufgelegt. Auf 200 Seiten zeigt die Behörde neue Ausbildungsmöglichkeiten für junge Frauen und Männer nach der Schule außerhalb der Universitäten. Ein Heft befasst sich mit betriebswirtschaftlichen Ausbildungen bzw. fremdsprachlichen Angeboten im sozialen Bereich, das andere mit dem technisch-naturwissenschaftlichen Bereich. Mit diesen Broschüren geht auch eine Informationswoche einher, die die hohe Zahl an Studienbewerbern in Deutschland reduzieren helfen und andere Wege einer guten Berufsausbildung für junge Leute aufzeigen soll.","Junge Frauen in der Schweiz sollen nun mehr Chancen für eine offene Berufswahl haben. Mit einer Motivationskampagne wollen die Fachleute zum Umdenken anregen und neue Horizonte öffnen. \"Von wem würden Sie lieber Ihr Auto reparieren lassen?\" oder \"Wem vertrauen Sie eher eine Herzoperation an?\", heißt es unter jeweils zwei Portraits einer Frau und eines Mannes. Die Plakate sollen für den \"kleinen Unterschied\" im Kopf sensibilisieren, wonach Frauen nicht dasselbe zugetraut wird wie Männern. Immer noch ergreifen junge Frauen typische Frauenberufe wie Textilverkäuferin oder Sekretärin. Mit einem Internetwettbewerb soll das Thema \"Frauen und Technik\" fokussiert werden, im Speziellen der Informationssektor, der in der Schweiz noch ganz in Männerhand ist."],"37":["Wie wäre es, bei wildfremden Menschen einzuziehen und während der eigenen Reise dort zu übernachten? Wer nach unmittelbarer Bekanntschaft mit dem Reiseziel und seinen Gepflogenheiten lechzt, betreibt heute Couchsurfing. Private Gastgeber auf allen Kontinenten bieten im Internet eine Schlafgelegenheit an. Geben und Nehmen heißt das Prinzip des neuen Reisetrends: Wer bereits eine Couch in New York in Anspruch genommen hat, kann auch sein Sofa in St. Pölten für andere Touristen anbieten. Sechs Millionen Menschen weltweit wissen, wie sich so etwas anfühlt, denn sie alle sind Mitglieder bei wwwcouchsurfingorg, dem größten Online-Portal zur Vermittlung von kostenlosen Übernachtungsmöglichkeiten. Hier suchen Abenteuerlustige nach privaten Übernachtungsmöglichkeiten aus aller Welt. In über 100.000 Städten sind Couchsurfer angemeldet und dementsprechend ist die Wahrscheinlichkeit recht hoch, im Urlaub als Gast bei Fremden einzuziehen. Doch genau diesen Begriff vermeidet man auf der Homepage galant, aber bestimmt. Von „Fremden“ ist hier nicht die Rede, vielmehr von „Freunden, die du noch nicht getroffen hast“.","Darauf, zu einem Wildfremden ins Auto zu steigen, basiert die Geschäftsidee von Mitfahrplattformen im Internet. Ihr Prinzip: Wer mit dem Auto von A nach B fahren will und noch Plätze frei hat, sucht online oder via App nach Mitfahrern, um sein Auto zu füllen und sich die Benzinkosten zu teilen. Das dürfte funktionieren, denn solche Websites gibt es mittlerweile zuhauf. Neu sind Mitfahrbörsen nicht: Schon in den 1950ern wurde in Frankfurt am Main - ganz und gar offline - eine Mitfahrzentrale gegründet. Eigentlich wie Autostoppen, nur besser planbar. Mit dem Internet wurde die Organisation dann noch leichter. Heute weiß man vorab schon eine ganze Menge über die potenziellen Chauffeure: Sie haben Profile, auf denen sie nicht nur sich selbst, sondern auch ihr Auto präsentieren. Auch eine Ausweiskopie kann dem Profil beigefügt werden.","Langes Stehen tut selten gut, das gilt auch für Autos. Bei wenig genutzten Fahrzeugen kann unter anderem Rost an Blech und Bremsen entstehen. Damit der Wagen nach längerer Standzeit nicht nur anspringt, sondern auch verlässlich läuft, ist Vorsorge nötig. Früher wurde empfohlen, das Auto vollzutanken, damit kein Rost im Tank entsteht. Dieser Ratschlag erübrigt sich schon seit längerer Zeit, denn seit Mitte der 80er Jahre haben Autos meist einen Kunststofftank. Während es bei älteren Autos empfehlenswert sein kann, die Batterie auszubauen, verursache dies bei neueren Modellen häufig Probleme mit der Elektronik. Besonders wichtig ist eine geeignete Unterstellmöglichkeit. Wenn es ein teures Fahrzeug ist, sollten Sie überlegen, einen Stellplatz zu mieten. Die Fachleute raten außerdem dazu, etwas mehr Luft in die Reifen zu pumpen, weil schon die Temperaturunterschiede den Druck deutlich sinken lassen können. Damit der Wagen in Form bleibt, gilt aber eigentlich das Motto „Fahren, fahren, fahren“. Wer sein Auto nicht selbst bewegt, kann dies andere für sich erledigen lassen. Solche Ersatz-Fahrer findet man auf Vermittlungsportalen im Internet.","Es gibt einen neuen Trend, der nicht nur in Deutschland, sondern weltweit Einzug hält: „Nutzen statt Besitzen“ lautet er und umfasst so unterschiedliche Praktiken wie Wohnungstausch, Kleidertauschpartys, Autogemeinschaften, Gemeinschaftsgärten, Tauschringe für Werkzeuge, Drucker oder DVDs und vieles andere mehr. Das Internet macht’s möglich: Tauschplattformen für Dinge, Wohnungen oder private Autos ermöglichen es, schnell und unkompliziert denjenigen zu finden, der (oder die) das hat, was ich brauche. Mit der Verbreitung digitaler Leih-, Miet- und Tauschmodelle entstehen neue Geschäftsformen, die sich auf einer neuen „Währung“ gründen: Vertrauen. Vertrauen, dass der andere meine Dinge gut behandelt und mich nicht hinters Licht führt, obwohl ich den anderen noch nie gesehen habe.","Warum den teuren Zug oder Flieger nehmen, wenn es doch per Anhalter viel günstiger geht? Besonders junge Leute heben gerne den Daumen, um von A nach B zu kommen. Beim Autostoppen sollte man jedoch einige gesetzliche Regeln kennen. In Österreich ist Autostoppen auf Autobahnen oder Autostraßen - generell und unabhängig vom Alter - verboten. Auf Autobahn-Parkplätzen, Raststationen und an allen anderen Straßen ist an übersichtlichen Stellen das Autostoppen erlaubt. Es gilt jedoch, bundeslandspezifische Altersbestimmungen zu beachten. In Kärnten und Vorarlberg ist das Autostoppen unter 14, in der Steiermark unter 15 Jahren verboten. Wer im Ausland autostoppen will, sollte sich vorab mit rechtlichen Bestimmungen und landesüblichen Gewohnheiten vertraut machen. Beispielsweise setzen Autofahrer in manchen Ländern wie Rumänien, Indien und Mexiko eine Bezahlung voraus. In den USA, Kanada oder Australien kommt es auf den jeweiligen Bundesstaat an, ob Autostoppen erlaubt ist. In vielen afrikanischen Ländern wiederum ist Trampen selbstverständlich und ersetzt die oftmals fehlenden öffentlichen Verkehrsmittel."],"38":["Bonbons machen Kinder glücklich, und zwar nicht erst seit gestern: Denn diese beliebte Süßigkeit ist viel älter, als man allgemein vermuten würde. Schon vor über 1 000 Jahren gab es im antiken China, in Griechenland und im Römischen Reich Süßwaren aus Honig, Blüten und Früchten. Wer noch mehr über Bonbons erfahren möchte, sollte einen Ausflug nach Vaihingen an der Enz unternehmen: Dort gibt es nicht nur seit 1828 die Bonbonund Zuckerwarenfabrik Jung, sondern auch das einzige Bonbon-Museum Deutschlands. Auf 300 Quadratmetern Ausstellungsfläche findet sich Antwort auf viele bunte Fragen: Man erfährt dort etwa, woher Bonbons kommen, wie sie ihre heutige Form erhielten und wie sie überhaupt hergestellt werden. Gezeigt werden auch Bonbondosen, Bonbon-Maschinen und Werbemittel. Beim Rundgang durch das Museum übernehmen kleine und große Besucher echte Teile aus den frühen Herstellungsstätten und verfolgen die Entwicklung bis zur Fabrikproduktion unserer Zeit.","Am Frankfurter Hauptbahnhof können Reisende beim Warten auf den Zug noch schnell einen besonderen Snack genießen. Denn am Bahnhof steht jetzt ein Rettomat: ein Automat, an dem abgelaufene Schokoriegel, Chips, Nüsse und andere Lebensmittel verkauft werden. Das Mindesthaltbarkeitsdatum der Produkte ist in den meisten Fällen fast abgelaufen, daher werden sie günstiger angeboten als im Handel. Auch Getränke hält der Automat bereit. \"Die Produkte sind überschüssig beziehungsweise stehen kurz vor oder nach dem Ablauf des Mindesthaltbarkeitsdatums, sind aber trotzdem noch gut\", erklärt ein Sprecher der Deutschen Bahn. Denn sie werden natürlich sorgfältig geprüft. Mit dem neuen Service wolle der Konzern den Bahnhof noch attraktiver machen und so Ressourcen schützen. Fahrgäste sollen die Möglichkeit erhalten, sich mit Süßigkeiten und Knabbereien zu versorgen und gleichzeitig etwas gegen die Lebensmittelverschwendung zu tun. Außerdem könnten Vorbeigehende und Reisende bei einer kleinen Probiergabe darüber, dass viele Lebensmittel weggeworfen werden, aufgeklärt werden. 3.","Wo heißes Wasser aus der Erde sprudelt, hat sich vielerorts das Bäderund Kurwesen gut entwickelt. Schon im alten Rom wusste man, dass ein Bad im warmen Wasser wohltuend ist und gegen Alltagsstress, Verspannungen und Ermüdung wirkt. Badeeinrichtungen gab es überall im Römischen Reich. Gegen eine geringe Eintrittsgebühr konnte jeder, egal welche Erhebung seiner in der gesellschaftlichen Rangordnung, die Anlagen genießen; diese boten Platz für bis zu 1000 Menschen. Von ähnlichen Bauten und der speziellen Architektur konnten viele europäische Städte profitieren und Badeluxus kopieren. Möglichst prachtvoll wurden sie gebaut, sollten eindrucksvoll sein, und wertvolle Mosaikund Marmorböden, mehrere Badebecken sowie Räume für Schwitzund Dampfbäder machten sie zu gesellschaftlichen Begegnungsorten. Doch die besonderen Freizeiteinrichtungen spielten auch im gesellschaftlichen Leben eine Rolle: Denn das Gesuchte für das Auge verbandet sich hier überall auch mit einer angenehmen Atmosphäre, wo die ein Besuch in einer Therme zu einem beliebten Freizeitziel in vielerlei Art. Mit den veränderten demokratischen Bedürfnissen wurden die römische Bauweise erhalten, aber die Grenze etwas reduziert.","Nicht nur in Hollywoodfilmen tröstet man sich bei Liebeskummer mit Pralinen: Der Griff zu Süßigkeiten ist überall weit verbreitet. Viele glauben, dass sie die Stimmung aufhellen, die Konzentration verbessern oder gegen \"Nachmittagstiefs\" im Büro helfen. Doch damit liegen sie womöglich falsch. Denn Wissenschaftler haben nun genauer erforscht, wie Zucker auf unser Gemüt wirkt. In ihrer Studie stellten sie praktisch keinen positiven Einfluss des Zuckerkonsums auf die Laune fest – im Gegenteil. \"Die Idee, dass Zucker die Stimmung heben kann, ist auf der ganzen Welt verbreitet\", sagt Konstantin Grüger von der Humboldt-Universität in Berlin. \"Unser Ergebnis bietet jedoch eigentlich keinen Anhaltspunkt dafür.\" Im Gegenteil: \"Eher sorgt Zucker dafür, dass wir uns schlechter fühlen.\" Die Auswertung deutet darauf hin, dass Probanden nach Zuckerkonsum müder und unkonzentrierter waren als jene, die nur ein Placebo bekommen hatten.","Wellness und der Besuch von Kurorten und Thermalbädern haben seit Jahrhunderten Tradition in Ungarn. Das Land besitzt zwar keinen direkten Zugang zum Meer, aber dafür wimmelt es in diesem Binnenstaat nur so von Thermalquellen. Dabei handelt es sich um Quellen, aus denen Grundwasser austritt, das über 20 Grad warm ist. Dieses Wasser enthält Mineralstoffe, denen eine positive Wirkung auf den Organismus zugeschrieben wird. 123 Thermalquellen finden sich allein in Budapest, das berühmt für seine Bäder ist. Diese Stadt ist damit nicht nur das einzige Kurbad, das zugleich die Hauptstadt eines Landes ist, sondern auch die größte Kurstadt Europas. In Budapest kann man zwischen über 20 Bädern wählen. Viele sind Bauten von beträchtlichem historischem und architektonischem Rang. Obwohl Budapest auch eine ausgeprägte Café-Kultur besitzt, sind die Bäder für die Stadtbewohner wichtige Treffpunkte - denn oft verabreden sich Freunde in einem Bad."],"39":["Im Winter ziehen sich viele Tiere in den Winterschlaf zurück, um Energie zu sparen. Während dieser Zeit wird ihr Stoffwechsel langsamer, und ihre Körpertemperatur sinkt. Dies hilft ihnen, über einen längeren Zeitraum ohne Nahrung auszukommen. Beispiele für Tiere, die Winterschlaf halten, sind Igel, Fledermäuse und Murmeltiere.","Laut einer Studie der Universität Leipzig fördert natürliches Licht die Lernfähigkeit von Schülern. Klassenzimmer mit viel Tageslicht sorgen dafür, dass die Schüler aufmerksamer und konzentrierter sind. Die Forscher stellten außerdem fest, dass ausreichend Licht die Stimmung hebt und das Lernklima verbessert.","Ein regelmäßiger Schlafrhythmus ist wichtig für die Gesundheit. Während des Schlafs produziert unser Körper das Hormon Melatonin, das den Schlaf-Wach-Rhythmus reguliert. Melatonin unterstützt den Körper dabei, sich zu entspannen, und sorgt für eine erholsame Nacht. Ein gestörter Schlafrhythmus kann jedoch zu Gesundheitsproblemen führen.","In den letzten Jahren ist das nächtliche Wandern in der Natur zu einer beliebten Freizeitaktivität geworden. Gesundheitsexperten empfehlen, diese Praxis nicht zu verbieten, da sie positive Auswirkungen auf die körperliche und geistige Gesundheit hat. Nachts zu wandern hilft, Stress abzubauen, die Sinne zu schärfen und die Verbindung zur Natur zu stärken. Zudem fördert es die Produktion von Melatonin, das den Schlaf-Wach-Rhythmus reguliert und bei Schlafproblemen hilft. Experten betonen, dass diese Bewegung besonders wohltuend ist, solange sie sicher und in geeigneten Bedingungen stattfindet.","Professor Dr. Thoma Münch von der Universität Freiburg führte eine Studie durch, die den Zusammenhang zwischen Arbeitszeiten, Tageslicht und der Gesundheit von Arbeitnehmern untersuchte. Die Ergebnisse zeigten, dass Menschen, die ihre Arbeitszeiten besser an den natürlichen Sonnenrhythmus anpassen, weniger unter Schlafstörungen und chronischer Müdigkeit leiden. Außerdem trägt der tägliche Fußweg zur Arbeit, besonders bei Tageslicht, nicht nur zur körperlichen Gesundheit bei, sondern verbessert auch die psychische Verfassung. Der Kontakt mit natürlichem Licht reguliert den Hormonhaushalt, insbesondere die Produktion von Melatonin und Serotonin, was entscheidend für das Wohlbefinden ist."],"40":["Die zunehmende Klimaveränderung macht sich bereits in der Tierwelt bemerkbar. So müssen Zugvögel ihre Eier früher legen, um sich an die wärmeren Frühjahrstemperaturen in ihren gewohnten Brutregionen anzupassen. Bei bestimmten Arten ist das Zugverhalten aber nicht nur abhängig vom Klima, sondern auch von anderen Reizen, wie zum Beispiel der Länge der Tage. Diesen Vogelarten fällt es besonders schwer, die Eiablage an die geänderten klimatischen Bedingungen anzupassen. Zugvögel, die eine besonders lange Strecke zwischen ihren Überwinterungsplätzen und den Brutstätten zurücklegen müssen, sind durch das Zusammenspiel von Temperaturänderung und anderen, unveränderten Außenbedingungen besonders leicht zu verwirren. Denn der Zeitpunkt für den Abflug aus den Überwinterungsregionen wird von Einflüssen bestimmt, die nichts mit der Temperatur zu tun haben. Einige Auslöser für die Wanderung sind auch genetisch bedingt. Die Tiere kehren in der Regel dann zurück, wenn es die meisten Insekten als Nahrung für ihren Nachwuchs gibt.","Das Klima hatte einen entscheidenden Einfluss auf die Entwicklung des Menschen, vermuten Wissenschaftler. Sie stellten einen Klimakalender des Menschen zusammen, demzufolge fünf dramatische Klimaänderungen zur Evolution des Menschen beigetragen haben. Die Klimawandlungen hätten diese drastisch beschleunigt. Die Notwendigkeit, sich an neue Umstände anzupassen, habe die Entwicklung des Gehirns beschleunigt und zum aufrechten Gang beigetragen. Auch die Entwicklung von verschiedenen Arbeitsgeräten sei teilweise durch den Klimawandel bedingt, denn die Veränderungen der Umweltbedingungen fielen zeitlich mit dem Erscheinen der ersten Vorfahren des Menschen in den betroffenen Gebieten zusammen. Sucht man nach einem Merkmal, das den Menschen vom Tierreich abhebt, so ist das vermutlich eine außerordentliche Unabhängigkeit gegenüber den Launen der Natur. Einer Hypothese zufolge war es das stetig wechselnde Klima, das den Mensch zum Menschen machte. Die ungewissen und sich ändernden Lebensbedingungen seien demnach während der letzten sechs Millionen Jahre der entscheidende Faktor in der Evolution des Menschen gewesen.","Fast dreizehn Jahrhunderte lang blühte die Hochkultur der Maya, bis es zu ihrem Zusammenbruch kam. Fachleute diskutieren seit Jahrzehnten, was den plötzlichen Kollaps auslöste: Kriege, Hunger oder das Klima? Eine neue Studie spricht für Letzteres: Anhaltende Trockenheit führte demnach zum Untergang - zumindest indirekt. Rund um Christi Geburt entwickelte sich im Süden und Südosten Mexikos sowie in Teilen von Guatemala, Belize und Honduras die Hochkultur der Maya. In ihren Inschriften sind Kriege, Hochzeiten und Thronfolgen exakt festgehalten. Das Ende dieser Aufzeichnungen markiert auch den Beginn des Niedergangs: Zwischen dem 8. und dem 10. Jahrhundert wurden viele Städte aufgegeben und die Bevölkerung ging drastisch zurück. Für diesen Kollaps gibt es heute mehrere Erklärungen: Lange Zeit vermutete man vor allem blutige Auseinandersetzungen, Invasionen und soziale Konflikte dahinter, auch Epidemien und Naturkatastrophen standen als mögliche Auslöser zur Diskussion. Erst in den letzten zwanzig Jahren mehren sich die Stimmen, dass eine Veränderung des Klimas die Triebfeder für den Untergang der Hochkultur gewesen sein könnte.","Experten nehmen an, dass Tag für Tag rund 100 Tierarten aussterben. Sie gehen davon aus, dass innerhalb der nächsten 20 Jahre weltweit ein Viertel aller bislang bekannten Arten ausgestorben sein wird. Der Mensch treibt dieses Artensterben stark voran: Die Zerstörung von natürlichem Lebensraum, Umweltverschmutzung und Krankheiten gefährden Tiere und Pflanzen. Ohne das Einwirken des Menschen auf die verschiedenen Ökosysteme der ganzen Welt würden pro Jahr höchstens 25 Arten aussterben. Neben dem eigentlichen Verlust der jeweiligen Art hat das Aussterben der Tiere Folgen für das gesamte Ökosystem: Sein natürliches Gleichgewicht wird gestört. Wenn eine Art stirbt, sterben auch andere abhängige Arten.","Wie eng eine Art mit ihrem Lebensraum verbunden ist, zeigt sich oft erst, wenn sie nicht mehr da ist. War sie ein wichtiges Glied in der Nahrungskette, dann verschwinden plötzlich auch andere Lebewesen. Darüber, wie viele Arten es überhaupt gibt, gibt es unterschiedliche Schätzungen. Wissenschaftler gehen jedoch davon aus, dass der größte Teil noch gar nicht entdeckt ist. Das jetzige Tempo vorausgesetzt, würde es noch mehrere hundert Jahre dauern, bis alle Arten beschrieben sind. Wir kennen nur knapp zwei Millionen von geschätzten 30 Millionen Arten. Von sehr vielen Arten wissen wir nichts über ihre Rolle im Ökosystem – und schon gar nicht, in welcher Weise sie für den Menschen nützlich sein könnten. Aber immer mehr Lebensräume und damit Artenbestände werden ausgelöscht. Die Vereinten Nationen schätzen, dass täglich 130 Tier- und Pflanzenarten aussterben."],"41":["Das Kunstwort „Mnemo“-Technik tritt seit dem 19. Jahrhundert an die Stelle des Begriffes „Gedächtniskunst“. Sinn und Ziel der Mnemotechnik (aus dem Griechischen: „Gedächtnis“, „Erinnerung“) ist die reichhaltige Aufnahme von Informationen und deren gute Verarbeitung. Daraus kristallisiert sich ein bewusstes „sich Erinnern“ – und zwar auf Dauer! Vulgo „Eselsbrücken“ bauen, Reime bilden, innere Bilder entwickeln. Es handelt sich also um ein kluges Schema effektiven Lernens und Erinnerns. Eine wichtige Rolle dabei spielt die Assoziations-Technik. Will man sich eine Reihe verschiedener Dinge merken, ist es sinnvoll, sich diese bildhaft vorzustellen. Danach stellt man in Form einer lustigen oder schrecklichen Geschichte eine Verknüpfung her.","Stundenlanges Strebern? Das ist Geschichte. Lernen geht schneller und leichter, wenn man sich an sechs Tipps hält. Will man etwas Neues lernen, reichen wenige Minuten täglich pro Unterrichtsfach. Eine Anleitung nicht nur für Streber. Stundenlanges Lernen? Nein, danke, das kommt für die Schüler von Wilfried Helms nicht in Frage. „Wenige Minuten täglich reichen pro Unterrichtsfach, wenn man etwas Neues lernen will. Gerade wenn man Probleme in einem Fach hat, ist das genug“, sagt der Gründer des Lernzentrums „Mind Unlimited“. Einzige Bedingung: Wer wirklich etwas lernen und behalten will, braucht einen Überraschungseffekt - und ein Glücksgefühl. „Unser Gehirn ist im Grunde ein fauler Sack“, erklärt Helms, „deshalb lernt es nur, wenn es einen Grund hat.“ Das heißt, wenn es wachgerüttelt wird, weil eine neue Aufgabe verlangt wird. Das Wachrütteln von Schülerköpfen gelingt aber nur, wenn Eltern oder Lehrer eine gute Beziehung zu den Kindern haben. Denn erst die sorgt dafür, dass der Schüler nicht gleichgültig vor dem Stoff sitzt. Nur dann schüttet der Körper Stoffe aus, durch die sich das Gehirn aufs Büffeln einstellt. Das ist der Überraschungseffekt.","Wer ein digitales Quiz zusammenstellen wollte, brauchte noch vor kurzem viel Zeit und technisches Know-how. Doch das sind „Tempi passati“ – dank Michael Hielscher von der Pädagogischen Hochschule Bern. Ein Wort-Bild-Memory zu basteln, ist kinderleicht: Man tippt dazu einen Begriff ins Onlineformular ein. Danach sucht man ein passendes Bild im Wikimedia-Fundus, oder man lädt ein eigenes hoch. Und weiter geht es zum nächsten Begriff... Dank der kostenlosen Website Learningappsorg kann heute jedermann eigene Lerneinheiten erstellen und im Web publizieren. Noch vor zwei, drei Jahren musste man auf dem Weg zum eigenen Onlinequiz mehr Hürden nehmen: Es waren besondere Informatikkenntnisse erforderlich und oft war das mit viel Geld und Zeit verbunden. Zwar gibt es heute einige kostenlose E-Learning-Plattformen. Diese sind aber oft so umständlich zu bedienen, dass der Großteil der Lehrer und Kursleiter sie ignoriert.","Es ist eine Schwäche unseres Gehirns: Je älter man wird, desto schwerer wird es, sich Dinge zu merken. Viele Hirnjogging-Produkte versprechen eine bessere Gedächtnisleistung – viele davon sind jedoch nutzlos. Was aber hilft wirklich? Gedächtnisforscher wissen: Reines Auswendiglernen ist nicht genug. „Jeden Tag ein Kreuzworträtsel lösen heißt noch nicht, dass Sie sich den Einkaufzettel besser merken können“, so Hans Georg Nehen, Professor an der Memory-Clinic in Essen. Sinnvoll seien andere einfache Übungen. „Wenn Sie an der roten Ampel stehen, gehen Sie in Gedanken Ihren Weg zurück. Wie viele Kreuzungen haben Sie passiert?“ Oder man stellt sich vor dem geistigen Auge vor, wie viele Kreuzungen noch kommen. „Schon eine geringe Trainingsdauer ist effizient“, betont Nehen, der auch dem Bundesverband Gedächtnistraining vorsitzt. Das sieht Markus Hofmann ähnlich: „Es aktiviert das Hirn, sich jeden Tag neuen geistigen Aufgaben zu stellen.“ Nicht immer dasselbe zu machen – das sei pures Gehirnjogging, sagt der Gedächtnistrainer aus München. „Putzen Sie sich mal mit links die Zähne, fahren Sie einen anderen Weg zur Arbeit, drehen Sie die Zeitung zum Lesen auf den Kopf oder dirigieren Sie bei Ihrer Lieblings-CD mit.“","Mit der richtigen Ernährung werden Sie zwar nicht schlauer, doch der Verzehr bestimmter Lebensmittel soll die Konzentration und Leistungsfähigkeit steigern und Stress reduzieren. Blaubeeren, Nüsse, Avocados, Lachs und Hülsenfrüchte schmecken nicht nur unglaublich gut, sondern sind wahre Energielieferanten fürs Gehirn: Brainfood. Natürlich werden wir durch Lebensmittel nicht schlauer, die in ihnen steckenden Vitamine und Mineralstoffe können jedoch Leistungstiefs, Konzentrationsschwächen, Gereiztheit und Müdigkeit vorbeugen. Zuallererst gilt: viel trinken. Nur mit ausreichend Flüssigkeit sind ausreichende Sauerstoffversorgung und die Durchblutung von Kopf und Körper gewährleistet. Leichte Kopfschmerzen, Konzentrationsschwierigkeiten und Müdigkeit können erste Anzeichen für einen Flüssigkeitsmangel sein. Mindestens 2 Liter kalorienarmer Getränke sollten über den Tag verteilt getrunken werden: Am besten Wasser oder kalorienarme Säfte und Kräutertees. Mehr Kraft erhält der Kopf auch durch Zucker, der langsam ins Blut abgegeben wird, z.B. aus Kohlehydraten, wie sie in Vollkornprodukten stecken. Auch die Kohlenhydrate aus Hülsenfrüchten werden erst aufgespalten und dann vom Körper aufgenommen, was für einen konstanten Blutzuckerspiegel sorgt."],"42":["Wer im Alter nicht mehr alleine wohnen, aber dennoch ein eigenständiges und selbstbestimmtes Leben führen möchte, begibt sich in den meisten Fällen auf die Suche nach einer entsprechenden Einrichtung. Konventionell geführte Seniorenheime und -residenzen haben allerdings den Nachteil, dass die dort geltenden Regeln die Bewohner einschränken. Für viele Ältere beziehungsweise deren unmittelbare Angehörige ist zudem die finanzielle Leistbarkeit ein ausschlaggebendes Thema, denn die durchschnittliche Pension erlaubt keine allzu hohen Ausgaben. Eine günstigere Alternative bietet nun ein neues Wohnprojekt, das aus einer Kooperation entstanden ist.","Als junger Mensch in Wien auf Wohnungssuche zu sein, ist allenfalls eine große Herausforderung. Wer ein Studium an der Universität oder Fachhochschule aufnimmt oder gerade einen Ausbildungsplatz in der Hauptstadt Österreichs erhalten hat, dem fehlen allzu oft die finanziellen Mittel, um ein halbwegs annehmbares Quartier zu finden. Die anfänglichen Kosten, die bereits vor dem Einzug in die neue Wohnung fällig sind, können durch die geforderte Kaution von meist drei Bruttomonatsmieten sowie die Vermittlungsgebühren für Maklerbüros enorm hoch werden. Um eine günstige Gemeindewohnung beantragen zu können, muss man bereits mehrere Jahre in Wien hauptgemeldet sein, und auch dann ist Geduld angebracht. Bei einer Anmeldung sind zudem gleich alle Suchkriterien festzulegen, also etwa Wunschbezirk und Quadratmeteranzahl. Für jene, die gerade die ersten selbstständigen Schritte tun, lässt sich allerdings die Zukunft kaum so genau vorausplanen. Gemeindewohnungen sind daher meist keine Option. Die Stadt Wien will nun in den kommenden Jahren zunehmend Wohnprojekte mit flexiblen Vertragsbedingungen und kurzen Kündigungsfristen fördern und sich damit stärker an der Situation junger Leute orientieren.","Wohnen wie immer? Laut Ansicht des renommierten Zukunftsforschers Adrian Gregorius wird sich innerhalb der nächsten paar Jahrzehnte ein Wandel in unserer Wohnkultur vollziehen, der durch die Bevölkerungszunahme in den Städten bedingt wird. Die Konzentration eines großen Anteils der Bevölkerung im Stadtgebiet sieht Gregorius - im deutlich wahrnehmbaren Gegensatz zum ungebremsten Landschaftsverbrauch in den umliegenden Regionen – jedoch keineswegs grundsätzlich als Problem. Vielmehr sei das Leben in der Stadt, wenn es richtig geplant und umgesetzt werde, sowohl ressourcen- als auch energieschonend. Des Weiteren entfalle der klimaschädliche und stressige Berufsverkehr und eine private Autonutzung werde weitgehend überflüssig, da die gesamte städtische Infrastruktur vor Ort zur Verfügung stehe. Nicht nur die Dichte, sondern auch die veränderten Gesellschaftsstrukturen werden es daher erforderlich machen, das Konzept des Wohnens in privaten und flexibel gemeinschaftlich nutzbaren Räumen adäquat anzupassen sowie Naturflächen im Nahbereich neu zu gestalten. Einheitslösungen könne es dabei nicht geben, so der Zukunftsforscher. Unterschiedliche Lebens-, Bau- und Wohnformen müssten der Vielfalt der Stadtbewohner Rechnung tragen.","Dass sich die Menschen einmal danach sehnen würden, möglichst wenig Wohnfläche zur Verfügung zu haben, hätte wohl niemand vermutet. Eine neue, von den Vereinigten Staaten ausgehende Bewegung zielt nun darauf ab, sich von überflüssigen materiellen Dingen zu trennen und nur mehr das zu behalten, was auf einer Fläche von 15 bis 20 Quadratmetern Platz findet. Die sogenannten Tiny Houses, also kleinen Häuser, erfreuen sich auch in Österreich immer größerer Beliebtheit, da ihre Anschaffungskosten gering sind und sie bei Bedarf auch per LKW an einen anderen Standort gebracht werden können. Dadurch ist man als Besitzer eines solchen Eigenheims sehr flexibel, was die Wahl des Wohnorts anbelangt. Es bedarf nur eines kleinen Stellplatzes, der für eine bestimmte Zeit gemietet oder gepachtet wird. Besonders vonseiten ländlicher Gemeinden, die stark vom Abzug Einheimischer betroffen sind, besteht großes Interesse daran, dass auf diese Art Personen in entlegeneren Ortschaften wieder ansässig werden. Deswegen wurden mancherorts – oftmals auf Initiative der Bürgermeister – bereits Vermittlungsbörsen für Interessierte eingerichtet.","Wer hat insgeheim nicht jenen Tag herbeigesehnt, an dem die Kinder endlich selbstständig werden, eigenes Geld verdienen, das gemeinsame Zuhause verlassen und man das eigene Leben wieder in die Hand nehmen kann? Für viele Eltern ist jedoch das Fehlen des Nachwuchses in den heimischen vier Wänden letztendlich ein richtiger Schlag, der das Ende eines Lebensabschnitts signalisiert, in welchem man als Versorger gebraucht wurde. Zu alledem gesellt sich der Umstand, dass man sich des eigenen Älterwerdens zunehmend bewusst wird. Tatsächlich kommt nun also eine schwierige, oftmals zu Depressionen führende Phase der Umorientierung auf die Eltern zu. Um das Gefühl von Einsamkeit und Leere zu überwinden, entschließt sich so manches Paar zu dem durchaus radikalen Schritt, das nun für zwei ältere Personen viel zu große Heim zu veräußern und sich etwas Kleineres und Günstigeres zu suchen, das besser zu den neuen Gegebenheiten passt, anstatt die vorhandenen, nun freistehenden Räumlichkeiten im Familienheim umzugestalten oder für einen eventuellen Besuch der Kinder bereitzuhalten."],"16":["Die meisten Menschen verbinden den Begriff Barrierefreiheit mit dem Zugang zu Gebäuden oder Transportmitteln. Dabei betrifft Barrierefreiheit viel mehr Bereiche unseres Alltags, so zum Beispiel auch die Informations- und Kommunikationstechnologie. Die APA, die Austria Presse Agentur, hat deshalb einen Nachrichtendienst in einfacher und leicht verständlicher Sprache ins Leben gerufen. Er wendet sich an Menschen, die Lese- oder Lernschwierigkeiten haben oder die die deutsche Sprache noch nicht so gut beherrschen. Für diesen Nachrichtendienst werden die wichtigsten Meldungen des Tages aus Politik, Wirtschaft, Sport, Kultur und Lokalnachrichten für die Niveaustufen A2 und B1 geschrieben. Interessenten können sich die Texte fünfmal pro Woche am späten Nachmittag per E-Mail schicken lassen oder über eine besondere Informationsplattform bekommen. Das Projekt wird vom Sozialministerium gefördert und wurde gemeinsam mit einem Grazer Unternehmen entwickelt, das auf Textübertragungen für verschiedene Schwierigkeitsstufen spezialisiert ist. Der Nachrichtendienst wurde bereits als innovativer Beitrag zum Thema Barrierefreiheit ausgezeichnet.","Die WHO, die Weltgesundheitsorganisation, warnt vor den Folgen ungesunder Werbung im Internet. Kinder und Jugendliche treffen beim Nutzen der Sozialen Medien häufig auf Anzeigen für ungesunde Lebensmittel wie Süßigkeiten oder salzige und fettreiche Snacks. So werden Übergewicht und damit zusammenhängende Krankheiten im Erwachsenenalter gefördert, mahnt die Organisation. Sie fordert deshalb Regierungen dazu auf, diese Werbung zum Schutze der Kinder stärker zu begrenzen. Die WHO weist außerdem auf die Gefahr von Bewegungsmangel im Zusammenhang mit den Neuen Medien hin. Das betrifft nicht nur Jugendliche, sondern auch Kleinkinder. Gerade in den ersten Lebensjahren sollte der natürliche Bewegungsdrang der Kinder genutzt werden, damit sie Freude an Bewegung und Sport entwickeln. Kleinkinder sollten sich mindestens drei Stunden pro Tag bewegen und so wenig Zeit wie möglich vor einem Bildschirm verbringen. Überhaupt sollten Kinder, die jünger als zwei Jahre sind, grundsätzlich nicht vor ein Tablet oder einen PC gesetzt werden. Denn wer viel sitzt, wird in der Folge leichter krank.","Schülerinnen und Schüler sollen im Schulunterricht auch den Umgang mit Nachrichten lernen. Das forderten kürzlich in Wien die Teilnehmenden an einer Konferenz zur politischen Bildung von Jugendlichen. Das Ziel dabei ist, jungen Menschen den kritischen Umgang mit den Inhalten und der Präsentation von Nachrichten beizubringen. Heute ist der Zugriff auf Nachrichtensendungen so einfach wie noch nie. Viele Nachrichtensendungen des ORF können mindestens eine Woche lang im Internet abgerufen werden. Schülerinnen und Schüler können sie so zur eigenen Arbeit nutzen oder gemeinsam in der Klasse besprechen. Die Konferenz nannte auch gleich konkrete Fragen für die Analyse von Nachrichtensendungen: Welche Nachrichten werden angeboten – Politik und Wirtschaft, Unfälle, Sport oder Prominews? Berichten die Moderatorinnen und Moderatoren sachlich oder machen sie persönliche Bemerkungen zu den einzelnen Nachrichten? Wie ist die Reihenfolge, wie lange sind die Beiträge? Am besten eignen sich die Unterrichtsfächer Politische Bildung, Geschichte, Deutsch oder Englisch, so die Expertenrunde.","Mit dem Trampolin den Körper in Schwung bringen: Für viele Menschen ist das Sprunggerät eine gute Möglichkeit, sich mit viel Spaß und ohne allzu großen Aufwand zu bewegen. Besonders beliebt ist das Trampolin bei Kindern. Expertinnen und Experten betonen auch die Vorteile des Hüpfens auf dem Trampolin. Die Bewegung auf dem Trampolin fördert nicht nur die Beweglichkeit, sondern auch die Koordination. Allerdings ist sie nicht ganz ungefährlich. Orthopäden weisen auf die extrem hohe Unfallgefahr hin. Die Ärzteschaft möchte Kindern und Eltern keineswegs die Freude am Trampolinspringen verderben. Vielmehr möchte sie dazu aufrufen, einige Sicherheitsregeln zu befolgen, mit denen sich Unfälle leicht vermeiden lassen. Eine harte, ebene Stellfläche und ein Sicherheitsnetz sind dabei unverzichtbare Voraussetzungen. Viele Sportvereine bieten Kurse an, in denen Kinder sicheres Trampolinspringen lernen können.","Die Klage, dass Jugendliche und junge Erwachsene kein Interesse mehr an Nachrichten haben, ist unbegründet. So lautet zumindest eine der Schlussfolgerungen aus einer Studie zum durchschnittlichen Medienkonsum junger Menschen mit dem Schwerpunkt Nachrichten. Demnach lesen oder hören in Österreich nahezu 50 % der Personen unter 30 Jahren täglich Nachrichten. Viele der Befragten gaben an, dass sie sich nicht auf die Inhalte der Sozialen Medien verlassen möchten, da ihre Glaubwürdigkeit oft angezweifelt wird. Den klassischen Medien wie Nachrichtensendungen oder Tageszeitungen wird hingegen eher geglaubt. Soziale Netzwerke können herkömmliche Nachrichtenquellen nicht ersetzen, so die vorherrschende Meinung – auch wenn diese Quellen in der Gestaltung oft als eher langweilig empfunden werden."],"25":["Feng Shui – wörtlich: \"Wind Wasser\" – ist die taoistische Lehre vom Leben im Einklang mit der Umgebung. Seit Jahrhunderten wird Feng Shui in China und anderen fernöstlichen Kulturen praktiziert, inzwischen ist es auch bei uns beliebt. Wohnen mit Feng Shui bedeutet ein Gleichgewicht herzustellen – beginnend bei der Auswahl des Grundstücks, der Anordnung von Türen und Fenstern und der Gestaltung der Wohnräume. Türen und Fenster leiten den Energiefluss wie Schleusen, die Position der Möbel lässt die positive Energie weiterströmen oder behindert sie. Wie man vorhandene Energie-Störungen durch einfaches Umstellen der Möbel beseitigen kann, zeigen Feng-Shui-erfahrene Innenarchitekten.","Farben haben eine stärkere Wirkung auf Menschen, als viele vermuten. Der Einfluss der Farben ist sogar so groß, dass er für therapeutische Zwecke genutzt wird. Bei der farblichen Gestaltung einer neuen Wohnung sollte man zuerst einmal zurückhaltend sein. Ist der Raum nämlich in knalligem Rot oder blendendem Gelb gestrichen, müssen die Möbel und andere Gegenstände farblich darauf abgestimmt sein, da sonst eine unruhige oder aggressive Atmosphäre entstehen kann. Weiß gestrichene Wände stehen hingegen zwar in dem Ruf, langweilig zu sein, sie lassen sich aber mit allen Möbeln, Stoffen und Dekorationsgegenständen kombinieren und schaffen so leicht eine gemütliche und für das Auge ansprechende Atmosphäre.","Ein allgemeingültiger Optimalwert wird von Fachleuten ungern benannt, da kaum ein Wert so hohen natürlichen Schwankungen unterliegt wie die Luftfeuchte. Witterung, Temperaturunterschiede, Wohngewohnheiten, alles sorgt für ständiges Auf und Ab. Als Mittelwert kann 40–60 % angenommen werden. Die relative Luftfeuchtigkeit sollte in Wohnräumen nie dauerhaft unter 30 % oder über 70 % liegen. In den meisten Wohnräumen ist die Luft zu trocken. Die Luftfeuchtigkeit beträgt nur 20 %. Besonders Zentralheizungen und Klimaanlagen trocknen die Luft aus und wirbeln Staub, Keime und Schadstoffe auf. Atemwegserkrankungen und Allergien sind oft die Folge. Auslöser sind meist Keime oder Bakterien, die bei trockener Luft gut gedeihen. Gegen üble Gerüche und zu hohe Lufttrockenheit helfen am besten Pflanzen. Sie geben Wasserdampf an die Umgebung ab und sorgen für ein gutes Raumklima.","Frische Kräuter machen jedes Essen zum Genuss. Man braucht keinen großen Garten, um sich für den Eigenbedarf aromatische Gewürzpflanzen selbst ziehen zu können. Die meisten dieser Kräuter gedeihen nämlich auch im Blumentopf auf dem Balkon oder auf der Fensterbank. Dabei sind natürlich solche Pflanzen, die im Freien wachsen können, durch den Einfluss des Sonnenlichts aromatischer als solche, die nur hinter Glas wachsen können. Die Pflanzen im Zimmer brauchen auch mehr Pflege als ihre Kollegen an der frischen Luft. Wegen der Lufttrockenheit in den Wohnungen müssen sie z. B. viel häufiger gegossen werden als Freilandpflanzen, auch sind sie weniger widerstandsfähig gegen Schädlinge und Pflanzenkrankheiten.","Bei der Wohnraumgestaltung lässt sich viel erreichen mit der richtigen Auswahl der Zimmerpflanzen. Es müssen nicht nur grünblättrige Gummibäume oder Palmen sein, die einen Raum verschönern – vielfältige Blatt- und Blütenfarben machen selbst trostlos wirkende Räume farbenfroh und fröhlich. So können Blühpflanzen auf der Fensterbank auch im Herbst oder Winter die Bewohner in gute Laune versetzen. Grünpflanzen beruhigen zudem und man fühlt sich beim Anblick der Natur in der eigenen Wohnung einfach ruhiger und ausgeglichener. Bedenken Sie aber: Pflanzen müssen am richtigen Platz stehen, wenn man lange an ihnen Freude haben möchte. Viele Gärtnereien oder Blumengeschäfte bieten daher einen Beratungsservice an."],"28":["Sie sind eine gut funktionierende Gemeinschaft mit einer Vision: Schon seit den 80er Jahren leben Mitglieder des \"Tauschrings Harmelsdorf e. V.\" vor, wie man nachhaltig mit Ressourcen umgehen kann und dadurch die Umwelt schont. \"Tauschen, nicht wegwerfen\" ist das Motto dieser Initiative – die damals als eine der ersten dieser Art in Deutschland noch belächelt wurde, heute aber viel Lob und Anerkennung bekommt. Ob Küchengeräte, Bücher oder auch Kleidungsstücke, die man nicht mehr anzieht: Was ungenutzt ist, findet bei jemandem Verwendung, der noch etwas damit anfangen kann. Getauscht werden nicht nur Güter, sondern auch Dienstleistungen. Eine der Voraussetzungen für das Gelingen: \"Die Dienstleistungen dürfen nicht in Konkurrenz zum Handwerk stehen\", erklärt Tauschring-Mitglied Kati Jago. Besonders gefragt seien Fahrdienste, etwa zum Arzt. Ihre monatlichen Zusammenkünfte an der Rathausstraße sind für die derzeit 30 Vereinsmitglieder viel mehr als bloße Tauschtreffs: \"Man darf den Faktor Mensch nicht unterschätzen\", sagt Kati Jago. Denn beim Tauschen zähle auch das soziale Miteinander.","\"Man gönnt sich ja sonst nichts.\" Und schon ist die Einkaufstüte voll und das Konto leer. Macht das glücklich? Oder wieso sonst kauft man mehr, als man eigentlich geplant hat? \"Ein Einkauf kann sich ähnlich anfühlen wie eine Belohnung\", sagt der Psychologe Daniel Stüber. Denn dabei würden Glückshormone ausgeschüttet. Manchmal könne das sogar in einem Kaufrausch enden. Denn das Glücksgefühl, das Konsumenten beim Kaufen erleben, könne sie dazu anregen, immer mehr Geld auszugeben. Doch die Ernüchterung folge oft schnell, warnt er: Denn wer später merke, wie teuer das alles gewesen ist, schütte Stresshormone aus. Dies könne zu Schlafstörungen und schlechter Laune führen. Langfristig lässt sich so die eigene Lebenszufriedenheit also nicht steigern.","Geklickt, gekauft, zurückgeschickt: Kunden nutzen im Online-Handel gerne die Möglichkeit, Waren innerhalb einer bestimmten Frist kostenlos zurückzusenden. Vor allem im Modehandel steigt die Zahl der Rücksendungen immer weiter an. Oft bestellen Kunden gleich mehrere Modelle in unterschiedlichen Größen, um sie zu Hause in Ruhe anzuprobieren. Die Kosten für die Retouren trägt der Anbieter. Dennoch lohnt sich für die Online-Händler das Geschäft. Die zurückgegebene Kleidung kann zum Beispiel oft so aufbereitet werden, dass sie erneut zum Verkauf angeboten werden kann. \"Rücksendungen werden sich im Online-Handel nie ganz vermeiden lassen\", erklärt Birgit Steinköhler vom Bundesverband Online-Handel. Dennoch ist es möglich, dass sich ihre Anzahl in Zukunft senken lässt. Dies wünschen natürlich auch die Online-Verkäufer und suchen nach neuen Möglichkeiten: etwa detailliertere Produktinformationen oder neue Technologien, die die individuellen Maße der Kunden ermitteln. Dennoch: Rücksendungen werden im Online-Handel wohl immer zum Geschäftsmodell gehören.","Keine Lust mehr auf die Konsum-Gesellschaft? Dann könnte es ein erster Schritt sein, den Lieblingspulli zu stopfen statt zu entsorgen oder den alten Wecker von Oma noch mal zum Laufen zu bringen. Ob Fahrrad, Fernseher oder Smartphone – man muss bei Defekten nicht gleich alles wegwerfen. In sogenannten Repair-Cafés können defekte Gegenstände unter fachkundiger Anleitung wieder instandgesetzt werden. \"Damit schonen wir die Umwelt und den Geldbeutel\", erklärt Thomas Rederitz, Inhaber eines solchen Reparaturcafés. Repair-Cafés verstehen sich als Initiative gegen die Wegwerfmentalität. Da viele Firmen keinen Reparaturservice mehr anbieten, muss vieles aufwendig entsorgt werden, sagt Rederitz. Das sei nicht immer nötig. \"Manchmal ist ja auch nur eine Schraube locker, oder es fehlt ein kleines Bauteil, das leicht ersetzt werden kann.\" Im Reparaturcafé wird gemeinsam gewerkelt, geschraubt, genäht, gebastelt – und auch gelacht und geredet. Die Reparatur wird in jedem Fall sachgerecht durchgeführt. Denn zu den freiwilligen Mitarbeitern von Repair-Cafés gehören Handwerksmeister der unterschiedlichsten Fachrichtungen.","Viele Menschen sind erstaunlich großzügig: Sie machen anderen gern Geschenke, spenden Geld für gute Zwecke oder opfern Zeit für ehrenamtliche Tätigkeiten. Aber was motiviert sie dazu? Die Wissenschaft liefert ganz unterschiedliche Erklärungsansätze. Eine Erklärung lautet, dass großzügige Menschen auf Gegenseitigkeit hoffen: Wer viel gibt, bekommt auch viel zurück. Eine Studie konnte nun aber zeigen, dass die Antwort vielleicht ganz einfach ist: Großzügigkeit mache eben glücklich. Dies fanden Forscher der Universität Lübeck heraus. Diese enge Verknüpfung zwischen großzügigem Verhalten und Glücksgefühl zeige sich auch im Gehirn. So aktiviere ein solches Verhalten ein Hirnareal, das eng mit unserem Belohnungszentrum verknüpft ist. Das Ergebnis ihrer Studie könne weitreichende Folgen für die Gesellschaft haben. Wer glücklicher werden möchte, könne sich diese neuen Erkenntnisse zunutze machen: Denn wer für andere da ist, tut auch etwas für das eigene Wohlbefinden."],"31":["Fernsehen ist der Sprachentwicklung bei Kleinkindern nicht förderlich. Sie sind bunt und lustig, die Teletubbys, die am Bildschirm auch deutsche Kinder beglücken. Doch gute Sprachlehrer für Babys sind sie nicht – so das Ergebnis einer US-amerikanischen Studie. \"Manche Eltern mögen davon träumen, dass ihre Kinder die ersten Worte beim Fernsehen lernen\", sagt eine Linguistin, \"aber das funktioniert nicht.\" Die Kommunikationsexpertin hat 48 Kleinkinder im Alter von 5 bis 24 Monaten getestet. Zuerst bekamen sie Gegenstände zu Gesicht, für die sie noch keine Worte hatten – etwa einen Schraubenzieher. Für das gezeigte Objekt erfanden die Forscher dann ein Fantasiewort wie \"Deet\". \"Damit wollten wir sicherstellen, dass die Kinder den Begriff wirklich noch nie gehört hatten\", erklärt die Expertin. Dann wurde es fünfmal wiederholt – entweder in einem Teletubby-ähnlichen Video oder direkt von einer anwesenden Person. Nach kurzer Pause legten die Forscher ihren Probanden einige Gegenstände vor und forderten sie auf: \"Zeig mir Deet.\" Babys, die das Wort direkt gelernt hatten, reagierten spätestens bei der dritten Wiederholung. Die jungen TV-Seher aber waren meist ratlos.","Pharmakologen am Universitätsklinikum Tübingen haben kürzlich bei einer Auswertung von 1,6 Millionen Rezeptverordnungen für Kinder und Jugendliche festgestellt, dass in gut 13 Prozent der Fälle das jeweils verschriebene Medikament gar nicht eigens für Kinder zugelassen war oder in einer für sie nicht getesteten Dosierung verwendet wurde. In Kinderkliniken sind etwa 50 Prozent, auf Intensivstationen für Neugeborene sogar bis zu 90 Prozent der verabreichten Medikamente nicht speziell für Kinder konzipiert. Noch bedenklicher: Je kleiner und je kränker ein Kind ist, desto mehr dieser \"Off-Label\"-Verordnungen hat es zu erwarten. Besonders bei den in Kliniken behandelten, ernsthafteren Krankheiten aber können die Ärzte oft gar nicht anders, als für Kinder nicht getestete Medikamente zu verabreichen. Da Kinder vergleichsweise selten schwer erkranken, sind die aufwendigen Testverfahren zur Herstellung altersspezifischer Medikamente für die Hersteller häufig wirtschaftlich uninteressant. Glücklicherweise ändert sich dieser Zustand durch eine EU-Verordnung, die seit Januar 2007 gilt: Demnach müssen alle in der Entwicklung befindlichen Medikamente, die für Kinder und Jugendliche in Betracht kommen, auch an ihnen geprüft werden. Für bereits zugelassene Präparate gibt es finanzielle Anreize, sie nachträglich an jungen Altersgruppen zu erproben. Geprüfte Medikamente erhalten dann den Packungsaufdruck: \"Für Kinder geprüft.\"","Alternative Heilverfahren können vor allem bei leichten Erkrankungen hilfreich sein. Dabei gilt es, Nützliches von Scharlatanerie zu unterscheiden. Viele sprechen noch von \"alternativer\" Heilkunde. Doch inzwischen ist für die etwa 400 Heilverfahren jenseits der Schulmedizin der Ausdruck \"Komplementärmedizin\" üblich geworden. Denn die Akupunkteure, Aromatherapeuten, anthroposophischen Mediziner, Pflanzenheilkundler, Homöopathen und viele andere begreifen ihre besonderen Methoden meist als Ergänzung der herkömmlichen Medizin und nicht als deren Ersatz. In dieser Funktion ist die Komplementärmedizin heute weithin akzeptiert. Auch in der Kinderheilkunde sind die Verfahren beliebt. Ob sie wirksam sind, lässt sich mithilfe klinischer Studien überprüfen. Die aber sind aufwendig und teuer, weshalb es oft an wissenschaftlichen Wirksamkeitsnachweisen mangelt. Sicher nachgewiesen ist vor allem die Wirksamkeit von Pflanzenpräparaten. Mehr Forschung auf dem Gebiet der Komplementärmedizin könnte verhindern, dass mancher vielleicht nützliche Behandlungsansatz den Schulmedizinern völlig aus dem Blick gerät. Und einige Ärzte sollten vielleicht darüber nachdenken, was ein Kenner jener Szene vor einiger Zeit auf einem Kongress des Berufsverbandes der Kinder- und Jugendärzte gesagt hat: Das Erfolgsgeheimnis der Anbieter nicht-konventioneller Methoden beruhe vor allem darauf, dass sie den Eltern das Gefühl vermittelten, \"endlich einmal ernst genommen zu werden\".","Die eine liebt Flora und Fauna, die andere hat ein Händchen für Kommunikation und Marketing: Zusammen betreiben die Schwestern Henrike Rodemeier und Gesine Wischmann Deutschlands einzige Ginseng-Farm im niedersächsischen Bockhorn. Als studierte Agraringenieurin ist die 38-jährige Rodemeier für den Anbau zuständig. Die vier Jahre ältere Schwester vertreibt über ihre Firma Florafarm die aus den Wurzeln gewonnenen Arzneimittel. Zudem entwickelte die gelernte Pharmareferentin eine eigene Ginseng-Kosmetiklinie. Den Anfang hatte ihr Vater Heinrich Wischmann bereits vor 24 Jahren gemacht: Er gab die unrentable traditionelle Landwirtschaft auf und konzentrierte sich auf den Anbau von Ginsengwurzeln, die unter anderem das Immunsystem stärken und den Blutdruck regulieren. Trotz Ruhestand ist auch er noch auf der Farm aktiv. Doch die Zukunft gehört den Töchtern – die planen bereits eine Dependance.","Kinder essen zu viel Fast Food, aber zu wenig Obst und Gemüse, so eine Expertin vom Deutschen Institut für Ernährungsmedizin und Diätetik (D.I.E.T.) in Bad Aachen. Nach Angabe der Deutschen Gesellschaft für Ernährung sind 10 bis 20 Prozent aller Schulkinder und Jugendlichen übergewichtig, Tendenz steigend. Übergewicht kann schon im frühen Alter zu Folgeerkrankungen wie Hypertonie, Fettstoffwechselstörungen, Diabetes oder Gallensteinleiden führen. Zu den Ursachen gehören eine oftmals zu hohe tägliche Energie- und Fettzufuhr und mangelnde Bewegung. Gerade bei einer genetischen Vorbelastung führt das zu einer Zunahme der Fettmasse des Körpers. Das D.I.E.T. rät daher allen Eltern, ihren Kindern von klein auf eine gesunde Kost zu bieten. Durch einen regelmäßigen Mahlzeitenrhythmus im Tagesablauf kann außerdem unkontrolliertes \"Zwischendurchessen\" vermieden werden. Ein kompletter Verzicht auf Süßes ist aus psychologischen Gründen nicht empfehlenswert, ein vernünftiger Umgang mit Süßigkeiten muss erlernt werden. Durch vermehrte körperliche Aktivität wird der Energieverbrauch erhöht. Eltern sollten versuchen, bei ihren Kindern sportliche Interessen zu wecken und Hobbys zu fördern."],"34":["Kyrill, Friederike, Lothar oder Xaver – all dies sind Namen von Stürmen, die in Deutschland und Europa in den vergangenen Jahrzehnten für Schlagzeilen gesorgt haben. Aber wie kommen Stürme eigentlich zu ihren Namen? Die Antwort auf diese Frage findet man beim Institut für Meteorologie in Berlin. Hier werden bereits seit 1954 Namen für alle Hoch- und Tiefdruckgebiete vergeben, die das Wetter in Deutschland mitbestimmen. Zunächst hatten alle Tiefs weibliche Namen und alle Hochs männliche. Seit Ende der 90er-Jahre wird abgewechselt: In einigen Jahren tragen die Tiefs männliche Namen, in anderen weibliche. Seit 2002 haben alle Bürgerinnen und Bürger außerdem eine ganz besondere Möglichkeit: Sie können ein Hoch oder ein Tief \"kaufen\", ihm einen Namen geben oder es sogar verschenken. Der Deutsche Wetterdienst und die Medien übernehmen diesen Namen dann und verwenden ihn in den Wetterberichten. So können Sie einem lieben Menschen eine originelle Überraschung bereiten oder sich selbst eine Freude machen.","Der Jugendwettbewerb \"Naturwissenschaft & Technik\" geht in die nächste Runde. Auch in diesem Jahr haben Schülerinnen und Schüler wieder die Möglichkeit, ihre Erfindungen der Öffentlichkeit zu präsentieren. Eine Jury bewertet die Wettbewerbsbeiträge und wählt die fünf besten aus. Auch das Publikum vor Ort darf abstimmen und einen \"Publikumsliebling\" wählen. Insgesamt sind Sachpreise im Wert von 3000 Euro zu gewinnen, gesponsert von Unternehmen aus der Region. Teilnehmen können Schülerteams aller Schularten ab der fünften Klasse. Mit dabei ist diesmal auch ein Team des Thomas-Mann-Gymnasiums in Neustadt. Die Oberstufe hat eine neue Wetter-App entwickelt, mit der sie in diesem Jahr die Jury und das Publikum überzeugen möchte. Der Schulleiter des Thomas-Mann-Gymnasiums, Bernd Giesinger, ist stolz auf die Schülerinnen und Schüler: \"Ich freue mich sehr über das Engagement dieser jungen Menschen, die ihre Zeit und Kreativität nutzen, um unsere gemeinsame Zukunft zu gestalten.\"","Am gestrigen Abend fegte Sturmtief Charlotte über Deutschland hinweg und legte große Teile des Landes lahm. Mit Spitzengeschwindigkeiten von 140 Kilometern pro Stunde sei Charlotte einer der stärksten Stürme der vergangenen Jahre, sagte Meteorologe Andreas Fischer. Insbesondere in Hessen, Nordrhein-Westfalen und im Saarland sind wegen umgestürzter Bäume unzählige Straßen und Bahnstrecken blockiert. Viele Züge konnten gestern nicht mehr weiterfahren und Hunderte Bahnreisende saßen zum Teil bis spät in die Nacht auf freier Strecke fest. In Hessen wurde der Bahnverkehr zeitweise komplett eingestellt. An den Flughäfen Frankfurt, Düsseldorf und Köln/Bonn kam es zu zahlreichen Verspätungen und Flugausfällen. Ankommende Maschinen wurden teilweise zu anderen Flughäfen umgeleitet. Von dort gestaltete sich die Weiterfahrt für viele Reisende allerdings ebenfalls sehr schwierig. Die Aufräumarbeiten laufen derzeit auf Hochtouren und werden noch einige Zeit in Anspruch nehmen. Im Moment ist es noch nicht absehbar, wie lange es dauern wird, bis alle Strecken wieder frei sind.","Soll ich einen Pullover anziehen oder reicht ein T-Shirt? Muss man einen Schirm mitnehmen oder braucht man eine Sonnenbrille? Jedes Smartphone hat heutzutage eine vorinstallierte Wetter-App, aber genaue Wettervorhersagen liefern die meisten nicht. Es gibt aber gute Alternativen. Wer einen zuverlässigen Wetterdienst für sein Smartphone oder Tablet sucht, ist mit der neuen App Wetterwissen bestens beraten. Schon in der kostenlosen Version bietet die App umfangreiche Daten zur aktuellen Wetterlage, leicht verständliche Prognosen und Unwetterwarnungen. Der Regenradar zeigt Ihnen genau, wo sich Regenwolken bilden und ob diese in Ihre Richtung ziehen oder nicht. Für 1,99 Euro gibt es ein Premium-Abo mit zusätzlichen Wetter-Videos und Informationen zu Wintersport und Badewetter. Die App ist in der Premium-Version werbefrei, in der kostenlosen Version wird am unteren Rand Werbung eingeblendet, die viele Nutzer aber nicht als störend wahrnehmen. Die App punktet außerdem mit einem modernen Design und schafft es damit ganz klar in die Top 10 der Wetter-Apps.","Zehn Jahre ist es her, dass sich aus einem scheinbar harmlosen Tiefdruckgebiet schnell und überraschend der gefährliche Sturm Tinka entwickelte, der in Norddeutschland immense Schäden anrichtete und als einer der teuersten Stürme in die Geschichte einging. Den Wetterdiensten wurde damals vorgeworfen, die Entwicklung des Tiefdruckgebietes nicht richtig berechnet und die Bevölkerung nicht rechtzeitig gewarnt zu haben. Obwohl die Messinstrumente immer präziser geworden sind, lassen sich manche Wetterereignisse wie zum Beispiel Gewitter und Stürme nur schwer vorhersagen. Ein Sturm kann von vielen Faktoren abhängig sein und entwickelt sich oft kurzfristig. Daher kann es passieren, dass die Prognosen völlig verschieden ausfallen, manchmal sogar auch ganz falsch sind. Um dies zu vermeiden, vergleichen Meteorologen möglichst viele Wetterlagen. Je mehr Übereinstimmungen es gibt, desto wahrscheinlicher ist es, dass ihre Prognose zutrifft. Mit einer Trefferquote von etwa 80 Prozent kann die Entwicklung eines Sturms inzwischen auch recht gut eingeschätzt werden – aber eben nicht zu 100 Prozent."],"35":["\"Auf meinen elektronischen Steuerberater kann ich mich hundertprozentig verlassen\", erklärt Rainer Wust, Inhaber einer kleinen Elektronikfirma in Hamburg. Die Steuererstattung, die er für das vergangene Jahr vom Finanzamt erhielt, stimmte völlig mit dem überein, was sein Steuersparprogramm ausgerechnet hatte. Immer mehr Deutsche sparen sich den teuren Gang zum Steuerberater und setzen auf Computerprogramme. Die Vorteile liegen auf der Hand: Am heimischen Rechner lassen sich alle steuerrelevanten Daten bequem in die richtigen Formulare eingeben und per Internet an das Finanzamt schicken. Das Programm fragt nach wichtigen Zahlen, kennt Steuerspartipps und hilft zuverlässig durch den Steuerdschungel – ohne Terminabsprachen und langwierige Sitzungen beim Steuerberater, wie das früher üblich war. In einigen Fällen muss man aber trotzdem noch Belege und andere Unterlagen beim Finanzamt einreichen – und zwar per herkömmlicher Post.","Kundenberaterin Sabine E. ist ständig auf Achse. Als Repräsentantin einer großen Plastikgeschirrfirma für Süddeutschland besucht sie Messen, Ausstellungen und Kunden, um den Verkauf anzukurbeln. Heute München, morgen Stuttgart, übermorgen Mainz – Sabine E. ist an das Leben einer modernen Geschäftsnomadin gewöhnt. Umso mehr schätzt sie den Service, den eine immer größere Zahl an Hotels Geschäftsreisenden wie ihr anbieten: das Hotelzimmer mit komplettem Büroservice. Dem Hotelgast stehen nicht nur Internetzugang und Telefon kostenlos zur Verfügung, er kann auch Kopien in Auftrag geben, Dokumente ausdrucken lassen oder schnell noch vom Zimmer aus ein Fax verschicken. \"Für mich hat das viele Vorteile\", sagt Frau E. \"Meine Aufträge und Abrechnungen kann ich jetzt oft schon während meiner Kundentermine in mein Notebook eintippen und dann am Abend per E-Mail versenden. Unterlagen kann ich auch zwischendurch ausdrucken und Verträge unterschreiben und verschicken. Das spart mir viel Zeit, die ich jetzt dafür nutze, um auch mal abends auszugehen und die Gastronomie der Stadt, in der ich mich gerade befinde, kennenzulernen.\"","Ein Referat für den Geschichtsunterricht über Karl den Großen zur nächsten Woche – kein Problem. Mussten sich Schüler früher durch Berge von Sachbüchern kämpfen, Lexika wälzen und die Nachmittage in den Lesesälen der Bibliotheken verbringen, genügt heute ein Mausklick auf die Webseite eines Onlinedienstes, der kostenlos oder für wenig Geld für Schüler fertige Referate zu fast jedem Thema liefert. Statt im staubigen Bibliothekssaal zu sitzen, entspannt sich der Schüler von heute im Schwimmbad vom Schulstress. Und trägt im Unterricht ein Referat vor, von dem er oft nicht einmal das Thema, geschweige denn Details kennt, was spätestens bei Nachfragen der Lehrer schließlich auffällt. Die Praxis, fertige Referate per Internet anzubieten, stößt bei Lehrern und Schulpolitikern auf Kritik. Sie fordern deshalb einheitlich Maßnahmen gegen die Anbieter, die zwar Schülern die Arbeit abnehmen, aber nichts zur Wissensvermittlung beitragen.","Wer könnte interessantere Meldungen aus allen Ecken des World Wide Web liefern als die Internetnutzer selbst? Deshalb sind auf vielen Nachrichtenportalen keine Nachrichtenprofis am Werk, sondern ganz normale Surfer, die selbst zu Onlinereportern werden. Das Prinzip solcher Seiten ist genial einfach: Wer irgendwo im Netz eine Meldung aufspürt, die auch andere Surfer interessieren könnte, schreibt eine kurze Zusammenfassung und reicht diese einfach ein. Dort wird dann vom Betreiber nur geprüft, ob der angegebene Link, also die Fundstelle im Netz, auch funktioniert und die Quelle seriös ist. Auf diese Weise können Falschmeldungen aussortiert werden. Nach erfolgreicher Prüfung wird aus dem Internetfundstück auch schon eine Nachricht. Wer die Meldungen liest, kann dann selbst an der Quelle überprüfen, ob er den Informationen vertraut.","Zu Beginn des Englischkurses fragt Verena Baum ihre Mitlernenden nach ihren Namen, wie es in einem Sprachkurs eben üblich ist. Doch statt auf einem harten Schulstuhl sitzt sie ganz bequem auf ihrem körpergerechten Schreibtischstuhl zu Hause vor ihrem PC. Vor zwei Jahren startete eine Sprachenschule vor den Toren von Frankfurt am Main auf Initiative einer pfiffigen Kursleiterin ein Pilotprojekt: \"Überall Englisch\". Die Lernenden eignen sich ihre Sprachkenntnisse über ein Computerprogramm an, das extra für dieses Projekt entwickelt wurde. Per Internet treten sie in Dialog mit den anderen Kursteilnehmern und üben und kommunizieren gemeinsam auf Englisch. Alle sechs bis acht Wochen trifft man sich aber nach Möglichkeit an der Schule zum Austausch, zur Lernkontrolle und natürlich, um die Fragen zu beantworten, auf die der PC keine persönliche Antwort wusste. Für Verena Baum und die meisten anderen Teilnehmer an \"Überall Englisch\" war es zuerst ungewohnt, sich nicht in einem Kursraum zu treffen. Aber: \"Das war eine tolle Erfahrung, und das Lernen hat großen Spaß gemacht.\""],"36":["Wer sportlich aktiv sein möchte, fragt sich zu Beginn oft, welche Sportart und welches Trainingspensum wohl richtig sind. Hier eine Empfehlung von Sporttherapeuten: Das ideale Trainingspensum besteht aus drei sportlichen Aktivitäten pro Woche, zwei \"trockenen\" (z. B. Radfahren) und einer \"nassen\" (Schwimmen). Für die Wahl der Sportarten gilt Folgendes: Verzichten Sie als Anfänger auf Tennis und Squash, denn die schnellen, abrupten Bewegungen belasten Gelenke und Bänder sehr. Walking (zügiges Gehen), Radfahren und Schwimmen hingegen sind sehr empfehlenswerte Sportarten.","\"Köstliches Deutschland\" (Südwest, 192 S., 19,50 Euro) – ein Buch, das zum Kochen und zum Reisen animieren will. Der Autor Udo Eckert hat sich Goethes Motto \"Warum denn in die Ferne schweifen...\" zu eigen gemacht und sich auf einen kulinarischen Streifzug durch deutsche Regionen gemacht. Das Buch ist Bildband, solides Kochbuch und praktischer Gourmetführer gleichermaßen.","Behutsame Landnutzung im Einklang mit der Natur hat die einmalige Landschaft der Rhön geschaffen. Wenn Sie mehr darüber wissen wollen, schreiben Sie uns oder schicken Sie uns diese Anzeige! Natur- und Lebensraum Rhön e. V., Georg-Meilinger-Str. 3, D-36115 Ehrenberg-Wüstensachsen.","Allein in Salzluft, Sonne und Seewind bekommen Körper und Seele Aufwind. Nordsee – ein Klima, einzigartig und wie geschaffen für Gesundheit: mal sanft, mal rau. Auf jeden Fall belebend. Und eine Kur gibt zusätzlich Impulse. Mit den elementarsten Heilkräften der Natur. Sternstunden der Gesundheit. Informationen bei: 5-Sterne-Nordsee-Kur, Postfach 161 130, D-22510 Husum.","Dass die Stimme – vornehmlich von Männern – im Alter oft rauer klingt, liegt an altersbedingten Umbildungen des Stimmapparats im Kehlkopf. Die veränderte Stimme der Betroffenen verliert dadurch an Kraft und Dynamik und kann sich dann ungewohnt heiser oder rau anhören. Doch vor dem 70. Lebensjahr ist mit dieser natürlichen Stimmveränderung nicht zu rechnen."],"12":["Wie wollen wir von anderen gesehen werden? Von unserer Schokoladenseite natürlich. Aber es gibt Menschen, die haben keine. Eine Frau mit schiefer Nase mag sich weder im Profil noch frontal zeigen. \"Die Nase\", so der plastische Chirurg Professor Henrik Menke, \"sitzt mitten im Gesicht – so banal das klingt. Zu große Abweichungen von der Norm beeinträchtigen den ganzen Menschen.\" Der Chirurg, der an der Wiesbadener Wilhelm-Fresenius-Klinik eine Abteilung für ästhetische Chirurgie leitet, lehnt es ab, am Mängelwesen Mensch alles chirurgisch Machbare auszuführen. Keinem unter 18 würde er die Nase operieren – es sei denn, sie ist durch einen Unfall oder eine Krankheit verunstaltet. Menke: \"Wenn ich die Probleme nachvollziehen kann, die junge Leute mit ihrer Nase haben, werde ich in allen Details mit den Patienten besprechen, was getan werden kann, lehne es aber ab, mit Videoanimation zu arbeiten. Damit kann ich zwar alles machen, jedes gewünschte Resultat herbeizaubern. Die Realität ist aber eine andere. Aus diesem Grund hat es der Gesetzgeber zu Recht untersagt, mit Vorher-nachher-Bildern zu arbeiten.\"","Der Riechsinn ist unser ursprünglichster Sinn – sagt Matthias Schenk vom Schloss Freudenberg. Wer ihn schärfen will, ist im dort untergebrachten \"Erfahrungsfeld der Sinne\" an der richtigen Adresse: Sieben Stationen befassen sich mit dem Riechvermögen. Ob klein oder groß, dick oder schmal – auch wenn manch einer die Form seiner Nase schon mal verflucht hat, ohne sie können wir nicht sein. \"Es entsteht eine neue Welt, sogar ein ganz neuer Kosmos, wenn man sich mit der Nase beschäftigt\", weiß Matthias Schenk. Sein \"Erfahrungsfeld der Sinne\" wird täglich von rund 400 Gästen besucht. An 140 Stationen im Gemäuer und im parkähnlichen Außenbereich lässt es sich bewusst fühlen, hören, sehen, riechen und schmecken. Der Nase kommt im \"Erfahrungsfeld der Sinne\" eine zentrale Rolle zu. Schließlich, so Schenk, sei der Geruchssinn gehirngeschichtlich der älteste Sinn. \"Er ist ein Ur-Sinn, der uns mit allen Tieren verbindet.\" Gestützt wird diese Aussage dadurch, dass beispielsweise Säuglinge ihre Mutter riechen, bevor sie sie sehen und hören.","Mit Drogen kennt sich Falko aus. Der sechs Jahre alte Schäferhund sucht für den Zoll nach Kokain, Haschisch und Heroin. Bis zu vier Kofferladungen, meist aus Südamerika, Afrika und Südostasien, beschnüffelt der Vierbeiner am Tag. Rund 300 mal in der Minute atmet er dabei ein und aus – ein wahrer Nasenmarathon. Hunde riechen bis zu einer Million mal besser als Menschen. Hat der Mensch fünf Millionen Riechzellen, so sind es bei einem Schäferhund 200 Millionen. Grundsätzlich gilt: Je länger die Hundeschnauze, desto besser das Geruchsvermögen. Schnüffler wie Falko können \"stereo\" riechen, das heißt, ihre Nase kann zwischen rechts und links unterscheiden. Spürhunde erkennen deshalb auch die Richtung eines Geruchs. Doch die beste Hundnase nutzt nichts, wenn sie nicht geschult wird. So lernen Drogenspürhunde in jungen Jahren, wie sie sogenannte weiche und harte Drogen finden. Werden bei der Ausbildung noch alle Drogen zusammengepackt, so schafft es Falko, sie beim Kofferschnüffeln dann einzeln wahrzunehmen. Bis zu zehn Jahre können Spürhunde des Zolls arbeiten, ehe sie samt ihrer Nase in den verdienten Hunde-Ruhestand gehen dürfen.","Beim Menschen ist das Sehen der Sinn Nummer eins, gefolgt vom Hören und an dritter Stelle dem Riechen. Ganz anders sieht es bei vielen Tieren aus, zum Beispiel bei Hunden. \"Ein Hund, der nicht sehen kann, ist wie ein Mensch ohne Geruch – das ist nicht schön, aber auch nicht dramatisch\", sagt Ralf Spangenberg, Tierarzt aus Ingelheim. Zum Vergleich: Während die Riechschleimhaut des Menschen rund fünf Quadratzentimeter misst, bringt es der Hund auf 85 Quadratzentimeter und mehr. \"Hunde sind Riechweltmeister\", bringt es der Tierarzt auf den Punkt. Nicht die beste, dafür die längste Nase der Welt hat der Elefant. \"Das Riechen ist allerdings Nebensache – beim Elefanten ist die Nase zum Werkzeug geworden.\" Er kann damit Baumstämme umschlingen und schleppen, die Nase kann als Rüsseldusche genutzt werden – und natürlich als Esswerkzeug. Interessant sind auch die Nasen der Spinnen. Deren Riechorgane stecken in den Beinen. \"Da sind sie ganz nah an den Dingen dran\", erklärt Spangenberg. Wiederum anders verhält es sich bei Schlangen: \"Sie nehmen über die Zunge Gerüche auf.\" Und damit nicht genug: Weil die Zunge gespalten ist, können sie auch rechts und links unterscheiden – und genau die Richtung bestimmen, in der sie ihre Beute finden. Auch die scheinbar nasenlosen Fische können riechen. \"Haie zum Beispiel riechen und schmecken Blut über Kilometer\", so Spangenberg.","Niesen ist eine Reaktion auf die Umwelt. Mal kitzelt Staub die Nase, mal reizt ein chemischer Stoff oder ein anderer Fremdkörper in der Luft unser Riechorgan. Sogar grelles Licht kann durch die Verbindung der Gesichtsnerven zum Niesen führen. Unwillkürlich wird ein Reflex ausgelöst, der die Nase \"säubern\" soll. Es kommt zu einem explosionsartigen Ausstoßen der Luft durch die Nase – dem Niesen. Allergiker niesen oft serienweise, bis der letzte Reiz aus der Nase entfernt ist. Auf die Reizmeldung hin holt der Körper tief Luft – bis die Lungen maximal gefüllt sind. Dann wird der Atem kurz angehalten. Und schließlich stößt der Körper in Sekundenschnelle die eingeatmete Luft wieder aus. Dabei kann diese leicht eine Geschwindigkeit von 150 bis 160 Stundenkilometern erreichen. Lautlos geht das Niesen selten vonstatten. Das \"Ha\" – oft gleich mehrfach vor dem befreienden \"Tschi\" hervorgestoßen – entsteht, weil beim Einatmen die Stimmbänder aufgemacht werden. Beim \"Tschi\" wird die Luft dann wieder ausgestoßen. Der Laut entsteht, weil gleichzeitig die Zunge hinter die Vorderzähne gepresst wird. Denn der Körper will, dass möglichst viel Luft durch die Nase und möglichst wenig durch den Mund entweicht, daher verschließt die Zunge der Luft teilweise den Weg."],"21":["(Kitobda to'liq matn yo'q – qisqacha mazmun:) Berlin hat einen berühmten Zoo. Der Text sagt, dass die Besucher in den großen Park von Berlin kommen. Sie treffen die Tiere, besonders die Löwen.","(Qisqacha mazmun:) In Südafrika sagt der Text, dass die Menschen Angst vor den Löwen hatten. Deshalb haben sie angefangen, sie zu töten. Aus diesem Grund hat die Regierung beschlossen, Reservate zum Schutz der Löwen vor dem Aussterben zu schaffen. Die Regierung hat eine Entscheidung getroffen, ein Schutzgebiet zu errichten.","(Qisqacha mazmun:) In den USA sagt der Text, dass es dort einen Zoo gab. Das Interesse an Löwen hatte eine besondere Bedeutung für die Anziehung von Touristen.","(Qisqacha mazmun:) Die reichen Familien haben meistens etwas Besonderes. Hier ist es klar, dass viele Texte sagen, dass es reiche Familien in Asien gibt. Sie haben die Tendenz, exotische Tiere zu züchten. In ihren Palästen gibt es Tiere wie Löwen und Leoparden.","(Qisqacha mazmun:) Die Tierschutzorganisation ruft an. Der Text spricht über eine Sitzung einer Tierrechtsorganisation. Es wird ein Update über den Umgang mit Tieren vorgestellt. Es geht um die Schaffung spezieller Gebiete für sie. Außerdem wird die Ausbildung von Menschen im Umgang mit Tieren thematisiert."]};
