<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FSP / FaMed va Kenntnisprüfung'ga 2 yillik tayyorgarlik">
<meta name="theme-color" content="#13244f">
<title>FaMed yo'li</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fa,#0a1020);--sf:light-dark(#ffffff,#121b31);--sf2:light-dark(#eef2fb,#18233d);
--ink:light-dark(#0f1a2e,#eef2fa);--mut:light-dark(#5b6880,#97a5c0);--line:light-dark(#e2e7f1,#23304b);
--pri:light-dark(#2f5bea,#86a2ff);--pri2:light-dark(#e8eeff,#1c2a52);--acc:light-dark(#f2543a,#ff8a6e);--sun:#ffc53d;--ok:light-dark(#12804a,#5fd394);
--sh:0 1px 2px rgba(15,26,46,.06),0 12px 32px -16px rgba(15,26,46,.25);--r:18px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,.ff{font-family:Outfit,system-ui,sans-serif;letter-spacing:-.01em}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;font-weight:700}
h2{font-size:clamp(24px,3.6vw,32px)}h3{font-size:18px;font-weight:600}
a{color:var(--pri)}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(4vw,16px)}
/* top bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar .wrap{display:flex;align-items:center;gap:16px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font:700 19px Outfit,system-ui,sans-serif;text-decoration:none;color:var(--ink)}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri),#13244f);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.tabs{display:flex;gap:4px;margin-inline-start:auto}
.tabs a{font:600 15px Outfit,system-ui,sans-serif;color:var(--mut);text-decoration:none;padding:9px 14px;border-radius:999px;display:flex;align-items:center;gap:7px}
.tabs a[aria-current]{background:var(--pri2);color:var(--pri)}
.tabs svg{width:20px;height:20px}
@media(max-width:760px){.bar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}.tabs{position:fixed;inset:auto 0 0 0;margin:0;justify-content:space-around;background:var(--sf);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
 .tabs a{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 8px;border-radius:12px;min-width:56px}}
main{padding:22px 0 40px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 140% at 100% 0%,#3a6af0 0%,#1b3478 45%,#0f1a3a 100%);color:#fff;padding:clamp(22px,3.4vw,36px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;inset:auto -60px -90px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,197,61,.35),transparent 65%)}
.hero .k{font:600 14px Outfit,system-ui,sans-serif;opacity:.8}.hero h2{font-size:clamp(26px,4.4vw,40px);margin:6px 0 10px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:600 13.5px Outfit,system-ui,sans-serif;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.chip.sun{background:var(--sun);color:#1a1300}
.ring{position:relative;width:150px;height:150px;z-index:1}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font:700 34px/1 Outfit,system-ui,sans-serif}.ring span{font-size:12.5px;opacity:.8}
@media(max-width:560px){.hero{grid-template-columns:minmax(0,1fr)}.ring{width:120px;height:120px;position:absolute;right:14px;top:14px;opacity:.95}.ring b{font-size:26px}.hero h2{padding-right:120px}}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(16px,2.4vw,24px)}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}.hd span{color:var(--mut);font-size:14px;white-space:nowrap}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.min{font:700 15px Outfit,system-ui,sans-serif;background:var(--pri2);color:var(--pri);border-radius:12px;padding:8px 0;width:54px;text-align:center;white-space:nowrap}
.task h3{font-size:16.5px}.task p{margin:3px 0 0;color:var(--mut);font-size:14.5px}
.task.done h3{color:var(--mut);text-decoration:line-through}.task.done .min{background:var(--sf2);color:var(--mut)}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--sf);display:grid;place-items:center;cursor:pointer;padding:0;color:transparent}
.tick[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}.tick svg{width:22px;height:22px}
.tl{font:600 13px Outfit,system-ui,sans-serif;color:var(--pri);background:none;border:0;padding:4px 0;cursor:pointer;min-height:auto}
.sec+.sec{margin-top:18px}
/* buttons, inputs */
button,.btn{font:600 15.5px Outfit,sans-serif;min-height:46px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.pri,.btn.pri{background:var(--pri);border-color:var(--pri);color:light-dark(#fff,#0a1020)}
button.big{min-height:54px;font-size:17px;padding:12px 24px;width:100%}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{font:16px "Atkinson Hyperlegible",sans-serif;width:100%;min-height:48px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink)}
label{display:block;font:600 13.5px Outfit,system-ui,sans-serif;color:var(--mut);margin:14px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.muted{color:var(--mut)}.small{font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stats div{background:var(--sf2);border-radius:14px;padding:12px}.stats b{display:block;font:700 26px/1.1 Outfit,system-ui,sans-serif}.stats span{font-size:12.5px;color:var(--mut)}
.note{border-radius:14px;padding:12px 14px;background:light-dark(#fff6df,#2a2410);color:light-dark(#6b4b00,#ffd77a);font-size:14.5px;margin-top:14px}
/* flash card */
.fc{position:relative;border-radius:24px;background:var(--sf);border:1px solid var(--line);box-shadow:var(--sh);padding:26px clamp(18px,3vw,30px);min-height:340px;display:flex;flex-direction:column}
.fc::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,var(--pri),var(--acc))}
.fc .meta{display:flex;justify-content:space-between;gap:10px;font:600 13px Outfit,system-ui,sans-serif;color:var(--mut)}
.fc .q{font:600 clamp(22px,3.4vw,30px)/1.25 Outfit,system-ui,sans-serif;margin:24px 0 16px}
.fc .a{font:700 clamp(23px,3.6vw,32px)/1.25 Outfit,system-ui,sans-serif;color:var(--pri)}
.fc .f{margin-top:8px}.fc .n{margin-top:6px;color:var(--mut);font-size:14.5px}
.fc .grow{flex:1}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
.rate button{flex-direction:column;gap:0;padding:8px 4px;min-height:58px}.rate small{font:400 11.5px "Atkinson Hyperlegible";color:var(--mut)}
.rate button:nth-child(1){border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}.rate button:nth-child(3){border-color:color-mix(in srgb,var(--pri) 50%,var(--line))}
.prog{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;margin-top:14px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:99px}
.verd{margin-top:12px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--acc)}
.spk{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;flex:none}.spk svg{width:20px;height:20px}
/* week view */
.ex{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.ex:first-child{border-top:0}
.ex b{font-family:Outfit,system-ui,sans-serif;font-weight:600;display:block}.ex span{color:var(--mut);font-size:14.5px}
.rule{font-size:16.5px;background:var(--pri2);border-radius:14px;padding:14px 16px;margin:12px 0 4px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font:600 13px Outfit,system-ui,sans-serif}
.scroll{overflow-x:auto}
.weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* plan */
.month{margin-top:26px}.month>h3{margin-bottom:10px;color:var(--mut);font-size:15px}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.wk a{display:block;text-decoration:none;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.wk a.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}.wk a.past{opacity:.75}
.wk small{font:600 12.5px Outfit,system-ui,sans-serif;color:var(--pri)}.wk b{display:block;font:600 16px Outfit,system-ui,sans-serif;margin:3px 0}.wk span{font-size:13.5px;color:var(--mut)}
.badge{position:absolute;top:12px;right:12px;font:700 12px Outfit,system-ui,sans-serif;padding:3px 8px;border-radius:99px;background:var(--sf2);color:var(--mut)}.badge.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.phase{border-left:4px solid var(--pri);padding:4px 0 4px 14px;margin-top:14px}.phase p{margin:4px 0;color:var(--mut);font-size:14.5px}
/* timer */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));display:none;align-items:center;gap:14px;padding:10px 12px 10px 20px;border-radius:999px;background:#0f1a3a;color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);z-index:30;max-width:calc(100% - 24px)}
@media(min-width:761px){#timer{bottom:24px}}
#timer b{font:700 24px Outfit,system-ui,sans-serif;font-variant-numeric:tabular-nums}#timer span{font-size:14px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
#timer button{background:rgba(255,255,255,.14);border:0;color:#fff;min-height:40px;border-radius:999px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font:600 14px Outfit,system-ui,sans-serif;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:no-preference){.fc{animation:pop .28s ease}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
.gear{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--mut);margin-inline-start:4px}.gear svg{width:22px;height:22px}
@media(max-width:760px){.gear{margin-inline-start:auto}}
.num{font:700 15px Outfit,system-ui,sans-serif;background:var(--pri2);color:var(--pri);border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.task.done .num{background:var(--sf2);color:var(--mut)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.pills button{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;font-size:14px;background:var(--sf)}
.pills button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:light-dark(#fff,#0a1020)}
.pills.main button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pills:not(.main){margin-bottom:10px}
.lnk{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.lnk a{font:600 13px Outfit,system-ui,sans-serif;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--pri2);color:var(--pri)}
.dz{padding:16px 0;border-top:1px solid var(--line)}.dz:first-of-type{border-top:0}.dzh{display:flex;gap:12px;align-items:center}.dzh b{font:600 17px Outfit,system-ui,sans-serif}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:12px 0 0;font-size:15px}dt{font:600 13px Outfit,system-ui,sans-serif;color:var(--mut);padding-top:2px}dd{margin:0}
dl.auf dd{display:block}dl.auf .spk{float:left;margin-right:8px}
@media(max-width:560px){dl{grid-template-columns:minmax(0,1fr)}dt{margin-top:6px}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}@media(max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opts button{justify-content:flex-start;text-align:start;min-height:54px}.opts button.right{background:color-mix(in srgb,var(--ok) 18%,var(--sf));border-color:var(--ok)}.opts button.wrong{opacity:.55}
.phase.now{border-left-color:var(--acc);background:var(--sf2);border-radius:0 12px 12px 0}
.stack td{vertical-align:top}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{border:0;padding:3px 0}}
</style>
</head>

  <nav class="tabs" id="tabs">

<script>
// 26 haftalik reja (6 oy). Karta formati: "o'zbekcha|nemischa|shifokor tili|eslatma"
const W=[
{t:"Tanishuv va gap tartibi",g:"Präsens va fe'l 2-o'rinda (V2)",
gx:"Nemis gapida tuslangan fe'l doim 2-o'rinda turadi. Gap boshida vaqt yoki joy so'zi tursa ham, fe'l joyidan siljimaydi, ega fe'ldan keyin keladi. Savol so'zisiz savolda (ha/yo'q) fe'l 1-o'ringa chiqadi.",
ex:[["Ich arbeite heute im Krankenhaus.","Men bugun kasalxonada ishlayman."],["Heute arbeite ich im Krankenhaus.","Bugun men kasalxonada ishlayman (fe'l yana 2-o'rinda)."],["Arbeiten Sie heute?","Siz bugun ishlaysizmi? (fe'l 1-o'rinda)"],["Wo wohnen Sie?","Qayerda yashaysiz?"]],
m:"Bosh va yuz qismlari",lis:"DW \"Nicos Weg\" A2 kursidan 1 ta epizod (learngerman.dw.com, bepul)",spk:"O'zingizni tanishtiring: ism, yosh, qayerdansiz, kasb, oila. 1 daqiqa.",wr:"O'zingiz haqingizda 8 ta gap yozing. Har gapda fe'l 2-o'rinda ekanini tekshiring.",
c:["Mening ismim Behzod.|Ich heiße Behzod.||","Men O'zbekistondanman.|Ich komme aus Usbekistan.||","Men shifokorman.|Ich bin Arzt.||kasb oldidan artikl qo'yilmaydi","Men uylanganman, ikki farzandim bor.|Ich bin verheiratet und habe zwei Kinder.||","Men Toshkentda yashayman.|Ich wohne in Taschkent.||","Bugun men kasalxonada ishlayman.|Heute arbeite ich im Krankenhaus.||V2: fe'l 2-o'rinda","Bosh|der Kopf|Caput|","Ko'z|das Auge|Oculus · okulär|ko'plik: die Augen","Quloq|das Ohr|Auris|","Burun|die Nase|Nasus · nasal|","Og'iz|der Mund|oral|","Tish|der Zahn|Dens · dental|ko'plik: die Zähne","Bo'yin|der Hals|Collum · zervikal|'Hals' tomoq ma'nosida ham","Tomoq (halqum)|der Rachen|Pharynx|"]},
{t:"O'tgan zamon: Perfekt",g:"Perfekt (haben / sein + Partizip II)",
gx:"Og'zaki nutqda o'tgan zamon Perfekt bilan aytiladi: haben yoki sein fe'li 2-o'rinda, Partizip II gap oxirida. Harakat va holat o'zgarishini bildiruvchi fe'llar (gehen, kommen, fahren, aufstehen) sein bilan, qolganlari haben bilan.",
ex:[["Ich habe gefrühstückt.","Men nonushta qildim."],["Ich bin gestern zum Arzt gegangen.","Men kecha shifokorga bordim."],["Wann sind Sie gekommen?","Siz qachon keldingiz?"],["Er hat viel gearbeitet.","U ko'p ishladi."]],
m:"Ichki a'zolar va tana",lis:"Nicos Weg A2: keyingi epizod, matnini o'qib chiqing",spk:"Kechagi kuningizni Perfekt bilan aytib bering: nima qildingiz, qayerga bordingiz.",wr:"Kechagi kuningiz haqida 8 ta Perfekt gap yozing.",
c:["Men nonushta qildim.|Ich habe gefrühstückt.||haben + Partizip II","Men kecha shifokorga bordim.|Ich bin gestern zum Arzt gegangen.||gehen → sein","Siz qachon keldingiz?|Wann sind Sie gekommen?||kommen → sein","U ko'p ishladi.|Er hat viel gearbeitet.||","Yurak|das Herz|Cor · kardial|","O'pka|die Lunge|Pulmo · pulmonal|","Jigar|die Leber|Hepar · hepatisch|","Buyrak|die Niere|Ren · renal|","Oshqozon|der Magen|Gaster · gastral|","Ichak|der Darm|Intestinum · intestinal|","Qorin|der Bauch|Abdomen · abdominal|","Ko'krak qafasi|der Brustkorb|Thorax · thorakal|","Orqa|der Rücken|Dorsum|","Qo'l (yelkadan)|der Arm||","Kaft (qo'l panjasi)|die Hand||","Oyoq|das Bein||","Oyoq panjasi|der Fuß||"]},
{t:"Präteritum va birinchi simptomlar",g:"Präteritum: war, hatte, konnte",
gx:"sein, haben va modal fe'llar og'zaki nutqda ham Präteritum shaklida ishlatiladi: war, hatte, konnte, musste, wollte. Bular Perfektdan ko'ra qisqa va tabiiy eshitiladi.",
ex:[["Ich war müde.","Men charchagan edim."],["Er hatte Fieber.","Uning isitmasi bor edi."],["Ich konnte nicht kommen.","Men kela olmadim."],["Wir mussten warten.","Biz kutishimizga to'g'ri keldi."]],
m:"Simptomlar 1",lis:"Nicos Weg A2: 1 epizod. Har gapni pauza qilib takrorlang (shadowing)",spk:"Oxirgi marta kasal bo'lganingizni aytib bering: nima og'ridi, isitma bormidi.",wr:"Oxirgi kasalligingiz haqida war/hatte/konnte bilan 6 ta gap.",
c:["Men charchagan edim.|Ich war müde.||sein → war","Uning isitmasi bor edi.|Er hatte Fieber.||haben → hatte","Men kela olmadim.|Ich konnte nicht kommen.||können → konnte","Og'riq|der Schmerz|Dolor|ko'pincha ko'plikda: die Schmerzen","Bosh og'rig'i|die Kopfschmerzen|Zephalgie|","Isitma|das Fieber|Pyrexie|","Yo'tal|der Husten|Tussis|","Tumov|der Schnupfen|Rhinitis|","Tomoq og'rig'i|die Halsschmerzen||","Hansirash (nafas qisishi)|die Atemnot|Dyspnoe|","Charchoq|die Müdigkeit|Fatigue|","Bosh aylanishi|der Schwindel|Vertigo|","Kvartira|die Wohnung||"]},
{t:"Modal fe'llar",g:"Modalverben: müssen, können, dürfen, sollen, wollen, möchten",
gx:"Modal fe'l 2-o'rinda tuslanadi, asosiy fe'l esa gap oxirida infinitiv holida turadi. sollten - maslahat (shifokor bemorga ko'p ishlatadi), dürfen nicht - mumkin emas.",
ex:[["Ich muss Deutsch lernen.","Men nemis tilini o'rganishim kerak."],["Hier darf man nicht rauchen.","Bu yerda chekish mumkin emas."],["Sie sollten mehr Wasser trinken.","Siz ko'proq suv ichishingiz kerak (maslahat)."],["Kann ich Ihnen helfen?","Sizga yordam bera olamanmi?"]],
m:"Simptomlar 2 va kasblar",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Germaniyada nima qilmoqchisiz va nima qilishingiz kerak? (möchte, muss, kann)",wr:"Bemorga 6 ta maslahat yozing: Sie sollten.../Sie dürfen nicht...",
c:["Men nemis tilini o'rganishim kerak.|Ich muss Deutsch lernen.||modal fe'l + oxirida infinitiv","Bu yerda chekish mumkin emas.|Hier darf man nicht rauchen.||","Sizga yordam bera olamanmi?|Kann ich Ihnen helfen?||","Men Germaniyada ishlamoqchiman.|Ich möchte in Deutschland arbeiten.||","Siz ko'proq suv ichishingiz kerak.|Sie sollten mehr Wasser trinken.||sollten = maslahat","Ko'ngil aynishi|die Übelkeit|Nausea|","Qusish|das Erbrechen|Emesis|","Ich ketishi|der Durchfall|Diarrhö|","Ich qotishi|die Verstopfung|Obstipation|","Qorin og'rig'i|die Bauchschmerzen|abdominelle Schmerzen|","Ishtaha yo'qligi|die Appetitlosigkeit|Inappetenz|","Terlash|das Schwitzen|Hyperhidrose|","Hamshira|die Pflegekraft||eski so'z: Krankenschwester","Assistent shifokor|der Assistenzarzt||"]},
{t:"Akkusativ",g:"Akkusativ: den, einen, keinen",
gx:"To'g'ri to'ldiruvchi (kimni? nimani?) Akkusativda bo'ladi. Faqat erkak rodda o'zgaradi: der → den, ein → einen, kein → keinen. Ayol (die) va o'rta (das) rod o'zgarmaydi.",
ex:[["Ich sehe den Arzt.","Men shifokorni ko'ryapman."],["Der Patient braucht einen Termin.","Bemorga qabul vaqti kerak."],["Ich habe kein Fieber.","Menda isitma yo'q."],["Haben Sie einen Stift?","Sizda ruchka bormi?"]],
m:"Ovqat hazm qilish a'zolari",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Kecha nima yedingiz va ichdingiz? Akkusativ bilan.",wr:"Akkusativ bilan 8 ta gap: ich brauche / ich habe / ich sehe...",
c:["Men shifokorni ko'ryapman.|Ich sehe den Arzt.||der → den","Bemorga qabul vaqti kerak.|Der Patient braucht einen Termin.||ein → einen","Menda isitma yo'q.|Ich habe kein Fieber.||","Ovqat|das Essen||","Non|das Brot||","Go'sht|das Fleisch||","Sabzavot|das Gemüse||","Meva|das Obst||","Qizilo'ngach|die Speiseröhre|Ösophagus|","O't pufagi|die Gallenblase|Vesica biliaris|","Oshqozon osti bezi|die Bauchspeicheldrüse|Pankreas|","Ko'richak|der Blinddarm|Appendix|bemor 'Blinddarm' deydi; aslida Appendix = Wurmfortsatz","Yutish qiyinligi|die Schluckbeschwerden|Dysphagie|","Jig'ildon qaynashi|das Sodbrennen|Pyrosis|"]},
{t:"Dativ",g:"Dativ va Dativ predloglari (mit, nach, bei, von, zu, aus, seit)",
gx:"Dativ - kimga? kimda? savoliga javob. der/das → dem, die → der, ko'plik → den (+n). mit, nach, bei, von, zu, aus, seit predloglaridan keyin doim Dativ. zu + dem = zum, von + dem = vom.",
ex:[["Ich helfe dem Patienten.","Men bemorga yordam beraman."],["Ich fahre mit dem Bus.","Avtobusda boraman."],["Nach der Arbeit gehe ich nach Hause.","Ishdan keyin uyga boraman."],["Ich komme vom Arzt.","Men shifokordan kelyapman."]],
m:"Shifoxona joylari",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Ishga qanday borasiz? mit dem Bus, zu Fuß... va kasalxonaning qaysi bo'limida ishlagansiz?",wr:"Dativ predloglari bilan 8 ta gap.",
c:["Men bemorga yordam beraman.|Ich helfe dem Patienten.||helfen + Dativ","Avtobusda boraman.|Ich fahre mit dem Bus.||mit + Dativ","Ishdan keyin uyga boraman.|Nach der Arbeit gehe ich nach Hause.||","Men shifokordan kelyapman.|Ich komme vom Arzt.||von + dem = vom","Kasalxona|das Krankenhaus|Klinik|","Bo'lim (statsionar)|die Station||","Reanimatsiya|die Intensivstation||","Shoshilinch yordam bo'limi|die Notaufnahme||","Operatsiya xonasi|der Operationssaal|OP|","Shifokor qabulxonasi|die Praxis||","Qabul vaqti|der Termin||","Tez yordam mashinasi|der Krankenwagen||"]},
{t:"Joy predloglari",g:"Wechselpräpositionen: in, an, auf, unter, über, vor, hinter, neben, zwischen",
gx:"Bu predloglar 'qayerda?' (wo?) savolida Dativ, 'qayerga?' (wohin?) savolida Akkusativ talab qiladi. liegen/stehen/sitzen - Dativ; legen/stellen/setzen - Akkusativ.",
ex:[["Der Patient liegt im Bett.","Bemor karavotda yotibdi (wo? → Dativ)."],["Legen Sie den Patienten ins Bett.","Bemorni karavotga yotqizing (wohin? → Akk)."],["Das Medikament liegt auf dem Tisch.","Dori stol ustida."],["Der Arzt geht ins Zimmer.","Shifokor xonaga kiradi."]],
m:"Shifoxona xodimlari",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Xonangizni tasvirlang: nima qayerda turibdi.",wr:"Palata tasviri: 8 ta gap (wo? va wohin?).",
c:["Bemor karavotda yotibdi.|Der Patient liegt im Bett.||wo? → Dativ","Bemorni karavotga yotqizing.|Legen Sie den Patienten ins Bett.||wohin? → Akkusativ","Dori stol ustida.|Das Medikament liegt auf dem Tisch.||","Shifokor xonaga kiradi.|Der Arzt geht ins Zimmer.||in + das = ins","Bo'lim boshlig'i|der Chefarzt||","Katta shifokor|der Oberarzt||FaMed'da bemorni shunga taqdim etasiz","Bemor (erkak / ayol)|der Patient / die Patientin||","Karavot|das Bett||","Palata|das Patientenzimmer||","Hamkasb|der Kollege / die Kollegin||"]},
{t:"Ergash gaplar 1",g:"Nebensätze: weil, dass, wenn",
gx:"weil (chunki), dass (-ki), wenn (agar / -ganda) bilan boshlangan ergash gapda tuslangan fe'l gap OXIRIGA o'tadi. Ergash gap oldin kelsa, bosh gap fe'l bilan boshlanadi.",
ex:[["Ich kann heute nicht kommen, weil ich krank bin.","Bugun kela olmayman, chunki kasalman."],["Er sagt, dass er seit drei Tagen Fieber hat.","U uch kundan beri isitmasi borligini aytadi."],["Wenn die Schmerzen stärker werden, kommen Sie bitte wieder.","Og'riq kuchaysa, qaytib keling."]],
m:"Anamnez savollari 1",lis:"Nicos Weg A2 yoki B1: 1 epizod + shadowing",spk:"Nega Germaniyaga ketmoqchisiz? weil bilan 5 ta sabab.",wr:"weil, dass, wenn bilan 3 tadan gap (jami 9).",
c:["Bugun kela olmayman, chunki kasalman.|Ich kann heute nicht kommen, weil ich krank bin.||weil: fe'l oxirga","U uch kundan beri isitmasi borligini aytadi.|Er sagt, dass er seit drei Tagen Fieber hat.||dass: fe'l oxirga","Og'riq kuchaysa, qaytib keling.|Wenn die Schmerzen stärker werden, kommen Sie bitte wieder.||","Sizni nima bezovta qilyapti? (nima sabab bilan keldingiz)|Was führt Sie zu uns?||anamnezning birinchi savoli","Ismingiz nima?|Wie heißen Sie?||","Necha yoshdasiz?|Wie alt sind Sie?||","Aniq qayeringiz og'riyapti?|Wo genau tut es weh?||","Shikoyatlar qachondan beri?|Seit wann haben Sie die Beschwerden?||","Og'riqni qanday tasvirlaysiz?|Wie würden Sie die Schmerzen beschreiben?||","0 dan 10 gacha og'riq qanchalik kuchli?|Wie stark sind die Schmerzen auf einer Skala von 0 bis 10?||","Og'riq biror joyga tarqaladimi?|Strahlen die Schmerzen irgendwohin aus?||"]},
{t:"Ajraladigan fe'llar",g:"Trennbare Verben: aufstehen, einnehmen, anrufen, anfangen",
gx:"Old qo'shimchali fe'llarda (auf-, ein-, an-, ab-, aus-, mit-) old qo'shimcha gap oxiriga ajraladi. Perfektda -ge- o'rtaga kiradi: aufgestanden, eingenommen, angefangen.",
ex:[["Ich stehe um sechs Uhr auf.","Men soat oltida turaman."],["Nehmen Sie das Medikament zweimal täglich ein.","Dorini kuniga ikki marta iching."],["Wann haben die Schmerzen angefangen?","Og'riq qachon boshlandi?"],["Ich rufe den Oberarzt an.","Men katta shifokorga qo'ng'iroq qilaman."]],
m:"Anamnez savollari 2",lis:"Nicos Weg B1: 1 epizod + shadowing",spk:"Kun tartibingizni aytib bering (aufstehen, anfangen, aufhören...).",wr:"Kun tartibingiz: 8 ta gap, kamida 5 ta ajraladigan fe'l.",
c:["Men soat oltida turaman.|Ich stehe um sechs Uhr auf.||aufstehen","Dorini kuniga ikki marta iching.|Nehmen Sie das Medikament zweimal täglich ein.||einnehmen","Og'riq qachon boshlandi?|Wann haben die Schmerzen angefangen?||anfangen → angefangen","Doimiy dori ichasizmi?|Nehmen Sie regelmäßig Medikamente ein?||","Allergiyangiz bormi?|Haben Sie Allergien?||","Ilgari operatsiya qilinganmisiz?|Wurden Sie schon einmal operiert?||","Ilgari qanday kasalliklaringiz bo'lgan?|Haben Sie Vorerkrankungen?||","Chekasizmi?|Rauchen Sie?||","Spirtli ichimlik ichasizmi?|Trinken Sie Alkohol?||","Oilangizda qanday kasalliklar bor?|Gibt es Erkrankungen in Ihrer Familie?||","Kasbingiz nima?|Was sind Sie von Beruf?||","Kim bilan yashaysiz?|Mit wem wohnen Sie zusammen?||"]},
{t:"O'zlik fe'llari va og'riq tavsifi",g:"Reflexive Verben: sich fühlen, sich setzen, sich Sorgen machen",
gx:"O'zlik fe'llari sich bilan keladi: ich → mich, du → dich, er/sie/Sie → sich, wir → uns. Bemorga murojaat: Setzen Sie sich bitte.",
ex:[["Ich fühle mich schlecht.","O'zimni yomon his qilyapman."],["Setzen Sie sich bitte.","O'tiring, iltimos."],["Machen Sie sich keine Sorgen.","Xavotir olmang."]],
m:"Og'riq turlari",lis:"Nicos Weg B1: 1 epizod + shadowing",spk:"Turli og'riqlarni tasvirlang: bosh, qorin, ko'krak (stechend, drückend...).",wr:"3 xil bemorning og'rig'ini 3 gapdan tasvirlang.",
c:["O'zimni yomon his qilyapman.|Ich fühle mich schlecht.||sich fühlen","O'tiring, iltimos.|Setzen Sie sich bitte.||","Xavotir olmang.|Machen Sie sich keine Sorgen.||","Tezroq tuzalib keting!|Gute Besserung!||","Sanchiqli (og'riq)|stechend||","Siquvchi, bosuvchi|drückend||","Achishtiruvchi|brennend||","To'lg'oqsimon|kolikartig||","Simillagan (to'mtoq)|dumpf||","Uruvchi (pulsatsiyali)|pochend||","Og'riq chap qo'lga tarqaladi.|Die Schmerzen strahlen in den linken Arm aus.||"]},
{t:"Sifatlar va bemor tasviri",g:"Adjektivdeklination (sifat qo'shimchalari)",
gx:"Ot oldidagi sifat qo'shimcha oladi: ein starker Schmerz, eine ältere Frau, hohes Fieber. Qoidani yodlash o'rniga tayyor birikmalarni yodlang, ular imtihonda ko'p qaytariladi.",
ex:[["eine ältere Patientin","keksa bemor ayol"],["ein 60-jähriger Patient","60 yoshli bemor"],["Der Patient ist in gutem Allgemeinzustand.","Bemorning umumiy holati yaxshi."]],
m:"Bemorni tasvirlash",lis:"Nicos Weg B1: 1 epizod + shadowing",spk:"Oilangizdagi bir kishini tasvirlang (yosh, ko'rinish, xarakter).",wr:"Kasalxonadagi bir bemorni tasvirlang: 8 ta gap, sifatlar bilan.",
c:["Keksa ayol|eine ältere Frau||","60 yoshli bemor|ein 60-jähriger Patient||","Kuchli og'riq|starke Schmerzen||","Yuqori isitma|hohes Fieber||","Quruq yo'tal|trockener Husten||","Balg'amli yo'tal|Husten mit Auswurf||","O'tkir og'riq|akute Schmerzen||","Surunkali kasallik|eine chronische Erkrankung||","Bemorning umumiy holati yaxshi.|Der Patient ist in gutem Allgemeinzustand.|AZ|","Shishgan oyoq|ein geschwollenes Bein||"]},
{t:"Taqqoslash va vaqt ifodalari",g:"Komparativ va Superlativ",
gx:"Taqqoslash: -er + als (besser als), eng yuqori daraja: am -sten (am schlimmsten). Tartibsizlari: gut → besser → am besten, viel → mehr → am meisten. Anamnezda vaqt ifodalari juda muhim: seit, vor, täglich.",
ex:[["Die Schmerzen werden stärker.","Og'riq kuchayib boryapti."],["Heute geht es mir besser als gestern.","Bugun kechagidan yaxshiroqman."],["Nachts ist es am schlimmsten.","Kechasi eng yomon bo'ladi."]],
m:"Vaqt va chastota",lis:"Nicos Weg B1: 1 epizod + shadowing",spk:"Toshkent va Andijonni taqqoslang (katta, issiq, qimmat...).",wr:"Bemor shikoyatlari vaqti haqida 8 ta gap (seit, vor, täglich, plötzlich).",
c:["Og'riq kuchayib boryapti.|Die Schmerzen werden stärker.||","Bugun kechagidan yaxshiroqman.|Heute geht es mir besser als gestern.||","Kechasi eng yomon bo'ladi.|Nachts ist es am schlimmsten.||","Uch kundan beri|seit drei Tagen||seit + Dativ","Ikki hafta oldin|vor zwei Wochen||","Kuniga bir marta|einmal täglich||","Ertalab / kechqurun / kechasi|morgens / abends / nachts||","Vaqti-vaqti bilan|ab und zu||","Doimiy|ständig||","Birdaniga|plötzlich||","Asta-sekin|allmählich||"]},
{t:"Bemorga ko'rsatma berish",g:"Imperativ (Sie-shakli)",
gx:"Bemorga hurmat bilan buyruq: fe'l + Sie + bitte. Ajraladigan fe'lda old qo'shimcha oxirga: Atmen Sie bitte tief ein. Bu hafta 1-3 oylarni ham takrorlaysiz.",
ex:[["Atmen Sie bitte tief ein.","Chuqur nafas oling."],["Öffnen Sie bitte den Mund.","Og'zingizni oching."],["Legen Sie sich bitte auf den Rücken.","Chalqancha yoting."]],
m:"Tekshiruv paytidagi gaplar",lis:"Nicos Weg B1: 1 epizod + shadowing",spk:"Bemorni tekshirayotgandek gapiring: 8 ta ko'rsatma ketma-ket.",wr:"Tekshiruv jarayonini 10 ta Imperativ gap bilan yozing.",
c:["Chuqur nafas oling.|Atmen Sie bitte tief ein.||","Nafasni ushlab turing.|Halten Sie bitte die Luft an.||","Og'zingizni oching.|Öffnen Sie bitte den Mund.||","Chalqancha yoting.|Legen Sie sich bitte auf den Rücken.||","Bu yer og'riyaptimi?|Tut das hier weh?||","Belgacha yechining, iltimos.|Machen Sie bitte den Oberkörper frei.||","Qoningizni olamiz.|Wir nehmen Ihnen Blut ab.||","Ko'p suv iching.|Trinken Sie viel Wasser.||"]},
{t:"Shart mayli va yurak 1",g:"Konjunktiv II (würde, hätte, wäre, könnte) va Futur I",
gx:"Konjunktiv II xushmuomalalik va shart uchun: Könnten Sie...? Ich würde... Wenn ich Zeit hätte... Kelasi zamon: werden + infinitiv (oxirida).",
ex:[["Könnten Sie mir bitte helfen?","Menga yordam bera olasizmi? (xushmuomala)"],["Wenn ich Zeit hätte, würde ich mehr lernen.","Vaqtim bo'lsa, ko'proq o'qir edim."],["Nächstes Jahr werde ich nach Deutschland gehen.","Kelasi yil Germaniyaga boraman."]],
m:"Yurak-qon tomir tizimi 1",lis:"DW \"Top-Thema\" (B1): 1 ta matn va audio",spk:"Yurak qanday ishlashini oddiy nemis tilida 2 daqiqa tushuntiring.",wr:"Yurak haqida 8 ta oddiy gap (Das Herz pumpt Blut...).",
c:["Menga yordam bera olasizmi?|Könnten Sie mir bitte helfen?||xushmuomala so'rov","Vaqtim bo'lsa, ko'proq o'qir edim.|Wenn ich Zeit hätte, würde ich mehr lernen.||","Kelasi yil Germaniyaga boraman.|Nächstes Jahr werde ich nach Deutschland gehen.||Futur I","Yurak qonni butun tanaga haydaydi.|Das Herz pumpt Blut durch den ganzen Körper.||","Qon bosimi|der Blutdruck|RR|","Yuqori qon bosimi|der Bluthochdruck|arterielle Hypertonie|","Puls|der Puls||","Arteriya|die Schlagader|Arterie|","Vena|die Vene||","Yurak tez urishi|das Herzrasen|Tachykardie|","Yurak notekis urishi|das Herzstolpern|Herzrhythmusstörung|","Ko'krakdagi og'riq|die Brustschmerzen|Thoraxschmerz|"]},
{t:"Nisbiy gaplar va yurak 2",g:"Relativsätze (der, die, das, den, dem)",
gx:"Nisbiy gap otni aniqlaydi. Nisbiy olmosh rodi otga, kelishigi esa ergash gapdagi vazifaga qarab tanlanadi. Fe'l oxirga o'tadi.",
ex:[["Der Patient, der seit drei Tagen Schmerzen hat, liegt in Zimmer 5.","Uch kundan beri og'riyotgan bemor 5-xonada."],["Das ist der Patient, den ich gestern behandelt habe.","Bu men kecha davolagan bemor."]],

c:["Uch kundan beri og'riyotgan bemor 5-xonada.|Der Patient, der seit drei Tagen Schmerzen hat, liegt in Zimmer 5.||","Bu men kecha davolagan bemor.|Das ist der Patient, den ich gestern behandelt habe.||","Yurak xuruji|der Herzinfarkt|Myokardinfarkt|","Yurak yetishmovchiligi|die Herzschwäche|Herzinsuffizienz|","Bo'lmachalar titrashi|das Vorhofflimmern|VHF|","Toj tomirlar kasalligi|die Verengung der Herzkranzgefäße|koronare Herzkrankheit (KHK)|","Oyoq venalari trombozi|die Beinvenenthrombose|tiefe Venenthrombose (TVT)|","Qon suyultiruvchi dori|der Blutverdünner|Antikoagulans|","Oyoqlar shishi|geschwollene Beine|Beinödeme|","EKG olmoq|ein EKG schreiben||"]},
{t:"Majhul nisbat va nafas 1",g:"Passiv Präsens (wird + Partizip II)",
gx:"Ish-harakat bajaruvchisi muhim bo'lmasa, Passiv ishlatiladi: werden 2-o'rinda, Partizip II oxirida. Arztbrief va Patientenvorstellung'da juda ko'p uchraydi.",
ex:[["Der Patient wird untersucht.","Bemor tekshiriladi."],["Blut wird abgenommen.","Qon olinadi."],["Ein Röntgenbild wird gemacht.","Rentgen surati olinadi."]],

c:["Bemor tekshiriladi.|Der Patient wird untersucht.||Passiv: wird + Partizip II","Qon olinadi.|Blut wird abgenommen.||","Rentgen surati olinadi.|Ein Röntgenbild wird gemacht.||","Nafas olmoq|einatmen||","Nafas chiqarmoq|ausatmen||","Bronxlar|die Bronchien||","Balg'am|der Auswurf|Sputum|","Nafas olganda xirillash|das Pfeifen beim Atmen|Giemen|","Nafas yo'llari|die Atemwege||","Ko'krak qafasini eshitmoq|die Lunge abhören|Auskultation|"]},
{t:"Passiv o'tgan zamon va nafas 2",g:"Passiv Präteritum (wurde) va Perfekt (ist ... worden)",
gx:"O'tgan zamonda: wurde + Partizip II (yozma), ist + Partizip II + worden (og'zaki). Arztbriefda asosan wurde ishlatiladi.",

{t:"zu va um...zu; ovqat hazm 1",g:"Infinitiv mit zu, um ... zu",
gx:"Ba'zi fe'l va iboralardan keyin zu + infinitiv keladi: vergessen, versuchen, es fällt mir schwer. Maqsad: um ... zu (-ish uchun). Ajraladigan fe'lda zu o'rtaga kiradi: einzunehmen.",

{n:"Arztbrief (Konjunktiv I)",d:"Yozma qismda bemor aytganlari Konjunktiv I bilan yoziladi: habe, sei, nehme. Har bo'limni to'liq gaplar bilan yozing.",s:[
["Einleitung","Herr Max Muster, 58 Jahre alt, stellte sich am 12.03. in unserer Notaufnahme mit seit drei Tagen bestehenden Bauchschmerzen vor."],
["Aktuelle Anamnese","Der Patient berichtete, die Schmerzen hätten plötzlich begonnen und seien im rechten Oberbauch lokalisiert. Sie seien kolikartig und strahlten in die rechte Schulter aus. Die Schmerzintensität gab er mit 8 von 10 an."],

["Vegetative Anamnese","Appetit, Schlaf, Stuhlgang und Miktion seien unauffällig. Eine Gewichtsabnahme habe er nicht bemerkt."],
["Vorerkrankungen und Medikation","An Vorerkrankungen seien eine arterielle Hypertonie und ein Diabetes mellitus Typ 2 bekannt. Er nehme Ramipril 5 mg 1-0-0 und Metformin 1000 mg 1-0-1 ein."],
["Allergien und Noxen","Eine Allergie gegen Penicillin sei bekannt. Er rauche seit 30 Jahren eine Schachtel Zigaretten pro Tag (30 pack years) und trinke gelegentlich Alkohol."],
["Familien- und Sozialanamnese","Der Vater sei an einem Herzinfarkt verstorben. Der Patient sei verheiratet, habe zwei Kinder und arbeite als Busfahrer."],
["Verdachtsdiagnose","Aufgrund der Anamnese besteht der Verdacht auf eine akute Cholezystitis."],
["Differenzialdiagnosen","Differenzialdiagnostisch kommen eine Gallenkolik, eine akute Pankreatitis und ein Hinterwandinfarkt in Betracht."],
["Weiteres Vorgehen","Zur weiteren Abklärung empfehlen wir eine körperliche Untersuchung, Labor (Blutbild, CRP, Leberwerte, Lipase), ein EKG und eine Sonografie des Abdomens."]]},
{n:"Bemorni katta shifokorga taqdim etish (Patientenvorstellung)",d:"Qisqa, tartibli, aniq. Avval asosiy shikoyat, keyin muhim ma'lumotlar, oxirida taxminiy tashxis va reja.",s:[
["Einleitung","Ich möchte Ihnen Herrn Muster vorstellen, einen 58-jährigen Patienten, der sich heute mit seit drei Tagen bestehenden kolikartigen Schmerzen im rechten Oberbauch vorgestellt hat."],
["Wichtigste Details","Die Schmerzen strahlen in die rechte Schulter aus und traten nach einer fettreichen Mahlzeit auf. Begleitend bestehen Übelkeit und Erbrechen."],
["Vorgeschichte","An Vorerkrankungen sind eine Hypertonie und ein Diabetes Typ 2 bekannt. Er nimmt Ramipril und Metformin ein. Es besteht eine Penicillinallergie."],
["Verdachtsdiagnose","Aufgrund der Anamnese gehe ich von einer akuten Cholezystitis aus."],
["Differenzialdiagnosen","Differenzialdiagnostisch denke ich an eine Gallenkolik, eine Pankreatitis und einen Hinterwandinfarkt."],
["Vorgehen","Ich würde gerne Blut abnehmen, ein EKG schreiben und eine Sonografie des Abdomens durchführen. Bis dahin würde ich dem Patienten ein Schmerzmittel geben."],

{n:"Aufklärung tartibi",d:"Bemorga oddiy tilda, Fachsprache'siz tushuntirasiz. Har bosqichdan keyin: 'Haben Sie das verstanden?'",s:[

["Diagnose erklären","Wir vermuten, dass Ihre Gallenblase entzündet ist. Deshalb empfehlen wir eine Operation."],
["Ablauf","Die Operation findet in Vollnarkose statt. Wir machen drei kleine Schnitte am Bauch und entfernen die Gallenblase mit einer Kamera."],
["Risiken","Wie bei jeder Operation gibt es Risiken: zum Beispiel Blutungen, Infektionen oder Verletzungen von Nachbarorganen. Diese Komplikationen sind aber selten."],
["Alternativen","Eine Alternative wäre zunächst eine Behandlung mit Antibiotika, aber die Beschwerden können wiederkommen."],
["Vorbereitung und danach","Bitte essen Sie ab Mitternacht nichts mehr. Nach der Operation bleiben Sie etwa zwei bis drei Tage im Krankenhaus."],

  else if(bTab==='ls')body=sub(LS.map(x=>x.uz),bSel,'sel')+blkLS(Math.min(bSel,19),-1);
  else if(bTab==='auf')body=sub(AUF.map(a=>a[0]),bSel,'sel')+blkAuf(Math.min(bSel,11));
  else if(bTab==='tpl')body=sub(TPL.map(t=>t.n),bSel,'sel')+blkTpl(Math.min(bSel,TPL.length-1));
  else if(bTab==='game')body=`<div class="card" style="max-width:760px"><p class="muted" style="margin-top:0">Bemor belgisi beriladi: qaysi kasallik? Kasalliklarni bir-biridan ajratishni shunday o'rganasiz.</p><label for="gls">Simptom</label><select id="gls"><option value="-1">Hammasi aralash</option>${LS.map((x,i)=>`<option value="${i}" ${i===gameLS?'selected':''}>${esc(x.uz)} · ${esc(x.de)}</option>`).join('')}</select><div id="game" style="margin-top:16px"></div></div>`;
  else if(bTab==='road')body=`<div class="card"><p class="muted" style="margin-top:0">Maqsad: FSP / FaMed → Berufserlaubnis → Kenntnisprüfung → Approbation. Har bir bosqich keyingisining poydevori: nemis tilidagi tibbiy bilim ham til imtihoniga, ham KP'ga kerak.</p>${ROAD.map((r,i)=>`<div class="phase${i===Math.min(6,Math.floor((curWk()-1)/26))?' now':''}"><b class="ff">${esc(r[0])} · ${esc(r[1])}</b><p>${esc(r[2])}</p></div>`).join('')}
    <div class="note">Muhim: Leipzig Saksoniyada joylashgan. Saksoniyada til imtihoni faqat Saksoniya shifokorlar palatasida (SLÄK) FSP shaklida topshiriladi; FaMed u yerda rasmiy tan olinganlar ro'yxatida yo'q. Tayyorgarlik bir xil: anamnez, hujjatlashtirish, shifokor bilan suhbat. Qaror qilishdan oldin Landesdirektion Sachsen'dan aniqlang.</div></div>`;
  else body=`<div class="card"><table class="stack"><thead><tr><th>Turi</th><th>Manba</th><th>Izoh</th></tr></thead><tbody>${RES.map(r=>`<tr><td>${esc(r[0])}</td><td><a href="${esc(r[2])}" target="_blank" rel="noopener">${esc(r[1])}</a></td><td class="muted">${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>`;
  v.innerHTML=`<h2 style="margin-bottom:12px">Bilim bazasi</h2><div class="pills main">${BT.map(b=>`<button data-bt="${b[0]}" aria-selected="${b[0]===bTab}">${b[1]}</button>`).join('')}</div><div style="margin-top:14px">${body}</div>`;
  v.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{bTab=b.dataset.bt;bSel=0;GQ=null;vBilim()});
  v.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{bSel=+b.dataset.sel;vBilim()});
  bindSpk(v);bindJumps(v);v.querySelectorAll('[data-ddx]').forEach(a=>a.addEventListener('click',()=>{GQ=null;setTimeout(vBilim)}));
  if(bTab==='game'){$('gls').onchange=e=>{gameLS=+e.target.value;GQ=null;drawGame()};drawGame()}
  const sel=v.querySelector('.pills:not(.main) [aria-selected=true]');if(sel)sel.scrollIntoView({block:'nearest',inline:'center'})}
function newGQ(){const li=gameLS>=0?gameLS:Math.floor(Math.random()*LS.length),x=LS[li],k=Math.floor(Math.random()*x.ddx.length);
  const others=x.ddx.map((d,i)=>i).filter(i=>i!==k).sort(()=>Math.random()-.5).slice(0,3);GQ={li,k,opts:[k,...others].sort(()=>Math.random()-.5)};gAns=false}
function drawGame(){const box=$('game');if(!box)return;if(!GQ)newGQ();const x=LS[GQ.li],d=x.ddx[GQ.k];
  box.innerHTML=`<div class="fc" style="min-height:0"><div class="meta"><span>${esc(x.uz)} · ${esc(x.de)}</span></div><div class="q" lang="de" style="font-size:21px">${esc(d[1])}</div>
   <div class="opts">${GQ.opts.map(o=>`<button data-o="${o}" class="${gAns?(o===GQ.k?'right':'wrong'):''}" ${gAns?'disabled':''}>${esc(x.ddx[o][0])}</button>`).join('')}</div>
   ${gAns?`<div class="verd ${gAns==='ok'?'ok':'bad'}">${gAns==='ok'?"To'g'ri!":"To'g'ri javob: "+esc(d[0])}</div><p class="muted small">${esc(d[0])}: ${esc(d[2])}</p><div class="row"><button class="pri" id="gn">Keyingi savol</button>${spk(d[0])}</div>`:''}</div><p class="muted small">Umumiy natija: ${S.ddx.ok} / ${S.ddx.all} to'g'ri</p>`;
  box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.o===GQ.k;gAns=ok?'ok':'no';S.ddx.all++;if(ok)S.ddx.ok++;save();drawGame()});
  if($('gn'))$('gn').onclick=()=>{GQ=null;drawGame()};bindSpk(box)}
/* ---------- REJA ---------- */
function vPlan(){const cw=curWk(),grp=[[1,13,"1-3-oylar · Til poydevori"],[14,26,"4-6-oylar · Til va tibbiy so'zlar"],[27,52,"7-12-oylar · Tibbiyot asoslari nemis tilida"],[53,72,"13-17-oylar · Simptomdan tashxisga"],[73,78,"18-oy · FSP / FaMed qoliplari"],[79,104,"19-24-oylar · Imtihon rejimi"]];
  v.innerHTML=`<h2>2 yillik batafsil reja</h2><p class="muted" style="max-width:66ch">104 hafta, har kuni aniq vazifalar. Har haftaning 7-kuni takrorlash va test. Haftani bosib, uning materiallarini oching. Undan keyingi KP bosqichi: Bilim → 5 yillik yo'l.</p>
  ${grp.map(g=>`<div class="month"><h3>${g[2]}</h3><div class="wk">${Array.from({length:g[1]-g[0]+1},(_,j)=>{const n=g[0]+j,K=kind(n),sc=S.tests[n];return `<a href="#hafta" data-w="${n}" class="${n===cw?'cur':n<cw?'past':''}"><small>${n}-hafta${n===cw?' · hozir':''}</small><b>${esc(K.t)}</b>${K.k==='lang'?`<span>${esc(W[K.i].g)}</span>`:''}${sc!=null?`<i class="badge${sc>=8?' g':''}">${sc}/10</i>`:''}</a>`}).join('')}</div></div>`).join('')}
  <div class="row" style="margin-top:24px"><a class="btn" href="#sozlama">Sozlamalar va zaxira nusxa</a></div>`;
  v.querySelectorAll('[data-w]').forEach(a=>a.onclick=()=>{viewWk=+a.dataset.w})}
/* ---------- SOZLAMA ---------- */
function vSet(){v.innerHTML=`<h2>Sozlamalar</h2><div class="cols"><div class="card"><h3>Reja</h3>
  <label for="sd">Boshlanish sanasi (1-hafta 1-kuni)</label><input type="date" id="sd" value="${esc(S.start)}">
  <label for="sn">Kuniga yangi kartalar soni</label><input type="number" id="sn" min="0" max="60" value="${S.newPer}">
  <div class="row"><button class="pri" id="ss">Saqlash</button></div>
  <p class="muted small">Saytni telefoningiz bosh ekraniga qo'shing: brauzer menyusidan "Bosh ekranga qo'shish" (Add to Home screen) ni tanlang. Shunda ilova kabi ochiladi va internetsiz ham ishlaydi.</p></div>
  <div class="card"><h3>Zaxira nusxa</h3><p class="muted small">Taraqqiyotingiz faqat shu brauzerda saqlanadi. Haftada bir marta faylga saqlang. Boshqa telefon yoki kompyuterga o'tsangiz, shu faylni o'sha yerda tiklang.</p>
  <div class="row"><button class="pri" id="dl">Faylga saqlash</button><label class="btn" for="fi" style="margin:0;color:var(--ink);font-size:15.5px">Fayldan tiklash</label><input type="file" id="fi" accept=".json,application/json" hidden></div>
  <p class="small" id="im2"></p></div></div>`;
  $('ss').onclick=()=>{const d=$('sd').value;if(d)S.start=d;S.newPer=Math.max(0,Math.min(60,+$('sn').value||0));save();toast("Saqlandi")};
  $('dl').onclick=()=>{S.backup=Date.now();save();const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='famed-yoli-'+iso(today())+'.json';document.body.appendChild(a);a.click();a.remove();toast("Fayl saqlandi")};
  $('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(x){$('im2').textContent="Fayl noto'g'ri.";return}
   if(!o||typeof o.prog!=='object'){$('im2').textContent="Bu FaMed yo'li fayli emas.";return}
   $('im2').innerHTML=`Fayldagi taraqqiyot: ${Object.keys(o.prog).length} ta o'rganilgan karta. Hozirgi ma'lumot almashtiriladi. <button class="tl" id="ok2">Tasdiqlash</button>`;
   $('ok2').onclick=()=>{S=Object.assign(def(),o);save();toast("Tiklandi");vSet()}};r.readAsText(f)}}
/* ---------- yo'naltirish ---------- */
const VIEWS={bugun:vToday,hafta:vWeek,kartalar:vCards,test:vTest,bilim:vBilim,reja:vPlan,sozlama:vSet};
function route(){const h=(location.hash||'#bugun').slice(1),k=VIEWS[h]?h:'bugun';
  document.querySelectorAll('#tabs a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+(k==='test'?'kartalar':k)));
  if(k!=='hafta'&&k!=='test')viewWk=0;VIEWS[k]();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();route()}},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
</body>
</html>
