<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FSP / FaMed va Kenntnisprüfung'ga 2 yillik tayyorgarlik">
<meta name="theme-color" content="#13244f">
<title>FaMed yo'li</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fa,#0a1020);--sf:light-dark(#ffffff,#121b31);--sf2:light-dark(#eef2fb,#18233d);
--ink:light-dark(#0f1a2e,#eef2fa);--mut:light-dark(#5b6880,#97a5c0);--line:light-dark(#e2e7f1,#23304b);
--pri:light-dark(#2f5bea,#86a2ff);--pri2:light-dark(#e8eeff,#1c2a52);--acc:light-dark(#f2543a,#ff8a6e);--sun:#ffc53d;--ok:light-dark(#12804a,#5fd394);
--side:#0f1a3a;--sh:0 1px 2px rgba(15,26,46,.06),0 12px 32px -16px rgba(15,26,46,.25);--r:18px;--F:Outfit,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.ff{font-family:var(--F);letter-spacing:-.01em}
h1,h2,h3{margin:0;line-height:1.12;text-wrap:balance;font-weight:700}
h2{font-size:clamp(24px,3.4vw,32px)}h3{font-size:18px;font-weight:600}
a{color:var(--pri)}
/* chap menyu */
.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--side);color:#dfe6ff;display:flex;flex-direction:column;padding:18px 12px calc(18px + env(safe-area-inset-bottom));z-index:40;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;font:700 20px var(--F);color:#fff;text-decoration:none;padding:4px 10px 18px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#3a6af0,#5b86ff);display:grid;place-items:center;font-style:normal;font-size:16px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#b9c4e6;text-decoration:none;font:600 15.5px var(--F);margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current]{background:#2f5bea;color:#fff}
.nav svg{width:21px;height:21px;flex:none}
.nav .sep{font:600 11.5px var(--F);color:#7083b8;text-transform:none;padding:16px 12px 6px}
.side .foot{margin-top:auto;padding:12px;font-size:12.5px;color:#7f8fbd}
.top{display:none}
.wrap{margin-left:250px;padding:26px max(3vw,18px) 60px;max-width:1290px}
.scrim{display:none}
@media(max-width:900px){
 .side{transform:translateX(-102%);transition:transform .22s,visibility .22s;visibility:hidden}
 body.menu .side{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.4)}
 body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(5,10,25,.45);z-index:35}
 .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
 .top button{width:46px;height:46px;min-height:46px;padding:0;border-radius:12px}
 .top b{font:700 18px var(--F)}
 .wrap{margin-left:0;padding:16px 14px 60px}}
/* umumiy */
.hero{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(120% 140% at 100% 0%,#3a6af0 0%,#1b3478 45%,#0f1a3a 100%);color:#fff;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;box-shadow:var(--sh)}
.hero .k{font:600 14px var(--F);opacity:.8}.hero h2{font-size:clamp(24px,4vw,36px);margin:6px 0 10px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:600 13.5px var(--F);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}.chip.sun{background:var(--sun);color:#1a1300}
.ring{position:relative;width:132px;height:132px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.ring b{font:700 30px/1 var(--F)}.ring span{font-size:12px;opacity:.8}
@media(max-width:560px){.hero{grid-template-columns:minmax(0,1fr)}.ring{width:96px;height:96px;position:absolute;right:12px;top:12px}.ring b{font-size:22px}.hero h2{padding-right:96px}}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(16px,2.2vw,24px)}
.sec{margin-top:18px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}.hd span{color:var(--mut);font-size:14px;white-space:nowrap}
button,.btn{font:600 15.5px var(--F);min-height:46px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button.pri,.btn.pri{background:var(--pri);border-color:var(--pri);color:light-dark(#fff,#0a1020)}
button.ok,.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.big{min-height:54px;font-size:17px;padding:12px 24px;width:100%}
button:disabled{opacity:.45;cursor:default}
.tiny{min-height:38px;padding:6px 12px;font-size:14px;border-radius:11px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{font:16px "Atkinson Hyperlegible",sans-serif;width:100%;min-height:48px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink)}
label{display:block;font:600 13.5px var(--F);color:var(--mut);margin:14px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.muted{color:var(--mut)}.small{font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stats div{background:var(--sf2);border-radius:14px;padding:12px}.stats b{display:block;font:700 26px/1.1 var(--F)}.stats span{font-size:12.5px;color:var(--mut)}
.note{border-radius:14px;padding:12px 14px;background:light-dark(#fff6df,#2a2410);color:light-dark(#6b4b00,#ffd77a);font-size:14.5px;margin-top:14px}
/* ketma-ket vazifalar */
.steps{list-style:none;margin:0;padding:0;position:relative}
.step{position:relative;padding:0 0 14px 52px}
.step::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--F);background:var(--sf2);color:var(--mut);border:2px solid var(--line)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .dot{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 6px var(--pri2)}
.step .head{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;background:none;border:0;padding:0;width:100%;text-align:start;font:600 16.5px var(--F);color:var(--ink);justify-content:flex-start}
.step.done .head{color:var(--mut);text-decoration:line-through}
.step.later .head{color:var(--mut)}
.step .head small{font:500 12.5px var(--F);color:var(--mut);margin-left:auto;text-decoration:none;white-space:nowrap}
.step .body{margin-top:8px;background:var(--sf2);border-radius:16px;padding:14px 16px}
.step.cur .body{background:var(--pri2)}
.step .body p{margin:0 0 4px}
.grp{font:700 13px var(--F);color:var(--mut);margin:6px 0 12px 52px}
/* kartochka */
.fc{position:relative;border-radius:24px;background:var(--sf);border:1px solid var(--line);box-shadow:var(--sh);padding:24px clamp(18px,3vw,30px);min-height:340px;display:flex;flex-direction:column}
.fc::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,var(--pri),var(--acc))}
.fc .meta{display:flex;justify-content:space-between;gap:10px;font:600 13px var(--F);color:var(--mut)}
.fc .q{font:600 clamp(22px,3.2vw,29px)/1.25 var(--F);margin:22px 0 14px}
.fc .a{font:700 clamp(22px,3.4vw,31px)/1.25 var(--F);color:var(--pri)}
.fc .f{margin-top:8px}.fc .n{margin-top:6px;color:var(--mut);font-size:14.5px}.fc .grow{flex:1}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
.rate button{flex-direction:column;gap:0;padding:8px 4px;min-height:58px}.rate small{font:400 11.5px "Atkinson Hyperlegible";color:var(--mut)}
.prog{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;margin-top:14px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:99px}
.verd{margin-top:12px;font-weight:700}.ok-t{color:var(--ok)}.bad{color:var(--acc)}
.spk{width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;flex:none}.spk svg{width:20px;height:20px}
.ex{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.ex:first-child{border-top:0}
.ex b{font-family:var(--F);font-weight:600;display:block}.ex span{color:var(--mut);font-size:14.5px}
.rule{font-size:16.5px;background:var(--pri2);border-radius:14px;padding:14px 16px;margin:12px 0 4px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font:600 13px var(--F)}
.scroll{overflow-x:auto}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.pills button{flex:none;min-height:40px;padding:8px 14px;border-radius:999px;font-size:14px}
.pills button[aria-selected=true]{background:var(--pri);border-color:var(--pri);color:light-dark(#fff,#0a1020)}
.pills.main button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lnk{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.lnk a{font:600 13px var(--F);text-decoration:none;padding:7px 12px;border-radius:999px;background:var(--pri2);color:var(--pri)}
.lnk a.yt{background:light-dark(#ffe9e6,#3a1a16);color:light-dark(#c4302b,#ff8a80)}
.dz{padding:16px 0;border-top:1px solid var(--line)}.dz:first-of-type{border-top:0}.dzh{display:flex;gap:12px;align-items:center}.dzh b{font:600 17px var(--F)}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:12px 0 0;font-size:15px}dt{font:600 13px var(--F);color:var(--mut);padding-top:2px}dd{margin:0}
@media(max-width:560px){dl{grid-template-columns:minmax(0,1fr)}dt{margin-top:6px}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}@media(max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opts button{justify-content:flex-start;text-align:start;min-height:54px}.opts button.right{background:color-mix(in srgb,var(--ok) 18%,var(--sf));border-color:var(--ok)}.opts button.wrong{opacity:.55}
.phase{border-left:4px solid var(--pri);padding:6px 0 6px 14px;margin-top:14px}.phase p{margin:4px 0;color:var(--mut);font-size:14.5px}.phase.now{border-left-color:var(--acc);background:var(--sf2);border-radius:0 12px 12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.unit{display:flex;flex-direction:column;gap:6px}.unit small{font:600 12.5px var(--F);color:var(--pri)}.unit b{font:600 17px var(--F)}
.unit.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.month{margin-top:26px}.month>h3{margin-bottom:10px;color:var(--mut);font-size:15px}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.wk a{display:block;text-decoration:none;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative}
.wk a.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}.wk a.past{opacity:.75}
.wk small{font:600 12.5px var(--F);color:var(--pri)}.wk b{display:block;font:600 15.5px var(--F);margin:3px 0}.wk span{font-size:13px;color:var(--mut);display:block}
.badge{position:absolute;top:12px;right:12px;font:700 12px var(--F);padding:3px 8px;border-radius:99px;background:var(--sf2);color:var(--mut)}.badge.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.weeknav{display:flex;align-items:center;gap:10px}
.lex td:first-child{width:46px}.star{color:var(--acc);font-weight:700}
#pdfv{background:#525a6b;border-radius:16px;padding:10px;overflow:auto;max-height:78vh;text-align:center}
#pdfv canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.pbar input{width:90px}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:none;align-items:center;gap:14px;padding:10px 12px 10px 20px;border-radius:999px;background:#0f1a3a;color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);z-index:50;max-width:calc(100% - 24px)}
#timer b{font:700 24px var(--F);font-variant-numeric:tabular-nums}#timer span{font-size:14px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
#timer button{background:rgba(255,255,255,.14);border:0;color:#fff;min-height:40px;border-radius:999px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font:600 14px var(--F);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media(max-width:600px){.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{border:0;padding:3px 0}}

/* ===== Dizayn tuzatishlari (v5) */
@media(max-width:560px){.ring{width:74px;height:74px;right:14px;top:14px}.ring b{font-size:19px}.ring span{font-size:10.5px}.hero h2{padding-right:78px}.hero .k{padding-right:78px}}
.hd{flex-wrap:wrap;row-gap:2px}.hd h3{min-width:0;flex:1 1 auto}
@media(max-width:600px){
 table.wt,table.wt tbody{display:block}
 table.wt tr{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
 table.wt tr:last-child{border-bottom:0}
 table.wt td{border:0;padding:0;width:auto!important}
 table.wt td:first-child{grid-row:1 / span 2}
 table.wt td:nth-child(3){grid-column:2;color:var(--mut);margin-top:2px}
 table.wt td:only-child{grid-column:1 / -1;grid-row:auto}
}
details.month{margin-top:14px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:0 14px}
details.month[open]{padding-bottom:14px}
details.month>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:14px 0;font:600 15.5px var(--F)}
details.month>summary>span{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
details.month>summary::-webkit-details-marker{display:none}
details.month>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;flex:none}
details.month[open]>summary::after{transform:rotate(-135deg)}
details.month>summary small{font:600 12.5px var(--F);color:var(--mut);background:var(--sf2);padding:3px 9px;border-radius:99px;white-space:nowrap}
details.month.now>summary small{background:var(--pri2);color:var(--pri)}
details.month .wk a{background:var(--bg)}
details.addc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font:600 18px var(--F)}
details.addc>summary::-webkit-details-marker{display:none}
details.addc>summary::after{content:"+";font:600 24px/1 var(--F);color:var(--pri)}
details.addc[open]>summary::after{content:"−"}
.more{margin-top:12px;width:100%}
</style>
</head>
<body>
<header class="top"><button id="mb" aria-label="Menyu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b id="tt2">FaMed yo'li</b></header>
<aside class="side" id="side">
  <a class="logo" href="#bugun"><i>F</i>FaMed yo'li</a>
  <nav class="nav" id="nav">
    <a href="#bugun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Bugun</a>
    <a href="#hafta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"/></svg>Bu hafta</a>
    <a href="#kartalar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>Kartalar</a>
    <div class="sep">O'quv materiallari</div>
    <a href="#darslik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 7h7"/></svg>Darslik (kitob)</a>
    <a href="#grammatika"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20l6-16 6 16M6.5 14h7M17 8h4M19 6v4"/></svg>Grammatika</a>
    <a href="#lugat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>Fachbegriffe</a>
    <a href="#bilim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>Tibbiyot bilimi</a>
    <div class="sep">Reja</div>
    <a href="#reja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>2 yillik reja</a>
    <a href="#kitob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h9l4 4v14H6zM14 3v5h5"/></svg>Kitobni ochish</a>
    <a href="#sozlama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Sozlama</a>
  </nav>
  <div class="foot">FSP / FaMed → Berufserlaubnis → KP → Approbation</div>
</aside>
<div class="scrim" id="scrim"></div>
<main class="wrap" id="v"></main>
<div id="timer"><b id="tt">00:00</b><span id="tn"></span><button id="tp">Pauza</button><button id="ts">Yopish</button></div>
<div class="toast" id="toast"></div>
<script>
// 26 haftalik reja (6 oy). Karta formati: "o'zbekcha|nemischa|shifokor tili|eslatma"
const W=[
{t:"Tanishuv va gap tartibi",g:"Präsens va fe'l 2-o'rinda (V2)",
gx:"Nemis gapida tuslangan fe'l doim 2-o'rinda turadi. Gap boshida vaqt yoki joy so'zi tursa ham, fe'l joyidan siljimaydi, ega fe'ldan keyin keladi. Savol so'zisiz savolda (ha/yo'q) fe'l 1-o'ringa chiqadi.",
ex:[["Ich arbeite heute im Krankenhaus.","Men bugun kasalxonada ishlayman."],["Heute arbeite ich im Krankenhaus.","Bugun men kasalxonada ishlayman (fe'l yana 2-o'rinda)."],["Arbeiten Sie heute?","Siz bugun ishlaysizmi? (fe'l 1-o'rinda)"],["Wo wohnen Sie?","Qayerda yashaysiz?"]],
m:"Bosh va yuz qismlari",lis:"DW \"Nicos Weg\" A2 kursidan 1 ta epizod (learngerman.dw.com, bepul)",spk:"O'zingizni tanishtiring: ism, yosh, qayerdansiz, kasb, oila. 1 daqiqa.",wr:"O'zingiz haqingizda 8 ta gap yozing. Har gapda fe'l 2-o'rinda ekanini tekshiring.",
c:["Mening ismim Behzod.|Ich heiße Behzod.||","Men O'zbekistondanman.|Ich komme aus Usbekistan.||","Men shifokorman.|Ich bin Arzt.||kasb oldidan artikl qo'yilmaydi","Men uylanganman, ikki farzandim bor.|Ich bin verheiratet und habe zwei Kinder.||","Men Toshkentda yashayman.|Ich wohne in Taschkent.||","Bugun men kasalxonada ishlayman.|Heute arbeite ich im Krankenhaus.||V2: fe'l 2-o'rinda","Bosh|der Kopf|Caput|","Ko'z|das Auge|Oculus · okulär|ko'plik: die Augen","Quloq|das Ohr|Auris|","Burun|die Nase|Nasus · nasal|","Og'iz|der Mund|oral|","Tish|der Zahn|Dens · dental|ko'plik: die Zähne","Bo'yin|der Hals|Collum · zervikal|'Hals' tomoq ma'nosida ham","Tomoq (halqum)|der Rachen|Pharynx|"]},
{t:"O'tgan zamon: Perfekt",g:"Perfekt (haben / sein + Partizip II)",
gx:"Og'zaki nutqda o'tgan zamon Perfekt bilan aytiladi: haben yoki sein fe'li 2-o'rinda, Partizip II gap oxirida. Harakat va holat o'zgarishini bildiruvchi fe'llar (gehen, kommen, fahren, aufstehen) sein bilan, qolganlari haben bilan.",
ex:[["Ich habe gefrühstückt.","Men nonushta qildim."],["Ich bin gestern zum Arzt gegangen.","Men kecha shifokorga bordim."],["Wann sind Sie gekommen?","Siz qachon keldingiz?"],["Er hat viel gearbeitet.","U ko'p ishladi."]],

c:["Men nonushta qildim.|Ich habe gefrühstückt.||haben + Partizip II","Men kecha shifokorga bordim.|Ich bin gestern zum Arzt gegangen.||gehen → sein","Siz qachon keldingiz?|Wann sind Sie gekommen?||kommen → sein","U ko'p ishladi.|Er hat viel gearbeitet.||","Yurak|das Herz|Cor · kardial|","O'pka|die Lunge|Pulmo · pulmonal|","Jigar|die Leber|Hepar · hepatisch|","Buyrak|die Niere|Ren · renal|","Oshqozon|der Magen|Gaster · gastral|","Ichak|der Darm|Intestinum · intestinal|","Qorin|der Bauch|Abdomen · abdominal|","Ko'krak qafasi|der Brustkorb|Thorax · thorakal|","Orqa|der Rücken|Dorsum|","Qo'l (yelkadan)|der Arm||","Kaft (qo'l panjasi)|die Hand||","Oyoq|das Bein||","Oyoq panjasi|der Fuß||"]},
{t:"Präteritum va birinchi simptomlar",g:"Präteritum: war, hatte, konnte",
gx:"sein, haben va modal fe'llar og'zaki nutqda ham Präteritum shaklida ishlatiladi: war, hatte, konnte, musste, wollte. Bular Perfektdan ko'ra qisqa va tabiiy eshitiladi.",
ex:[["Ich war müde.","Men charchagan edim."],["Er hatte Fieber.","Uning isitmasi bor edi."],["Ich konnte nicht kommen.","Men kela olmadim."],["Wir mussten warten.","Biz kutishimizga to'g'ri keldi."]],
m:"Simptomlar 1",lis:"Nicos Weg A2: 1 epizod. Har gapni pauza qilib takrorlang (shadowing)",spk:"Oxirgi marta kasal bo'lganingizni aytib bering: nima og'ridi, isitma bormidi.",wr:"Oxirgi kasalligingiz haqida war/hatte/konnte bilan 6 ta gap.",
c:["Men charchagan edim.|Ich war müde.||sein → war","Uning isitmasi bor edi.|Er hatte Fieber.||haben → hatte","Men kela olmadim.|Ich konnte nicht kommen.||können → konnte","Og'riq|der Schmerz|Dolor|ko'pincha ko'plikda: die Schmerzen","Bosh og'rig'i|die Kopfschmerzen|Zephalgie|","Isitma|das Fieber|Pyrexie|","Yo'tal|der Husten|Tussis|","Tumov|der Schnupfen|Rhinitis|","Tomoq og'rig'i|die Halsschmerzen||","Hansirash (nafas qisishi)|die Atemnot|Dyspnoe|","Charchoq|die Müdigkeit|Fatigue|","Bosh aylanishi|der Schwindel|Vertigo|","Kvartira|die Wohnung||"]},
{t:"Modal fe'llar",g:"Modalverben: müssen, können, dürfen, sollen, wollen, möchten",
gx:"Modal fe'l 2-o'rinda tuslanadi, asosiy fe'l esa gap oxirida infinitiv holida turadi. sollten - maslahat (shifokor bemorga ko'p ishlatadi), dürfen nicht - mumkin emas.",
ex:[["Ich muss Deutsch lernen.","Men nemis tilini o'rganishim kerak."],["Hier darf man nicht rauchen.","Bu yerda chekish mumkin emas."],["Sie sollten mehr Wasser trinken.","Siz ko'proq suv ichishingiz kerak (maslahat)."],["Kann ich Ihnen helfen?","Sizga yordam bera olamanmi?"]],
m:"Simptomlar 2 va kasblar",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Germaniyada nima qilmoqchisiz va nima qilishingiz kerak? (möchte, muss, kann)",wr:"Bemorga 6 ta maslahat yozing: Sie sollten.../Sie dürfen nicht...",
c:["Men nemis tilini o'rganishim kerak.|Ich muss Deutsch lernen.||modal fe'l + oxirida infinitiv","Bu yerda chekish mumkin emas.|Hier darf man nicht rauchen.||","Sizga yordam bera olamanmi?|Kann ich Ihnen helfen?||","Men Germaniyada ishlamoqchiman.|Ich möchte in Deutschland arbeiten.||","Siz ko'proq suv ichishingiz kerak.|Sie sollten mehr Wasser trinken.||sollten = maslahat","Ko'ngil aynishi|die Übelkeit|Nausea|","Qusish|das Erbrechen|Emesis|","Ich ketishi|der Durchfall|Diarrhö|","Ich qotishi|die Verstopfung|Obstipation|","Qorin og'rig'i|die Bauchschmerzen|abdominelle Schmerzen|","Ishtaha yo'qligi|die Appetitlosigkeit|Inappetenz|","Terlash|das Schwitzen|Hyperhidrose|","Hamshira|die Pflegekraft||eski so'z: Krankenschwester","Assistent shifokor|der Assistenzarzt||"]},
{t:"Akkusativ",g:"Akkusativ: den, einen, keinen",
gx:"To'g'ri to'ldiruvchi (kimni? nimani?) Akkusativda bo'ladi. Faqat erkak rodda o'zgaradi: der → den, ein → einen, kein → keinen. Ayol (die) va o'rta (das) rod o'zgarmaydi.",
ex:[["Ich sehe den Arzt.","Men shifokorni ko'ryapman."],["Der Patient braucht einen Termin.","Bemorga qabul vaqti kerak."],["Ich habe kein Fieber.","Menda isitma yo'q."],["Haben Sie einen Stift?","Sizda ruchka bormi?"]],
m:"Ovqat hazm qilish a'zolari",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Kecha nima yedingiz va ichdingiz? Akkusativ bilan.",wr:"Akkusativ bilan 8 ta gap: ich brauche / ich habe / ich sehe...",
c:["Men shifokorni ko'ryapman.|Ich sehe den Arzt.||der → den","Bemorga qabul vaqti kerak.|Der Patient braucht einen Termin.||ein → einen","Menda isitma yo'q.|Ich habe kein Fieber.||","Ovqat|das Essen||","Non|das Brot||","Go'sht|das Fleisch||","Sabzavot|das Gemüse||","Meva|das Obst||","Qizilo'ngach|die Speiseröhre|Ösophagus|","O't pufagi|die Gallenblase|Vesica biliaris|","Oshqozon osti bezi|die Bauchspeicheldrüse|Pankreas|","Ko'richak|der Blinddarm|Appendix|bemor 'Blinddarm' deydi; aslida Appendix = Wurmfortsatz","Yutish qiyinligi|die Schluckbeschwerden|Dysphagie|","Jig'ildon qaynashi|das Sodbrennen|Pyrosis|"]},
{t:"Dativ",g:"Dativ va Dativ predloglari (mit, nach, bei, von, zu, aus, seit)",
gx:"Dativ - kimga? kimda? savoliga javob. der/das → dem, die → der, ko'plik → den (+n). mit, nach, bei, von, zu, aus, seit predloglaridan keyin doim Dativ. zu + dem = zum, von + dem = vom.",
ex:[["Ich helfe dem Patienten.","Men bemorga yordam beraman."],["Ich fahre mit dem Bus.","Avtobusda boraman."],["Nach der Arbeit gehe ich nach Hause.","Ishdan keyin uyga boraman."],["Ich komme vom Arzt.","Men shifokordan kelyapman."]],
m:"Shifoxona joylari",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Ishga qanday borasiz? mit dem Bus, zu Fuß... va kasalxonaning qaysi bo'limida ishlagansiz?",wr:"Dativ predloglari bilan 8 ta gap.",
c:["Men bemorga yordam beraman.|Ich helfe dem Patienten.||helfen + Dativ","Avtobusda boraman.|Ich fahre mit dem Bus.||mit + Dativ","Ishdan keyin uyga boraman.|Nach der Arbeit gehe ich nach Hause.||","Men shifokordan kelyapman.|Ich komme vom Arzt.||von + dem = vom","Kasalxona|das Krankenhaus|Klinik|","Bo'lim (statsionar)|die Station||","Reanimatsiya|die Intensivstation||","Shoshilinch yordam bo'limi|die Notaufnahme||","Operatsiya xonasi|der Operationssaal|OP|","Shifokor qabulxonasi|die Praxis||","Qabul vaqti|der Termin||","Tez yordam mashinasi|der Krankenwagen||"]},
{t:"Joy predloglari",g:"Wechselpräpositionen: in, an, auf, unter, über, vor, hinter, neben, zwischen",
gx:"Bu predloglar 'qayerda?' (wo?) savolida Dativ, 'qayerga?' (wohin?) savolida Akkusativ talab qiladi. liegen/stehen/sitzen - Dativ; legen/stellen/setzen - Akkusativ.",
ex:[["Der Patient liegt im Bett.","Bemor karavotda yotibdi (wo? → Dativ)."],["Legen Sie den Patienten ins Bett.","Bemorni karavotga yotqizing (wohin? → Akk)."],["Das Medikament liegt auf dem Tisch.","Dori stol ustida."],["Der Arzt geht ins Zimmer.","Shifokor xonaga kiradi."]],
m:"Shifoxona xodimlari",lis:"Nicos Weg A2: 1 epizod + shadowing",spk:"Xonangizni tasvirlang: nima qayerda turibdi.",wr:"Palata tasviri: 8 ta gap (wo? va wohin?).",
c:["Bemor karavotda yotibdi.|Der Patient liegt im Bett.||wo? → Dativ","Bemorni karavotga yotqizing.|Legen Sie den Patienten ins Bett.||wohin? → Akkusativ","Dori stol ustida.|Das Medikament liegt auf dem Tisch.||","Shifokor xonaga kiradi.|Der Arzt geht ins Zimmer.||in + das = ins","Bo'lim boshlig'i|der Chefarzt||","Katta shifokor|der Oberarzt||FaMed'da bemorni shunga taqdim etasiz","Bemor (erkak / ayol)|der Patient / die Patientin||","Karavot|das Bett||","Palata|das Patientenzimmer||","Hamkasb|der Kollege / die Kollegin||"]},
{t:"Ergash gaplar 1",g:"Nebensätze: weil, dass, wenn",
gx:"weil (chunki), dass (-ki), wenn (agar / -ganda) bilan boshlangan ergash gapda tuslangan fe'l gap OXIRIGA o'tadi. Ergash gap oldin kelsa, bosh gap fe'l bilan boshlanadi.",
ex:[["Ich kann heute nicht kommen, weil ich krank bin.","Bugun kela olmayman, chunki kasalman."],["Er sagt, dass er seit drei Tagen Fieber hat.","U uch kundan beri isitmasi borligini aytadi."],["Wenn die Schmerzen stärker werden, kommen Sie bitte wieder.","Og'riq kuchaysa, qaytib keling."]],
m:"Anamnez savollari 1",lis:"Nicos Weg A2 yoki B1: 1 epizod + shadowing",spk:"Nega Germaniyaga ketmoqchisiz? weil bilan 5 ta sabab.",wr:"weil, dass, wenn bilan 3 tadan gap (jami 9).",
c:["Bugun kela olmayman, chunki kasalman.|Ich kann heute nicht kommen, weil ich krank bin.||weil: fe'l oxirga","U uch kundan beri isitmasi borligini aytadi.|Er sagt, dass er seit drei Tagen Fieber hat.||dass: fe'l oxirga","Og'riq kuchaysa, qaytib keling.|Wenn die Schmerzen stärker werden, kommen Sie bitte wieder.||","Sizni nima bezovta qilyapti? (nima sabab bilan keldingiz)|Was führt Sie zu uns?||anamnezning birinchi savoli","Ismingiz nima?|Wie heißen Sie?||","Necha yoshdasiz?|Wie alt sind Sie?||","Aniq qayeringiz og'riyapti?|Wo genau tut es weh?||","Shikoyatlar qachondan beri?|Seit wann haben Sie die Beschwerden?||","Og'riqni qanday tasvirlaysiz?|Wie würden Sie die Schmerzen beschreiben?||","0 dan 10 gacha og'riq qanchalik kuchli?|Wie stark sind die Schmerzen auf einer Skala von 0 bis 10?||","Og'riq biror joyga tarqaladimi?|Strahlen die Schmerzen irgendwohin aus?||"]},
{t:"Ajraladigan fe'llar",g:"Trennbare Verben: aufstehen, einnehmen, anrufen, anfangen",
gx:"Old qo'shimchali fe'llarda (auf-, ein-, an-, ab-, aus-, mit-) old qo'shimcha gap oxiriga ajraladi. Perfektda -ge- o'rtaga kiradi: aufgestanden, eingenommen, angefangen.",
ex:[["Ich stehe um sechs Uhr auf.","Men soat oltida turaman."],["Nehmen Sie das Medikament zweimal täglich ein.","Dorini kuniga ikki marta iching."],["Wann haben die Schmerzen angefangen?","Og'riq qachon boshlandi?"],["Ich rufe den Oberarzt an.","Men katta shifokorga qo'ng'iroq qilaman."]],

c:["Men soat oltida turaman.|Ich stehe um sechs Uhr auf.||aufstehen","Dorini kuniga ikki marta iching.|Nehmen Sie das Medikament zweimal täglich ein.||einnehmen","Og'riq qachon boshlandi?|Wann haben die Schmerzen angefangen?||anfangen → angefangen","Doimiy dori ichasizmi?|Nehmen Sie regelmäßig Medikamente ein?||","Allergiyangiz bormi?|Haben Sie Allergien?||","Ilgari operatsiya qilinganmisiz?|Wurden Sie schon einmal operiert?||","Ilgari qanday kasalliklaringiz bo'lgan?|Haben Sie Vorerkrankungen?||","Chekasizmi?|Rauchen Sie?||","Spirtli ichimlik ichasizmi?|Trinken Sie Alkohol?||","Oilangizda qanday kasalliklar bor?|Gibt es Erkrankungen in Ihrer Familie?||","Kasbingiz nima?|Was sind Sie von Beruf?||","Kim bilan yashaysiz?|Mit wem wohnen Sie zusammen?||"]},
{t:"O'zlik fe'llari va og'riq tavsifi",g:"Reflexive Verben: sich fühlen, sich setzen, sich Sorgen machen",
gx:"O'zlik fe'llari sich bilan keladi: ich → mich, du → dich, er/sie/Sie → sich, wir → uns. Bemorga murojaat: Setzen Sie sich bitte.",
ex:[["Ich fühle mich schlecht.","O'zimni yomon his qilyapman."],["Setzen Sie sich bitte.","O'tiring, iltimos."],["Machen Sie sich keine Sorgen.","Xavotir olmang."]],
m:"Og'riq turlari",lis:"Nicos Weg B1: 1 epizod + shadowing",spk:"Turli og'riqlarni tasvirlang: bosh, qorin, ko'krak (stechend, drückend...).",wr:"3 xil bemorning og'rig'ini 3 gapdan tasvirlang.",
c:["O'zimni yomon his qilyapman.|Ich fühle mich schlecht.||sich fühlen","O'tiring, iltimos.|Setzen Sie sich bitte.||","Xavotir olmang.|Machen Sie sich keine Sorgen.||","Tezroq tuzalib keting!|Gute Besserung!||","Sanchiqli (og'riq)|stechend||","Siquvchi, bosuvchi|drückend||","Achishtiruvchi|brennend||","To'lg'oqsimon|kolikartig||","Simillagan (to'mtoq)|dumpf||","Uruvchi (pulsatsiyali)|pochend||","Og'riq chap qo'lga tarqaladi.|Die Schmerzen strahlen in den linken Arm aus.||"]},

{t:"Taqqoslash va vaqt ifodalari",g:"Komparativ va Superlativ",
gx:"Taqqoslash: -er + als (besser als), eng yuqori daraja: am -sten (am schlimmsten). Tartibsizlari: gut → besser → am besten, viel → mehr → am meisten. Anamnezda vaqt ifodalari juda muhim: seit, vor, täglich.",
ex:[["Die Schmerzen werden stärker.","Og'riq kuchayib boryapti."],["Heute geht es mir besser als gestern.","Bugun kechagidan yaxshiroqman."],["Nachts ist es am schlimmsten.","Kechasi eng yomon bo'ladi."]],

c:["Og'riq kuchayib boryapti.|Die Schmerzen werden stärker.||","Bugun kechagidan yaxshiroqman.|Heute geht es mir besser als gestern.||","Kechasi eng yomon bo'ladi.|Nachts ist es am schlimmsten.||","Uch kundan beri|seit drei Tagen||seit + Dativ","Ikki hafta oldin|vor zwei Wochen||","Kuniga bir marta|einmal täglich||","Ertalab / kechqurun / kechasi|morgens / abends / nachts||","Vaqti-vaqti bilan|ab und zu||","Doimiy|ständig||","Birdaniga|plötzlich||","Asta-sekin|allmählich||"]},
{t:"Bemorga ko'rsatma berish",g:"Imperativ (Sie-shakli)",
gx:"Bemorga hurmat bilan buyruq: fe'l + Sie + bitte. Ajraladigan fe'lda old qo'shimcha oxirga: Atmen Sie bitte tief ein. Bu hafta 1-3 oylarni ham takrorlaysiz.",

["Vorgeschichte","An Vorerkrankungen sind eine Hypertonie und ein Diabetes Typ 2 bekannt. Er nimmt Ramipril und Metformin ein. Es besteht eine Penicillinallergie."],

["Differenzialdiagnosen","Differenzialdiagnostisch denke ich an eine Gallenkolik, eine Pankreatitis und einen Hinterwandinfarkt."],
["Vorgehen","Ich würde gerne Blut abnehmen, ein EKG schreiben und eine Sonografie des Abdomens durchführen. Bis dahin würde ich dem Patienten ein Schmerzmittel geben."],

["Ablauf","Die Operation findet in Vollnarkose statt. Wir machen drei kleine Schnitte am Bauch und entfernen die Gallenblase mit einer Kamera."],
["Risiken","Wie bei jeder Operation gibt es Risiken: zum Beispiel Blutungen, Infektionen oder Verletzungen von Nachbarorganen. Diese Komplikationen sind aber selten."],
["Alternativen","Eine Alternative wäre zunächst eine Behandlung mit Antibiotika, aber die Beschwerden können wiederkommen."],
["Vorbereitung und danach","Bitte essen Sie ab Mitternacht nichts mehr. Nach der Operation bleiben Sie etwa zwei bis drei Tage im Krankenhaus."],
["Abschluss","Haben Sie noch Fragen? Sie können sich das in Ruhe überlegen. Wenn Sie einverstanden sind, unterschreiben Sie bitte hier."]]},

  <div class="grid2">${BOOK.map((b,i)=>{const w1=2*i+1,cur=cw===w1||cw===w1+1;return `<div class="card unit${cur?' cur':''}"><small>${w1}-${w1+1}-haftalar${cur?' · hozir':''} · ${b[0]}-bob</small><b lang="de">${esc(b[1])}</b><span class="muted">${esc(b[2])}</span><p class="small" style="margin:4px 0 0">${esc(b[5])}</p><div class="row" style="margin-top:8px"><button class="tiny" data-act="pdf:${b[3]}">PDF ${b[3]}–${b[4]}-sahifa</button></div></div>`}).join('')}</div>`;
  bindAct(v)}
/* ---------- KITOB (PDF) ---------- */
let PDF=null,pdfLoading=null,pdfErr='';
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('famed-yoli',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=k=>idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const idbPut=(k,val)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(val,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('saqlash bekor qilindi'))}));
const addScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('yuklanmadi: '+src));document.head.appendChild(s)});
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve();
  if(!pdfLoading)pdfLoading=import('./pdfjs/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc=new URL('./pdfjs/pdf.worker.min.mjs',location.href).href;window.pdfjsLib=m})
   .catch(()=>addScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js').then(()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}))
   .catch(e=>{pdfLoading=null;throw e});
  return pdfLoading}
let bookBuf=null;
async function openPdf(buf){bookBuf=buf;await loadPdfJs();PDF=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise}
async function getStored(){let x=await idbGet('book');if(!x)return null;if(x instanceof Blob)x=await x.arrayBuffer();return x}
function rawOpen(){if(!bookBuf)return;try{const u=URL.createObjectURL(new Blob([bookBuf],{type:'application/pdf'}));window.open(u+'#page='+kPage,'_blank')}catch(e){toast("Ochib bo'lmadi")}}
async function vKitob(){
  v.innerHTML=`<h2 style="margin-bottom:12px">Kitob</h2><div id="kb"><div class="card"><p class="muted">Kitob yuklanmoqda...</p></div></div>`;
  const kb=$('kb');
  if(!PDF){try{const buf=await getStored();if(buf)await openPdf(buf)}catch(e){pdfErr=String(e&&e.message||e)}}
  if(!PDF){kb.innerHTML=`<div class="card" style="max-width:720px"><h3>1-qadam: kitob PDF faylini tanlang</h3><p>Sayt kitobni o'zi yuklab ololmaydi: "Trainingseinheiten Deutsch B2·C1 Medizin" PDF faylini telefoningizdan <b>bir marta</b> tanlashingiz kerak. Fayl faqat shu telefonda saqlanadi.</p>
   <ol class="small muted" style="padding-left:20px"><li>Agar kitob Telegram'da bo'lsa, avval uni telefonga yuklab oling (faylni bosib, "Yuklab olish" yoki "Fayllarga saqlash").</li><li>Pastdagi tugmani bosing va "Fayllar" (Files) ichidan PDF'ni tanlang.</li><li>Shundan keyin vazifalardagi "Kitobni ochish" tugmalari kerakli sahifani o'zi ochadi.</li></ol>
   <label class="btn pri big" for="pf" style="margin-top:10px;color:light-dark(#fff,#0a1020)">PDF faylni tanlash</label><input type="file" id="pf" accept="application/pdf,.pdf" style="position:absolute;opacity:0;width:1px;height:1px"><p class="small" id="pm">${pdfErr?'Oldingi xato: '+esc(pdfErr):''}</p>
   <p class="muted small">Maslahat: saytni Telegram ichida emas, Chrome yoki Safari'da oching.</p></div>`;
   $('pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const pm=$('pm');pm.textContent="Fayl o'qilmoqda...";
     let buf;try{buf=await f.arrayBuffer()}catch(x){pm.textContent="Faylni o'qib bo'lmadi: "+(x.message||x);return}
     try{await idbPut('book',buf)}catch(x){pm.textContent="Diqqat: faylni telefonda saqlab bo'lmadi, keyingi safar yana tanlashingiz kerak bo'ladi. ("+(x&&x.message||x)+")"}
     pm.textContent="Kitob ochilmoqda...";
     try{await openPdf(buf);pdfErr='';if(PDF.numPages<200)toast("Diqqat: bu fayl kitobga o'xshamaydi ("+PDF.numPages+" sahifa). Kerak bo'lsa 'Boshqa kitob tanlash'ni bosing.");vKitob()}catch(x){bookBuf=buf;pm.innerHTML="Kitobni sayt ichida ochib bo'lmadi ("+esc(x&&x.message||x)+"). <button class='tiny' id='raw'>PDF'ni alohida oynada ochish</button>";$('raw').onclick=rawOpen}};return}
  const N=PDF.numPages;kPage=Math.min(Math.max(1,kPage),N);const B=BOOK.find(b=>kPage>=b[3]&&kPage<=b[4]);
  kb.innerHTML=`<div class="pbar"><button id="kp" aria-label="Oldingi sahifa">‹</button><input id="kn" type="number" min="1" max="${N}" value="${kPage}" aria-label="Sahifa"><span class="muted">/ ${N}</span><button id="kx" aria-label="Keyingi sahifa">›</button><select id="ku" style="width:auto;flex:1;min-width:180px"><option value="">Bobga o'tish...</option>${BOOK.slice().sort((a,b)=>a[3]-b[3]).map(b=>`<option value="${b[3]}">${b[0]}. ${esc(b[1])}</option>`).join('')}</select></div>
   ${B?`<p class="muted small" style="margin:0 0 10px">${B[0]}-bob: ${esc(B[1])} · ${esc(B[2])}</p>`:''}<div id="pdfv"><canvas id="pc"></canvas></div><div class="row"><button class="tiny" id="raw">Alohida oynada ochish</button><button class="tiny" id="chg">Boshqa kitob tanlash</button></div>`;
  const draw=async()=>{try{const pg=await PDF.getPage(kPage),cv=$('pc');if(!cv)return;const w=Math.max(280,$('pdfv').clientWidth-20),vp0=pg.getViewport({scale:1}),sc=Math.min(2.2,w/vp0.width),dpr=Math.min(2,window.devicePixelRatio||1),vp=pg.getViewport({scale:sc*dpr});cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);cv.style.width=Math.floor(vp.width/dpr)+'px';await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise}catch(e){$('pdfv').innerHTML=`<p style="color:#fff">Sahifani chizib bo'lmadi (${esc(e&&e.message||e)}). "Alohida oynada ochish" tugmasini bosing.</p>`}};
  const goP=n=>{kPage=Math.min(Math.max(1,n),N);vKitob()};
  $('kp').onclick=()=>goP(kPage-1);$('kx').onclick=()=>goP(kPage+1);$('kn').onchange=e=>goP(+e.target.value);$('ku').onchange=e=>{if(e.target.value)goP(+e.target.value)};$('raw').onclick=rawOpen;$('chg').onclick=async()=>{try{await idbPut('book',null)}catch(e){}PDF=null;bookBuf=null;kPage=1;vKitob()};
  draw()}
/* ---------- GRAMMATIKA ---------- */
let gSel=0;
function vGram(){const items=[...W.map((w,i)=>({h:(i+1)+'-hafta',t:w.g,x:w.gx,ex:w.ex,q:gTopic(w.g)})),...GB2X.map((g,i)=>({h:(27+2*i)+'-hafta (B2)',t:g[0],x:g[1],ex:[[g[2],'']],q:g[3]}))];
  const it=items[Math.min(gSel,items.length-1)];
  v.innerHTML=`<h2 style="margin-bottom:12px">Grammatika</h2><p class="muted" style="margin-top:0">B1 dan B2 gacha barcha mavzular. Har birida o'zbekcha qoida, misollar va video (nemischa va o'zbekcha) bor.</p>
  <div class="pills">${items.map((x,i)=>`<button aria-selected="${i===gSel}" data-g="${i}">${esc(x.h)}: ${esc(gTopic(x.t))}</button>`).join('')}</div>
  <div class="card" style="max-width:860px"><div class="muted small ff">${esc(it.h)}</div><h3 style="font-size:22px;margin:4px 0">${esc(it.t)}</h3><div class="rule">${esc(it.x)}</div>${vidLinks(it.q)}<div style="margin-top:10px">${it.ex.map(e=>`<div class="ex">${spk(e[0])}<div><b lang="de">${esc(e[0])}</b>${e[1]?`<span>${esc(e[1])}</span>`:''}</div></div>`).join('')}</div></div>`;
  v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gSel=+b.dataset.g;vGram()});bindSpk(v);
  const s=v.querySelector('.pills [aria-selected=true]');if(s)s.scrollIntoView({block:'nearest',inline:'center'})}
/* ---------- LUG'AT (Fachbegriffe) ---------- */
let lCat='',lQ='',lImp=false,lShow=60;
const CATS=[...new Set(FB.map(x=>x[0]))];
function vLug(){
  v.innerHTML=`<h2 style="margin-bottom:6px">Fachbegriffe (Mainz ro'yxati)</h2><p class="muted" style="margin-top:0;max-width:72ch">${FB.length} ta lotincha tibbiy atama, nemischa (bemor tili) va o'zbekcha tarjimasi bilan. Yulduzcha bilan belgilanganlari ro'yxatda muhim deb belgilangan: ular kartalarda birinchi chiqadi (kuniga ${S.newFb} ta yangi).</p>
  <div class="row" style="margin-top:0"><input id="lq" placeholder="Qidirish: lotincha, nemischa yoki o'zbekcha" value="${esc(lQ)}" style="flex:1;min-width:220px"><button id="li" aria-pressed="${lImp}" class="${lImp?'pri':''}">★ Faqat muhimlari</button></div>
  <div class="pills" style="margin-top:12px"><button aria-selected="${!lCat}" data-c="">Hammasi</button>${CATS.map(c=>`<button aria-selected="${c===lCat}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="card"><div id="lc" class="muted small"></div><div class="scroll"><table class="lex wt"><tbody id="lt"></tbody></table></div><button id="lm" class="more" hidden>Yana 60 ta ko'rsatish</button></div>`;
  const draw=()=>{const q=norm(lQ),r=FB.map((x,i)=>[x,i]).filter(([x])=>(!lCat||x[0]===lCat)&&(!lImp||x[4])&&(!q||norm(x[1]+' '+x[2]+' '+x[3]).includes(q)));
    const N=Math.min(r.length,lShow);$('lc').textContent=r.length+" ta atama"+(r.length>N?` · ${N} tasi ko'rsatilmoqda`:"");
    $('lt').innerHTML=r.slice(0,N).map(([x,i])=>{const p=S.prog['f'+i];return `<tr><td>${spk(x[2].split(/[\/,]/)[0])}</td><td><b lang="de">${esc(x[2])}</b><div class="muted small" lang="la">${x[4]?'<span class="star">★</span> ':''}${esc(x[1])}</div></td><td>${esc(x[3])}${p?'<div class="small" style="color:var(--ok)">kartada o\'rganilmoqda</div>':''}</td></tr>`}).join('');bindSpk($('lt'));$('lm').hidden=r.length<=N};
  $('lm').onclick=()=>{lShow+=60;draw()};
  $('lq').oninput=e=>{lQ=e.target.value;lShow=60;draw()};$('li').onclick=()=>{lImp=!lImp;lShow=60;vLug()};
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{lCat=b.dataset.c;lShow=60;vLug()});draw()}
/* ---------- REJA ---------- */
function vPlan(){const cw=curWk(),grp=[[1,13,"1-3-oylar · Til poydevori + kitob"],[14,26,"4-6-oylar · Til, tibbiy so'zlar + kitob"],[27,52,"7-12-oylar · Tibbiyot asoslari nemis tilida + kitob"],[53,72,"13-17-oylar · Simptomdan tashxisga"],[73,78,"18-oy · FSP / FaMed qoliplari"],[79,104,"19-24-oylar · Imtihon rejimi"]];
  v.innerHTML=`<h2>2 yillik batafsil reja</h2><p class="muted" style="max-width:70ch">104 hafta, har kuni ketma-ket vazifalar. Har haftaning 7-kuni takrorlash va test. Haftani bosib, uning materiallarini oching. KP bosqichi: Tibbiyot bilimi → 5 yillik yo'l.</p>
  ${grp.map(g=>{const on=cw>=g[0]&&cw<=g[1],dn=Array.from({length:g[1]-g[0]+1},(_,j)=>g[0]+j).filter(n=>n<cw).length;return `<details class="month${on?' now':''}"${on?' open':''}><summary><span>${g[2]}<small>${on?'hozir · ':''}${g[0]}–${g[1]}-haftalar${dn?` · ${dn} o'tdi`:''}</small></span></summary><div class="wk">${Array.from({length:g[1]-g[0]+1},(_,j)=>{const n=g[0]+j,K=kind(n),sc=S.tests[n],B=bookOf(n);return `<a href="#hafta" data-w="${n}" class="${n===cw?'cur':n<cw?'past':''}"><small>${n}-hafta${n===cw?' · hozir':''}</small><b>${esc(K.t)}</b>${K.k==='lang'?`<span>${esc(W[K.i].g)}</span>`:''}${B?`<span>Kitob: ${B.u[0]}-bob ${esc(B.u[1])}</span>`:''}${sc!=null?`<i class="badge${sc>=8?' g':''}">${sc}/10</i>`:''}</a>`}).join('')}</div></details>`}).join('')}`;
  v.querySelectorAll('[data-w]').forEach(a=>a.onclick=()=>{viewWk=+a.dataset.w})}
/* ---------- SOZLAMA ---------- */
function vSet(){v.innerHTML=`<h2>Sozlamalar</h2><div class="cols"><div class="card"><h3>Reja</h3>
  <label for="sd">Boshlanish sanasi (1-hafta 1-kuni)</label><input type="date" id="sd" value="${esc(S.start)}">
  <label for="sn">Kuniga yangi kartalar (so'z va iboralar)</label><input type="number" id="sn" min="0" max="60" value="${S.newPer}">
  <label for="sf">Kuniga yangi Fachbegriffe</label><input type="number" id="sf" min="0" max="60" value="${S.newFb}">
  <div class="row"><button class="pri" id="ss">Saqlash</button></div>
  <p class="muted small">Telefonda: brauzer menyusidan "Bosh ekranga qo'shish" ni tanlang. Shunda ilova kabi ochiladi va internetsiz ham ishlaydi.</p></div>
  <div class="card"><h3>Zaxira nusxa</h3><p class="muted small">Taraqqiyotingiz faqat shu brauzerda saqlanadi. Haftada bir marta faylga saqlang. Boshqa qurilmaga o'tsangiz, faylni o'sha yerda tiklang.</p>
  <div class="row"><button class="pri" id="dl">Faylga saqlash</button><label class="btn" for="fi" style="margin:0;color:var(--ink);font-size:15.5px">Fayldan tiklash</label><input type="file" id="fi" accept=".json,application/json" hidden></div><p class="small" id="im2"></p>
  <h3 style="margin-top:20px">Kitob</h3><p class="muted small">Kitob PDF fayli shu qurilmada saqlangan bo'lsa, uni almashtirish mumkin.</p><div class="row"><button id="rb">Kitob faylini almashtirish</button></div></div></div>`;
  $('ss').onclick=()=>{const d=$('sd').value;if(d)S.start=d;S.newPer=Math.max(0,Math.min(60,+$('sn').value||0));S.newFb=Math.max(0,Math.min(60,+$('sf').value||0));save();toast("Saqlandi")};
  $('dl').onclick=()=>{S.backup=Date.now();save();const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='famed-yoli-'+iso(today())+'.json';document.body.appendChild(a);a.click();a.remove();toast("Fayl saqlandi")};
  $('rb').onclick=async()=>{try{await idbPut('book',null)}catch(e){}PDF=null;bookBuf=null;location.hash='kitob'};
  $('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(x){$('im2').textContent="Fayl noto'g'ri.";return}
   if(!o||typeof o.prog!=='object'){$('im2').textContent="Bu FaMed yo'li fayli emas.";return}
   $('im2').innerHTML=`Fayldagi taraqqiyot: ${Object.keys(o.prog).length} ta o'rganilgan karta. Hozirgi ma'lumot almashtiriladi. <button class="tiny" id="ok2">Tasdiqlash</button>`;
   $('ok2').onclick=()=>{S=Object.assign(def(),o);save();toast("Tiklandi");vSet()}};r.readAsText(f)}}
/* ---------- yo'naltirish ---------- */
const VIEWS={bugun:[vToday,"Bugun"],hafta:[vWeek,"Bu hafta"],kartalar:[vCards,"Kartalar"],test:[vTest,"Test"],darslik:[vBook,"Darslik"],kitob:[vKitob,"Kitob"],grammatika:[vGram,"Grammatika"],lugat:[vLug,"Fachbegriffe"],bilim:[vBilim,"Tibbiyot bilimi"],reja:[vPlan,"Reja"],sozlama:[vSet,"Sozlama"]};
function route(){const h=(location.hash||'#bugun').slice(1),k=VIEWS[h]?h:'bugun';
  document.querySelectorAll('#nav a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+(k==='test'?'kartalar':k)));
  if(k!=='hafta'&&k!=='test')viewWk=0;if(k!=='bugun')focus=null;document.body.classList.remove('menu');$('tt2').textContent=VIEWS[k][1];VIEWS[k][0]();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
$('mb').onclick=()=>document.body.classList.toggle('menu');$('scrim').onclick=()=>document.body.classList.remove('menu');
route();
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();route()}},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
